 SAF.15.a: ""

 SAF.18.t: "Albert Hertzog Calls a National Vigil"
 SAF.18.desc: "The death of Adolf Hitler has come to the ears of the National Party. And they answered it with sorrow and passion; at the call of Hertzog, members of the party are to come together so they may hold a vigil for the Führer.\n\nAnd in the name of the man they seem to mourn, they are calling for a week exclusive to Hitler's respect. People should light candles for the fallen German, businesses, they demand, should close down.\n\nReports of armed Boer men are reaching us, the details suggesting that they are organized by the National Party and are not only providing 'security' for the mourners but also forcing business to close down and threatening their political opponents. From Port Elizabeth up to Pietersburg, it seems that this is not something we cannot ignore. Hertzog is making a very interesting gamble on the behalf of his party, cleverly using this vigil as a way of rallying his supporters.\n\nHertzog proclaims that his lockdown of the country will stay until the South African government pay proper respects to Adolf Hitler and denounce what they called the Anglo-American imperialist interference on South Africa. We cannot let this happen. We cannot allow this to become greater than it is. They are defying the Dominion!"
 SAF.18.a: "Get them under control!"

 SAF.19.t: "Police Refuses to Crack Down on National Party"
 SAF.19.desc: "We have a problem. The police was sent to disperse the Boers' vigil, but it seems that things are not going the way we want them to. One of the officers, Eugène Terre'Blanche, has refused to carry out his orders. He has gone over to the Boers, joining them as his fellow officers either observed him in shock or followed his example and deserted too.\n\nAccording to reports, the crowd was roused to applaud him. He spoke to them, delivering a big speech by the side of Hertzog, praising his policies and one independent Boer Nation. Terre'Blanche was known inside the SAP as especially devoted to the ideals of the National Party, seems that he's letting himself free to do as he pleases against any authority.\n\nSouth Africa cannot approve this. The whole country is watching him receive a glorious ovation from the masses out in the streets, insulting the authority of the Government. We are losing control of the situation. Not only he is defecting to them. Thanks to his actions, the rest of our officers are refusing to disperse the protests. If we do not do something soon, we may lose the country!"
 SAF.19.a: "Those Boers must be stopped! The army must be sent in!"

 SAF.35.t: "When It Began"
 SAF.35.desc: "History has had a fascination for seminal events since mankind learned to write their names with stone and chisel.\n\nThe intuitive drive to envision the disorder that surrounds men as a series of causes and effects instills itself into common sense, so tempting them to regard certain happenstances as larger-than-life moments shifting time's course. A Serb ending an archduke's life, common sense would thus say, began a war that snuffed a continent's lamplights forever. A threat for a Polish port heralded a new order over Europe and the wider world. Thrice again, a grisly massacre in Cape Town marked the beginning of Africa's latest tragedy.\n\nBut common sense is faulty and full of holes. Human intuition is no less fallible in writing South Africa's narratives than in any other war it has seen. What it believes is a gargantuan conflict's violent outset is instead its largest battle up to that point -- the conflagration among a teetering powder keg's flickers.\n\nOne such flicker emerged in a polling station in Pretoria, weeks before the nation decided between Dominion and Republic. Census workers found themselves harried by an assemblage of Boers, armed and exuberant. Not to be outdone, the Majesty's loyal subjects -- not His or Her Majesty, South Africa remained at an impasse over whose crown they swore fealty -- rallied onto the streets to meet the Afrikaners head-to-head. They carried the same guns and shared the same patrimony; nevertheless, their opinions over their destiny cannot be reconciled. Tensions simmered in the standoff, ugly differences brought to light with shouts and jeers.\n\nThen a shot rang loud. A man crumpled atop a pool of blood. Shouts became screams as muzzle flash lit the streets.\n\nWho shot first was lost to time, but its aftereffects foreshadowed the years to come: democracy strangled at the crib; hundreds laid lifeless along the blood-soaked pavements; and a city whose infernos rose to mingle with the reddish hue of the sunset sky"
 SAF.35.a: "A continent plunged in years of twilight."

 SAF.36.t: "Flames of Freedom"
 SAF.36.desc: "There was no doubt that reducing the number of guards on Robben Island was a grave mistake, even as Nazi boots marched across South African soil. Among the prisoners, information traveled swiftly- men desperate for freedom would seize any chance, no matter the cost. Chaos spreads as quickly as fire through dry grass, and on that desolate island, a riot could ignite into something deadly. They knew and had to seize their chance.\n\nNelson Mandela himself led the uprising. Years of confinement had given him time to study the prison's weaknesses; every blind spot in the fence, every careless routine of the guards. The spark came just after breakfast, when the mess hall was crowded with inmates. In an instant, benches overturned, tin cups crashed to the floor, and the prisoners surged forward with broom handles, chains, and sharpened scraps of metal. Caught off guard and badly outnumbered, the guards were quickly overwhelmed.\n\nBy midday, the towers were deserted, the gates thrown open, and smoke curled above burning sheds. The survivors among the guards lay bloodied and broken, their weapons now in the hands of those they had once tormented. Robben Island was no longer a prison - it belonged to the people. It was Mandela's first hard-won victory - a small but powerful beginning to a long, unyielding struggle for freedom.\n\nNow he understood there was no option left for a peaceful resolution. Years of pleas and petitions had only been met with iron and cruelty. His people would never be granted freedom; they had to take it for themselves. If they wished to live with dignity, they would have to fight hard, drive the oppressors from their land, and claim what was theirs by right. And by no means would he stand and watch it aside.\n\nNot long after, the boat meant for him reached the shore of the small island. His comrades from the ANC had not forgotten him yet. With the guards defeated, the prisoners have seized their vessels, trying to escape on their own. Mandela stepped aboard his boat with quiet resolve. Leaving Robben Island behind, memories of his first visit flickered briefly - how peaceful, how deceptively serene it had seemed. Now all he saw were flames and smoke. Flickering lights of Cape Town lay before him, and the whole of South Africa was waiting, unaware of the storm that had already begun."
 SAF.36.a: "Shatter the Shackles!"

 SAF.37.t: "The Cape Town Massacre"
 SAF.37.desc: "Troops arrived at Cape Town, their transports reaching the grounds of the Parliament. They swiftly came out of them, forming up against the protestors, obeying the orders of their officers, sergeants shouting at their men to move more quickly.\n\nThings would have gone well had it not been for a series of unfortunate events. The protestors, surprised but also provoked at the army's presence, stood their ground, refusing to leave. The troops kept telling them but the Boers were pressing against them. Barricades were toppled, protestors were picking up rocks and throwing them at the men and rumors of armed Boers coming to help their kinsmen fight back were getting to the soldiers.\n\nConfused orders came through. Instructions to the contrary were issued. These mixed with the shouts of the protesters, the din of strife, and the sirens of abandoned police cars made the worst happen. In just several bursts from the rifles and carbines of the soldiers, forty people, none of them with weapons as feared by the alarmed troops, lay dead on the ground. The crowds were now dispersing, but not because they wanted to. They had to. Their brothers and sisters, their mothers and their fathers, they were scattered upon the ground, broken and bleeding.\n\nIt was a horrifying massacre. And the news of this came all over South Africa, turning the entire land against the Armed Forces. Only the worst can come out of this now."
 SAF.37.a: "It is too late now to go back."

 SAF.38.t: "The ANC Revolts!"
 SAF.38.desc: "At approximately 0700 hours, a number of police stations in the eastern coastal city of Durban went silent. Over the course of the morning, it became clear that this wasn't a coincidence. Emergency broadcasts from military units in the air quickly poured in.\n\nLOUIS BOTHA AIRPORT FALLEN\n\nSALISBURY ISLAND UNDER HEAVY ASSAULT\n\nPORTS IN REBEL HANDS\n\nCivilian radio stations started broadcasting exhortations in Zulu and Xhosa, calling on the native peoples of South Africa to rise up and overthrow their colonial overlords. Some broadcasts even noted that, with the ongoing Boer revolt, the opportunity for revolution has never been greater. Mere hours later, the few surviving security units in Durban began evacuating south, as the ANC's uMkhonto we Sizwe declared the city to be in free African hands. Meanwhile, similar assaults have begun in other cities across the country. Clearly, our nation's crises will not be limited to the Boers."
 SAF.38.a: "This is a disaster!"

 SAF.39.t: "The South African Civil War Begins!"
 SAF.39.desc: "Not long after the referendum on the monarchy had concluded, the unbelievable happened. The Ossewabrandwag crossed the Ostafrikan border by early morning and moved in motorized convoys to Pretoria, with full support from the National Party under Albert Hertzog, attempted a violent coup. Thankfully, through the sacrifice of loyal security forces their assault on parliament was prevented from capturing all the key figures of the United Party who were able to evacuate towards Cape Town.\n\nThe OBW has managed to secure the entire Transvaal and are now pushing on all fronts to dominate all of South Africa. Even worse, reports have come in that the German colonies in the north haven't just actively backed this coup attempt, but are actively mobilizing to intervene on the side of the so-called Afrikaner Volksstaat led by OBW leader Johannes van Rensburg. Not everything is lost, though, for the loyal half of the country will resist them and the Union Defence force is already moving to establish defensive lines and mobilize all loyal South Africans to the cause of freedom.\n\nAbove all, the United States of America has already pledged to support us and are in the process of sending supplies, and the OFN itself holding an emergency meeting in support. We have to hold the line, until the full support of the Americans and the rest of the OFN arrives."
 SAF.39.a: "For South Africa, our land!"

 SAF.40.t: "Smash the Dominoes!"
 SAF.40.desc: "The time has come for the ultimate battle against fascism! The last stand against autocracy abroad and worldwide, a final glorious crusade against the forces of evil that have forced the free people's of the world under their autocratic jackboots. With one fell sweep, we will stop the Nazis from securing a new foothold in Africa, for if we do not, surely the brutal invasion of our South Africans will only be the beginning. If Africa falls, next falls India, then with the east secured, the Nazis will soon be in the Americas as well!\n\nAt least, this is the sentiment that every American general with a foot in the White House door has loudly shouted, berated the Senate over, rallied their troops with and harassed the media with as seemingly every man who has ever held a gun has proclaimed the time for a 'final battle' against the fascist menace.\n\nWhile many members of the Republican-Democratic Coalition have seemed nervous over the situation, proposing some doubts that this 'Domino Theory' is as immediate a threat as proposed, or that entering war with direct servants of the Reich can end in anything besides a greater conflict, it is most surprising that several members of the NPP have stepped across the Senate aisle to agree. Leftists in the NPP have questioned what, exactly, the RDC dominated military establishment proposes as any end goal in this conflict, and what plan they may have to deal with Africa even if there is some sort of victory, while the far right of the party has showed some suspicious hesitance to do battle with the fascists.\n\nRegardless, however, the President seems dead-set on a policing action in the nation, President Nixon seemingly hoping that a knock out punch on the Reichskommissars will save his flagging administration and halt the impending impeachment vote."
 SAF.40.a: "Goodbye my darling, hello Kuruman!"

 SAF.41.t: "The Summit Begins!"
 SAF.41.desc: "Emissaries from the Organization of Free Nations member states have gathered today in Washington, D.C. to discuss the ongoing developments in South Africa.\n\n"The spectre of fascism has struck the Dominion of South Africa in its moment of weakness," President Nixon said as he greeted ambassadors and ministers from five countries, including Canada, Australia, New Zealand, Guyana and the West Indies Federation, at the Walter E. Washington Convention Center. "We, as an alliance of democracies, are obliged to protect democracy not merely within our borders, but wherever it flourishes without. The Free World cannot afford another setback, like it had in Europe, in Asia, in the Pacific -- a line must be drawn, one way or the other. If we must draw it across the Kalahari, then so be it."\n\nUnder threat from both an insurrection and a surprise invasion by German forces in the continent, Africa's last democracy has urged the United States and its allies for immediate military support. The White House is expected to issue a resolution for an intervention into the South African conflict in the following weeks, although details regarding the scale and participants thereof are currently unknown..."
 SAF.41.a: "The giant shifts from its slumber."

 SAF.42.t: "See South Africa!"
 SAF.42.desc: "In recent weeks, Americans have been treated with an unusual addition to their primetime schedules' standard fares.\n\nBreaks in between runs of nightly sitcoms, usually reserved for advertisements from Coca Cola and Ford and a hundred other sponsors, instead show montages of rolling savannahs, cresting mountains and vibrant cities from a faraway land called South Africa. Backdropped by an instrumentalized version of God Save the Queen, a grandfatherly voice soothingly extols the life of a nation few have heard, let alone seen. But that was fine, he assures; for a minute of a family's time, South Africa will visit them in their own homes. Mayhaps soon they will visit South Africa too.\n\nThese advertisements are the brainchildren of Edison Cook, newest chairman of the South African Broadcasting Corporation and co-founder of the nascent American South Africa Public Affairs Committee. Tasked by Cape Town to "encourage closer ties between two free nations parted only by one ocean", he has successfully negotiated air time from each of America's country's Big Three networks for his organization's extensive public awareness campaign. Observant commentators have remarked of the concurrence between Mr. Cook's campaign and the commencement of hostilities in South Africa.\n\nDespite the veteran broadcaster's optimism, and his blank check, only time will tell if the imperiled democracy's newest ploy to sway America's spirit towards its defence will bear fruit."
 SAF.42.a: "From the Cape to the Zambezi stretch a thousand miles of freedom..."

 SAF.43.t: "A Kimberley Tragedy"
 SAF.43.desc: "Harold Howard, like his father and his father before him, was a farmer with a homestead north of Kimberley. There he grew wheat, corn and many other crops with his wife Laura, his daughters Annie and Kylie, and the family's farmhands Johan and Mattys. Farming demanded backbreaking and routine labor from the 52 year-old father and his family -- every day in the Highveld began with work at five and ended with work at seven -- but Harold saw no need for things to change anytime soon. A farmer he has been, he thought, and a farmer he will always be.\n\n"But months prior to the war, Harold realized his farmhands had been returning from the weekly trip to Kimberly erratically late. Years of habit established thus: They would leave at eight with a lorry full of produce, sell them to markets around the city, and come back home before lunch. Nowadays they would return between then and sundown at the latest. Harold had a mind to ask them what they've been doing, but ultimately held his peace. He'd trusted the Boer boys with his money for ten years now; why shouldn't he trust them on how they spend their time every Sunday?\n\n"Harold thought his life won't ever change. He also thought he shouldn't ask questions when it did. So imagine his surprise when Johan Anderson and Mattys Bosman returned to the farm at eight PM... with a lorryful of armed men.\n\n"The poor man neither spoke nor wrote of the events that followed as he recuperated in the city hospital, only that he escaped by the skin of his teeth. Laura, Annie and Kylie were absent from his bullet-ridden truck..."\n\n-- excerpt from Tales from the Bush."
 SAF.43.a: "Why, these damnable Afrikaners and their barbaric war...!"

 SAF.44.t: "Christians for Freedom"
 SAF.44.desc: "In most Sundays, the sermon at the Church of Jesus Christ the Savior begins with a reading from the New Testament. The Lord's words were timeless and granted prescient wisdom to any era with every reading. As the world seems mired in a decade of strife, His pleas to treat fellow men of all races and creeds as brothers ring loud like gunshots for America's laity.\n\nBut today was special. Before a congregation of nearly fifty pious Americans, Reverend Isiah Hickenlooper began his sermon with an allusion to Father Abraham.\n\n"Brothers and sisters," boomed the Reverend to the spellbound attendants. "Near five score to this day, our forefathers were unchained from slavery by the fires of war. Men who had been uprooted from one continent to another had at long last met the jubilee they were promised. But even now the friends and families they had left behind remain yoked by empires: the Englishmen, the Frenchmen, and now the fascists of Nazi Germany."\n\n"Shortfalled we may be, but we are luckier than our cousins in the Dark Continent. We have the pretense of rights; they have not. We can live our whole lives without bearing the scars of whips; they cannot. We are masters of our own destinies; they are not! No, my friends -- they have not tasted freedom for three hundred years! And they will never taste freedom for three hundred more unless something is done!"\n\nReverend Hickenlooper's flock is one of several who have organized the "Christians for Freedom", in support of President Nixon's intent to intervene in the South Africa conflict. This national band of pastors and preachers have since agitated for a campaign to free German slaves in Africa -- a sentiment that hearkens heavily to America's own war waged against slavery.\n\nLike heavy gears made to turn, the nation's faithful are roused into a 20th-century crusade by an abolitionist spirit not seen since the mid-19th. This animus manifested itself when Sunday Mass for Reverend Hickenlooper's Alabama church ended not with benedictions, but with the spontaneous utterance of a jubilant tune passed from father to son."
 SAF.44.a: "As He died to make man holy. Let us die to make man free."

 SAF.45.t: "Ships on the Horizon"
 SAF.45.desc: "A stormy night in the South Atlantic. A Südwestafrikan patrol boat monitoring the waters off the coast of Alexander Bay is periodically hit by waves from the bow, washing over the vessel. In the light of a thunderstrike, one of the crew spots something, and motions to the captain. The sighting is confirmed, to his horror. He starts relaying an emergency message to the Kriegsmarine command in Lüderitz. Many vessels, various types, markings unknown. He tries to give off as much information as he is able, until a broadside of Mark 42 guns ends his broadcast permanently.\n\nThe report, though brief and vague, sets off a scramble across Africa, as a massive effort to confirm the report is undertaken. Eventually, an aerial reconnaissance flight returns with pictures that send an enormous wave of dread throughout the entire Schild. There can be no doubting it now, the Americans have arrived with their Sixth Fleet.\n\nGone is any semblance of German naval superiority. Shattered are any dreams of ending this war through a quick and daring naval invasion of the Cape. The seas belong to the cruisers and frigates of the American Navy, its skies to the flights of aircraft lined on the decks of the carriers. The fleet is of such a size that no one would dream of taking it on with the ships of the Schild. In one stroke, it appears the Americans have achieved victory at sea for the South African War."
 SAF.45.a: "The light at the end?"

 SAF.46.t: "Gifts from Uncle Sam"
 SAF.46.desc: "Not all of America's gifts were purely benign, however. Hidden underneath the hustle and bustle that ensued were crates devoid of the "MADE IN USA" stencils borne by the majority of unladen containers. Eagle-eyed witnesses would spot men in the khakis of the South African Union Defence Force carrying these unmarked crates to equally unmarked warehouses. If the revelry deterred them little from inspecting, then the glares of armed guards cratered their curiosity for them instead.\n\nInside, the crates were pried open to reveal cargo just as precious, if not moreso, than cans of American food: racks of American M16s, belts of American 5.56 mm bullets, boxes of American radios, barrels of American mortars and bazookas. Some of the crates packed creatively disassembled American field guns and artillery. When asked, the attendants remarked only of "misplaced" equipment from the US Navy. A scarce trickle of it, they admitted, but it will have to do until better channels are approved and relayed.\n\nIn his apparent wisdom, President Nixon has approved clandestine measures to partly supply South Africa's wanting men with the implements they need to stem the fascist tide. Should we tell our people and the world of these gifts?"
 SAF.46.a: "To every radio and TV screen."
 SAF.46.b: "No one has to know..."

 SAF.47.t: "American Muscle"
 SAF.47.desc: "As debates rage in Washington over what scraps to send South Africa's way and when, New York Harbor is host to a one-in-a-lifetime scene: thousands of cargo trucks, lined up like a row of ducks, waiting patiently for a crane to pack them on a cargo ship's deck. Packed with more trucks than most towns have cars, these ships will soon depart for the faraway shores of the Cape of Good Hope.\n\nIn anticipation of an invasion of Europe and the Japanese Home Islands, the US Army issued General Motors a contract to produce their reliable CCKW trucks during the Second World War. The Pentagon expected hundreds of thousands of the so-called "deuce-and-a-halfs" forming the core of the Army's ocean-wide supply train. Detroit was more than capable and willing to fulfil such a lucrative contract, going so far as to reach its agreed-upon orders by spring 1945.\n\nUnfortunately, the invasion plans they were built to buttress were scrapped when mushroom clouds engulfed Pearl Harbor later that year. A good number entered the civilian market after the war -- just as many were left to flake off their army green paint jobs in warehouses across the fifty states.\n\nThe war in South Africa is akin to a second calling for these unused, unsung warriors. When Cape Town asked for trucks of all kinds to support their war effort, the White House and GM immediately had the other in mind. Days later South Africa agreed to take several thousands of GM's leftover CCKWs for a pittance of how much they cost GM to make, but several orders of magnitude more than the cost to bring them back to proper function. In other words, a rare win-win deal in the history of international trade.\n\nThough they were denied the war they were born to fight, the venerable deuce-and-a-half now joins the veld with factory-fresh engines, desert camo paint and the South African Union Defence Force's insignias on its sides. Hopes are high that it will perform there with the same gallantry it had shown the world twenty years ago."
 SAF.47.a: "A toast to the arsenal of democracy's stodgy veins!"

 SAF.48.t: "The Beacon of Hope"
 SAF.48.desc: "... Shown in the map is our Earth split into two worlds: The Free World, and the Slave World. The lands covered in black represent the Slave World; those in white represent the Free World -- our world, with the freedoms and luxuries that come with. Each torch stands for one free nation; because of World War Two, most of them lie in the Western Hemisphere. Germany, Italy, and Japan have made most of the rest their slaves.\n\n'Note the lone torch at the very tip of Africa, the continent right below Europe. That is South Africa: Its sole democracy. Once a lion within the British Empire's great pride, South Africa is now a lion without a family to call his own. High above him, black buzzards circle as they wait for the moment to strike.\n\nNow the ugly beasts have swooped down for the kill -- but first, a glimpse of the country in question. What makes South Africa special in the concert of nations? Why must we pay attention to its plight? Though it stands as a beacon of hope amidst a continent swathed in darkness, it still seems an ocean too far for any American to care overmuch for its fortunes. For the next fifty minutes of your time, this information film will answer your questions about the Free World's last bastion in the Dark Continent, and the perils which assail it...\n\n-- excerpt from Why We Must Fight: South Africa."
 SAF.48.a: "The Dominion calls, America answers."

 SAF.49.t: "Help from the Cold"
 SAF.49.desc: "Accustomed as they are to the dark hair that accompanies either pale, fair, or swarthy complexions, the assemblage that filtered out of St. Ignatius in Cape Town harbor seemed like aliens from Mars for Cape Town's inhabitants: Pale, blond-haired, and blue-eyed. Wearing sharply tailored doctors' suits and nurses' caps, they stopped for neither the city's fine sights nor its fine people as they hurried to the Observatory's Groote Schuur Hospital. Befuddled onlookers wonder about the stoic, no-nonsense medicine men they were now saddled with.\n\nThis peculiar host of doctors and nurses is, of course, Iceland's little commitment to the OFN's budding front in South Africa. Due to It's lack of a Standing Army, the Republic of Iceland can't contribute militarily to the war. However, President [ICE.GetLeader] says that his country has among the most robust healthcare systems in the world; its health professionals on average are on par with the best America can offer, and its facilities are more than equipped to handle abrupt surges of wounded and diseased patients. Surges, incidentally, that South Africa will doubtless encounter as the war drags on.\n\nFor a nation six times smaller than the entirety of the Cape Province's capital, its medical staff is a testament to the weight it can punch despite its size. Their assistance is welcome regardless, as South Africa's health service infrastructure is strained to its limits by the exigencies of war." ## HDV ##
 SAF.49.a: "At least have a pint of Castle Lager, yeah?"

 SAF.50.t: "Help from the Tropics"
 SAF.50.desc: ""We may not be known for much," said the University of the West Indies' Vice-Chancellor Sir Philip Sherlock of the hundreds leaving Jamaica for South Africa, 'but only the finest mathematicians in our half of the globe.'\n\nThe Vice-Chancellor's words are no mere boast; indeed, the Caribbean nation's acumen in this regard was already appreciable before the flight of knowledge succeeding Sealion had turned appreciable into exceptional. Say what one will about the Federation's many failings, but its sandy beaches and tropical fruits seem to attract geniuses with the wherewithal to immigrate and the will to learn the Queen's English. They have since built the islands' piecemeal infrastructure up to a developed nation's standards since one war's end.\n\nNow, as the clarion call echoes in Kingston, the very same genius now board ships bound for another war to replicate their miracles in the Great Escarpment and beyond. No matter their paltry numbers, the West Indies' now-named "Boffin Bunch" remain a welcome addition to South Africa's own band of civil and military scientists."
 SAF.50.a: "These broties look like they know how to throw a good party!"

 SAF.51.t: "The Cape Town Sealift"
 SAF.51.desc: ""The South Africans needed those guns in Cape Town yesterday! Don't keep me waiting like this again!" Major General Bigelow snapped, before slamming the phone receiver down on the representative from Norfolk & Western Railway. After sparing a second for a quiet sigh, he picked up the receiver again as he pored over the rail timetables provided by the Ordnance Corps.\n\nOutside Bigelow's office, a young major winced and turned to his colonel as the phone receiver crashed down again. "I know we're all up to our eyeballs organizing the sealift to South Africa, but what's got General Bigelow so worked up?"\n\n"Whatever supplies the South Africans didn't abandon, they're burning through in days," the colonel replied testily. "They're throwing all the munitions and men they have at the Nazis, and soon they'll be out of both. And besides..."\n\nThe colonel pointed at a campaign medal on the General's desk.\n\n"Twenty years ago, Major Bigelow was a logistics officer during the Defence of Britain. President Dewey was slow getting industry to mobilize, so he had to send over every gun he could buy, beg, or divert."\n\nThe major's eyes widened as he made the connection.\n\n"It wasn't enough.""
 SAF.51.a: "Not this time, goddammit!"

 SAF.53.t: "The Queen's Men"
 SAF.53.desc: "Since the days of colony, Canada has maintained a long tradition of military service in the name of God, King and Empire. The Old Dominion has always answered firm and true whenever London called for their aid. Its army's conduct in the First and Second World Wars, in particular, were nothing short of exemplary; around 1 in 12 of all Canadians had fought like heroes in the shell-pocked battlefields of France twice over.\n\nThough the Empire is now a sad memory, Canada has yet to err from maintaining an army belying its stature\n\nSuch is the case today as the Canadian Division disembarks from the Queen Mary in Cape Town Harbor. The spectacle that gathered throughout the coast was the most euphoric a war-burdened populace can muster: Ten thousands of little Union Jacks fluttered high alongside just as many little Orange, White and Blues while a band vivaciously trumpeted God Save the Queen near the waterfront. The mob sang along off-key of course, as did the squaddies surprised with the reception that greeted their first day in the veld.\n\nThen again, can one truly blame the Cape for so cheering for the Queen's men? They and theirs have long distinguished themselves from the innately rebellious Boers with an innate loyalty to the Crown. With this in mind, Canada's formal entry into South Africa's war proved that, though the Empire is dead, the loyalty that has bound the Queen to her dominions for centuries remain sturdy and stalwart against their foes."
 SAF.53.a: "Loyalty begets loyalty, moreso between mother and son."

 SAF.54.t: "Brothers from the Last Wars"
 SAF.54.desc: "In exactly two Boer Wars and two World Wars, South Africa had fought at least one battle alongside its brothers in the Antipodes. Whether in East Africa or North Africa, shared experience in the battlefield has built up a camaraderie between the two far-flung Dominions that the fall of Empire cannot completely dissolve. Bolstering these feelings is an undercurrent of sympathy; after all, South Africa is as much of a bulwark as Australia and vice versa, but against the Nazis instead of the devils in Tokyo.\n\nSo is it any surprise that Canberra has sent ten thousand Australians to assist their brothers in their latest war? One would suggest that Washington had to goad it into doing so -- poppycock, naturally. More than anyone in the OFN, Australia recognizes the value of reciprocity; if it cannot show commitment to its duties, then who will show the same to Australia when the Rising Sun makes its move?\n\nNo, Australia and South Africa are brothers -- and brothers support each other in times of crises. Look no further than the veterans reuniting with old friends in Table Bay for testaments of the special relationship these two nations share."
 SAF.54.a: "None better in life than a blood brother 'til Judgement Day."

 SAF.55.t: "The Last Domino"
 SAF.55.desc: "Imagine, if you will, a row of dominoes standing upright. It takes time and effort to set one up without knocking it down prematurely, and when you do, even the slightest touch can undo your hard work- like so. See? Shot myself in the foot right there. (laughter)\n\n"Anyway, let's build it up again, just like... so. There we go. Now, suppose we assume that each domino represents one nation. One free, democratic nation that has or had existed since the beginning of the 20th century. Say, France and England near the front and our own country, the United States, at the opposite end. The Second World War meant that a good half of the dominoes on this table had already fallen, just like this.\n\n"So many fledgeling democracies and their people, left to the tender mercies of the black fascist hand. All that remains are a couple handful of dominoes, the ones at the back end sheltered whether by distance, strength, fortitude, or a combination of all three. Right this moment, South Africa now forms the front tip of this shaky conga line... and with the war making like tremors and gusts battering the table, the South African domino has wobbled every which way since it began.\n\nI will not insult your intellect by stating the obvious repercussions of South Africa's demise. What I can do, however, is proffer a solution: An intervention to stop the tremors and gusts wherever and whenever they're found. One way or another, South Africa must not fall in our lifetimes. The Free World cannot survive another setback; let's stop the malcontents dead cold before it can cause one..."
 SAF.55.a: "For all its curtains, geopolitics presents itself as a bloody game."

 SAF.56.t: "A Different Sun"
 SAF.56.desc: "It felt good to be on the ground again. Joseph Roy carried his gear of the cargo plane, past American air force personnel and toward the hastily built Canadian hangar. An officer shouted at them to hurry up. A few Americans turned, surprised. Had they really heard French? Joseph couldn't blame their confusion. The afternoon sun was making it hard to think.\n\nHis uncle had told him stories of the war in Britain. The soldiers there had been less surprised to hear French. Many Free French troops had fought in Britain. So had Polish pilots, Czechoslovak engineers, Russian exiles. American troops, their numbers almost as high as the desperate Brits, themselves fielding youth barely able to hold rifles and great war veterans with their grim desperation. All united against the fascist onslaught.\n\nOf course left unsaid by his uncle was that it had all been for nothing. Hundreds of French Canadians, buried under a cold and remote sun. The war had been unpopular then. This new war might be. Joseph had seen the protests back home in Québec city on his days of leave from Valcartier. A protester near the national assembly had coughed blood on him after getting in a fistfight. The fool didn't have to shout at him only for wearing a uniform, Joseph thought.\n\nIt felt good to be in the shade. The hangar was still extremely hot. The soldier leaned against the corrugated metal wall. Hopefully the war would be short. Hopefully only volunteers like him would make it to this foreign place. Hopefully, none of his comrades would find their final resting place so far from Québec's forest and plains."
 SAF.56.a: "He would serve, as had his uncle."


 SAF.60.t: "Americans on a Hijacked Iberian Ship"
 SAF.60.desc: "Today, news reached the offices of the Pentagon of a crisis upon the seas. The Iberian Government as well as the West Indies Federation report of a hijacked passenger ship, known as the Santa Maria. The ship was days ago hijacked by a group of radical Iberian democrats who boarded disguised as passengers, and has since gone off the radar following a quick stop in Saint Kitts, in which crewmen injured in the hijacking were offloaded. Aboard the ship are six-hundred passengers, consisting of women, children, and civilian men. Many of those aboard the ship are Iberian, however the Pentagon confirms that several occupants are American citizens.\n\nIt is possible that all those aboard the ship could meet a violent end, should all go awry, which would include the death of several American citizens at the hands of foreign terrorists. The American public would find such news unacceptable. As such, the only advisable course of action would be to commence a naval search operation to find the Santa Maria, and to liberate those on board. There are several United States Navy vessels in the Caribbean and central-atlantic region, which are prepared to commence search operations upon a moment's notice."
 SAF.60.a: "Send the navy!"
 SAF.60.b: "We can't afford the distraction."

 SAF.61.t: "The Marine Raiders"
 SAF.61.desc: "Corporal Smithley is the last in his squad to climb aboard the Santa Maria under the cover of nightfall. He carefully unslings his M14 rifle from his back, and as quietly as possible does a check of his loaded magazine, ensuring a round is readily prepared within the chamber. The intent of the mission is clear. Act fast, ensure civilians are not harmed, and take prisoner as many of the hijackers as possible. As soon as the first shot is fired, the hijackers will mobilize.\n\nThe squad leader gives a short series of hand signals, and they begin to move slowly across the dimly lit deck of the ship.\n\nNot long after, contact is made. The squad leader quickly releases two shots into the armed hijacker patrolling the deck, and the hijacker goes limp. Now that shots have been fired, the marines spring into action. Shots ring out from the other side of the deck, as other hijackers are likely killed. Smithley accompanies his squad in climbing an outer staircase of the ship, as they prepare for close quarters combat upon entering the bridge. The order is given to fix bayonets, and Smithley quickly affixes the ringed bayonet to the socket upon the barrel. Commotion can now be heard from within the ship, as several men begin shouting. Gunshots can be heard from other areas of the ship, as other marine squads quickly dispatch the oddly placed and unprepared hijackers.\n\nSmithley's squad quickly arrives at the entrance to the bridge, from where the ship is controlled. The squad leader begins counting down the entry. Finally, the count hits one, and he springs into action along with the rest of his squad. Quickly, they rush in to the bridge. Smithley, without thinking, dispatches one armed defender before a shot is fired. The other armed men within the bridge drop their rifles, and swiftly surrender to preserve their own life."
 SAF.61.a: "We have Galvão, the ship is secure."

 SAF.62.t: "The Americans Capture Galvão"
 SAF.62.desc: "Reports have today arrived from the United States Navy that the Santa Maria has been secured. A contingent of United States Marines aboard the USS Hermitage were able to successfully board the Santa Maria in the dark early hours of the morning. Seven hijackers were killed, and no civilians or crewmen who were hostages upon the ship were harmed. The other seventeen hijackers were captured by the United States Navy, and placed under custody. Among those captured is Henrique Galvão, who surrendered himself to marine forces once they swiftly stormed the bridge of the ship.\n\nThe United States has already agreed to extradite the Iberian hijackers to be dealt with by their legal system. The Americans, after questioning Galvão, have discovered his intentions. The intent of the hijacking was to sail the ship to Portugal, where he intended to incite rebellion within Iberia."
 SAF.62.a: "A modern Dom Quijote."

 SAF.63.t: "Iberia Offers Assistance in South Africa"
 SAF.63.desc: "This afternoon, the Iberian ambassador in Washington D.C. met with the President. The Iberian ambassador, in a move that has shocked many in our administration, has pledged the direct support of Iberia in the South African War. The ambassador claimed that, should the United States accept the offer of Iberian support in the conflict, Iberia is prepared to contribute significant and direct military combat support.\n\nAlthough wholly unexpected, this news has been welcomed by many in Washington. Previously, many Americans felt alienated within the conflict. It has been widely viewed as if we were standing alone. Whilst the scale of Iberian support has yet to be confirmed, we have affirmed with the Iberian ambassador that we will accept their support without question. Furthermore, our military is poised to provide any aid possible to the Iberians in assisting with the commencement of their operations."
 SAF.63.a: "We take all the help we can get."

 SAF.64.t: "Iberia Offers to Lease São Tomé"
 SAF.64.desc: "As the war in South Africa continues to ramp up, so does the involvement of our Iberian partners. The Iberians, much to our pleasure, have stood behind their commitments within the conflict, and have continued to provide much coveted support for our forces as well as those of our allies. In a recent communication, the Iberians have pledged a significant expansion to their existing support within the war. The communication to Washington D.C. outlines many intricacies and details of current Iberian intentions within the conflict, however one pledge within the document stands out from the others.\n\nThe Iberian island of São Tomé, which rests just north of the Equator, not far off the coasts of Central and West Africa, carries great potential as a logistics hub for the duration of this conflict. Following the establishment of Iberian operations in South Africa, they now believe the situation to be appropriate to lease access to the island to us, granting us an invaluable logistical asset. Senior military officials believe that the ports of São Tomé may be effectively used as a logistics waypoint, and further as a possible airbase for our bomber aircraft fleet.\n\nWhilst plans for the usage of the island remain in the preliminary stages, we have gratefully accepted the Iberian lease proposal, and it is estimated that logistical operations upon the island will commence in a matter of mere weeks."
 SAF.64.a: "A great boost to the war effort."

 SAF.65.t: "Iberia Provides Maps for War Effort"
 SAF.65.desc: "Whilst Portuguese colonial administration over Mozambique and Angola is a thing of the past, naught more than a mention within the history books, the recency of this history now has the potential to pay dividends within the war effort.\n\nIn a recent coordination effort, hosted in Washington, senior members of the Iberian military provided to us a plethora of dated maps and documentation, hailing from the late era of Portuguese colonial control in Mozambique and Angola. The content of the documents provided details, at great length, upon the industrial and infrastructural specifications in various vital regions within Mozambique and Angola, now controlled by the Reichskommissariats of the Afrika-Schild. We estimate that the maps, whilst outdated, are likely to this day accurate to a high degree. The information provided by the Iberians should prove invaluable for the continued effectiveness of the American bombing campaign against our enemies, as we begin to accurately strike at vital enemy logistical and industrial centers."
 SAF.65.a: "May the bombs rain down even more accurately than before."

 SAF.66.t: "US Airforce Hits Luanda Arms Factories"
 SAF.66.desc: "Following an exchange of information between the Iberian and American militaries, the USAF has been in possession of detailed information upon the logistical and industrial layout of the Afrika-Schild controlled regions of Mozambique and Angola. The intelligence has not been left to waste.\n\nYesterday afternoon, USAF bombers struck at industrial centers within Luanda, where significant arms production has been undertaken for the duration of the conflict in South Africa. Due to Iberian intelligence upon local industry, American bombs fell with deadly accuracy upon essential edifices within the local industry, causing irreparable damages and bringing a significant share of arms production in the region to a complete halt.\n\nDue to the quick and devastating nature of the new American bombing campaign, it is hoped by many senior officials that the productive capabilities of the Reichskommissariats will be significantly hindered for the duration of the conflict. Despite this, the overall effect of the reinvigorated American bombing campaign upon the overall effectiveness of the Afrika-Schild has yet to be determined."
 SAF.66.a: "A significant blow to the enemy war machine."

 SAF.67.t: "Rádio África Livre"
 SAF.67.desc: "Officers working at the SOG Headquarters in Cape Town were not believing their own eyes when they first glanced the so called specialists that arrived from Iberia, rather than the clean cut military men in well ironed uniforms that they were used to, the Portuguese specialists all had long hair, mustaches, and wore floral shirts instead of camouflage, small groups gossiped in the hallways about how the Iberians looked more like folk singers than real soldiers. And they were right.\n\nThese men, all of them spent at least a decade living in the Continent, were part of the joint project to set up Radio Free Africa, who would broadcast propaganda in Portuguese aimed at African natives in Angola and Mozambique trying to inspire them to sabotage the German war effort. But more powerful than the propaganda were the songs, the most popular being Canto do Desertor, an anti-war ballad written by the Angolan-born poet Luis Cilia calling for desertion as the moral thing, reinforced feelings of nostalgia for home and family and the futility of dying in a war for those who are oppressing your people. The popularity of a Cilia's songs proved so much amongst the Südwestafrikaner SS that their German officers ordered the confiscation of personal radios and started punishing soldiers who tuned in on RFA's frequency, but no matter how harsh the repression is, in every sector of the Namibian front you can hear the troops humming while their officers are away 'Me deram uma Cruz de Ferro quando matei meu irmão, e a cabo promoveu-me o Alemão, todos me chamam de herói ninguem me chama de amor, quem quieres uma Cruz de Ferro que eu não vou pro quartel'"
 SAF.67.a: "Tell my mother I won't go to war for a German."

 SAF.68.t: "Heroes from the Sky"
 SAF.68.desc: "The streets run red with the blood of innocents, as bombs and mortars rain from the sky. Despite American air superiority, little can be done when the enemy is so close by. Civilians in South Africa find themselves inadvertently caught in the crossfire of this bloody conflict, and as a result, many become a casualty of war.\n\nIn the chaos of the city streets, many speak of Portuguese saviours who run through the deadly corridors, rescuing those in need. These stories, whilst they may appear to be fantastical, are in fact grounded in reality.\n\nAccounts from across the conflict in South Africa tell of Portuguese medics of the Iberian army coming to the aid of those in peril, risking their own life and limb to do so. Hundreds of South Africans claim to have been in some way rescued by these medics, operating far outside the scope of their mission in order to provide any assistance possible for the South African populace caught in zones of conflict. The actions of these men have truly become the make of legend."
 SAF.68.a: "We are forever in their debt."


 SAF.75.t: "Rising Discontent"
 SAF.75.desc: "Various commanders currently embroiled in the conflict have begun independently expressing concerns to their superiors. However, beyond the typical frivolous requests for more resources and logistical support, a common theme has emerged. Commanders report a worrying amount of apathy and at times outright disobedience among their ranks. Incidents of scathing letters home, insufficient fulfilment of duties, and mocking jeers towards superiors have emerged as a pattern. It seems that many soldiers no longer understand the value in our mission, and wish to return home.\n\nDisciplinary actions are being taken, but it is highly possible this situation could devolve into cases of outright desertion if left unchecked. We must tread carefully."
 SAF.75.a: "Let's keep our eyes open."

 SAF.76.t: "Anti-War Sentiments"
 SAF.76.desc: "More bad news has been received from a number of commanders on the ground in the Bush. The deteriorating morale among rank-and-file troops has clearly only increased. While outright rebellion and desertion still seem far off, what began as scathing letters and mocking jeers has evolved somewhat. The sort of discipline that we try to instill in our troops is clearly breaking down. Troops are starting to affiliate with particular cross-unit organizations, often based on race. Moreover, radical anti-war literature and thought seems to have penetrated a number of barracks.\n\nWe can certainly work to address this lack of cohesion among our troops, but this will be a difficult set of problems to solve, and the continually vicious state of the war is likely to only make matters worse."
 SAF.76.a: "We can only hope that this will be all."

 SAF.77.t: "The Situation Deteriorates"
 SAF.77.desc: "As the Fascist enemy grows increasingly barbaric in his assault, morale has become a significant problem among the rank and file. Beyond simple desertion, some soldiers have begun corresponding directly with members of the media. Exaggerated stories of some of the horrors of war have begun to spread like wildfire back home. Some soldiers have even organized demonstrations, pleading with their officers, and jeering that the North is a "Death factory".\n\nCrackdowns continue, but the sheer scale of the soldiers movement has made many within high command nervous. If the media were able to sufficiently spin a narrative against us, our prospects of victory could become limited."
 SAF.77.a: "What are you talking about?! This is war!"

 SAF.78.t: "Jungle Rats"
 SAF.78.desc: "The endless war we appear to be engaged in has pushed our troops to the limit - and some are saying beyond even that. Boer partisan activity has reduced our functional capacities to the point that many units are reporting poor morale when not on direct R and R. In fact, recent surveys amongst units in the field have revealed skyrocketing rates of drug usage and addictive behaviors. In interviews conducted by reporters, soldiers are noticeably shaken and extremely reluctant to continue the war they entered enthusiastically, and many are already describing the shellshocked men who return to the United States as the Second Lost Generation. The tactics of the partisans are apparently working, as some predict that a massive wave of desertions may be in full effect - and we are not ready for the consequences."
 SAF.78.a: "I can't take it anymore!"

 SAF.79.t: "A Sudden Announcement"
 SAF.79.desc: "Our worst nightmare has come to pass! A massive, highly organized wave of desertions has swept virtually every front in the South African conflict! Entire battalions are abandoning their posts, exhausted by a seemingly unwinnable war. Those that have been willing to speak with their superiors or the press claim South Africa "Is a dead nation" and decry being forced to risk their lives for what they call an immoral war.\n\nOur soldiers live in constant fear of partisan reprisal or enemy bombings, and are refusing to continue their duty within such a stalemate. This is an unprecedented disaster for the war effort, and drastic action must be taken to ensure our gains are not lost in their entirety"
 SAF.79.a: "This may cost us everything."

 SAF.80.t: "The Silent Epidemic"
 SAF.80.desc: "Panzerschokolade, smack, devil's grass; from Africa's open wounds a new health crisis as flared up as drug use has soared across the continent. Soldiers from the OFN and Afrika-Schild have taken to consuming marijuana, heroin or sedatives to escape the tedium and horror of battlefield deployment. Their comrades on the frontline are in turn often running on amphetamines to maintain vigilance on endless patrols. In this they are joined by desperate locals consuming cheap amphetamines to curb hunger as they flee devastated fields and plantations.\n\nFor once the Germans and Americans are in agreement about something. But neither side is able to stem the tide of drugs flooding into the dark continent. Criminal syndicates from Asia transport entire productions of heroin to backwater ports that the Schild and OFN cannot monitor. Even without criminal activity, the vast amount of medicine brought in by both factions still presents a colossal risk potential. Overworked doctors prescribe drugs for any ailments, and officers often close their eyes on this problem to keep their soldiers sedated and functional. Soldiers from both sides torch as many fields of marijuana as they can, but their generals have little time for police work as they struggle to win their war. And through all this, private corporations funnel vast amounts of older pharmaceutical products to the continent where they serve as precursor for harder drugs.\n\nThe domestic reaction in America has been horror. Many refuse to see their children conscripted, lest they return home as dysfunctional addicts. Critics of the government's war effort see in this drug epidemic a microcosm of the entire South African mess; an impossibly large continent is impossible to fully control and monitor. Private interests benefitting from the chaos have little interest in solving the crisis, and the American government is too busy to try and help to make things better. Cynics predict that the South African War is likely to end long before its associated drug boom is solved."
 SAF.80.a: "Come on, this will ease the pain."

 SAF.81.t: "Operation Springbok"
 SAF.81.desc: "Operation Springbok has provided highly valuable intel on the border between FIELDS and CRUSADER. On the recommendation of JULIET, Green Beret units were inserted into FIELDS to conduct recon along the northern border at key points of interest. Notable findings include the potential of the (REDACTED) mountain range as a natural defensive line against a CRUSADER offensive from the southeast, the favorability of the interior terrain of FIELDS towards both a CRUSADER invasion and a joint TRIGGERMAN-TORCH counteroffensive, and lastly the incredibly harsh conditions and landscape of northwest FIELDS making it likely all forces operating in the region would suffer high environmental attrition.\n\nCopies of the findings of Operation Springbok have already been distributed to trustworthy elements within TRIGGERMAN along with advice from TORCH advisors on how best to utilize the information. For the full topographical report and its military significance please see attached documents 1-4.\n\nThe Green Beret units that took part in Springbok have been ordered to remain in FIELDS to engage in further operations in the region."
 SAF.81.a: "Understood."

 SAF.82.t: "Operation Blood Brother"
 SAF.82.desc: "Green Beret units inserted for Operation Springbok are to proceed with Operation Blood Brother at once. Operation Blood Brother is to consist of a multi-step training program to assist TRIGGERMAN in the training of its own special forces brigade, codename RECCES, who will be able to operate in a similar function to the Green Berets.\n\nInstructors participating in Blood Brother are authorized to train RECCES recruits in all areas the Green Berets are trained in except for (REDACTED), (REDACTED), and assassination of civilian targets. Aside from these restrictions, Green Beret instructors are to provide all assistance possible to the TRIGGERMAN officers overseeing the creation of the RECCES brigade.\n\nInstructors are to regularly report back to POLARIS on how receptive TRIGGERMAN has been to their advice, the disparities between TRIGGERMAN and TORCH special forces training, and how effective they estimate the RECCES brigade would be in action against CRUSADER."
 SAF.82.a: "Understood."

 SAF.83.t: "Operation Colossus"
 SAF.83.desc: "Operation Colossus was initiated simultaneously with Operation Blood Brother and has continued following the successful conclusion of Blood Brother. Green Beret units have been instructed to integrate themselves into TRIGGERMAN at multiple levels in an exclusively advisory capacity. This advising has multiple objectives:\n1) Improve the effectiveness of TRIGGERMAN as much as is feasible.\n2) Prepare TRIGGERMAN for integration with TORCH forces in the event of an invasion by CRUSADER.\n3) Cultivate good relations within TRIGGERMAN hierarchy and establish assets within both TRIGGERMAN and HOST.\n4) Identify TRIGGERMAN officers with possible CRUSADER sympathies.\nObjectives 3 and 4 are the primary goals of Colossus, and are well on track to be met.\n\nTORCH advisors from the Green Berets have compiled dossiers on every significant TRIGGERMAN officer, and have noted several sympathizing with our cause (See attachment A). Additionally, a clique of officers possessing dubious loyalty to FIELDS have been marked (Attachment B contains a full list). Plans to remove these officers from their positions are currently being formulated."
 SAF.83.a: "Understood."

 SAF.84.t: "Operation Rotterdam"
 SAF.84.desc: "Operation Rotterdam is intended to combat ORANGE activities within FIELDS and prevent efforts by CRUSADER to aid or assist ORANGE. Operatives of the SOG (Studies and Observations Group - see dossier) experienced in paramilitary and counterinsurgency missions are to infiltrate areas with high ORANGE presence, primarily in and around the cities of (REDACTED) and (REDACTED).\n\nOnce insertion is complete, SOG operatives will assimilate into civilian life and begin covertly collecting information on local ORANGE activities. Priority information includes planned attacks against TRIGGERMAN or TORCH, communications between ORANGE and CRUSADER, identities of ORANGE leadership, and ORANGE cell locations across FIELDS. SOG operatives are to coordinate among one another and act on their own initiative to halt or hinder ORANGE activities in any way deemed necessary so long as it does not expose their cover.\n\nSOG operatives are not to report any of their findings to either TRIGGERMEN or TORCH. All findings on ORANGE during the course of Operation Rotterdam are to be sent directly to POLARIS.\n\nOperatives participating in Operation Rotterdam are to continue under these guidelines and send monthly status updates until an order to cease is received from POLARIS. Orders to cease activity from any other source are to be ignored."
 SAF.84.a: "Understood."

 SAF.85.t: "Operation Assegai"
 SAF.85.desc: "Operation Assegai will consist in the formation, financing, arming, and training TRIGGERMAN assets in covert resistance activities, including assassination, political provocation and disinformation.\n\nSmall-scale operations may cover discrete areas and counter subversion of HOST, but larger cells stay-behind envisage reacting to a CRUSADER invasion of FIELDS. Assegai assets will be supplied with arms and explosives caches (Contents on Annex 2.a) to slow down Crusader troops from reaching the Cape while TORCH prepares joint deployment."
 SAF.85.a: "Understood."

 SAF.86.t: "Operation Malan"
 SAF.86.desc: "Operation Malan is still showing adequate progress. While BLUE has suggested that working with native groups may be preferred, JULIET has once again pushed for continued assistance to TRIGGERMAN groups (see dossier 4.b for associated names) in order to ensure assistance from targets.\n\nBLUE has argued that native groups would be more willing to accept assistance, while JULIET has pointed out domestic issues that could follow if racial wars in FIELDS were to occur, and points out that assistance to much more conservative TRIGGERMAN groups could both ensure an easy transition of power, as well as provide a natural ally in domestic policy.\n\nJULIET also points out that backing TRIGGERMAN in Operation Malan, along with General (REDACTED, SEE FULL DOSSIER BRIEF) to ensure the plan moves forward could lead to a bloodless coup in case the results of the referendum are not favorable."
 SAF.86.a: "Understood."

 SAF.87.t: "Operation Knobkerrie"
 SAF.87.desc: "Operation Knobkerrie was as a tremendous success, the suggestion proposed by BLUE to associate native elements on TRIGGERMAN service and the creation of MINUTEMEN has reaped good results. The termination of B.J Vorster by MINUTEMEN (SEE FULL DOSSIER BRIEF) not only neutralized a moderate pro-Axis politician that could sway HOST electorate to their side at the referendum but also proved the effectiveness of MINUTEMAN as a loyal and productive asset, encouraging their employment both on Operation Assegai and any further requirements."
 SAF.87.a: "Understood."

 SAF.88.t: "A House Divided"
 SAF.88.desc: "The foreign media has often depicted the crisis in South Africa and ensuing war against the north as a struggle between Anglos and Afrikaners. The truth, as with most things mediatic, is more nuanced. A small minority of Afrikaners has opposed the violent separatism of their fellow citizens. The number of these loyalists has been growing thanks to the Afrikaner Volkstaat's willingness to abandon democracy and side with the northern fascists. Many of these young loyalists have joined the Union Defence Force and performed valiantly on the battlefield in the Queen's Boer Guard unit.\n\nIn turn, many Anglophone citizens are disgusted with the government's "weak response" to the ANC and have urged terrible retribution. At the war's outbreak, scores of fascist Anglophones have fled north to join the breakaway states, or have stayed home to act as an insidious fifth column."
 SAF.88.a: "South Africa weeps for her children."
 ############################################## Start Tree Events


 SAF.101.t: "Alone in the Wild"
 SAF.101.desc: "South Africa, our Dominion, stands alone on the continent as a genuine state that is not corrupted by the horrific and brutal ideology of the Reich. It stands alone, free from the influence of the Nazis, their new colonies either too busy with the exploitation of their resources for export to Europe or with the maintenance of their borders with the chaos of the rest of Africa. And though we may stand alone and free, it cannot be ignored that we are not ready to endure any more trouble. Within and without, things are coming close to falling apart.\n\nIn our nation, increasing tensions among our citizens are becoming untenable. The Boers to the northwest are becoming more restless, seeking to impose their vision on us, demanding from us many concessions. It is thanks to Hertzog and the National Party that they have a voice in our Parliament, and such a voice is becoming louder and louder, bringing predictions of an unwanted but maybe inevitable uprising. And the African National Congress, a party founded by black citizens who are discontent with their living conditions and upset with the way we rule this land, is gradually becoming more daring and defiant. They have the support of many of their kind both internally and beyond.\n\nIn time, however, no matter how much we may not want it for it, something is going to happen. Consequences, both foreseen and not, are looming over our heads, becoming clearer to us only after it is too late. We must prepare for the future, doing everything we possibly can to preserve our Nation as the Crown's subjects, or else succumb to either the enemies within or the nightmare of the Reich."
 SAF.101.a: "May our Dominion stand, or die fighting for its freedom."

 SAF.102.t: "The Quiet American"
 SAF.102.desc: "A tall man stepped out of the plane, carrying himself down the steps, breathing in the South African air. It was something he had long been expecting to breathe, to experience for himself, and to remember. Edward Geary Lansdale steadied himself, bringing his personal luggage with him, and walked away from the aircraft, forgetting about noise of the dying engines.\n\nHe looked forward to doing the things that he had done before, his identity and his motives protected by secrecy. He had not thought that he would quietly rise up the ranks and find his place here; he had humble beginnings, especially as a journalist. He maneuvered through the terminal and into the rest of the airport, finally reaching a car waiting for him.\n\nThe easy part was done. As he rode in the back, thinking over the more tedious details of his mission, Edward closed his eyes and envisioned the unit he would forge with the best this land and his own country would offer. Their name wouldn't be too suspicious; it was simply the Studies and Observations Group. But anyone looking closely, especially someone like him, would know that it was more than just a mere auxiliary entity.\n\nThis group would put dread into the hearts of those who seek to cause South Africa trouble, especially if they threaten the interests of the Free Nations. Those were Vice-President Kennedy's orders.\n\nThe Nazis will learn to fear them. If they would keep trespassing in the valley, he would sweep the shadows over them. He would harass them, divide them, press them, and take their comrades. He would search for their assets, destroy them, and fade away like a shade in the night. He would fill them with terror, even as they rested or waited for orders.\n\nAs long as he played his cards right, and for as long as he kept the unit nice and tight, he could ensure that his objectives were fulfiled."
 SAF.102.a: "Serving in the shadows, waiting in the midst of wars."

 SAF.103.t: "In the Defendant's Dock"
 SAF.103.desc: ""Above all, we want equal political rights, because without them our disabilities will be permanent. I know this sounds revolutionary to the whites in this country, because the majority of voters will be Africans. This makes the white man fear democracy."\n\nThe man speaking these words is Nelson Mandela, a man on trial for four counts of sabotage and attempting to overthrow the government, charges that will stick and will potentially lead to his execution. He is being tried alongside several other ANC members, in a case which has garnered considerable attention. Mandela has used this opportunity to bring attention to his cause. This opening to the defence proceedings has been a three hour speech. In it, he has justified the ANC's decision to go beyond constitutional methods and non-violent resistance, citing the increased restrictions placed on non-whites. Instead, they have embarked on a campaign of sabotage against property, while developing a military arm for possible future use.\n\n"But this fear cannot be allowed to stand in the way of the only solution which will guarantee racial harmony and freedom for all," he continues. "It is not true that the enfranchisement of all will result in racial domination. Political division, based on colour, is entirely artificial and, when it disappears, so will the domination of one colour group by another. The ANC has spent half a century fighting against racialism. When it triumphs, as it certainly must, it will not change that policy."\n\n"This then is what the ANC is fighting for. Our struggle is a truly national one. It is a struggle of the African people, inspired by our own suffering and our own experience. It is a struggle for the right to live."\n\nHe turns to look the judge in the eyes, the last time he will do so in this trial.\n\n"During my lifetime I have dedicated myself to this struggle of the African people. I have fought against white domination, and I have fought against black domination. I have cherished the ideal of a democratic and free society in which all people live together in harmony and with equal opportunities. It is an ideal which I hope to live for and to see realised."\n\n"But if need be," he concludes, "it is an ideal for which I am prepared to die.""
 SAF.103.a: "The defendant is found guilty and sentenced to life imprisonment."

 SAF.104.t: "Hertzog's Speech"
 SAF.104.desc: "The white-haired Afrikaner rose from his place as quickly as he could, adjusting his glasses with one hand while the other gripped a sheet of paper, knuckles white from the pressure. All around him waited the rest of the Parliament; his colleagues in the National Party on his side, and the members of the United Party, their ranks dirtied by the presence of the English, reminding him bitterly of their treatment of his family who they forced into concentration camps. His eyes regarded them with terrible contempt, especially as he noticed Seretse Khama, the only black man present, observing the proceedings. While he obviously shared the same feelings his contemporaries had for the English, nobody would doubt that Albert would be more disgusted with the African.\n\nNevertheless, despite the presence of these people, he would have to make his move now. Albert steadied himself as the Parliament was called to order, the representatives of each party settling down in their seats. He waited until the speaker to proclaim to them that the floor was free for him to take. Then he began to speak to them, his voice loud and clear.\n\n"This land does not need to continue its existence under the watch of a monarch! In fact, for the many times I have proclaimed this, especially with my party, it is not necessary to seek the guidance of one. We can rule over this land as a Republic with a President at its head. But what is the point of striving for this if this is not put forward to the people? For everyone to have their say, especially those who truly deserve to settle the land which they have called theirs since they've come?"\n\nMen from the United Party rose in anger, booing at him, raising their voices, but the speaker interrupted them. And the Boer kept speaking, more clearly now, overcoming the volume of his opponents, just as many in his own party rose to defend him and to counter their disapproving remarks.\n\n"I make it clear before you now! Realize that there is no way for this Parliament to keep on moving forward if it cannot listen to the calls of the people. I demand that a referendum be considered for the sake of our people! And if this is not put to consideration, every proposal set forth by this parliament shall be halted. This land is our land; this is the Volkstaat, and we are not slaves of any king or queen!"\n\nThe parliament burst with noise and the Boer returned to his seat, proud, as his party members shouted down the opposition, silencing them."
 SAF.104.a: "Unfortunately, it is his right as a member of Parliament to insult the Crown."
 SAF.104.b: "Let's see if Mr. Hertzog is bold enough to say that in front of a judge."

 SAF.105.t: "Referendum Celebrations"
 SAF.105.desc: "Despite the great opposition put up by the United Party, Hertzog's party came out victorious. Now, the streets of Johannesburg, Kaapstad, Pretoria, and all the other great settlements of the Republic explode with cheers from Boers who came out to celebrate the referendum. In the corners lit by street lamps, and on the highways free of traffic, the white citizens of South Africa, those who proudly call themselves the sons and daughters of those who endured the Great Trek, are, for once, free to show off their joy at a victory over the Anglos and the Africans.\n\nAlthough such a referendum may have a chance of failure, or of potential sabotage, it is nothing to neglect. The Boers had done it. And their enemies would have to shake their heads, sigh, and retreat into their homes. After all, as victory is celebrated, the streets of Suid-Afrika, the home of the supposedly noble Boers, witness vile acts in the dark.\n\nA scream of a prostitute here and there rings and fades. Some rumors of young Boers tossing empty beer cans at Africans as they sped over the roads come and go.\n\nSouth Africa, it seems, will have to put up with the Boers whether she wants to or not."
 SAF.105.a: "Let them have their little party."
 SAF.105.b: "The police will deal with these ruffians."

 SAF.106.t: "That Fateful Meeting" ### HDV ###
 SAF.106.desc: "To say the United Party's headquarters in Cape Town was packed would be a massive understatement. Party bigwigs from all around South Africa had come to finally set out the course of action on the continuously deteriorating situation within the nation.\n\nRepresentatives of the different wings of the United Party were clashing in intense yet still gentlemanly debates on what should be done. The one thing that was agreed upon by all present was that things simply couldn't carry on as they had been ever since Prime Minister De Villiers Graaff's rise to power in 1956. The PM himself was of course present, ever the moderating figure in the middle that kept the clashes between the UP's progressives and conservatives from actually causing a rift.\n\nVause Raw, ever the prominent conservative insisted upon a strict crackdown upon the ANC's so-called hooliganism and terrorism. Only rigid enforcement, legislation, and complete undermining of the African National Congress could keep them in line and thus serve to appease the Boers into stopping their pro-German foolishness.\n\nThe progressives under Colin Eglin and Jan Hofmeyr, meanwhile argued that the only approach that would bring back stability is to tackle the Ossewabrandwag's extremism, securing the borders and shorting up security against them.\n\nAs the evening carried on, tiredness set in, and more and more the meeting seemed to be close to completing. More and more eyes turned to De Villiers Graaff to await his conclusion, the undisputed leader of the United Party and the nation finally settling on a conclusion that all would have to follow."
 SAF.106.a: "Our priority must be handling the Ossewabrandwag"
 SAF.106.b: "We will have to deal with the ANC first"

 SAF.107.t: "Robben Island"
 SAF.107.desc: "A few kilometers off the shore of Cape Town is a small, flat, oval-shaped island that rises a few meters above the surface of Table Bay. In 1654, Dutch settlers built a farm for sheep there. In 1659, Autshumato, the defeated leader in a war against the settlers, was exiled here. Since then, the island has been home to a whaling station, a leper colony, a place to quarantine animals, and defensive fortifications in the Second World War. But it has always been regarded as a place to store troublesome chiefs, native leaders, and other political prisoners by its owners.\n\nRecently, it has become the new, permanent home to a number of radical prisoners. Daniels, Mandela, Mbeki, Mhlaba, Sisulu, Sobukwe, and others who are too much of a threat to society to be allowed to exist on the mainland wll be placed in the maximum security prison. Here, their visitors can be cut off, their mail stopped and regulated, their cell block isolated, their contact with the outside world shut. Their existence is reduced to their five square meter cell, their table, and the straw mat to sleep on. If they behave, they might be able to work in the quarry on the island, digging up lime."
 SAF.107.a: "Out of sight, but not out of mind."

 SAF.108.t: "The Paper Trail"
 SAF.108.desc: "Organizations neither sprout from nor last with thin air. Rather, they are formed by the will of like-minded men, buttressed by the hands of like-minded men, and financed by the money of like-minded men. Like a clockwork machine all three function synchronously to achieve some goal or another: Its leaders convene in smoke-filled rooms to discuss their ends and means; its grunts execute said means to their fullest extent; and its businessmen funnel part of their profit to propel themselves, their leaders, and their compatriot grunts further towards said ends.\n\nThe African National Congress is no different, but oftentimes perceptions fail to reflect the truth. One can easily see throngs of exuberant blacks waving banners of protest in television and on print, and the faces of the revolution they proclaim: Mandela, Tambo, Sobukwe. However, their pecuniary backbone escapes media attention save for reports on economic growth and the odd broken storefront. Ignored by many, these financiers are left free to support the petty insurrectionists wedging South Africa apart with millions of pounds -- blood money to the last shilling.\n\nTo deal with this clandestine threat, Commissioner du Plooy has suggested two approaches: sanctioning black and coloured businessmen suspected of providing funding to the ANC, or blacklisting businesses vocal in their support for the National Party. Going straight after the Congress's wealthy benefactors may hurt it the most, but undertaking the latter will allow us some degree of plausible deniability and, perhaps, uproot paper trails leading straight to the Reich."
 SAF.108.a: "Strike directly at the ANC!"
 SAF.108.b: "Hit the National Party instead."

 SAF.109.t: "Living Evidence"
 SAF.109.desc: "It was seven in the morning, the work day was just beginning at the Inter-African Commerce and Investments Bank when dozens of men wearing the South Africa's Police marched through the door of the company's headquarters in Durban. The bank, founded by Dr. Indlovu Kumalo one year before the War was the only financial institution in the whole country to be headed by a black man and a longtime suspect by State Security of being one of the largest sources of funds for the African National Congress.\n\nThe raid was a tremendous success, with way more important evidence than the expected ledgers and documents being captured, police seized on the bank's security cabined an arsenal of 3 Colt .45 pistols, 8 .38 revolvers and a 12 gauge shotgun, all of them most likely on the way to arm ANC guerrillas, but our boys also caught a prize worth more than any weapon: A blue eyed white man with a German Iron Cross, with the swords, pinned on his business suit.\n\nThe German was really cooperative with our detectives when taken to the station: He identified himself as Herr Becker, a veteran Wehrmacht Sargent who earned his Iron Cross in the Russian Front, where he also meet the current Reichskommissar Siegfried Müller, after the end of the war in Russia Mr. Becker moved to the Congo where he worked as one of Müller's bodyguards until he contracted Malaria and couldn't accompany the Governor in his many hunts. The suspect first encountered Dr. Kumalo in Léopoldville soon after, accepting a job as the Bank's security manager, when questioned the nature and reason of his presence in South Africa Herr Becker answered 'Only four more months of work here and I could buy that house in Germania!'"
 SAF.109.a: "We knew that the ANC was not acting alone."

 SAF.110.t: "Heavy-Handed Measures"
 SAF.110.desc: "From Bechuanaland to the Cape, South Africa's precincts ring with the din of marching feet and thrumming engines. Under the watchful eye of sergeants are weapons drilled, protocols reviewed, heavy armor donned, and targets identified. Likewise, the officers under their command fulfil their new tasks with competence and zeal. It seems as if the South African Police are preparing for war -- and if one were to consider Commissioner du Plooy's "heavy-handed measures" as anything but, then they will find themselves deluded and, if unfortunate, choking in tear gas.\n\nAs is often the case, the upper echelons are split as to how extensive these measures are. Some caution restraint and advocate for isolated raids against notable agitators, whereas hard-nosed hardliners consider simultaneous imprisonment of hundreds in their gatherings and conventions acceptable. They look to us to conclusively settle this debate."
 SAF.110.a: "Small, but sure and swift."
 SAF.110.b: "Enforce the law to the utmost!"

 SAF.111.t: "One Day in Boipatong"
 SAF.111.desc: "Officer Bast Van Wyk of the South African Police knew that he was part of something much greater than himself. This was to be one of the raids that would hopefully break the back of the ANC and push the organization well underground. And it would start with this raid on a small house in the township of Boipatong. The target was some ANC, and they would hopefully get some information off of him.\n\nThe police cars pulled up in front of the house early in the morning, and the Police officers got out. Van Wyk and his partner Officer Hanekom would take point, with two other officers behind while two more would circle around and close off the back yard. It was a standard police entry. Hanekom banged the door and yelled "This is the South African Police! Let us in, we have a warrant!"\n\nNo reply. Van Wyk and Hanekom knew that was bullshit. "Open up, we're coming in!" shouted Van Wyk as he and Hanekom reached for their pistols, drawing them out, in case the suspect was making a last stand. Then Van Wyk kicked in the door, ready for anything...\n\n...Except a man feeding a stack of folders into a pot-bellied stove in the living room.\n\nThe officers charged in, but were ambushed by the suspect's wife swinging a pot at the officers. The following two police officers grabbed her and wrestled her to the ground, while Van Wyk and Hanekom charged at the suspect, ordering him to put his hands up."
 SAF.111.a: "At least we made some arrests..."

 SAF.112.t: "This Day in Boipatong"
 SAF.112.desc: "Officer Bast Van Wyk of the South African Police knew that he was part of something much greater than himself. This was to be one of the raids that would hopefully break the back of the ANC and push the organization well underground. And it would start with this raid on a small house in the township of Boipatong. The target was some ANC activist, he forgot the name, and they would hopefully get some information off of him.\n\nThe police cars pulled up in front of the house early in the morning, and the Police officers got out. Van Wyk and his partner Officer Hanekom would take point, with two other officers behind while two more would circle around and close off the back yard. It was a standard police entry. Hanekom banged the door and yelled "This is the South African Police! Let us in, we have a warrant!"\n\nNo reply. Van Wyk and Hanekom knew that was bullshit. "Open up, we're coming in!" shouted Van Wyk as he and Hanekom reached for their pistols, drawing them out, in case the suspect was making a last stand.\n\nThe officers charged in, but were ambushed by the suspect's wife swinging a pot at the officers. The following two police officers grabbed her and wrestled her to the ground, while Van Wyk and Hanekom went through the rooms of the house, looking everywhere for the suspect.\n\nMore officers joined, opened every closet, peeked in every attic and crawlspace, and looked under every bed and table before coming to the obvious conclusion: he had vanished.\n\nIn the middle of the search, a red car, turning onto the street outside the house, stopped when it noticed the SAP outside. It then made a U-turn in the middle of the road, hurrying to the nearest pay-phone."
 SAF.112.a: "Now it's a bust..."

 SAF.113.t: "A Good Day in Boipatong"
 SAF.113.desc: "It was a smashing success, by any measurement.\n\nPersonally, Officer Bast Van Wyk could attest to it. One raid in the morning on an ANC activist in Boipatong. A file was recovered that had names of several other ANC members in the area. More raids, more information, and more arrests. It was a long day, but at the end of it, the South African Police had several suspects in their custody who would no longer be agitating the public openly.\n\nHis partner, Hanekom, had told him some better news. It seemed the national raids were a success. Hundreds of ANC agitators were now behind bars from Bechuanaland to the Cape. That would put a big dent in their operations, he figured. True, some hadn't gotten captured but at least they wouldn't be poking their heads up anytime soon.\n\nSo what comes next, he wondered? The ANC was smashed by now. Maybe they'd do something rash in retaliation, maybe they wouldn't. Maybe they'd just never be heard from again. But that wasn't likely, he assumed. These things typically didn't stop with just one raid. One raid might take out a crime organization, and there'd be a new one up and running in a couple months.\n\nBut that was life. Even if the wind blows down your fence, you still put it back up. At this critical moment in the history of South Africa, it was nice to have a little breathing room."
 SAF.113.a: "A job well done; we can rest easier."

 SAF.114.t: "A Bad Day in Boipatong"
 SAF.114.desc: "Bast Van Wyk of the South African Police knew he had to prepare for every eventuality for the raid on the ANC activists. He came with several other officers, who were well trained, outfitted with weapons, and were aware of everything that could go wrong. The suspect might be armed, he might have friends, he might not be in the building. They had contingency plans for all of these options.\n\nBut he didn't have a plan for a crowd of ANC supporters when he turned onto the street.\n\n"Shit," said his partner, Officer Hanekom, as the police car stopped in front of the crowd. "What the fuck are they doing here?"\n\n"They found out," Van Wyk said aloud. "Mother of god."\n\nThe ANC must have found out, he decided, and gotten their supporters to protest. The suspect must have been hidden by now. He got on the radio and yelled, "Calling all cars, we got a protest in Boipatong. The ANC has a bunch of their goons out in force, need a riot squad, over!"\n\nBut then, a crowd of marchers appeared behind the small convoy of police cars, cutting them off. The cars tried to get out, but it was too late. They were beginning to be swarmed by agitated protesters. Van Wyk knew it was now serious. He stepped out of his car, brandishing a shotgun as he announced, "You are blocking a law enforcement vehicle! Disperse at once!"\n\n"Police fuck off!" screamed the protesters. "Police fuck off!"\n\n"Get the fuck back!" yelled Van Wyk, struggling to be heard over the chants. "Let us through, or-"\n\nThen he heard the sound of a revolver being fired, and then another."
 SAF.114.a: "Maybe we should have just let sleeping dogs lie..."

 SAF.115.t: "Regarding Bran Fisher"
 SAF.115.desc: ""So what's his record?"\n\n"Lawyer, barred in Jo'burg since 1935. Card carrying member of the SACP since seven years after that. Very close with the ANC; so much so he led Mandela's defence in the Treason Trial."\n\n"Man like that's no Nationalist."\n\n"If it helps some, he used to be in college."\n\n"And now the papers call him a terrorist's pet defendant. Cut the kak, de Plooy -- what's your plan now he's in custody? Do you even have one?"\n\n"He's a Boer from Bloem and that's what matters. Old joke about us folk: God stamps NP reg sheets on the left asscheek before mallie shits us out of her koek. They'll rag him about it long before they notice he's a fellow traveller."\n\n"You're still cutting things close. If it backfires-"\n\n"It won't. Now if there's anything else you need, Governor?""
 SAF.115.a: ""...I hope you're right, Commissioner. Good day.""

 SAF.116.t: "American Journalist Arrested in a Raid"
 SAF.116.desc: "The man cleared his throat, composing himself in the face of Calvin's uncouth demeanor. He spoke again.\n\n"Sir, the American Public... well the Americans... have a short attention span."\n\nCalvin smiled a bit, sensing progress in this long and painful exchange. His cigarette returned to its rightful place, and his posture sloped backwards into the annals of his desk chair.\n\n"You mean Lansdale."\n\n"Yes. With all due respect, he could never understand the severity of our situation. His countrymen have got an ocean between them and all the boogeymen. If I may sir, what exactly is he offering?"\n\nCalvin obliged him, settling into the more direct dynamic the conversation had taken.\n\n"1500 rifles and 300 anti-tank platforms for one bleeding heart journalist."\n\nThe man clasped his hands upon his knees. He had suddenly assumed a confident persona that made Calvin feel small.\n\n"I can understand how that may be tempting. I implore you however, to consider again the American attention span. To a journalist or diplomat, our Union is nothing more than a peculiarity. Something exotic to observe from afar. Sure, we may get some aid for this guy. Then what? The Germans still grow closer every day."\n\n"You're saying we should press for more?"\n\n"I'm saying we keep their focus. I want them to see that even one of their own isn't safe. We need a consistent ally, one who understands. There are some within this government, sir, who wish to highlight the true face of the ANC."\n\nCalvin suddenly understood why this young man had been so nervous with his proposition. The blood drained from his face, as the severity of the crime dawned upon him. And yet, he could hardly argue with its necessity. They needed the Americans to stay involved, now more than ever. An ANC attack on an American journalist was the perfect catalyst."
 SAF.116.a: "This could backfire spectacularly! Shut it down."
 SAF.116.b: "Bloody hell... do it."

 SAF.117.t: "A Day at the Range"
 SAF.117.desc: ""Alright, let's start you off with a revolver. This is a Smith & Wesson Model 27. It's used by plenty of American police forces who have trouble in high crime slums. Much like us today, hmm?"\n\n"Yes," said Caelan Walker as he looked at the assortment of firearms the dealer brought to the range with him. There were so many, and he knew next to nothing about them. He was an accountant, not a soldier, for God's sakes! "Is this a good personal defence weapon?"\n\nThe dealer laughed as he started loading the firearm. "It's a really good personal defence weapon, not for hunting tough, It wasn't made for Lions, Springbok but for game like the ANC. Here," he said, handing it over, "try putting a few rounds downrange, see how she handles."\n\nCaelan had taken a few shots before this, and knew the general idea of firearm safety. Don't point it at anything you don't mind losing, keep the fingers away from the gas ports, and treat it like it's loaded at all times. He flicked off the safety, and assumed a stance. With both hands, he aimed it at the center of the target and-damn, that was a huge kick!\n\nThe dealer laughed. "Well, at least you got it on the paper," he said. "Don't worry, you'll get used to it when you fire off a couple more." Seeing the distressed look on the customer's face, he said "If that was too much, we could go for a lighter round..."\n\n"No, this gun is alright," Caelan said, wanting to bring this to as quick a conclusion as possible. "Do you have some ammo for this?"\n\n"We have two varieties, pointed tip and hollow point. Now, the hollow points are more expensive, but you get what you pay for in terms of stopping power and the fact they don't go through walls and hurt people on the other side. I'm guessing that's a concern for you."\n\nCaelan nodded. "Three girls." he said.\n\n"Well, that settles it, then. How many boxes do you want?""
 SAF.117.a: "More and more feel unsafe..."

 SAF.118.t: "Sunday Evening at the Church of Transfiguration"
 SAF.118.desc: "Many things flowed through the mind of Piet Nel as he sat in prayer during the evening service of the Anglican Church in the Cape Town suburb of Bellville. He thought about his sick mother, and his father who was taking care of her. He thought about his son's broken leg. He thought about God and many things far beyond the understanding or comprehension of man.\n\nThe blast brought him back in the moment.\n\nShoving his wife's head down behind the pew as he took cover, he heard another one go off behind him, and another. This time with gunshots and horrified screams. Looking at the aisle, he saw many worshipers being hit with automatic fire, and another blast throwing up limbs, bodies, and splinters of wood from the destroyed pews.\n\nThe initial shock wore off, and he remembered that he had decided to take his snub nosed Model 10 to church today. Thankful for his foresight, he took it out, and peeked around the corner of the pew with it, hoping to use it to its fullest extent possible.\n\nSeveral Bantu were there, PAC, maybe, armed with assault rifles, which they were firing at the churchgoers. One threw a grenade, which explained the blasts. Piet knew his gun was not going to tip the odds in his favor, but he had to use it anyway. He started shooting, taking aim at one of the Africans.\n\nAmazingly, the sudden show of resistance panicked and sent the PAC running away. These weren't trained military, and they had no plan to deal with actual resistance other than to run like hell. Piet followed them as he reloaded, but only saw a car soom away as he got to the door. They had got away. But he had saved the church.\n\nBut he looked back, and saw the wounded, the dead, the maimed, and the ones that were going to die strewn about on the floor of the church. And he knew that his foresight and good fortune were not nearly enough."
 SAF.118.a: "Nothing is sacred, nowhere is safe..."

 SAF.119.t: "The Citizen's Defence Force"
 SAF.119.desc: ""Alright, mate, what made you join the Cape Town CDF?"\n\n"Well," said Caelan Walker, "I recently started getting worried about the crime and the violence going around. So I bought a gun, but then that church got attacked, and I knew that wasn't enough. So I joined up to help the community, since the government can't seem to keep us safe."\n\n"Alright," said the militia leader. "So, how many guns do you have?"\n\n"Well, I have a .357 revolver at the house, I could bring it when I go on duty..."\n\n"A single .357? No rifles or anything else?" Calean shook his head. "Well," said the militia leader, "you're going to purchase a rifle. Everybody in this outfit needs a rifle for when we go hunting Kaff, just like the Commandos back in the old days. It worked well against the Bantu then, so why not now? So get a mauser, preferably. And an automatic pistol, since you want to have firepower in an engagement. And maybe a shotgun for your house, in case someone breaks in for your television. Ammo?"\n\n"A box for the pistol," Calean said, trying to wrap his head around what he had just been told. Two new guns? Where would he put them? He was already scared to death that his daughters might get to his gun and accidentally discharge it. And now he was to get several more?\n\n"Not enough," said the militia leader disapprovingly, "you are going to want at least two hundred rounds per gun at all times. And do it fast, since I hear there's a shortage coming with everyone buying it. So do it when you go home tonight, understand?"\n\nCalean nodded. But he really didn't understand. Not as much as he would like. What the hell was he doing here?"
 SAF.119.a: "Preparing for the worst."

 SAF.120.t: "The Farm"
 SAF.120.desc: "De Plooy asked for it and Graaff ground his head against it. The affair was all hush hush -- no one but the SAP's highest needed to know every bit of detail -- but eventually they hashed out a deal.\n\nHaving acquired approval, de Plooy first picked the best man for the job. Of the thousands under the agency's payroll, he settled on JJ de Swardt's dossier. The captain was a rising star in the Bliksems, having earned his stripes fighting small flareups in Bechuanaland. Chops in counter-insurgency were worth their weight in all the Rand's gold to the Commissioner, and so he stamped the man's transfer to his new station with a new rank.\n\nNext, he picked a place for Major de Swardt's new HQ. South Africa has no shortage of dilapidated homesteads half-buried under the sand, only that a sharp eye catch their silhouettes among the bush. One eye spotted a complex 12 miles west of Pretoria. Fairly sizable, replete with provisions, and just far enough from civilization to stifle a scream with the open desert. De Plooy approved a second expedition into what the preliminary report called Vlakplaas Farm.\n\nLastly, he picked a name for its new inhabitants. Words in Afrikaans were struck out right off the bat; given the task force's nature, Afrikaans only added to caustic irony. Neither were words in Xhosa, Zulu, Bantu, and the country's thousand other native languages considered for the same reason. Instead, Commissioner de Plooy chose a title so banal as to mislead the layman of the embryonic agency's true objectives."
 SAF.120.a: "C1."

 SAF.121.t: "Opening Bridges"
 SAF.121.desc: "Harry Oppenheimer knew that most important organizational tasks were just a matter of getting the right people where they needed to go. And Oppenheimer was a master of organization, as he was the head De Beers Consolidated Mines. His position made him the king of mining in a country built on mining, and it wasn't a surprise that he was the richest man in South Africa. So he felt it was fitting when the South African government asked him to solve an organizational problem of their own.\n\nThe reason he was approached was that amongst his many philanthropic contributions towards education and Jewish causes, he had been supporting the African National Congress as well. His support of the ANC was tolerated because of his wealth and regular donations to the United Party. Now, his friends in the United Party wanted to meet his ANC friends, and Oppenheimer was the go-between.\n\nFirst, a phone call to his ANC contacts. The government was willing to negotiate, he said, and they wanted to discuss some changes that would calm the ANC down. Would the ANC be interested? And would there be a possibility that the head of the ANC, Mr. Tambo, could meet with the Prime Minister to discuss this in person? The ANC contact promised to get an answer, and he was called up a few hours later, saying that, yes, the ANC was willing to talk. Oppenheimer called up the government next, and gave them a phone number that they could use to talk directly with the ANC.\n\nBut then, the ANC contact called Oppenheimer and told him that negotiations had hit a snag. Since Tambo was still technically wanted for violating his banning order, there were concerns that he would be arrested at the meeting when he came out of hiding. Oppenheimer called up Graaff's office directly and informed them of the situation. A little while later, they gave him the assurances that if Tambo agreed to the meeting, they would revoke the banning order and let him avoid the charge."
 SAF.121.a: "His part was done."

 SAF.122.t: "Meeting of the Leaders"
 SAF.122.desc: "The rural village of Mahlabathini was obviously a place where nothing of much importance seemed to happen. Toward the southern end of the of KwaZulu and with over a thousand inhabitants, it was indistinguishable from the many other African villages in the area. Then, one day, a small group of South African Police showed up at the primary school and stood guard around the complex, accompanied by the mining magnate Harry Oppenheimer.\n\nSome ANC members talked with Oppenheimer for a bit, and the sound of helicopters filled the air. Two transport helicopters, marked in the colours of the South African Air Force, landed on the football green. Out came several plainclothes officers, a few staffers, and Prime Minister De Villiers Graaff. The ANC members were satisfied, and left with a police officer.\n\nThe leader of the ANC, Oliver Tambo, would later have to admit he did feel like this was a set-up. And it did seem ridiculous that this would really be taking place. But the assurances by the other members of the ANC that this was really happening convinced him. He left the safehouse on the edge of the village and went to the school, where he was allowed in after a brief search for weaponry by the guarding police officer.\n\nThe meeting between Tambo and Graaff took place in a schoolroom, with the desks formed to make a makeshift table. Several staffers for both sides were allowed in, as well, the Prime Minister's photographer to record the meeting, and Oppenheimer as a mediator. Negotiations were a bit awkward, at first, as neither side really trusted the other and expected a sudden ambush. Eventually, it became clear that both really did want to talk, and things got a bit more relaxed and calmer. And things got easier when Tambo and Graaff decided they really did want some of the same things.\n\nBy the time the meeting was over, substantial progress had been made. Graaff knew that the ANC would be willing to reduce violent and disruptive activity in exchange for concessions. Tambo knew that the government was now willing to meet with them on things, which was a lot better than when they were totally ignored. In the end, the ANC and the United Party could lead with something in common:"
 SAF.122.a: "A handshake and an agreement."
 SAF.122.b: "A concrete alliance."

 SAF.123.t: "The Last Afternoon"
 SAF.123.desc: ""... as we were returning from the lime quarry, the guards started singling out the ANC prisoners and had us assemble in the courtyard. None of us knew what was happening. The rumor of a meeting between Tambo and Prime Minister Graaff came up once again, but we didn't know if it had really happened, or if it was another deception. Govan said 'this is where they put us in our own cell block."\n\n"Finally, the warden came out and spoke to us. He cleared his throat, and announced, 'the government of South Africa and the African National Congress have come to an agreement where the ANC will renounce violence as a political tool. As part of this deal, the ANC will no longer be judged to be in violation of the Suppression of Communism Act, and their members will no longer be prosecuted for their crimes. At 8 o'clock tomorrow morning, you will all be loaded onto a ferry for Cape Town, where you will be released. Thank you.'"\n\n"It was shocking, and we were unsure if it had truly happened. We spoke to the warden after the speech, who assured us that it was all true. Then we started asking questions. Everyone else could leave if their groups signed the deal, said the warden, but we were going to be leaving tomorrow. I asked him if I could have my release delayed to inform my family to meet me when I got out, and if I could be transported near them and released there. The warden told me that transportation was our own prerogative. 'As for the delay,' he said, 'Graaff signed the deal, there's nothing to negotiate. You're leaving Robben Island if you like it or not.' And that was that."\n\nNelson Mandela."
 SAF.123.a: "A giant step on the long walk..."

 SAF.124.t: "Watching the Murray Bay Road"
 SAF.124.desc: "Being under solitary confinement, he was strictly prevented from being near or talking to the other prisoners on Robben Island. Robert Sobukwe had to rely on mirrors and coded hand signals to maintain contact with his followers in the Pan African Congress. Through which, he told them to keep to their belief in pan-africanist principles, and a South Africa without non-Africans.\n\nRecently, however, the guards had approached him with an offer, saying the PAC would be unbanned and released if he renounced violence as a political tool. To help persuade him, they allowed him to discuss it with the other PAC prisoners, who told Sobukwe that the ANC had signed the deal and had left the island. Many wanted to take the deal and leave the prison. But Sobukwe stood firm. There would be no cooperation with the government, he decided. As he observed his comrades in the PAC marching past him with the rest of the prisoners, he reflected on his decision and knew they would have to stay steadfast if they were to finally achieve victory.\n\nThen came the shock of his life.\n\nA prisoner in the middle of the group raised his hand. Several PAC prisoners were suddenly grabbed by prisoners behind them, covering their mouths so they could not be heard. Then out came the shivs, pieces of glass with cloth wrapped around the handle. Jaw agape, he watched his comrades go down in a fury of stabs and kicks. He started to yell, but none of that made a difference to the sudden orgy of violence that was transpiring outside of his residence. And he realized, to his horror, that the assailants were PAC members as well, the moderate ones who wanted to leave, and the victims were the ones who stood by him.\n\nWho did this, Sobukwe wondered? Did the ANC infiltrate the PAC? Was somebody making a play for party leader? Why aren't the guards watching this? Did the government want this to happen?\n\nSo fixated was Sobukwe on the inter-party coup on his hand mirror, he failed to notice the three prisoners that had climbed over his fence behind him."
 SAF.124.a: "He who lives by the sword..."

 SAF.125.t: "How To Operate an Electric Typewriter"
 SAF.125.desc: ""So it's like a normal typewriter, but it's powered by electricity," explained Caelan Walker, an employee of the South African Ministry of Finance, to the new employee. "When you hit the keys, a little motor inside makes the strike."\n\n"Where does the carriage come out?" asked Xolisa Balfour, recently hired by the Ministry of Finance as an intern and one of the first African employees on the floor.\n\n"It doesn't. The striker inside moves instead."\n\nTo confirm this, Balfour looked down at the gap. But that raised more questions. "What's this ball inside for? And where are the keys?"\n\n"That's the typeball," Walker said. "The typewriter rotates it around to get to the letter you want, and then strikes it on the paper. It uses, um, something called digital to analog conversion and, well, something-something coding, I forgot what they call it. It's complicated, but it's really fast, let's just leave it at that. Here, I'll show you." Walker put in a piece of paper and typed his name with the machine. Indeed, it was fast.\n\n"You can replace the ball if you want to do italics or something like that. There's a set of balls in your drawer, along with a manual if you want to know more. And don't worry about maintenance, if they break, we usually get somebody from IBM to repair them anyway. Sounds good?"\n\nBalfour nodded and got right to work on the typewriter. He learned fast, Walker had to admit. Maybe this Bantu hire program wouldn't be as much a pain in the ass as some in the office thought."
 SAF.125.a: "Now if only they made them in dual pitch."

 SAF.126.t: "Old Wars and New Wars" #[SAF.SAF_Charles_Fraser.GetRank]
 SAF.126.desc: ""And the idea is that we put all these new soldiers to good use," said General Charles Fraiser. "So the new recruits are to be put into several all-African divisions. These units will be outfitted to the standards of the other South African divisions in the army. We will name them after the King's African Rifles, so they'll be the Royal African Rifles, or the South African Rifles if the referendum goes through. Fitting, don't you think?"\n\nEdward Lansdale looked over the proposal. "Not really," he said. "It may have been back in the '40's, but not what you need right now."\n\n"With all due respect," said General Constand Viljoen, "what do you mean, 'not what we need right now?' We've been staring down the Pakt for years now, and this is to prevent them from coming over the border and taking Cape Town in a week. Isn't that why you're here?"\n\n"I'm here to keep your country afloat," said Lansdale, "and that's going to be hard to do if you insist on fighting the last war. The next conflict that you fight is going to be against the Boers in Transvaal, and you can't make the same mistake the British did by assuming you can fight a conventional war against them. You march those divisions four abreast in there, and they won't come back out."\n\n"Do you have an alternate strategy?" asked General Fraser.\n\n"Turn 'em into a South African National Guard. Forget sending them into battle like it's Jelib again, you make these guys do some less glamorous work," Lansdale explained. "They don't need heavy artillery, they need to be able to direct traffic, clear homes, get into remote areas, and send people to strategic hamlets. They're a counter-insurgency force, they bring the fight to the enemy on their turf. That's what you should have these men doing."\n\nGeneral Viljioen was unconvinced. "You know that the Germans are going to come through Bechuanaland any day, right?"\n\nGeneral Lansdale was still firm. "And you know how many are buried in your country because somebody thought the Boers were going to play fair?""
 SAF.126.a: "We need some British style African Rifles."
 SAF.126.b: "The American is right, no one fights fair these days."

 SAF.127.t: "A Message For the Movie Star"
 SAF.127.desc: ""Mr. Buthelezi, are you there?" asked the man on the other end of the phone line. "They told me that you were off filming a movie. Were you?"\n\n"Well, yes, Mr. Schwarz, I was," said Mangosuthu Buthelezi, a prominent Zulu chieftain. "It's a film about the Battle of Rorke's Drift. I'm playing my great-grandfather, King Cetshwayo. They are making me stand around with a bunch of extras out here near the Amphitheatre. So what's the matter?"\n\n"I've been talking with party leadership in Cape Town," said Harry Schwarz, leader of the United Party in Transvaal. "It's been a while, and we want to know if you made a decision on our proposal, yet."\n\nButhelezi took a deep breath and said, "You know, I'm thinking I'll do it. I've always wanted a career in politics and I'm glad the United Party thinks the same way. I'll run as a candidate in the upcoming elections. And I'm honored that you would make me the first native United Party candidate."\n\n"You're welcome, Mr. Buthelezi. We're glad to hear that you'll stand for us. Your goals and ours align, and you'll be welcome in our ranks. Although, technically, you aren't the first African candidate. King Seretse Khama is going to run up in Bechuanaland, we just learned that this morning."\n\nButhelezi laughed. "It figures that he'd do that. He definitely hates the Germans enough to join you. But that's alright, I'm happy with being second. And hopefully he gets elected so I don't feel alone in Cape Town."\n\n"I hope so too. I'll tell Cape Town the good news. Good luck, Mr. Buthelezi. And if it doesn't work out, you still have your movie career to fall back on.""
 SAF.127.a: "Hertzog and Tambo will have a surprise in the next election."

 SAF.128.t: "The Old New Teacher"
 SAF.128.desc: "Nesiwe Mbeki has experienced a lot of things in her 75 years living in her village in the Eastern Cape. When she was born, South Africa was a colony, the First Boer War had just ended, and life in the village was going on as it always had. She witnessed the Second Boer War, the formation of the Union of South Africa, the First and the Second World Wars, and all the events in between. In the meantime, her village changed with the addition of new wood homes, a new schoolhouse with a generator, and more and more pressure on the residents, specifically the younger ones, to forget their past and traditions, and change their ways.\n\nNesiwe has been living with her son's family ever since her husband passed away. Not content to sit around the living room and stare at the wall, she took to telling stories to the children of the household who were too young for school or to work. The children told their friends, and soon the village children would go to the house to listen to her stories. Stories of old Xhosa heroes and legends, ones that she was told as a child, and ones he was dismayed to find the young ones had a lack of familiarity with.\n\nThen one day, one of the white teachers in the village sought her out. He told her that the government had decided to start teaching Xhosa, Zulu, and various other native languages, instead of just English and Afrikaans. This was due to the recent reforms to placate native groups. The only problem was there was a lack of white teachers who could speak Xhosa, necessitating the recruiting of elderly natives who could handle teaching duties. She fit the qualifications, and she could speak and write in English, thanks to a missionary who once visited the village when she was a child. Would she consider becoming a language teacher in the village school?\n\nNow, Nesiwe is a Xhosa language teacher. She teaches children how to read and write in the language of their ancestors. She helps her son's family with an extra source of income. And, most importantly, she still tells the children of the village the stories that have been passed down for generations of Xhosa. Nesiwe is happy with the recent turn of events, and many other elderly natives in South Africa feel the same."
 SAF.128.a: "The wisdom of elders will be shared."

 SAF.129.t: "B. J. Vorster Found Dead!"
 SAF.129.desc: "At 11 AM, a chicken farmer pulled into a service station in Cullinan, outside of Pretoria. He reported in a call to the police that a stopped car with its engine running had been blocking his lane on a remote highway nearby. When he went to investigate, he found the driver, a white man, slumped onto the wheel, dead, with what he believed to be gunshot wounds. The driver immediately left the scene to contact the authorities.\n\nWhen the farmer led the police to the scene, they found it exactly as he described it. By the looks of it, the victim was shot in the head at close range once with a .380 inch bullet. The driver-side window had been opened, and the car was in between the lane lines, indicating the vehicle had been stopped before the murder, and the assassin had come from the side. The victim was missing their wallet, and their identification. But one officer recognized the deceased, and the victim's surprising identity was soon confirmed.\n\nBalthazar Johannes "B. J." Vorster was born to a sheep farmer in Jamestown, South Africa in 1915. Becoming involved in politics during his years studying law, he had been a member of the pro-Nazi organization Ossewabrandwag during the war, an affiliation which earned him a detention at Koffiefontein. Claiming to have a newfound belief in the parliamentary system, he was elected as a National Party candidate for the National Assembly, before becoming a senator. Known for being able to be approachable, eccentric, and occasionally reasonable, he was nonetheless comitted to Boer nationalism and the implementation of racial segregation.\n\nNobody knew who ended his life on that road. The assailants had vanished long before the farmer had arrived. Combing the area failed to find much in terms of usable evidence. No cartridges were found on the ground, nor were there any fingerprints on the car or the body. A tire track was discovered on the side of the road, but that may have been unrelated. And no claims of responsibility from one of the rebel groups of South Africa.\n\nRegardless of his beliefs, B. J. Vorster was a South African Senator. A South African Senator who was murdered. And the culprit may well get away with it."
 SAF.129.a: "There's a killer on the road."

 SAF.130.t: "The Commando Problem"
 SAF.130.desc: ""It's a disgrace!" said Jan Hendrik Hofmyr as he slapped down the day's issue of the Sunday Times on the table. "Bothaville, Long Tom, and the Wonderboom Commandos, all funneling weapons to the NP! Robbing us blind, and giving arms to the enemy! This is enough, the commando system must be taken apart before more of it starts leaking equipment to the paramilitary groups."\n\n"It's a disgrace, but we need to take a larger view of the situation, before we do anything rash," said Field Marshall Charles Fraser. "The Commando System is far larger than just a few units. It's a militia system that operates all over the country. There's local units everywhere, many who are filled with perfectly loyal individuals. Shutting down this system of militias will only cause harm to our national security in the long run."\n\n"It's causing damage in the short run," Minister of Security Colin Eglin said. "They're already giving out weaponry to rebel groups, and they're probably going to join them soon. It's clear that the army's oversight isn't working. The commando system may be essential, but it has to go, before it becomes counterproductive against our own security."\n\n"Removing it entirely will be counterproductive, with all due respect," said Field Marshal Hendrik Klooper. "It is a massive organization which we need to be able to deploy in an instant. It's our reserves. It's our main organization that we need if the Germans come across the lines. Some of them are fucking up, but we have to rely on the Commando System to keep our defences up.""
 SAF.130.a: "They need to be shut down before things get worse."
 SAF.130.b: "We can't stop the Germans without them."


 SAF.131.t: "Votes on the Vote"
 SAF.131.desc: "The first step was to find out who would be assigned to the case. The Supreme Court of South Africa had various local levels, but this one would be heard at the Appellate Division in Bloemfontein. A large number of judges served in the division, but cases were heard by a panel of five judges. Once the judges who would hear the case were identified, the courting could begin.\n\nIt was obvious that one of the judges would rule the way they wanted. They had a case history and opinions that pointed to a view that suited the United Party. Thus, they were ignored completely, since they were confident they could rule the way they wanted. There were bigger concerns.\n\nThe second judge was a little vaguer on the side they supported. They had some opinions that looked good for the outcome, but had some that didn't. A private conversation, however, gave plenty of confidence that they would rule favorably for the side they wanted. So now they had two.\n\nThe third was the toughest. They had doubts about the merits of the case, and wanted to rule against it. This couldn't happen under any circumstances. It took a long time, with plenty of conversations, but they were finally convinced of its merit. A new courthouse in their hometown being named after them would be officially unrelated.\n\nThe fourth was a judge that was favorable to the side the government wanted. They weren't on the case originally, but some strings were pulled, and they got on. Mostly to make sure they were covered if any of the other three went back on their word.\n\nSo when the Appellate division met in Bloemfontein to decide on voting rights for natives, the United Party could relax a large amount. Sure, officially the decision would be made after the arguments, just like all the other cases heard by them. But that wasn't how things really worked. And the government could already celebrate a great legal victory when the court convened."
 SAF.131.a: "And, here. We. Go."


 SAF.132.t: "The Storming of the Supreme Court of Appeal"
 SAF.132.desc: "Nobody expected the prospect of mass enfranchisement of the largest ethnic group in South Africa to be popular with everyone. Especially with the ethnic group that had the most to lose in terms of political power.\n\nThe protests in Bloemfontein that day were peaceful, if heated. There were plenty of angry chants, but most of the demonstrators tried to avoid any hostile encounters with the police. Many were content to chant with their families and march under the Vierkleur and perhaps enjoy a barbecue. Only a few of the initial demonstrators carried weapons, and the police hoped that all of the large crowd of protestors would stay this way.\n\nThat changed when the mob began to rock cars back and forth.\n\nWhile the disturbance attracted the attention of the police officers, an armored van smashed through the outer gate and the garage gate. It was followed by a large group of Afrikaner paramilitaries. The sudden attack overwhelmed the small number of guards inside the building. Proceedings were immediately canceled, as the occupants inside tried to clear out, but it was too late.\n\nThe courtroom staff hid in various rooms as the Boer Kommandos painted slogans on the walls, urinated over furniture, and harassed the court members they found. Police rushed to the scene, but the amount of demonstrators prevented them from making a timely entrance. When they had finally arrived, the Kommandos were firmly in control of the building. They had men with side arms out front, snipers with rifles on the upper floors, and a Vierkleur that had been on the street now flying in place of the South African flag."
 SAF.132.a: "Send all necessary officers, we have a Code Red Priority at Bloemfontein."


 SAF.133.t: "Breach and Clear"
 SAF.133.desc: "It wasn't going to be an easy day for the men of the South African Police, or the citizens of Bloemfontein. Hostage situation, unknown number of hostiles, unknown number of hostages, many VIPs amongst them. They did have a few advantages, however. The hostage-takers lacked heavy weaponry, and were extremely disorganized. And they had been so kind as to put a major breach in the fence. So while the negotiators tried to bore them to death, the police made a plan...\n\nThe first step was the moving of a fire truck and a group of police officers near the front of the building. This made the Boers move towards the front to prepare for the expected attack. Meanwhile, groups of armed police gathered in the building behind the court. Under the watchful eye of sharpshooters, a group of welders cut away a section of the fence to get another point of entry.\n\nAs soon as the go-ahead was given, grenade launchers filled the building with tear gas as the police went in. A large number went through the hole in the fence, while a larger number went through the breach in the fence created by the van. Snipers went to work, shooting at the paramilitaries when they popped up in the windows.\n\nA few minutes after the breach, the hostages were being led out and forced to lie on the grass as they were checked for weapons. They were scared, but unharmed, even the judges. Several of the Boers were down, the rest were captured. A few injuries to the police force, but no fatalities. All in all, a successful operation."
 SAF.133.a: "Job well done, that will teach them a lesson!"


 SAF.134.t: "The Battle of Bloemfontein"
 SAF.134.desc: "First, it was an attempt to talk. Try to figure out who the paramilitaries were, what they wanted, and why they had attacked the Supreme court of South Africa. That came easily enough. But then came time to try to get them to leave. And then things snagged. Their demands were too much. And they wouldn't come quietly.\n\nThe next step was the raid. Overwhelm them with police officers and extreme force. Get the hostages out, and arrest whoever was left. That was the plan. In actuality, it was a disaster. The Boers were too heavily armed, far more than had been expected, far better than the attacking police. It was a pitched battle, and when it was over, the police retreated under a white flag, carrying their casualties, while the Vierkleur stood tall, taunting them.\n\nThe police lost their leverage. The army, under General Magnus Malan, was now in charge. After negotiation, it appeared both sides weren't interested in continuing the fighting. The Boers could leave if they left the judges alone. And the paramilitaries accepted. The Afrikaners released the hostages, and marched out of the city with their firearms, in formation, and with their heads held high parading with their Vierkleur right on the noses of South Africa's soldiers and policemen.\n\nIt was the most shameful moment in the history of the South African Police."
 SAF.134.a: "Where did they get those weapons...?"

 SAF.135.t: "The Next Move"
 SAF.135.desc: "Albert Hertzog ran his hand along the smooth marble mural. Farmers out in the field, with their wives, sons and daughters, once dead but brought to immortality with a chisel and an artisan's hands. Their names are forgotten to time; their deeds sowed the seeds that sprouted the continent's hardiest people.\n\nTwenty six other reliefs lined the mausoleum raised in honor of the Great Trek. A citadel carved from stone to praise God and the race He had conceived, and for which He has great plans in mind. It is the greatest symbol his kind had ever built -- and if those fools in the Cape had their way, Albert added with a grimace, a symbol as lost to history's dunes as poor Ozymandias.\n\nHe was looking at eternal rule by the Anglo lot, even if they had a few Afrikaners in their leadership and had slapped a Afrikanenr puppet into the position of Prime Minister. He had hoped that the perishing of Great Britain that once enslaved his fellow Afrikaners would be the end of it, but the United Party's power solidified ever more after the war's end based off the scraps of the British Empire. Now , the United Party was claimed that law and order has swept South Africa... but not on its true malcontents of the African National Congress. No, that ignoble attention went to his people, and his people alone. They've suffered enough, they had been stuck under the thumb of the Anglo's for too long, so Albert decided right then and there.\n\nSo he ambled out of the Voortrekker Monument, nearing a telephone box by the side. He had kept some distance from these contacts, but now the time had come to begin opening up to them. Hertzog dialed a number and gave his orders: several million pounds' worth of "vital equipment" from "the usual sources" and to "the usual channels". Funds were wired and hands shook over the telephone. Then he hung up.\n\nGraaff had played his hand. Now the NP shall play theirs, not through politics, but through violence. For the chance of change through the ballot box had been solidly proven false time after time."
 SAF.135.a: "The Crossing of the Vaalsrivier."

 SAF.136.t: "Posters Appear on the Cape"
 SAF.136.desc: ""Alright, fish and chips with a cola. Is that all?"\n\n"Yes, that's all."\n\n"Alright then, I'll get right on it." remarked the man, returning to the back room of the small establishment to prepare the food.\n\nAs he waited, Paki glanced at the wall, noticing the multitude of posters plastered on it. "Only the National Party can save you from those black demons!", "Vote for the National Party to help stamp out the coloured menace!" and "Watch out for these dark men! Place your trust in the National Party and safeguard yourself!" were written on those posters, coupled with pictures of violent scenes of murder, theft, and rape, all containing shots of Coloured people. He eyed the photos, aghast and disgusted at the imagery displayed.\n\n"Ah, the good old NP, always preaching" started the old man, who returned with Paki's food."They've always been a stir, convincing people that people like you should be kicked out of here. Their boys came into my shop and asked to plaster their propaganda, and I obliged. Doesn't mean I like them though." chuckled the old man.\n\n"Why did you allow them then?" asked Paki.\n\n"They pay me to post it here, and they pay well." scoffed the man. He looked at Paki for a moment. "Of course, you don't discriminate in business." he quickly added.\n\nWith that, Paki began to consume his food as reflected in his exchange with that white man. As Paki exited the shop he waved to the owner, showing a sign of goodwill. As he trotted along the streets leading to his house, he saw more posters of the same nature, which distressed him slightly. Then he thought about the future, or his people's future for that matter. The NP weren't fond of his kind, so he didn't want to imagine what they'd do to him if they passed by him. He sighed, wishing it would all roll over soon and he could enjoy his life peacefully. He'd hate to see his beloved Cape Town ruined by those "National Party" folk.""
 SAF.136.a: "I cannot imagine being happy anywhere else in the world but in Cape Town."

 SAF.137.t: "March Against Imperialism"
 SAF.137.desc: "As Johann van Leeuwen woke up from his morning slumber, he got off the bed, gave himself a nice bath, and walked outside to start the usual routine of fawning over the newspaper for interesting tidbits or walking around to satisfy his daily exercise routine. His sixty years of life had been eventful, yet he always felt there was always something new to experience. He didn't realize something eventful would happen that day.\n\nAs he was reading the local news, Johann heard thumping noises, loud and numerous, coming from the main road to the provisional government building. Such sounds piqued his interests, which led him far from the confines of his house to a large gathering of about a few hundred people. He quickly planted himself among the onlookers to observe the occasion. He saw boards carried by many, painted with symbols depicting broken crowns, inscribed on it "Down with the Queen! Long live the Republic!"\n\nHe heard the men and women chant violently "The United Party is weak and frail, they cannot save us from the Germans nor the Blacks! We, the National Party, are your only hope!"\n\nThe audience began to cry out in response "Down with the monarchies, down with the tyrants! Up with the Republic!"\n\nSuch rousing cheers from the audience displayed to Johann that he had found himself at one of the many rallies by the National Party, surrounded by crazed fanatics. He realized it as his curiosity faded, replaced by growing disappointment.\n\n"Another one?" said Johann "They always stir up the folk around here."\n\nHe began to turn away to return to his cozy adobe when the crowd started to move behind the protestors, dragging Johann along into a sea of white."
 SAF.137.a: "You never really know what's coming. A small wave, or maybe a big one."

 SAF.138.t: "United Party Activists Harassed at Orange"
 SAF.138.desc: ""...so that's our plan, got it?" repeated Anna to the rest, reaffirming that each member knew their tasks. "Let's go!" John said excitedly gesturing towards the local town's square. They moved towards the spot, hauling their equipment with them. Once they got to the center, they set up their booth. After that, they spoke into their megaphones and handed out pamphlets to nearby passersby, to which they received cold reception and stony stares from the local folk. "See? It's working. Looks like we're doing fine so far!" joked Frederick with a cheerful expression painted on his face.\n\nA stone flew, colliding with Friedrick's face, causing him to stagger and collapse onto the booth. His fellow accomplices attended to him worriedly, examining the damage in a hurried daze. It was a medium-sized scratch, flowing with blood and staining the dirt below with a crimson tint. As Anna and Robert pulled out bandages to cover the wound, John stood between them and the crowd, enforcing their distance. "Which one of you threw that stone?" asked John in an authoritative tone. He wasn't one to talk much, but the anger he felt from seeing his friend injured pushed him over the edge. He repeated it again, louder this time "Who threw the stone at Friedrich?" No one answered him. "I said, who threw that stone!" yelled John, insulted by the silence.\n\n"I did!" shouted an old man. "You people aren't appreciated in these parts. We stand by our loyal brethren, who pledge to make South Africa a better place! Our beloved party, run by our Boers, who are the original and rightful owners of this thriving land, not that filthy crown of yours They'd know better than you foolish young'uns," remarked the old man.\n\n"I don't want to see any of you ever again, so do you hear me? Scram!" screamed the old man, stamping his cane on the ground. The crowd started to murmur and began to close around John and his group. "No more crown! No more kings!" chanted the people, drawing closer and closer, shouting louder each time. John and the others huddled in a tight ring, trying their best to keep each other safe. Anna began to break down at the sight of the encroaching mob. John tried to keep his calm demeanor, but his eyes began to water and his face gripped with fear."
 SAF.138.a: "For if Bloemfontein was to be taken, it would only be over our dead bodies."

 SAF.139.t: "The Golden Cuppa"
 SAF.139.desc: "The blood and sand of South Africa's frontlines lend themselves poorly to the amenities that the Free World has taken for granted. Full three-course meals, air conditioning, vacation leave -- these fruits of prosperity, once banal, have become luxuries as soon as half of South Africa rebelled and the Reich rumbled to war. What plenty remains have been reserved for guns, tanks and ammunition for ten million fastened belts. For a nation under siege, butter is indulgent excess at best, and treason at worst.\n\nOf course, that does not mean special occasions no longer warrant a bit of celebration under the current stresses. Far from it. What it does imply, however, is that Her Majesty the Queen's loyal soldiers needed only the humble tea kettle -- and some special ingredients -- to commemorate the day of her birth.\n\nFavors were exchanged among the quartermasters beforehand such that their well-oiled trucks delivered crates of Twinings and creamy milk, rather than rifle rounds and oil, to Commonwealth formations across the front. More specific requests varied among the realms: the Canadians, for instance, ordered an extra bag of English breakfast for every beaver in uniform. West Indiemen detachments asked for generators to power their fancy iceboxes for brewing cold tea. The ANZACs demanded gallons of the freshest Norco Cape Town receives from the Antipodes. South Africa asked for medical supplies and spare parts, the killjoys; then again, they accepted the honeybush bags as eagerly as they do bottles of Betadine.\n\nYet in spite of their myriad differences and quarrels -- regiments heckled each other and themselves over whether to add milk before the tea or the converse -- every last Commonwealth tar listened to Earl Cameron announcing the Queen's thirty-sixth birthday on CBC Radio. And when Her Majesty's speech ended with the first crescendo of an old, storied tune crackling from their ham radios, an embattled brotherhood of nations raised their cups to the air in unison as they shouted:"
 SAF.139.a: ""God save the Queen!""

 SAF.140.t: "Raid on Weipe"
 SAF.140.desc: "They had seen the smoke first.\n\nIt had been a pretty standard aerial patrol for the Beitbridge garrison. Same itinerary as always: spend a few hours in the chopper, buzzing along the wide Limpopo River, looking for any smugglers who might be trying to cross into Ostafrika. Simple. Then they had seen the column of black, billowing from a patch of green near the abandoned Weipe border post. The chopper touched down, and the squad stepped out, staring at the gruesome sight.\n\nThere was a humble low-slung main house, made of stone and wood, accompanied by a couple of tiny shacks and a pen of goats. Flames poured from the house, the shacks had clearly been picked over, and what goats hadn't been taken lay bayoneted in the grass.\n\nAlong with the family.\n\nTheir remains lay in front of the house, the youngest son still clutching an Afrikaans Bible in his ruined arms. Settlers, probably hard up types from Krugersdorp or Bloemfontein, just trying to make a new life on the Lowveld. The corporal was almost surprised that there wasn't a covered wagon somewhere on the property. Along the back of the house, painted in garish red, was the name of their killers.\n\nZANU-PF\n\nOne of the privates spat on the ground when he saw the letters.\n\n"Never saw them so far South, Jerry must have chased them here."\n\nAs the corporal examined the scene, he noticed that the spent ammunition was suspiciously high quality for a bunch of backwater guerrillas to be toting around. Another private noticed the boot prints leading into the tree line. Curious, the corporal thought.\n\nHe would have to put it into the report."
 SAF.140.a: "The Crocodile has eaten the Sun."

 SAF.141.t: "Purebreds"
 SAF.141.desc: ""Sorry, say again?"\n\nSergeant Belardi shrugged and handed over the communique.\n\nNO ROOM IN HAMLET-DO NOT ALLOW INSURGENTS ACCESS-LIQUIDATE\n\nLieutenant Higgins's eyes stared wide at the sheet of paper. Their job was simple most of the time: his platoon would hike all the way to some Boer village or farm, round up the folks, and move them over to one of those "Strategic Hamlets" the Americans have been setting up in the Karoo. Get the rebels' hands off their guns and men and all. There would be tears, and some ou toppie yelling about Kitchener, but they tend to come along without a fuss after. Most of the time.\n\nBut today they visited a ranch with 300 purebred horses, reminding Higgins of his grandfather's stories of the races at Turffontein. A herd of cattle could be moved. That many horses? Not so much.\n\n"Orders from HQ," Belardi said. The sergeant said the word with a weird lift at the end. Again. Bastard was getting to his nerves, and probably knew it too.\n\nHiggins sighed, motioning to one of his subordinates. No matter how muddled their authorities are out in the bush, orders from higher up the chain were clear.\n\nHe removed the safety of his M2 and aimed right between the eyes of a dark brown Thoroughbred who lowered its ears accepting resignation."
 SAF.141.a: "With a shot is killed beauty."

 SAF.142.t: "The Gift of Foresight"
 SAF.142.desc: "'In Africa I see tree sickles merge into one, I see the wagons roll in from North to South, they look like Dutch wagons but they are new and covered in canvas bringing anarchy and starvation into the land, I see a man in handcuffs tearing the Vierkleur while sitting at the wagons. I see young armed men hiding in caves beyond Pretoria, and behind them came great crowds of women and children, fleeing from burnt down houses. I see great devastation and misery and the Afrikaner Nation getting close to extinction only to be saved by an old enemy who accepted them with open arms, the time belongs only to God, but bet ready when the sea starts drying up - Siener van Rensburg spoken in 1921'\n\nThe men of the Pretoria Kommando were listening to the radio on a cave overlooking the road north, every day they tuned in on the Transvaal Christian Radio for their nightly prayers before setting out to do ambushes on American convoys, with the prophecies of van Rensburg keeping their morale up high since the first days of the war, it was clear that God was on their side. But on that day the prophecies had Major Bosman, the commander was full of doubts he remember when he was a young man and his father took him to see the Seiner, that frail elder who talked in a soft voice like it was the Almighty Himself speaking through his lips, on his orders the whole Kommando would spend the night sheltered in the caves praying.\n\nDuring his night of the devotion, it all become clear to the major: The wagons always meant war in the Seiner's visions, they were rolling South just as the Germans, the man in handcuffs riding them must be Hertzog, he was interned as a child and his push to war made the Afrikaner nation torn itself apart. After that long reflection the rugged Afrikaner took the most difficult decision of his life, and ordered his Kommando to lay down their arms at the American FOB.\n\nLater the same day Sgt. John de Lance, radio operator to project Wandering Soul was awarded the Bronze Star."
 SAF.142.a: "Without firing a shot."

 SAF.143.t: "The Recognition of the Claimant"
 SAF.143.desc: ""Will you solemnly swear," said the Archbishop of Cape Town, "to govern the people of the Union of South Africa and its corresponding territories according to its respective laws and customs?"\n\n"I solemnly promise so to do," said Elizabeth II, recognized by many people in South Africa as the rightful Queen, whose ascension was prevented until recently by unfortunate circumstances. The belated ceremony was held in Cape Town, with many notable government officials in attendance. Many more people had lined the streets to watch the procession, and a larger number watched these events live on television.\n\nSouth Africa had never held a coronation of its own, with their ceremony being combined with the rest of the commonwealths when the monarch took the throne in Westminster Abbey. Thus, they decided to re-create the ceremony in Cape Town. Once her oaths had been taken, the Archbishop presented her with the holy bible and prepared for the most sacred part of the ritual.\n\nThe Queen went to sit in the Governor-General's chair for her anointing. She was presented with the Armills, Royal Stole, Royal Robe, and the Sovereign's Orb, followed by the Queen's Ring, the Sovereign's Sceptre with Cross, and the Sovereign's Sceptre with Dove. All of these had been given to her before, for they were the same ones used in her coronation in Canada. But this time, it was official for the South Africans.\n\nFinally, the Archbishop picked up St Edward's Crown and held it aloft over her head. The second he set it upon her head, the vacancy of the South African monarchy was ended. Immediately, a twenty-one-gun salute was fired outside, and the crowd chanted thrice:"
 SAF.143.a: "God save the Queen!"

 SAF.157.t: "The Last Day"
 SAF.157.desc: "Martha van Wert did not treat her last day as secretary in the office of the Governor-General of South Africa as anything special. She spent the early morning packing boxes, helping strip away the last remaining wooden crests and Union Jacks. There was a trickle of phone calls from journalists asking for the office's comment on its imminent disestablishment. Martha spent her lunch at her desk as she did every day, reading the newspaper while nibbling on a sandwich. On the front page was the word "REPUBLIEK" and a photo of the prime minister's face.\n\nAfter so much pain, after repelling the Nazis and the Boer traitors and securing its own independence, South Africa was finally ready to act on the results of its republic referendum. Effective at midnight, per the government's order, South Africa would break from the British Crown. Beneath the fold were a mix of other stories-of Black Africans protesting their underrepresentation in the government and lingering effects of the National Party's policies, of the first football game since the end of the war, of a church service to remember all those who had died.\n\nMartha dabbed at her eyes and gently folded the paper into her purse. She knew that the referendum meant that she had lost her job, but what she felt now was not sadness or regret. It was hope. There were countless problems that South Africa would need to face in the coming years-the costs of the war, discrimination and prejudice, governmental dysfunction. There would be hardship and struggle. There would undoubtedly be disappointments and moments of pain, but her country-her republic-could be in charge of its own fate. People like her could do hard work to correct the mistakes of the past and make South Africa a better place for everyone.\n\nMartha went through the rest of the day without issue or incident. As the workday reached its end, she tidied the office as much as she could for whoever used it next. Then she gathered her belongings, placed her key on her desk, and walked out the door."
 SAF.157.a: "A new future awaits."

 SAF.144.t: "The Scout's Deception"
 SAF.144.desc: ""Alright gentlemen, prepare your disguises and expect deployment 'bout five minutes flat!" yelled Colonel Reid-Daly, eyeing his fellow operators. All men had donned their SS uniforms and listened to their commander's orders attentively. "Alright, here's the plan, we're going to pass the checkpoint ahead, enter their HQ and give them Jerries some explosive gifts, got it?" stated Reid-Daly, lightly tapping the box, causing a little rattling noise. His fellow platoon members nodded their heads, whether for confirmation or slight fear. "Everyone prepare your counterfeit passes and recite your identification lines again. You'll get extra points if you can do it in German." remarked Reid-Daly, receiving chuckles from his team. "One last thing 'for we do this. If we all make it out alive, let's have drinks shall we? My treat." spoke Reid-Daly, invigorating his men with the promise of a cold respite. The groan of their transport truck indicated they were traveling on paved roads now. The plains were now past and they've just entered Reichskommissariat territory - specifically Ostafrika, the more sinister and malicious of the three.\n\nThey soon arrived at the checkpoint a few hundred meters from the military camp and had to identify themselves to the Germans guarding the gate. "SS-Oberscharführer Jack N. B. Stolk, reporting for duty Sir!" stated Reid-Daly, saluting the guard with gusto. The guard merely grunted and stated "Next," unfazed by his charisma. "Alright, I guess not everyone's a big fan of me." joked Reid-Daly. Next, the Germans examined the truck's contents, and opened the crates containing the faulty ordinance. This part was crucial, for if their trick was discovered, their mission and lives were very much over. As the guards reached out to grab the rifles, Reid-Daly muttered "Herr SS-Sturmbannführer said don't touch them.", waving off the Germans. They looked confused but merely shrugged and closed the crates, seeing nothing suspicious with them. "Dumb Krauts." remarked Reid-Daly as the truck sped away."
 SAF.144.a: "The perimeter was pierced."

 SAF.145.t: "The Greek Gift"
 SAF.145.desc: "They arrived at the camp and began to unload their cargo to drop them off at the target location. "Here you go, enjoy your new toys. It'll be really hard to replace them, I reckon." said Reid-Daly to the officers present. However, their limited knowledge of English failed to capture the sarcastic tone in his voice and merely nodded as a sign of acknowledgement, unaware of the events about to unfold. "Well then, I'll take my leave! Tschuss!" declared Reid-Daly, waving back at the commanding officers he'd exchanged brief words with. In reality, he returned to his truck parked outside. From there, he peeked from within, in anticipation for the climax of his operation.\n\nHe saw the Germans begin to unbox their shiny munitions, intending for use in a firing exercise. He saw the soldiers reload their rifles and insert shells in their artillery and mortars. Reid-Daly quickly told the driver to hit the gas, preparing their escape a few seconds before the explosive display.\n\nThe facility was suddenly rocked with a loud and powerful explosion, causing distress and panic among the Germans. The commanding officers now lay astonished. On the open field of the facility, lay scattered debris and shrapnel. Several soldiers lay on the floor, dead from the blast or barely managing to stay alive, embedded with fragments of their newly-acquired weapons. An emergency sweep of the area revealed that those "Anglos" had disappeared moments before the blast. A quick radio to the checkpoint revealed they had already been let through, now untraceable and uncatchable. The officers cursed and groaned, tricked by that very friendly Anglo and his band of misfits. On the flipside however, Colonel Reid-Daly and his platoon were well on their way to the Cape, with beer, a slap on the back, and maybe even a promotion awaiting them."
 SAF.145.a: "Never trust a filthy Brit to do a German's job."

 SAF.146.t: "Africa Addio - This is Not Africa"
 SAF.146.desc: "The small jeep rolled gently on the asphalt road in the sunny suburbs of Johannesburg. Outside, in the far distance, the black line of the Drakensberg was visible in the crystal blue sky - inside, a couple of Italians discussed vigorously, their black driver not understanding a word.\n\n"I don't know, Gualtiero. Crossing into Ostafrika from the Pietersburg road seems way too risky. I won't get shot in the ass by some SS because of your big ideas."\n\n"Franco, there's no other way. Taking a detour through Bechuanaland would cost us days, maybe weeks. We don't have an infinite budget and we knew the risks when we-"\n\nJacopetti's sentence was interrupted by the jeep coming to a screeching halt. Outside, a white policeman gestured to stop.\n\n"Oh, cazzo..."\n\nThe two filmmakers had just arrived with an intercontinental flight into South Africa, using their first two days in the Black Continent to film a few scenes of the stark realities of racial inequality in the country - interesting for sure, but both were aiming for something that would have more of an impact. Now however, in front of them was a small police cordon, and on the other side, what looked like a small riot. Miners, dozens of them, waving their picks menacingly - Jacopetti asked a policeman what had happened, and as Prosperi was already filming, the cop explained, in a thick Afrikaans accent, that a small mining incident became the pretext for a wildcat strike.\n\nAs the miners, all black, shouted slogans like "Africa for Africans", the black-gold-green flag of the African National Congress appeared as if out of thin air. It didn't take long for police reinforcements to arrive and disperse the crowds with a generous application of batons - all caught on film by Jacopetti and Prosperi. After the riot, when the Italians' jeep started to once again make its way down the now empty road, Jacopetti managed to capture one last shot - rows and rows of small, dingy homes where black miners lived. From the doors, children watched as their fathers were hauled into armored police trucks and carried away."
 SAF.146.a: "Onwards to Ostafrika!"

 SAF.147.t: "Africa Addio - They're Italians!"
 SAF.147.desc: "The last thing the militia had expected was two white people, unarmed, wandering into the village from the thick of the bush. After managing to capture the village from Hüttig's troops, the Black rebels had bunkered down, repelling any enemy scout that came too close - but none of them had been brave, or foolish, like these two, who fell right into the hands of a rebel patrol. Screaming and pleading for mercy, they were dragged into the main square, to be lined up against the wall - and, much to the amusement of the militia, never stopped taking film even in their final moments.\n\nThe leader of the militia, a massive black man wearing a pair of German military sunglasses alongside a similarly improvised uniform, wanted to execute the two Germans scouts in person. "Please, for God's sake! We're not Germans!" One shouted, as the other kept filming despite numerous hands trying to grab his camera and his clothes. "We're shooting a movie! A movie!" Quickly, he produced documents from his pockets. "REGNO D'ITALIA", said the letters on the exterior. The rebel leader squinted, struggling to read the document. "Ja-co... petti?"\n\nA few minutes later, the rebel leader, whose nom de guerre was Simba, was treating the two Italians no longer as intruders, but as welcomed guests. With a smile on his face, he showed the two around the village, especially the places where fighting had happened - and where the grim remnants of the fallen German garrison and their collaborators laid to rot. "Our people will be free!" Simba proclaimed before the camera, with a wide smile, gesturing towards the impaled skull of a German soldier, still wearing his Stahlhelm, now serving as a decoration for the village's main entrance. "All of Africa will be free one day!" That evening, Jacopetti talked with a few of Simba's men - all farmers, simple people, driven to rebellion by desperation - as they sped towards the Südwestafrikan border on a looted German jeep. Simba was kind enough to compensate with a ride the two Italians who would soon consign him and his men to the fame they deserved."
 SAF.147.a: "Südwestafrika beckons!"

 SAF.148.t: "Africa Addio - Zum Bomber"
 SAF.148.desc: "From the outside, the place looked almost surreal, or like a practical joke pulled by an architect with far too much free time and poor sense of humour. Just outside of the barbed wire, snaking around the perimeter of an air force base with its hangars and concrete control towers, stood the perfect imitation of a Bavarian brauhaus, dead in the middle of the arid landscape of the Kalahari. "Zum Bomber" said the sign outside, with a picture of a cartoonish pilot drinking an oversized pint of beer while driving its plane in mad circles across the sky. Much like the building, its colours were fading in the dusty wind. Two men, armed with cameras and a microphone, made their way inside.\n\n"Ein Film, ja?" The airman laughed with his comrades, all of them looking into the camera. Most of them still wearing pilots' clothes, the Luftwaffe crew members each had their beers and cigarettes, coarsely laughing and smoking in the dimly lit interior. "Well, you've come to the right place!" said one of them, who seemed to be their leader, in a thickly accented English. "Right here you can see the forgotten heroes of the Reich. The proud airmen! We're the ones who'll save the day in Africa! We're the ones who will remind these dirty black Untermenschen they belong in the stone age, and we'll bomb them enough to make sure they go back to it!" Everyone laughed, and another round of alcohol was passed around, followed by many others.\n\nMany hours passed, and the night fell over the Namibian desert - thousands of stars lit above. And yet, the two filmmakers were still there - many pilots had gone to sleep, but a few, visibly drunk, were still in the tavern. "Franco und Gualtiero, huh? From Italy. I've been there, once. On vacation, when I was ein Kind." The pilot smiled, a half smoked cigarette hanging from his lips. "I wish I could go on a vacation. Sometimes, it's just... how do you say it in English?" A pause followed. The pilot's eyes wandered off in the far distance. A distant rumble was heard, a bomber returning to the runways. "Tiring. It feels tiring." The pilot got up, struggling to stay on his feet. "I did a mission on a rebel-held village, yesterday. I've been to the place, there used to be children there. They will never go on a vacation." The pilot smiled dryly, before a grimace of disgust appeared on his face as he left the tavern."
 SAF.148.a: "Time to leave for Zentralafrika."

 SAF.149.t: "Africa Addio - Dogs of War"
 SAF.149.desc: ""I thought we were really done for this time, Gualtiero." The filmmakers didn't stop taking film even as combat raged in the village, ducking behind a knoll whenever a hail of bullets came too close. Their clothes dirty, torn, their faces beaten up, they had been captured and held by African rebels alongside a slew of other hostages - missionaries, for the most part, their Catholic mission now turned into an impromptu prison camp. However, not even this corner of Congo was safe for the rebels - and before they could start to execute the hostages, a company of mercenaries descended upon them like starving vulture.\n\nThe battle raged on for a few more hours, grenades punctuating the sparse symphony of gunfire. Soon enough, shirtless gangs of white mercenaries had driven out the shirtless gangs of black rebels, and after freeing the hostages, proceeded to resume their predecessors' job in systemically robbing them of anything even remotely valuable. As the two filmmakers kept shooting scene after scene of glorious looting and smiling mercenaries posing with their eyepatches, colourful parrots, and macabre war trophies, one soldier of fortune called them out. "Merda, siete Italiani!"\n\n"Gualtiero Jacopetti, piacere. And he's my colleague, Franco." The newly found compatriots shook hands, before the overjoyed mercenary spoke again. "I'm Paolo. Are you shooting a movie? About us? It's about goddamn time!" Hours later, the mercenary was still telling his story, and that of his compatriots, sitting on a tree stump. "Many are French, old legionnaires - other Belgians. There's even a few bloody English." Paolo smiled. "I was born in Kenia, my parents were among the first Italian settlers there. Then the Mau Mau came to visit us...and that's how I ended up here." Paolo got up, lighting a cigarette. "Dio, I really want to see that movie when it comes out. Anyway, you should come with us. I can set up a flight back to Italy for you." The mercenary column was preparing to leave the half destroyed mission. As the trucks moved along the muddy forest road, it started to rain, and the two Italians had to put away their cameras after filming one last shot - the whitened skeletons of African rebels, all slowly sinking into the mud, corpses swallowed by the African jungle."
 SAF.149.a: "Goodbye Africa!"

 SAF.150.t: "The Noise of Thunder"
 SAF.150.desc: "It was a dusty morning in the bushveld the day doom came from the sky.\n\nDistant horns sounded from behind the clouds, and it was the din of the Seventh Seal being broken, and the Boers looked skyward and exalted, for they were simple folk, dirt-farmers one and all, and recognised the signs of Judgment Day. They waited with goosebumped flesh for the loud voices from Heaven to proclaim the world becoming that of the kingdom of God and his Messiah, and the salvation of their immortal souls.\n\nIt was then that the infernal things came from the sky, and the horns were joined by guitar and drum and a voice like wailing, and the farmers cowered at what they now recognised as their destruction. The sky lit up like the pits of the abyss, and fire rained down upon them, and smoke filled the air, and ghastly filth poured over the land to wither all it touched.\n\nThrough it all the farmers shrieked and cried as their lives were ripped from their bodies. Some sought to comfort loved ones, others begged for the Lord's mercy. Young men ran in futility as their elders kneeled and awaited the brutal heat and sudden cold of death.\n\nIn but a few short minutes life was wiped from the bushveld, and not a one of them remained to see the American commander lean out of his helicopter to taste the air. He breathed deeply of the smoke and ash of his creation, and he knew it was good as he gazed upon the blasted landscape, devastation undreamt of by any ancient warmaster or khan. The commander looked to the vastness above and said a silent prayer to the same God the Boers begged to save them as they burned. He made a signal and the helicopters left back through the smoke, blasting their music as they left the cratered annihilation and its piles of black ash behind them, ash that had once been men who had hoped and dreamed and loved.\n\nLater, they would learn intel had been mistaken, and the village was not the rebel enclave they had thought it to be, but by then they had moved on to burn other villages in other lands, and it mattered little to them and was soon forgotten."
 SAF.150.a: "One fire fights one fire."

 SAF.151.t: "Your Country Needs You"
 SAF.151.desc: "Mason beamed as he strode home from downtown. Not even the sweltering summer heat could bring his spirits down. Never before in his life had he felt so integral, so paramount. For cradled underneath his arm was a folder containing several documents -- documents which would alter his life irreversibly. He was going to make a difference for once, and he could scarcely wait.\n\nPa emerged from his study when he heard the boy close their door shut. Immediately his attention honed onto the folder his son brought home, and the aging man's wrinkled features flashed with an old fear. "How was class?" he asked, knowing full well that his son had not just returned from school.\n\n"Well, Pa, I... didn't go to class today," Mason stammered. He found confidence after breathing deep. "Me and the lads went down to the recruitment office instead. We're going to fight in the war to shut those damn Boers up. We'll send the Huns packing all the way to Berlin, too!" he finished, puffed and expectant of the congratulations surely sent his way.\n\nInstead, Pa planted his hands on both Mason's shoulders. "God damn you, Mason!" the man cried, shaking the boy to and fro. "Do you know what you've done? Do you know what happens to boys in war?! This is no sport you're joining!"\n\n"I thought you'd be proud of me serving our country like you did," Mason retorted. Why could his father be so craven? "The hell's wrong with you?!"\n\n"Listen to me son," his father pleaded, "you're no killer- you're a boy! And boys march gladly off to war only to die without ever firing a shot!"\n\nThe boy would hear no more of this. "Well maybe if men weren't such cowards like you, we would've won the last bloody war!" he screamed, before he shook his father's hold off and stormed out from where he had just moments ago entered. Mason slammed the door as he broke into an aimless run away from home, tears streaking down his face and frown. Cradled underneath his arm were his last possession, the documents accepting his application into the Union Defence Force.\n\nMason Turner will make a difference. Damn his parents if they thought otherwise."
 SAF.151.a: "Carry on, my wayward son..."

 SAF.152.t: "A Small Failure"
 SAF.152.desc: "Mason stood near the edge of his bed, within a cramped cabin packed with young men like him doing likewise. Though they assumed an at-ease position, each gave the other uneasy looks, ready to snap in place the moment a word of command echoes across the cabin.\n\nA quick swivel showed that most of the platoon had his station in pristine condition for inspection. Mason's was not -- which was cause for the panic bubbling within him. He had forgotten to maintain his locker to the inspection standard today, and by the time he realized such he was out of time. Labored breaths left the grunt's chest as he dreaded the instructor's inevitable reprisal.\n\n"He's coming!" whisper-shouted a platoon mate as a lone figure approached the cabin door. Mason's eyes joined several dozen pairs in fixing the riveted metal abyss with rigid stares. The boy felt his heart hammer against his throat.\n\nThen the door burst open, revealing Corporal Vosloo's no-nonsense frown come to ruin their already short spirits. "Platoon! Attention!" the Corporal barked.\n\nIn unison, they stomped their heels together and stood ramrod stiff. The instructor paced from bed to bed, searching meticulously for every flaw one can imagine and then some. Mason could do nothing but stare ahead, though his ears caught the increasingly loud shouting -- first for a dusty bed frame, then stained floor tiles the next, and so on. Finally, the Corporal stood in front of Mason's own bunk. Beads of sweat poured out from the boy's every pore as he did his best to tamper his breath.\n\n"What the hell do you take me for, Private Turner?" screamed the Corporal, in his pronounced Afrikaner accent. "A moron?!"\n\n"N-no. No Corporal!" replied Mason quaveringly.\n\n"Turn and look closely Private!"\n\nMason snapped back around. Sure enough, the disheveled contents of his personal locker came in full view.\n\nThe seconds felt like hours as Mason endured yet another relentless barrage of loudly delivered insults. Maybe Corporal Vosloo was right. Maybe he really wasn't cut out for this life."
 SAF.152.a: "Maybe Pa was right after all..."

 SAF.153.t: "Under Pressure"
 SAF.153.desc: "Mason and the company proceeded through the sweltering heat of the Highveld. With trucks at a premium, the grunts had to lug their heavy kits upon their backs as they tried to keep up with their slow moving convoy. Worse still, the trucks kicked up puffs of dust while they moseyed along the dry dirt road. What he wouldn't do to get rid of the thin coat clinging to all the sweat on his bare sunburnt skin. Or finally move away from the hills flanking either side of the road. Maybe if he closed his eyes he'd find himself back home and-\n\nA violent explosion shook him to the core. Up ahead, a great cloud of dirt, dust, and smoke billowed from the lead vehicle's burning wreck. All the vehicles came to a halt, hitting each other's bumpers from the suddenness. Riflemen tossed their kits aside and prepared for contact.\n\nContact came as bursts of machine gun fire from the steep plateau hill, raining steel down the disorganized column. In the confusion, men struggled to discern the direction of gunfire until shouts began to echo. "In the hills! Get behind the trucks! It's coming from the hills!" men screamed, as they scrambled to take cover where cover was found -- rocks, trucks, brush. Mason quickly followed suit. Drivers, in a frenzy, dove out of their trucks to take cover from the hail of bullets. The Boers seemed so far away, yet so close at the same time.\n\nAs Mason watched the armored vehicles pull out onto the side of the road to return fire, he could only think to himself, 'How could I have ended up here?'"
 SAF.153.a: "God help me, I am only nineteen."

 SAF.154.t: "Warriors of the North"
 SAF.154.desc: "Volunteers and supplies from the world over have been filling our ports to aid us in our holy struggle to hold off the Nazi hordes. Most of these nations we have expected such as the OFN, who, of course, has been waiting for this for years. Others we were less prepared for, such as aid from the officially neutral West India (hedging its bets as always) smugglers from parts of the German sphere.\n\nBut the least expected of all of them has recently shown up unannounced at the headquarters of 1 SAI on the front. After nearly getting into a firefight with the 1st's sentries, 100 Russians (along with, ironically enough, guides and escorts from Zentralafrika hired via Breton connections) claiming to hail from various warlord states of the former Soviet Union approached the base commander and immediately offered their services.\n\nThe volunteers claim to belong to the 'All-Russian Volunteer Anti-Nazi League', a ragtag militia claiming allegiance to over a dozen different Russian states from the famous West Russian Revolutionary Front all the way to a devotee to a man claiming to be 'King Rurik' in the far east. While most of them do not speak English, their leader, claiming to belong to some sort of paramilitary organization called 'the Guard' has informed the commander in heavily broken English that the 100 fighters constitute a mix of volunteers sent by various governments and men wishing to fight the Germans for personal reasons, and 'will fight harder than any other man, having been trained for nearly three weeks in a 'Guard' regime'."
 SAF.154.a: "We're not going to turn away brave fighting men! Find a place for them immediately!"
 SAF.154.b: "They'd be better served telling someone what the hell is going on up there."

 SAF.155.t: "The Last Sighting"
 SAF.155.desc: "A stormy night in the South Atlantic. A Südwestafrikan patrol boat monitoring the waters off the coast of Alexander Bay is periodically hit by waves from the bow, washing over the vessel. In the light of a thunderstrike, one of the crew spots something, and motions to the captain. The sighting is confirmed, to his horror. He starts relaying an emergency message to the Kriegsmarine command in Lüderitz. Many vessels, various types, markings unknown. He tries to give off as much information as he is able, until a broadside of Mark 42 guns ends his broadcast permanently.\n\nThe report, though brief and vague, sets off a scramble across Afrika, as a massive effort to confirm the report is undertaken. Eventually, an aerial reconnaissance flight returns with pictures that send an enormous wave of dread throughout the entire Schild. There can be no doubting it now, the Americans have arrived with their Sixth Fleet.\n\nGone is any semblance of German naval superiority. Shattered are any dreams of ending this war through a quick and daring naval invasion of the Cape. The seas belong to the cruisers and frigates of the American Navy, its skies to the flights of aircraft lined on the decks of the carriers. The fleet is of such a size that no one would dream of taking it on with the ships of the Schild. In one stroke, it appears the Americans have achieved victory at sea for the South African War."
 SAF.155.a: "...But the war will be won on land."

 SAF.156.t: "Valor Above All"
 SAF.156.desc: "The general held a sheet of paper before a small, expectant crowd in front of a hangar in AFB Brooklyn. Behind him posed a handful of men from the South African Air Force's 57th Medical Detachment, along with their UH-1V "Horseshoe". As the general read off their exploits to the star-struck audience, door gunner Matthew Spirter recalled the chain of events that had just propelled the Horseshoe's crew to fame. The day began like any other: Taps at five o'clock, heli maintenance at seven, and border patrols until noon. With the exception of some GIs catching bullets in an unlucky firefight, the morning patrols were dull and boring. Up until that one morning, at least. Nothing could have prepared them for what happened then.\n\nHorseshoe had just touched down in Cape Town for refueling and resupply when the distress call came through the comms. Couple American squads, ambushed as they chased a column of SS all the way to Namibia. Brass dispatched them for medevac; everyone else was too far away or otherwise engaged. As the helicopter sped towards the border, another panicked alert from the ground reported only four men returning fire. Spirter cocked his M60 as they approached the LZ.\n\nThis was his first true test as a door gunner since his enlistment. Dad saw democracy fall in Europe; he swore to keep it alive in South Africa any way he could. So when the cluster of friendlies rose from the dunes and bullets peppered the Huey's sides, Spirter delivered burst after burst of .50 caliber fire at the dozens of Afrika SS below. That shut them up quick right as they landed and pulled the wounded out of the fighting.\n\nHe thought he saw war for the first time then, when the desperate Americans packed their limbless, wailing squadmates onto every free space Horseshoe had. The flight back home was as tense as a room cramped with fifteen war-torn men can be -- up until one of the wounded asked for a Zippo. Then they all laughed as fellow survivors do.\n\nBack in the airbase, Spirter caught an American with a stump and a pair of crutches among the crowd: a reminder of the lives he and the crew had saved. He smiled."
 SAF.156.a: "All in a day's work."

 SAF.158.t: "TLL TODO"
 SAF.158.desc: "event about news from the frontline about SOLDIERS OF FREEDOM(!) fighting THE GOD-DAMN NAZIS(!)"
 SAF.158.a: "TLL TODO"

 SAF.159.t: "TLL TODO"
 SAF.159.desc: "event about the sorry state of SAF logistics."
 SAF.159.a: "TLL TODO"

 SAF.160.t: "A Call for Unity"
 SAF.160.desc: "\"... There is a cancer, an evil attempting to infest our brave Homeland!\" The screen of the television changed, depicting three soldiers of the African Reichskommissariats, each holding rifles that were pointed at a family of five who looked terrified for their lives.\n\n"They are attempting to force slavery on all our people and put them into damnation, including YOU!\" The screen changed once more, now depicting several malnourished-looking men, women, and children mining.\n\n"They will attempt to erase all of our culture!\" The screen yet again changed, depicting several German soldiers planting explosives in a museum.\n\n"Yet despite the cancer, there remains one last hope! The courageous people of South Africa! YOU are the last line of defense standing between our fathers, mothers, sisters, brothers, neighbors, and the onslaught against us. Will YOU let them take away their lives? NO! Despite our differences, whatever they may be, WE are all one people, with OUR courage, bravery, nobility… WE shall never let them have our nation!\" The screen changed back, the three German soldiers were taken out, and a diverse bunch of soldiers rescued the family. The malnourished men, women, and children were set free by Afrikaners fighting for South Africa. The museum was saved as the Germans were taken out. And slowly the screen faded to black."
 SAF.160.a: "The enemy of life will be crushed!"

 SAF.161.t: "Steel Stamped"
 SAF.161.desc: "Harry strolled through one of his company's biggest mineral refineries, passing by workers and supervisors on the job. Taking puffs of a cigar outside of the hazard areas, he approached the office of the on-site manager of the refinery, knocking before entering, and shutting the door. "Gerrit, we must talk. Now." He spoke, setting the mood for a serious conversation. Locking the door, Oppenheimer sat down in the chair in front of his desk. "I've been made well aware of your problematic behavior, Mister Smit. To cut to the chase, you're a liability to the company, and I want you gone."\n\n"What the hell? Why?!" Gerrit demanded. "You know goddamn well why, and I don't like your tone either! You're a liability to the safety of my workers, my secretary has turned my desk into a goddamn igloo of complaint papers from them, and not to mention your scandals with women that aren't your wife!" Harry snapped. The refinery seemed to fall silent outside, the machines stood still. Gerrit looked around, unable to find any words. After a moment, he spoke with his head down; "...I'll clean it all out by clockout, sir," and left.\n\nStamping out the cigar in the nearby ashtray, Harry exited as well, ready to finally tackle the next objective he had here. Writing furiously on a paper, he drafted and stamped approval to reorganize every refinery under his name to contribute to the war effort. All across South Africa, workers read their new instructions, feeling determined to do something for the country, more than ever. As the days turned into weeks, Harry watched the men hard at work, refining each mineral to the quickest but highest quality of material, making sure not to waste a speck.\n\nAnd as each batch finished, they loaded right onto the trucks, shipping out to various arms factories around the country, driving further cooperation between the Oppenheimer name, the other companies, and the government, all for the motherland. By divine intervention or by hand, someone was doing something to help out, even as small or as overshadowed as it may have been; all will go to the war effort. Harry basked back in his office chair, smiling as the endless convoys of trucks came and went once more."
 SAF.161.a: ""Every man to a pickaxe, every mineral to the front.""

 SAF.162.t: "TLL TODO"
 SAF.162.desc: "event for the focus \"field reconnaissance\"."
 SAF.162.a: "TLL TODO"

 SAF.165.t: "Heavy on The Mind"
 SAF.165.desc: "Rowan stubbed out his cigarette in the ashtray as he turned into the side road. Daniel looked on to the dirt track before him. Dimly lit by the headlights of the Bedford truck, the bush could barely mask the smell that was coming from behind.\n\nProceeding onwards, Rowan's eyes wandered to Daniel, brooding at the passenger door.\n\n"So, do you want to tell me what's bothering you in that corner or are we going to endure this silence all the way back to town?"\n\nDaniel decided it was time, they were having this conversation. "Killing a bunch of people in their sleep and throwing them in unmarked graves in the countryside?"\n\n"Look here kid, these people went to sleep on their good and godly conscience that they were out to destroy South Africa for their own political gain. Our government knows this. This is for the people, for our livelihood and our communities. They wanted us dead. It was either us, or them." As Rowan pushed his cigarette against the glowing red coil.\n\n"Killing them in their sleep was the only option we had? Not even throwing them in a jail cell was a consideration? How moral are we to judge and kill these so-called enemies of the state?"\n\nRowan bit back. "Just because you have morals does not make you a better person. Last I remembered you put a bullet in the men just the same as me. If you want a judge, go talk to a fucking priest and confess your sins." as he inhaled a puff.\n\nDaniel, unable to accept hypocrisy, shouted at his partner to shut up and get the job done. He was done with this assignment."
 SAF.165.a: "Neither would speak to the other as they ran along in the nigh."

 SAF.167.t: "Liberty of the 20th Century"
 SAF.167.desc: "As the alarms wailed and sailors boarded the docks of Cape Town, their ensigns ensured yet another temporary stream of relief for South Africa. Of course, this was distinct equipment of all kinds. Medical, military, anything an auxiliary officer would be happy ticking off his checklist at a requisitions inspection.\n\nEventually, a group of "stevedores", as the Americans called them, unboarded along with his group several tons of mechanical parts, among others, within the haul. He was eventually supported by several American sailors, offboarding several and hauling them into trucks to be sent through and organized later. Of course, the work got quite tedious after a few minutes, and it didn't take long for the men at work to start making some conversation.\n\n"Hey, Afrikaner. 'You speak English?" The man scoffed at his bluntness but humoured him regardless, "Yeah, I do. What's up?" Surprised, he responded, and he pushed on, replying. "Well, I don't know. You guys are one of our closest friends in the world, yet I have to ask, since you speak some hybrid language. No offense, of course, I don't mean anything by it."\n\n"I've heard you guys are awfully blunt, y'know, manners exist, right? It's whatever, none taken. How about we talk about how life is for you? Wherever you come from?" After this head-on question, he wondered what to say, responding aptly. "I'm from Naperville, close to... Chicago. Life's fine out there, yet everyone in the city dislikes us; we're better developed. What about you?"\n\n"Me? I've lived in Constantia all my life. Joined to try and make a difference for my country, y'know, patriotism?" Now came the big make-or-break for the American. "I get that, same here. By the way, get over here." He eventually led him into a corner, not wanting to ask this in front of the others, pushing out his question. "So, how do you guys feel abo-" "Blacks? Well, we don't treat them fairly if I'm being honest. Some places just get segregated for no reason.""
 SAF.167.a: ""Huh, we're the same over there. Guess liberty doesn't like those of colour, huh?""

 SAF.168.t: "Div in London"
 SAF.168.desc: "Graaff waited patiently inside one of the many guest rooms in Buckingham Palace, having flown in just that morning. Outside, he could see several construction cranes, as they sought to not just repair the damage from the civil war, but also rebuild a new Britain away from Nazi oppression. It hadn't been that long since the war, yet London was already looking better than it had ever been. Sure, it was obvious London, no, the entirety of Britain, was still a shell of its former self, but the future was brighter than ever.\nOutside, he could see construction workers cordoning off sections of Hyde Park for repair work, one of the areas damaged by fighting when HMMLR arrived in the capital, yet on the other side of the park, people were enjoying the sunny day, fitting for a new beginning for the island.\nAs he observed the London skyline, he was alerted by a servant:" Mr.Graaff, her Majesty has arrived." As he motioned to Queen Elizabeth, walking into the room. She seemed more tired than she looked in photos, but her energy was that of a determined ruler. "Your majesty", he bowed as he greeted her. "It's good to see you again, especially after all that has happened".\n"It's my pleasure to welcome you to London, Mr.Graaf. Things have been slowly progressing over the last couple of months, and as you can see, reconstruction is going better than imagined, though of course, there are still some kinks in the way," she said while pointing towards the skyline. He turned to the skyline once again:" Of course, nobody can expect things to be all rosy after a war, but I have confidence that Britain will regain its own glory again, with the sun shining high over the isles.""
 SAF.168.a: "And I hope the same for South Africa too."

 SAF.169.t: "Limited Opportunities"
 SAF.169.desc: ""I give up. I just give up. As close as our two brother nations are, I don't see any opportunity for trade between us that we really can work on." Strauss leaned back, adjusting the glasses on his face.\n\nThis meeting was going nowhere, and it wasn't the fault of the man opposite him at all. Hugh Gilchrist, the Australian ambassador in South Africa, was dressed in a fine suit and tie combo, but even he was starting to look a bit unravelled as their meeting entered the second hour. He looked over the pages laid out in front of him for some promising exchange between the two nations, but found two very familiar-looking profiles. Two mining nations that were in the process of industrializing with agricultural industries that looked disappointingly similar. Trade relied upon contrasts between nations to be effective, and South Africa and Australia were simply too familiar, neither really having much unique to offer the other. Despite the warm relations between the nations, the geographic circumstances being favourable, and more, it just wasn't worth it for either nationl.\n\n"I suppose we should be looking at other measures. If goods are not what can be exchanged between us, what about other things?"\n\nStrauss perked up, leaning forward with interest. "What do you mean by that?"\n\n"Knowledge, experience, and technology. Since we are involved in the same fields and facing similar circumstances, information shared between our different companies and technological cooperation can serve to improve productivity and efficiency for us both." Gilchrist answered. "And decrease our mutual dependence upon the Americans, too."\n\n"Now that IS a fantastic solution! All that is needed is to establish connections between South African and Australian companies and universities, and both sides will benefit!" Straus leaned over to shake the hand of his conversation partner, and Gilchrist shook with great excitement."
 SAF.169.a: "A different kind of trade."

 SAF.170.t: "Traveling by Train"
 SAF.170.desc: "Strauss had never been to Suriname before; why would he ever have been, for this land had been absolutely nothing for centuries, only launched into relevancy by becoming the heartland of the Dutch in exile after the Second World War.\n\nFinishing a long day full of exchanging pleasantries and making contacts in the capital, Jacobus was now on his way by train towards the city of Nieuw Eindhoven to speak with the CEO of Philips Electronics, the biggest and most technologically advanced company in the nation and a major player in the electronics industry.\n\nAlong the way, Jacobus was making conversation with those in the train, with him speaking Afrikaans and them speaking Dutch. It heartened him that his native language was still strong enough to be understood by those who spoke modern Dutch, despite the differences between the languages being quite prominent. Even with that being the case, he could still not shake the feeling that his Afrikaans was causing the small girl sitting opposite him to giggle uncontrollably, despite her mother telling her to be quiet.\n\nHe turned to the side to look as endless rows and rows of farmland passed by, with the Atlantic Ocean barely visible in the distance. It was around sunset when he could suddenly spot a city in the distance, standing out by its brightness.\n\nHe had heard some about Nieuw Eindhoven, the so-called New City of Light, but now he could see that it really did live up to its name. He wondered how they could afford to waste all this electricity, considering how many of the buildings were emblazoned with lights that so vibrantly lit up the night. Finally, the train pulled into the station, which was lit up as much as the rest of the city. As he stepped out of the train, he could see Mr. Philips waiting for him with a big smile on his face."
 SAF.170.a: ""Welkom in Nieuw Eindhoven, Meneer Strauss.""

 SAF.171.t: "Strange Looks upon the Vanquished"
 SAF.171.desc: "At a local Steakhouse in the coastal areas of Cape Town, a pair walked in one day, yet not the typical type to enter the restaurant. The man wore a Khaki shirt and trousers, whilst the woman fashioned a modest dress, her skirt covering her knees. For those already inside the restaurant, it wasn't hard for them to theorize on these people's identity, Afrikaner. \n\nElsabe, the woman, looked worriedly at her husband, Pieter, who was busy watching the restaurant's patrons, who were giving them ugly looks. He pressed on, grabbing his wife's hand and slowly making their way to the nearest available table.\n\nThe moment they sat down, a waitress approached them, clearly English, as indicated by her cold and hostile demeanor. She gave a menu for each. How kind of her, Pieter thought at first, before opening the menu and revealing that all items were in English. He cautiously eyed the waitress who remained beside the pair's table.\n\n"Excuse me, miss." The man began, trying his best to hide his Afrikaans accent. "My wife doesn't exactly dominate the English language, so I was wondering if we could have our menus in Afrikaans-".\n\nThe silent aura formed around the table was cut swiftly by the waiter's cold response. "Our menu is only in English. Perhaps your wife should learn it instead." \n\nWhat? Pieter thought as he raised himself from his seat, now with no fear of hiding his accent. He'd spent the past few years of his life escaping town after town, staying in every remote city in the Boer Republic, all in the hopes he'd avoid being drafted. Before being an Afrikaner, he was a free man, and such an individual could not stand the idea of German boots stomping over his face each passing day. But now, that nightmare was gone, so he could be alongside his Anglo 'brothers', who thanked Pieter by turning their backs on him.\n\n"We lost the war, and you pigs still divide us by our identity?" He barked, receiving booing from other tables around him. The waitress did not react.\n\nPieter gestured to Elsabe to leave. Trying to keep her composure intact, she rose from her seat, and they both left the restaurant. A man even threw food at them as they departed."
 SAF.171.a: "Prejudice cares for no past."

 SAF.172.t: "Never Forgotten"
 SAF.172.desc: "It had been a few years since Daniel had seen his old childhood home, inherited by him after his parents died whilst he was on the frontlines. It would've been nice if they'd given him some of the home's items, but as he locked open the house's main door with his old keys, having been left on the same spot he'd left them all those years ago, his eyes locked on the terrifying sight of an empty room. \n\nEverywhere, from the living room to the kitchen, basement, and attic, had been left empty, abandoned even. Still, Daniel felt as if he couldn't complain. Knowing his parents, had they gotten their chances, they wouldn't have given Daniel even a penny of their worth. \n\nDaniel marched to war to prove to his nation that, despite his heritage, he'd take up the Union's banner and charge directly at the Nazi's heart. That was an action supported by many around him, but amongst those many, you could barely find a single member of his family. \n\nYet as he sat on his childhood bed, the only room in the house left intact, he began to reflect. He'd spent years away from his home, in his 'native' lands, fighting people who spoke his language, bleeding and seeing his fellow 'brothers' die right beside him. And for what? This? An empty memory? All the blood he'd shed, all the atrocities he'd witnessed, for nothing? \n\nHe'd seen it all. Soldiers were bleeding out as they cried for their mothers. Villages are burning, with many of their residents burning alongside them. The people who shared his beliefs were silenced by his rifle. All the sacrifices he'd have to endure, all in the name of freedom. Yet, was this the freedom he sacrificed his family for?\n\nAs his mind raced through these thoughts, he could hear someone knocking on the house's door. He opened it to find, well, no one, except for a single envelope on the doorway carpet. He opened it only to find a letter from the Prime Minister himself congratulating him on his work, alongside a very generous stash of money. \n\nDaniel, still dealing with past thoughts, struggled to react. When he did, he could only cry with joy."
 SAF.172.a: "Something he hadn't done in years."

 SAF.173.t: "The Embargo at Dusk"
 SAF.173.t2: "From South Africa, Without Love."
 SAF.173.desc: "Div sank into the armchair in his office, the weight of the day pressing down on him. It had been long; an endless parade of meetings, memos, and red boxes. Each one emptied, only to be replaced by another. Now, with a tumbler of amber liquid in hand, he allowed himself a brief moment of relaxation. The quiet hum of the evening felt almost comforting. Almost. He stared into his glass, watching light flicker across the surface. The recent shift toward the OFN had seemed bold, a huge chance for South Africa to assert its independence and balance between the great powers. But it was a fragile balance. One misstep could plunge the country into chaos.\n\nThe calm didn't last. A soft knock came at the door, followed by the entrance of his private secretary, a thick manila folder tucked under his arm. "Prime Minister, my apologies for disturbing you. News from Germania has arrived- and it's not what you were hoping for." Graaff frowned and took the folder. Inside was a single sheet, stamped and sealed:\n\n**Effective immediately, the Union of South Africa will be embargoed until further notice by the Greater German Reich and its allied governments. This measure was not ours to decide, given your government's continued alignment with the American enemy across the sea.\n\nReichsminister des Auswärtigen, der Großgermanisches Reich\nWalther Hewel**\n\nHe read the message twice, then set it down, staring blankly into his drink. The consequences were clear and catastrophic. German goods, capital, and investment had long balanced American influence; without them, South Africa would be left at the mercy of Washington. Markets would panic, industries would falter, and political rivals would circle like vultures.\n\n"Call an urgent cabinet meeting," he said finally, his tone steady but heavy. "This must be shared with all ministers before it leaks. We need to move fast."\n\nAs the secretary hurried out, Div refilled his tumbler and walked to the window. The lights of Pretoria shimmered faintly in the distance, blurred by the night air. He took a slow sip and exhaled. The embargo would test everything: his policies, his government, and perhaps even his own future. Reelection now felt like a distant prospect, unless, somehow, he could turn this disaster into an opportunity."
 SAF.173.desc2: "To: Marshal, Hans Speidel\n\nFrom: Jacobus Strauss, Minister of Foreign Affairs.\n\nDespite our two nations' great differences in policy and ideology, there remained an effective way for peaceful coexistence, but any and all chances of the aforementioned peace have been crushed by the surprise invasion made by your African Reichskommissariats, the invasion of South Africa, which has been discovered to be planned to support the illegal Ossewabrandwag coup attempt and violent uprising against the rightful South African government. These actions will not be tolerated in any form.\n\nGiven the outbreak of hostilities with said Reichskommissariats, the South African nation has been given no other choice but to recognize the existence of hostilities between our nations. However, South Africa makes it clear that only a state of war exists between South Africa and Germany's African Reichskommissariats. Additionally, South Africa recognizes that no hope for peace exists at the current moment.\n\nGiven such information, the government of South Africa will be ending normal trade relations with all countries within the German sphere and unconditionally seizing any and all assets owned by Germany in South Africa. Said assets will only be returned if German support for the Reichskommissariats does not continue and a complete withdrawal of all forces from South Africa is initiated. We hope that you and whoever wins the ongoing civil war may see reason, start peace negotiations, and bring your Reichskommissars back under control."
 SAF.173.a: "An Unwelcome Response."
 SAF.173.a2: "Signed, Jacobus Strauss"

 SAF.174.t: "Kaapse Klopse"
 SAF.174.desc: "The day had arrived, and once again, the streets of Cape Town were alive with celebration as Cape Coloureds across the city honored their vibrant heritage. Trucks carrying performers rolled down the avenues as hundreds of minstrels paraded behind, dressed in vivid colors and carrying ornate umbrellas while playing an array of musical instruments. Meanwhile, white citizens looked on in disapproval from the sidewalks as they did their usual shopping, bewildered by the spectacle before them. Among the crowd were several black factory workers who had just finished a 12-hour shift at the local Eskom Plant. This festival allowed people like them to openly embrace their heritage without fear of being expelled by the authorities.\n\n"Get out of here, you black laborers! Get back to work!" Taunts and insults echoed from the crowd of onlookers. Police officers were stationed along the procession to maintain order, but it seemed all they did was incite tension. "Go away! No one wants white trash here!" As some Coloureds shouted back, the enraged officers surged toward the crowd. Within minutes, chaos erupted as members of the procession confronted nearby police officers. Riot police quickly arrived, and crowds fled as the officers began to assault any Coloured person in sight. "Run! Run for your lives!"\n\nOnce calm, the whole street erupted into chaos. Unconscious bodies sprawled across the ground as law enforcement stormed after the fleeing minstrels. Journalists ducked into nearby shops, their cameras flashing as they captured the violence. "Hurry up, get him and bring him to the car! We'll take him to Groote Schuur Hospital!" At that moment, an unconscious man, blood streaming from his forehead, was hauled into a car by several minstrels who had been attending the parade.\n\n"Someone, please help! He's losing too much blood!" A Samaritan rushed to the front counter, pleading with the nurse. "I'm sorry, we have an overwhelming number of patients today, and because of his heritage, he cannot be prioritised - even in this state. He will be treated later. For now, you'll need to wait outside..."\n\nThe minstrel froze, words stuck in his throat. His chest tightened as despair weighed down on him. Because of his Bantu heritage, this man was being denied urgent care. Muttering angrily, he carried the unconscious, bleeding man out of the hospital. Placing him gently on a nearby bench, he was soon joined by others who tried desperately to stem the bleeding. Sitting beside him, the very men who had saved him could only watch as his breath grew weaker and life slipped away."
 SAF.174.a: "He was dead within 10 minutes."

 SAF.175.t: "The Cold War of the House"
 SAF.175.desc: "The autumn evening in Pretoria carried a tension that mirrored the brittle calm of South Africa itself. The Van der Merwe household, a modest bungalow on the city's outskirts, became an unwitting battleground that night. The family gathered around their aging radio, its brass dial tuned to Radio Ostafrika, a propaganda arm of the Reichskommissariat's exiled far-right loyalists. The voice of Johannes van Rensburg, disgraced leader of the OBW, crackled through the speaker. His words were sharp, laced with vitriol: condemnation of American "weakness," and fervent calls for alignment with Germany.\n\nPieter van der Merwe leaned forward in his armchair, nodding along. To him, van Rensburg's rhetoric resonated with fears of a changing world—the OFN's democratic overtures felt like a surrender, while Germany's order promised stability. His wife, Elize, a schoolteacher, sat rigidly on the sofa, her knitting needles clacking louder as the broadcast escalated. When van Rensburg derided mixed-race schools as "cultural treason," she snapped.\n\nThe argument erupted swiftly. Pieter defended van Rensburg as a "patriot," while Elize accused him of parroting fascist poison. Their voices rose, echoing in the cramped living room. Between them sat their daughter, Anika, clutching a tattered history textbook—a gift from Elize's pro-US brother. Her eyes darted between her parents, a silent witness to the chasm widening beneath their roof.\n\nAnika's presence did little to temper the clash. Pieter barked about "protecting their heritage," while Elize retorted that van Rensburg's vision would doom them all. The radio, still murmuring its hateful sermon, seemed to feed the discord.\n\nBy midnight, the radio was off. The couple sat at the kitchen table, weary but united in a fragile truce. They agreed that men like van Rensburg thrived on turning homes into trenches, but their relief was bittersweet."
 SAF.175.a: "A precarious household."

 SAF.176.t: "From Guangdong With Love"
 SAF.176.desc: "For many in South Africa, the delicate balance between Germany and Washington was a matter of survival, for it would ultimately shape the nation's destiny. Yet there was a third great power in the Cold War: the Empire of Japan. South Africa's neutrality allowed it to maintain trade ties with Tokyo as well, though geography placed natural limits on this relationship. The Japanese heartland lay far across the Indian Ocean, and unlike the Americans or Germans, Japan lacked deep political and economic footholds in the region.\n\nEven so, the harbour of Durban became the gateway for the Sphere. From time to time, Japanese ships arrived to engage in lucrative, high-end trade. While never matching the sheer volume of German or American commerce, Japan found a reliable customer for its industrial goods, while South Africa's gold and minerals flowed back across the seas to fuel Asia's industries.\n\nOver the years, this exchange expanded, particularly with the rise of Guangdong. The newly forged nation emerged as the Sphere's leading partner in trade with South Africa, offering advanced electronics and industrial equipment in exchange for the Cape's resources. To South African politicians, Guangdong's modernization and technological progress represented a model worth emulating, an inspiring vision of how the Cape might transform itself in the modern world."
 SAF.176.a: "For no one wanted to see what lay beneath the glittering lights"

 SAF.177.t: "In Memory of Malan"
 SAF.177.desc: "The funeral of Adolph Geysbert "Sailor" Malan became a moment of quiet reunion for South Africa's British exile community. Gathered in solemn respect were not only veterans of both the First and Second World Wars, but also leading figures of the United Party, whose attendance signaled defiance in the face of National Party objections. The South African flag was draped over the coffin of one of the RAF's most prominent flying aces, which had lost the battle with Parkinson's Disease just over a week ago. After the war's end, Sailor Malan returned home to found the Torch Commando, an organisation that opposed segregation in South Africa.\n\nColin Eglin slowly climbed up the stage to the podium, his face clearly filled with mourning over his friend and colleague. Watched upon by large parts of the South African military establishment, he began to speak.\n\n"We have lost a good man and a good soldier. Someone who rose to the defence of Britain without a second of doubt joined the fight for freedom against its enemies." The text for the speech, in a futile effort, had been modified heavily by the United Party to avoid offending the Germans. After a lot of debate, he had been able to keep as much as he could in, staunchly defending the right to honour his friend and the things he stood for.\n\n"Sailor had always fought the right cause, and with dedication and gallantry, he took part in the Dunkirk operation, achieving vital shootdowns of enemy forces who were trying to sink the good men who were trying to get back to safety." Colin's face turned somewhat at the mention of enemy forces; after all, everyone really knew exactly who he was talking about.\n\n"After the war's end, he returned home to lead another struggle, that against segregation and inequality that continues to plague this nation to this day. I was honoured to be a part of the Springbok Legion, which he founded, where veterans of this great war met to bring about a better South Africa. Yet as vital as he was to the good cause, fate struck him down with a debilitating disease that has now sadly claimed his life. Sailor Malan will not be forgotten as a gallant gentleman, deeply involved humanitarian, and one of the finest fighter aces the Royal Air Force has ever produced. South Africa has lost a great hero, who will be remembered forever.""
 SAF.177.a: "Rest in Peace"

 SAF.178.t: "A Fateful Meeting"
 SAF.178.desc: "On a quiet African night, a nondescript car approached a border post between the Union of South Africa and the Ostafrikan Reichskommisariat. As the car rode into the illuminated area near the border post, two soldiers in South African uniforms quickly blocked its path. One of the soldiers approached the car, motioning for it to lower its driver's window, which it quickly did. The soldier then peered into the car and smiled. "It is good to see you, Sir. The Commander has been expecting you. Please follow me."\n\nFeeling tense about if he had truly been able to make this journey without being pursued, Albert Hertzog stepped out of the car and followed the soldier. As he walked over a white line marking the border, Hertzog could make out a figure that was waiting in the darkness on the other side. After several more steps, he could finally see in the flesh a figure that he had heard much about, Johannes van Rensburg. This meant that the South African soldiers at the border were indeed members of the Ossewabrandwag. "Mr Hertzog, it is good to see you. Since you are present, I trust that you are willing to do what must be done ?"\n\nHertzog nodded, feeling his heart beat faster in excitement and righteous anger. "For many years, I tried to support the rights of our people in parliament. However, it has become clear that peace is no longer an option. The English sabotage all of our attempts to steer the country in the right direction, whilst acquiescing to the desires of the servants and the weak-willed. I and the entirety of the National Party will stand ready to support your intervention in establishing an Afrikaner government to guide this country to prosperity."\n\nVan Rensburg smiled from ear to ear as he heard these words and extended his arm as if asking for Hertzog to shake his hand. "Then we agree. We will take our country back from this Anglo occupation at any cost." Hertzog grasped the hand and shook it."
 SAF.178.a: "At any cost."

 SAF.179.t: "Crossing the Border"
 SAF.179.desc: "It was the middle of the night in the faraway farmlands up north, near the Reichskommissariat border. The people here lived a modest life; while not wealthy, they certainly could make do by farming or mining, far away from the control of Parliament in Pretoria. At this late hour, almost every household had its lights turned off, its residents sleeping soundly through the night, preparing to get to work the next day. All except for the Heijden residence. \n\nPeter Heijden, the six-year-old child of the Heijdens, was shifting around restlessly. He simply could not sleep. The street was eerily quiet, and he could not focus on sleeping. Frustrated, the boy climbed out of his window, hoping to take a walk, which he hoped could help him to sleep.\n\n"Hurry up, we need to get to Pretoria by sunrise!" Quiet voices echoed from the main road. Curiosity killed the cat, and the stubborn child walked closer to the main road. Though it was very dark, Peter could see the convoy of trucks speeding towards the bustling districts of Pretoria. Something was wrong, yet he could not figure out the abnormality.\n\nJust then, a heavily accented voice came from one of the trucks. "You imbecile! How could you forget your gun! Up north, you would get court-martialed for this incompetence!" Peter's jaw dropped. The Germans were here, in his neighbourhood! And yet, the border guards were not doing anything, simply smiling and letting the Germans and their Ossebrandwag cronies cross the border!\n\n"Hey, you! Kid! Get out of here! Go back to sleep!" A border guard walked up to Johannes, signalling for him to get back home. Peter was stunned, merely uttering the words, "Why aren't you doing anything..."\n\n"I'm doing what's best for all of us. The Ossebrandwag will make South Africa great again. Now, best you get home. And stay out of trouble." Just like that, Peter rushed back home and went to bed. He would not be able to go to sleep for the whole night, and come morning, everything had changed..."
 SAF.179.a: "His life would never be the same again..."

 SAF.180.t: "A Plan Derailed"
 SAF.180.desc: "As the sun began to peek over the horizon, the Ossewabrandwag troops sat in utter silence as they rolled into the outskirts of Pretoria in transport trucks. Today, they would embark on a sole objective: to bring down the United Party in a single swoop and take control of all of South Africa. Some were fiddling with their fingers, others were restlessly looking around. When the few civilians who were on their way to work quickly went back inside to hide from the men, the convoy continued onwards. Suddenly, the commander shot his hand up and yelled for the convoy to abruptly halt.\n\nGetting out of their vehicles, the men murmured to each other with uncertainty about why they had stopped. One of the officers in transit with the soldiers approached the commander, with papers in his hands. "Sir, we've lost contact with the central assault unit; they appear to have gone a different direction from us to reach the center of the city." He spoke. "Goddamn it. We're already unorganized before the fight even starts." The commander responded. While attempts to reorganize were being made, a soldier then leaned in from a truck's driver's side window. "Commander! Got a light-?"\n\nSuddenly, a shot rang out from the end of the street, the bullet striking the soldier in the temple, splattering brain and blood everywhere. "Sniper! Get the fuck down now!" Shouted the commander. More shots began to ring out, and soon, a mix of city police and SADF men began to arrive, the soldiers coming in more armored vehicles. Bullets flew everywhere as the Ossewabrandwag began to scurry to whatever cover they could find. The commander grabbed his radio for reinforcements, only to be met with the shouts of other units across the city being pinned down and ambushed.\n\n"This is assault unit southwest, we are pinned down! We have no cover, we're sitting ducks out here- requesting immediate reinforcements, over!" He screamed. "Southwest, this is unit north central, higher command has declared seventy-five percent of all positions to be untenable or on the verge of collapse. We are ordered to retreat from the city and regroup in Rustenburg, over." Looking back to see the corpses that littered the street and the blood flowing into the drains, the commander found few options other than to follow the order. Finally, he gave in and declared to his unit.\n\n"Assault unit southwest, position is untenable! If you can move, then get the hell out of here! If you can carry wounded, do it! Otherwise, get out and retreat out of the city! Now, damn it!" Still being picked off by South African rifles, the fragmented assault units of the OWB managed to pull out what they could from Pretoria. It was a long ride back to Rustenburg, as the wounded cried openly to their comrades. The units that stayed back looked in horror as they returned to the hastily-made FOB, unable to recognize any of the men, even if they had distinguishable faces."
 SAF.180.a: "Eyes intact or not, all could see the cost of this failure.."

 SAF.181.t: "Hertzog Speaks"
 SAF.181.desc: "At the morning dawn, politicians came in droves through 50th Parliament Street, called to an emergency meeting. Many had heard the gunshots around Pretoria, but none fully knew what was going on. Settling in the chamber, the men sat around on edge, the nicotine of cigarettes failing to calm the crowd. Finally, Albert Hertzog stepped to the front, revealing himself as the one who called the meeting. Whispers echoed into open conversation, even among his own party, to try and determine his motives. Clicking on the microphone, he spoke.\n\n"I stand in this building today, not to remain as a representative of people who have never represented the Afrikaners, or the pure race! By God, this land will be ruled by the true owners; the Afrikaners!" He demanded. "Today, the end of your subjugation begins! We, the pure Aryan race, are the rightful rulers of all nations! And it begins again here, with the end of the degeneration of our society!' I-" Hertzog's words began to fade into the commotion of the room. Looking at his party, many expressed their shock and dismay.\n\n"Mister Hertzog, are you fucking crazy?! This isn't how we get legal recognition, coups don't change that!" A party member screamed at him. "You're going to undo everything we have been fighting for, with the little credibility we had left!" Another replied. Hertzog gripped the sides of the lectern, his pride and anger mixing into his emotions as he threw insults right back at the crowd. Several members of the National Party stood up and walked right out of the building in protest but there were plenty of them who applauded.\n\n"You race traitors! Dare you defy me, and turn your back on your own brothers?! Our race?!" Hertzog blared. As the chaos ensued, several guards began to approach him, locking their arms around him and forming a human shield to escort him from the premises. In his mind, the resistance from his own party didn't make sense to him. He should be applauded, not reprimanded. To him, it didn't matter anymore. Any Afrikaner who followed him was a true Afrikaner, a pure white man for a pure race.\n\nBut his confidence didn't stop thoughts from filling his mind, seeing his party against his methods. Thoughts that there was something truly unforeseen in the coming time, coming to everyone. It was only a matter of time to know if that gut feeling was right."
 SAF.181.a: "A purist racial goal, an impure fortitude to Albert's mind."

 SAF.182.t: "A Narrow Escape"
 SAF.182.desc: "It was a long journey out of Pretoria, through side routes and detours to escape the Ossewabrandwag forces. Security forces had barely any time to prepare to guard the transportation of the United Party's politicians and South African elites across the country, with enemies around every corner. Along the way, they had nearly gotten caught on several occasions, but it seemed the universe was on their side today, with their pursuers being held back by loyalist forces that were rapidly rising across the country against the coup committed by the Ossewabrandwag and the National Party.\n\nBut now was not the time to dwell on the past. Now was the time for action to stem the chaos. Cape Town would become the de facto capital for the foreseeable future, and it would need to become the beating heart of the resistance against the invaders.\n\nSupply hubs, government agencies, training camps, air bases, and command centres; all had to be rebuilt right here as the government and military quickly mobilized all available resources to defend their homeland.\n\nThe plotters may have thought they had an easy victory, and that the South African military would collapse when faced with opposition, but they couldn't be more wrong. Now endowed with a life-or-death energy, the government worked faster and more unified than ever before, determined to maintain its beloved nation by any means necessary. The Ossewabrandwag may have won this battle, but Cape Town was ready for the long haul.\n\nMost importantly, the first frantic calls for aid had already been made, and the direct line to Washington was running red hot. Though the escape may have been narrow at times, it had been vital in keeping the fight for South Africa alive. Even as bad news continued to roll in from all across the nation, the light on the Cape has not yet gone out."
 SAF.182.a: "We have not chosen this war, but we shall win it nevertheless."

 SAF.183.t: "Hertzog Takes Over"
 SAF.183.desc: "Van Rensburg resigns, Hertzog is now the new Prime Minister(?)" #TLL TODO?
 SAF.183.a: "Congratulations to the new Prime Minister."

 SAF.184.t: "Shrinking the Budget"
 SAF.184.desc: "The air in the Pretoria boardroom was thick with the scent of old paper and older resentments. For hours, the Commission on Fiscal Solvency had stared at the abyss. The reports on the table were a death sentence in monochrome: without deep, painful cuts, the state was headed for bankruptcy.\n\n"The agricultural boards are an archaic drain,\" began Mr. Hawthorne, his crisp English accent cutting into the silence. He represented industry, a man of the market. \"We must trim these inefficient subsidies.\" Dr. van der Merwe, a stern economist from the Broederbond, barely let him finish. \"The farmer is the bedrock of the Volk,\" he shot back, his voice thick with indignation. \"You would sacrifice our people to appease foreign capital. The savings are in the bloated English import sector.\"\n\nThe battle lines were drawn. The chairman, a weary civil servant named du Plessis, tried to find a third path by mentioning the Bantu administration budget. \"Untouchable,\" both men said in unison. The debate devolved into a trial over who was to blame for the nation's ills, escalating until van der Merwe spoke of \"financial sabotage\" from the Anglophone press.\n\nHawthorne shot up from his chair in fury. Du Plessis slammed his gavel down, the sharp crack echoing in the tense silence. \"This commission is in recess,\" he announced. The experts filed out like bitter rivals. The numbers were solvable; the divisions in the room were not."
 SAF.184.a: "There is no unity in this Union."

 SAF.185.t: "A Moment of Unity"
 SAF.185.desc: "The private back room of the Pretoria club was a sanctuary, insulated from the turbulent nation outside. The air, thick with the scent of expensive brandy and cigar smoke, felt still for the first time in months. The four most powerful men in the United Party, fresh from a grueling referendum campaign that had pushed their coalition to the brink of collapse, were not fighting. They had won. Jan Hofmeyr, the elder statesman whose quiet gravitas held them together, raised his glass. \"To the Union\" he said, his voice soft but firm, \"and to the men who kept her.\"\n\nIt was Div who answered, a rare and genuine look of contentment on his face. \"We have been at each other's throats for a lifetime, it feels,\" he admitted, swirling the amber liquid in his glass. \"We have tested the very limits of party loyalty. But when the entire rotten structure was about to fall, we held the line. Together.\" Across the table, the perennially stoic Vause Raw gave a firm, affirmative nod. \"The people have spoken,\" he stated, his voice a low, gravelly rumble. \"The matter is settled. The real work of governing can finally begin.\"\n\nBeside him, Colin Elgin, a man who had viewed Raw with open suspicion for years, offered a small but sincere smile. \"For once, Vause,\" Elgin conceded, raising his glass in a small salute, \"I believe you're right.\" It was the closest the two had come to friendship, a truce born of shared victory. Div leaned back, the immense tension finally leaving his shoulders. The bitter infighting seemed petty now; the fears for the future, distant. They had faced the abyss and stepped back, their nation intact. In that quiet room, he felt a surge of real hope. The worst was finally over."
 SAF.185.a: "For South Africa!"

 SAF.186.t: "The King is Dead"
 SAF.186.desc: "The heavy oak door to Div's office was shut, but it did little to muffle the storm raging within. He paced his carpet like a caged animal, his face a deep shade of crimson as he spat venom at the man standing stoically before his desk. \"Did you ever, for a single solitary second, stop to think this through, Vause?\" Div seethed. \"Or were you so blinded by your sentimental fantasies that you marched the whole Party off a cliff? We are an international laughingstock! Washington sees a fractured ally, Germania sees a master race squabbling like children. They all see a nation so divided it can't even agree on its own head of state.\"\n\nThrough it all, Vause Raw remained as still as a statue, his face an unreadable mask of iron-willed discipline. Only the white knuckles of his hands, clasped tightly behind his back, betrayed the immense pressure of the moment. The referendum, his grand project, had failed spectacularly. \"And now,\" Div continued, his voice dripping with contempt, \"because you chased this ghost, we have to do the unthinkable. We have to be the ones to put the crown in its coffin. Traitors! Regicides! That is what they will call us, and it will all be your doing.\"\n\nWatching quietly, Colin Elgin maintained a perfect mask of professional concern. He cared nothing for the monarchy, but felt a cold satisfaction seeing the unshakeable Raw humbled by an appeal to a past that no longer existed. It was a victory for Elgin's brand of pragmatism, and he was content to let Div deliver the eulogy.\n\nSoon, the fury in Div's tirade burned out, replaced by a deep, exhausted frustration. The shouting stopped, leaving only a ringing silence in the vast office. He finally slumped into his chair, the anger gone. \"Get out,\" he said, his voice quiet, heavy, and defeated. \"Both of you.\""
 SAF.186.a: "Long live the Republic?"

 SAF.187.t: "No Fear to Hide"
 SAF.187.desc: "How long has it been? Months? Years? Decades? Somewhere around that number. But that didn't matter; the real question was how much it had impacted him. Stefan has lived most of his life in the rural Mopane Savanna of Eastern Botswana. Not exactly his favourite place to call home, but calm enough to greet him nicely. He'd spent the past few years raising a small family with his wife, living off the land and wildlife to hunt, although these past few years, he'd passed that job onto his children.\n\nWhat big things happened in that home in those past few years, threatened to be overshadowed by the War. Yet, as each bomb fell in the distance, each gunshot could be heard, each plane could be seen far, far away, not much changed for the homesteading family. Sure, the beginning of the War was terrifying for all, especially for the kids, but you can get used to it after a while, at least that's what Stefan thought.\n\nDuring the War's earlier stages, you could see trucks passing by in the distance. Although there was no need for Stefan or his family to lower their heads in those moments, despite their Boer heritage. None of those trucks ever bore a Swastika. Even then, it all seemed at a complete standstill. The new norm, as Stefan put it. The norm of waking up to explosions rather than roosters or having to teach your children to fight not just against animals, but men too, just in case. His wife didn't like that.\n\nYet one day, Stefan woke up with an unusual calm. He looked around himself in the mirror to make sure he was alright. The Sun too seemed to shine brighter that morning, even though it had followed the same routine yesterday, and it would again tomorrow. That's when it hit him; his children ran up to him, crying with joy: "The War's Over!" They yelled. "We Won! South Africa is free!"\n\nSo there's the answer. All the noise caused by the War, the explosions, gunshots, planes, and missiles dashing in the distance, they'd all vanished. They'd become such an integral part of his life that he'd forgotten how he felt when they weren't there. Truth be told, he won't ever miss those days. "
 SAF.187.a: "Hope rose with the Sun that day."

 SAF.188.t: "Wrong Step"
 SAF.188.desc: "Frans had spent the past few weeks managing one of the many provinces in what had been Ostafrika's largest administrative zone, formerly Portuguese Mozambique. Officially, he'd been sent there to organize the province and prepare it for full integration into South Africa. But Frans knew from the start that the real reason was more personal: his peers in the high command wanted to keep him out of their way. They saw him as a threat, someone who could one day replace them.\n\nThat wasn't to say he despised his position. Despite the discomfort of sleeping in wooden shacks and taking orders from locals whose English was a struggle to understand, he mostly focused on one thing: returning to his post in high command and confronting whoever had sent him to this forsaken corner of the world.\n\nYet one day, he'd make a different encounter. One of his local administrators was a native, and he wanted Frans to personally visit a few towns and villages to the south of the province, near one of the region's many former camps. But when they arrived at the first village, Jacob felt a strange sensation lingering in his mind; nothing, he felt nothing. He could see nothing, other than a few huts and abandoned trucks, but, other than that, it was empty.\n\n"This is why I wanted to take you here, sir," The native began, speaking in a rather Germanized accent. "These towns were suspected of having been taking part in ANC partisan activity, so the local SS Garrisons ordered the entire province's population to be arrested and sent to forced labor. We're still trying to find the survivors in other camps, but..."\n\nFrans stopped listening. He made his way into one of the huts after having a weird sensation in his body. All he could find was a dress, seemingly of a young girl, with bullet wounds and hit marks. Yet there was no trace of the young girl at first, until he took a wrong step over a half-dug ditch, covered in ants. He looked at the ditch, then at the native, then at himself. His hands. His heart. How he felt, how he saw things, he never thought he'd see such things, much less be the one reporting them back to Cape Town."
 SAF.188.a: ""Get my camera.""

 SAF.189.t: "Lost in the Lights"
 SAF.189.desc: "There are a few keys to diplomacy: pleasantries, conversations, exchanges of gifts, and, of course, tours. Jacobus Strauss was an Afrikaner, born on the Veld, who grew up in the grain fields helping his family with harvests. Far from that simple life, he now found himself in the middle of a dazzling room of computers and scientists, following along an enthusiastic guide who was showing him not just the advanced computers of today, but who was also dreaming bigger, talking about the future opportunities nationwide computerization offered.\n\nIt struck him that Philips was a very prideful man, eager to show off the achievements of his company in this newly built city. It was hard to argue against his accomplishments, but he could perhaps do with less time proclaiming about them.\n\nThe tour took them to another room filled with computer terminals and people working at them. "And this here is PASCAL, the fastest computer in all of South America, capable of two hundred thousand floating point operations per second. And that is merely the current generation; we are working on a concept that can reach up to five hundred thousand. Imagine what could be possible then, not to mention further miniaturization through extensive utilization and integrated circuits, as well as interconnectivity between different mainframes!"\n\nHis host shone brightly while Strauss merely nodded and followed along. Now, at last, his patience with the tour had run thin, and he spoke up. He knew nothing about computers; what he did know was that he needed to get this man to invest in South Africa, so it could have such a shining city of its own."
 SAF.189.a: ""Let's talk business, Mr. Philips""

 SAF.190.t: "A Matter of Principle"
 SAF.190.desc: "The press conference in Pretoria was the first held in months without the shadow of war looming over it. The air was still thick with a weary relief, the scent of victory mingling with the memory of its staggering cost. Div approached the podium to a hushed silence, his face resolute. After a few routine questions, a hand shot up.\n\nAn eager young American journalist stood up and asked Div a question. "Prime Minister," he asked, his voice clear, "given the divisive referendum your government held before the war and the sentiment of many Afrikaners, will your government now abolish the monarchy, respecting the people's choice?" The question was a direct challenge to the room's fragile unity. Div leaned into the microphone, his eyes like cold steel. His answer would not be that of a monarchist, but of a victor salting the earth of a vanquished foe.\n\n"Absolutely not," he stated, his voice flat and hard. "The republican cause was the central ideological banner of the traitors in the National Party. The same traitors who collaborated with the Boer Resistance as they took up arms against the legitimate government, and plunged this nation into war. We will not honour the wishes of defeated rebels. We will not spit on the graves of our soldiers by giving their enemies a posthumous victory. This is a matter of national principle."\n\nA stunned silence followed, the raw political brutality of the statement leaving the reporters speechless. The American recovered quickly enough for a follow-up. "Then, for clarity, Minister, who is the monarch of South Africa?" A thin, cold smile crossed Div's lips, the look of a man checkmating an opponent. "Her Majesty, Queen Elizabeth the Second," he answered with absolute finality. "And you can be assured, we are already preparing a coronation ceremony for her majesty in Pretoria, one worthy of the great and unified nation that she now reigns over.""
 SAF.190.a: "God Save the Queen."
 
