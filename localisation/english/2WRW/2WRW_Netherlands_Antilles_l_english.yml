 ### National Spirits ###
 
 CUR_six_islands_one_favorite: "The Prodigal Son"
 CUR_six_islands_one_favorite_desc: "In all official documents and declarations made in public, all six constituent islands of the Netherlands Antilles are equal parts of one united, constituent country under the wing of the Dutch throne. But in reality, one island outshines the rest as the other five islands are left aside to rot.\n\n Despite an ever growing cascade of dissatisfaction, the island of Curaçao has been at the frontend of all investment opportunities, institutions and glory poured in by the Dutch and Americans. Far from an equal partnership mentioned in the autonomy agreement of 1949, the primacy of Curaçao has left the other islands disgruntled. An uptick of complaints and vocation have fallen upon deaf ears as the father's preconceived equality slips further and further away. The sons grow ever agitated as sounds of protest threat to eventually swallow them all whole."
 CUR_little_tropical_island_paradise: "A Little Tropical Island Paradise"
 CUR_little_tropical_island_paradise_desc: "The temperature is lovely all year round, and so are our tax benefits. While grand commercial tourism is only in its infancy, the Netherlands Antilles have found one way to attract foreign investment and visitors to their shores: widespread tax evasion opportunities.\n\nWhile not yet well known, our reputation, or more accurately our notoriety, is spreading amongst entrepreneurs and the uber-wealthy of the Free World. Canadian Shell companies litter our beaches, South African CEOs sit in their air-conditioned offices and Australian accountants tick away at their workstations, syphoning profit in the name of freedom, liberty and capitalism. The American consumer may not have heard of the Antilles, but the American CEO surely has."
 CUR_60_40: "60:40"
 CUR_60_40_desc: "The backbone of the Antillean economy lies in oil refining, bunkering, and oil storage as the heart of Royal Dutch Shell's operations take up a vast majority of our national GDP. As a consequence, the word of Royal Dutch Shell CEO John Hugo Loudon is the most important law in our small islands.\n\nWith our nation's prosperity tied to one resource, the new tariffs on Venezuelan oil exports have seriously weakened our local economy. Instituted by President Larrazábal, the price of oil has skyrocketed to such an extent that Shell has been forced to dial back operations. By mandating that 60 percent of all oil revenue be given to Venezuela instead of the old 50/50 division, our nation has reluctantly squeezed Royal Dutch Shell out of out markets specifically due to it's heavy dependence upon Venezuelan supply. Unless the situation changes, the Antilles and Shell suffer alike while the populist government in Venezuela will continue holds all the cards."
