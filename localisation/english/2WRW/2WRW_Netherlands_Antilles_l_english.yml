 ### Characters ###
 CUR_Efrain_Jonchkeer: "Efraïn Jonckheer"

 ### Leader Bios ###
 POLITICS_EFRAIN_JONCHKEER_DESC: "The fight for autonomy by the Dutch Antilles has always been a peaceful and successful one. Driven by geographic constraints and a great understanding from both sides that the process would be mutually beneficial, the Mauritsstad Agreement was signed in 1948. It secured a larger degree of political independence while the deep economic ties between the two halves of the kingdom remained steadfast.\n\nAt the head of this autonomous region stands Efraïn Jonckheer, the small time businessman, diplomat and politician having advocated for the Dutch Antilles since the very first days he could grip the idea. The founder and spearhead of the Democratic Party, ever since his ascension to power, he has retained a strong grip in Antillean politics. Efraïn has made good work in achieving autonomy while still staying to the terms of the Mauritsstad Agreement, securing extensive Dutch and American investment to turn the six Antillean islands into modern, advanced economies that make good use of every small bit of land that they own. At the head of this island group stands the sole skilled negotiator with an insatiable eye for progress, and so, day by day, the people of these islands carry on pondering what they would have ever done without him."

