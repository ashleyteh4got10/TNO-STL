 NOV_AFG_WAR_DESC: "§,Afghan War§Y Current Conflict Level: Stage [?global.AFG_WAR_stage]"
 RUS_AFG_WAR_DESC_tt: "§W§,Afghanistan§W's §usands§W have once again tested the §bGraveyard of Empires§W. In early 1976, with §xTajikistan§W's declaration of war against §,Afghanistan§W, the longest §lproxy war§W in human history began, with the fates of both sides determined by the strategic prowess of the §VRussian§M, American§x, Japanese§q, and German§W powers.\n\n§,The Afghan War§W is divided into ten stages, each with unique §ndecisions§W. Over years of conflict, §VRussia§W will single-handedly oppose the §qGerman§M, American§x, and Japanese§W blocs to bring §,Afghanistan§W under its control. The §qGerman§M, American§x, and Japanese§W nations must §Vstop at nothing§W to thwart §VRussia§W's ambitions.\n\nThe intensity of the §,Afghan War§W is measured by the current §fWar Escalation Time§W. §fWar Escalation Time§W cannot fall below 270 days. As an §aSuperpower§W, any action supporting the §ewar§W will reduce §fescalation time§W. However, in §,Afghanistan§W, §aSuperpowers§W cannot solely focus on §ewar§W—they must also develop their home fronts to secure strategic advantages, which will §Sinevitably§W ease tensions.\n\n§aSuperpowers§W cannot directly intervene due to §Vfour-way§M rivalries§W. They can only provide §lindirect aid§W through §Gmilitary§W, §Yeconomic§W support, and stability maintenance. Full-scale troop deployments are impossible; instead, §Rsmall分批部队§W participate in proxy warfare. Ensuring the §Gmilitary quality§W of supported factions is crucial, lest soldiers §o噬沙§W in this §bGraveyard of Empires§W, trapped in endless §ewar泥潭§W.\n\nBeyond §Gmilitary§W aid, both sides can use §Rsubversive tactics§W to disrupt opponents' §adeployments§W and secure local §bvictories§W.\n\n§SYet no matter the methods, this §ewar§S cannot end quickly. Even the §Kmost optimistic estimates§S suggest it will last until §W1980§S. Managing §Pdomestic politics§S is critical—a misstep could force withdrawal from the §ewar§S and devastate §Vnational stability§S.\n\n§rFor the four superpowers, this is a meaningless war, yet their rivalries trap them in endless zero-sum博弈 on this stage.§F\n---------------------------------\n§VGod, I don't want\nto die before twenty\n\nEyes filled with tears\nflowing endlessly\n\nI tell myself 'Stay calm'\n'We'll die laughing'...\n\nAfghanistan, Afghanstan,\n'Black Tulips' circling the riverbanks."
