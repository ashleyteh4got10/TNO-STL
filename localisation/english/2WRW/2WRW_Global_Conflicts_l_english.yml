 RUS_AFG_WAR_DESC_tt: "On top of the dust of Afghanistan, the graveyard of empires has once again been put to the test. At the beginning of 1976, with Tajikistan's declaration of war on Afghanistan, the longest proxy war in human history began, and it was the ability of Russia, the United States, Japan and Germany to plan their fortunes on both sides.\n\nThe war in Afghanistan is divided into ten phases, each with its own unique resolutions, and in a few years of conflict, Russia will stand alone against the tripole of Germany, the United States and Japan, bringing Afghanistan under its command. What Germany, the United States, and Japan have to do is to stop Russia's plan from succeeding at all costs.\n\nThe indicator that quantifies the intensity of the war in Afghanistan is the current time of intensification of the war. The war intensifies for no less than 270 days, and as a superpower, anything you do to support the war will reduce the time it intensifies. But in Afghanistan, the superpowers cannot be involved in the war, they need to build in their own rears to secure the advantage of the conflict, which will inevitably de-escalate the situation.\n\nNo matter how the superpowers want to intervene directly, it is impossible because of the intrigue of the Quartet. The two sides can only provide indirect assistance to the forces they support, and assist the forces they support with military and economic support and stability maintenance. Therefore, it is very important to ensure the military quality of the forces they support, otherwise the soldiers of both sides will be devoured in the graveyard of empires and trapped in the quagmire of endless war, unable to get out.\n\nIn addition to directly transporting troops militarily, the two sides can also use a series of small actions to disgust the opponent and disrupt the opponent's operational deployment, so as to achieve partial victories.\n\nHowever, no matter how many means are available on both sides, there is no chance of a quick end to the war, and even the most optimistic estimates suggest that it will not end until at least 1980, so it is important to deal with the political turmoil at home, and if you are not careful, you will not only get out of the war, but also deal a devastating blow to domestic stability.\n\nFor the four superpowers, this is a meaningless war, but the four parties are trapped on this stage because of intrigues, engaged in an infinite zero-sum game."

  SWRW_AFG.9.t: "Meat grinder"
 SWRW_AFG.9.desc: "The rubber edges of the gas mask pressed against Ivan Ivanovich Ivanov's cheek, and the exhaled white mist condensed into frost on the eyepiece. He cowered around the corner of the trench and listened to the distant sound of shelling, the rumbling sound, somehow, reminded him of the waterfall in his hometown...... Three months ago, he was fishing in the ice on the shores of Lake Baikal, but now he is huddled in the frozen soil of the highlands, which have been plowed countless times by the guns of the four countries, and he is tormented like hell.\n\n"Rookie! Raise your gun high! "The stubble-faced platoon commander smashed Ivan's bulletproof vest with the butt of his rifle. The steel inserts hurt his ribs, and Ivan hurriedly raised the short assault rifle, and the condensed ice crystals on the barrel fell. Through the blackened snow, he saw a German Leopard tank engaged in a fierce exchange of fire with a Japanese Type 97 tank on the ridgeline 500 meters away...... I don't know which country's air raids left the craters, and there are still dark green oil stains.\n\nSuddenly the radio burst out in shrill Russian: "Three o'clock direction!" Afghan maniac with RPG! Before Ivan could react, the trench he was in suddenly turned black - the dust kicked up by the rockets obscured the sky, and the cans and bullet casings that had been scattered on the ground flew around like pieces on an overturned chessboard. Suddenly, he felt some warm liquid spill into his neckline, and when he turned his head, it was the brain of Anthony, a veteran who had taught him to load magazines half an hour earlier. I saw that only half of Anthony's body was hanging from the sandbag, and the other half was gone. His intestines were steaming hot like thawed fish entrails, standing out in the gray-black dirt.\n\n"Shoot! Shoot! The platoon commander's roar was mixed with the roar of a 12.7mm heavy machine gun. Ivan mechanically pulled the trigger. As the 5.45mm bullet passed through the falling snowflakes, the turbaned figure three hundred meters away exploded with blood in his chest. The man was killed instantly, but the bazooka in his hand was still launched, only to miss a lot, and smashed on an oil drum with the "Made in America" logo that had been left on the battlefield at some point, causing hundreds of more pieces of iron to the ground.\n\nAs night fell, Ivan huddled in a concrete bunker left behind by the Germans. The crack in the ventilation duct seeped into the minus 10 degrees Celsius cold, and the silence around him was enough to make him scared... He suddenly felt the slightly sharp bronze cross in his trouser pocket, which had been picked up from a blown up transport truck this morning, and its edges were covered with burn marks, and he felt a sense of silence as he looked at the small object that was faintly glowing with reddish-purple light.\n\nAt three o'clock in the morning, the shelling tore the night sky again. Ivan followed the assault team towards the pass, known to the Afghans as the "Valley of Blood," his boots creaking into the half-melted slush. Countless fireflies lit up in the darkness, and the Japanese Type 89 grenadiers and Russian AGS-17 grenade launchers roared at each other. At one point, Ivan saw a string of fresh footprints in the snow leading to the wreckage of a German-made Weasel armored vehicle, and he instinctively raised his gun to aim, even though he heard the cry of a newborn in the shadows — he knew that the fanatical Islamists would do anything. They use living people as bait, even babies, pregnant women, and even elderly people who have passed their old age...... Just as he was thinking, a pale-faced woman came out of the complete with the baby in her arms, and he immediately strengthened his vigilance and motioned for the other party to raise his hand. But the woman was unmoved, she smiled desolately, and pulled the safety bolt from her body with lightning speed, and Ivan now understood that it was too late. Blood flowers burst out of the woman's body, along with the high explosives strapped to her body. The last thing Ivan's consciousness remembered before falling into darkness was the shape of her mouth, even though he didn't know the Afghan language:"
 SWRW_AFG.9.a: ""Die, aggressor""

