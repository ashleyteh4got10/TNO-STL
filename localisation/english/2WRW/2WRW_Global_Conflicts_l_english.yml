 SWRW_AFG.8.t: "Under the sand, the rose has not bloomed"
 SWRW_AFG.8.desc: "October 10, 1983 · Northern Valley of Badakhshan · The 7th guerrilla stronghold of the Afghan National Liberation Front\n________________________________________\n04:26\nWhen he woke up, the sky was still dark. The ground was as cold as stone. He pulled his hand from under the blanket, his fingers frozen stiff. The gun rested beside him,\nand he subconsciously shook it - the metal was as cold as a knife. He didn't move, and after holding it for a while, it seemed that he could still feel some blood flowing.\nNot far away was Hamid, curled up in a broken carpet and coughing. They lost a supply point last night, and only four escaped. The other ten were either dead or didn't\nknow where they had gone.\nSomeone called his mother's name in a dream and whimpered in a low voice. When he thought of his mother, he noticed that his face was wet.\nBut not because of crying, but because there is blood in the dream and a baby crying. He knelt in the rubble, his hands covered with broken bones. He couldn't save the\nchild.\n________________________________________\n06:02\nThey planted explosives in the mountain passes and prepared to ambush a Russian supply convoy.\nHe deftly tied the lead with his fingers and bit the stem of hay in his mouth. He suddenly laughed.\nHamid asked, "How?" ”\n"I also played with these lines when I was a kid...... At that time, I was making kites at home. Now, I'm still making kites. ”\nHamid didn't laugh, just looked at him: "You're crazy. ”\nHe nodded, "Maybe." ”\n________________________________________\n10:18\nThe mine exploded.\nTheir ambush was successful, but at an extremely high cost. At the moment of the explosion, he stood too close and was stunned. When I woke up, there was scorched earth\nall around. The three team members lay down, not moving. One of his heads was broken, and his eyes were still looking at him. It was Rashid, who was only eighteen years\nold.\nHe looked up, and there was a living one in the distance, leaning against the stone and gasping. He rushed over, only to find that it was a Russian soldier, with blood all\nover his face, half of his teeth missing, and a song in his mouth.\nHe raised his gun and aimed it at him.\nThe man looked up, the corners of his mouth twitching, and he seemed to say, "Mom." ”\nHe froze.\nHe fired.\nHe killed a man who sang and said "Mommy".\n________________________________________\n14:30\nThey returned to their hiding place, and it began to snow.\nHe sat by the fire, roasting his frozen hands.\nThe firelight flickered. He saw the Russian soldier sitting across from him.\nHe raised his gun again, only to find that the muzzle of the gun was rusty. There was blood sticking to the trigger, whether it was his own or someone else's, he couldn't\ntell the difference.\nThe soldier spoke, and it was still the same sentence: "Mom." ”\nHe closed his eyes, and when he opened them again, there was only a pile of empty ammunition boxes across the fire.\n________________________________________\n16:55\nThey heard on the radio that a Pamir village in the east had been bombed yesterday. More than a dozen people died, and many children were not found.\nSomeone scolded: "Bastard German." ”\nHe didn't speak. He suddenly wanted to ask: "Are you scolding Germans, or Russians, Americans, or Japanese?" ”\n– or, are we ourselves?\nBecause they buried the explosives in advance, they hid the barracks, and they robbed the supplies. Before the village was flattened, was it because they had been hiding\nthere for the night?\nHe slammed into his feet and rushed out of the hole, trying to throw up. But I can't spit it out.\nThe stomach is empty, and so is the heart.\n________________________________________\n19:20\nDuring the night, he had a dream.\nIn the dream, he went back to his childhood. My father washed clothes by the river, and my mother made bread in the house. He ran like a child, chasing a kite over stones,\ngrass and hillsides.\nSuddenly, there was a loud bang, and he fell.\nIt's not him, it's the kite that broke the string and fell into the fire.\nThe kite is free.\nHe opened his eyes, and there was silence all around. He thought he was dead.\nBut he's still alive.\nHe sat up slowly, and there was only one sentence left in his head:\n"What we have watered with blood is not freedom, but a deeper hell. May Allah have mercy on us. ”\n________________________________________\n21:10\nThe night was eerily quiet. He held the gun in his hand, and the barrel still had the body temperature of the Russian soldier - not the real temperature, the temperature\nhe imagined.\nHe fired a shot at the wall. Bullet casings hit the ground.\n"Boom."\nHamid was startled and rushed over and asked, "What are you doing?" ”\nHe turned around and smiled on the verge of collapse:\n"I just want to be sure...... We're not in Serrer...""
 SWRW_AFG.8.a: "“… But we are eating the fruit of the tree of the tree. ”"

 SWRW_AFG.7.t: "German Air Force Volunteer Corps · Afghanistan Theater · Tactical Pilot Action Log"
 SWRW_AFG.7.desc: "June 1, 1982 · Badakhshan region, area of REGEN-E operation\n________________________________________\n06:04\nWhen he opened his eyes, there was blood outside the window.\nNo, it's the rising sun. But his first reaction was the orange color after the alarm light flashed. He couldn't figure it out anymore.\nOn the sheets were salt stains from the sweat he had done last night. In the dream, there was a house that was on fire, and a figure fell from the roof, holding a baby in\nhis hand. He woke up with his hands clenched, as if he was still trying to hold on to something.\nHe sat up, his throat tight.\nThe captain told him that today's mission was just a "regular sweep". Clearing of guerrilla transit points in a certain mountainous area.\n"There are no civilians," said the captain, "where are the civilians?" Did you see those radio navigators? It's just a bunch of cowsheds. ”\n________________________________________\n08:12\nLaunch. He turned on the HUD, and the system calmly listed the coordinates of the target, the state of the weapon, the wind speed.\nHe began to pray that something was wrong. At least then he can fly off. Unfortunately, everything works fine.\n"In the REGEN-E area, the enemy is expected to be transferred at the western entrance of the K valley and destroy all structures."\nHe saw the crowd as he swooped.\nNot soldiers. Not partisans.\nIt's a group of people. An old man, a child, a woman was washing clothes by the river, and a child was standing on a stone and waving at him.\nHe froze. Hand over the release key. The brain stops working.\nA reprimand came from the communication channel:\n"What are you waiting for? We don't want to take back the baby Madonna, the pilot, to carry out your orders. ”\nHe pressed it.\nHe pressed.\n________________________________________\n08:16\nIn the dust from the explosion, he saw the child's hand—and in that moment, he did.\nBut when I looked again, the child was gone. There was just a pile of charred and blackened coals.\nHe suddenly wondered if he had misremembered.\n"Perhaps...... The kid was somewhere else. ”\nBut a voice echoed coldly in his head: You killed him with your own hands.\n________________________________________\n13:00\nAfternoon. He returned to the base. The officer came over and patted him: "The task was done neatly, cleanly, precisely. ”\nThe corners of his mouth twitched, and he nodded.\nNo one mentioned the child. No one mentioned the woman.\nTheir names, he never known.\n________________________________________\n15:25\nHe sat outside the barracks, the sun falling on his knees. He suddenly remembered that his mother was a washerwoman when she was young, and that she knelt by the river to\nrub her clothes exactly like the woman this morning.\nHe covered his face with his palm. That's not self-blame. It was some kind of deeper fear.\n- What if he killed his own mother? Own children? Your own neighbors?\nBut he immediately retorted to himself: "But they are not." They are supporters behind enemy lines, potential threats, saboteurs of imperial security. ”\nHe took a deep breath.\nThen he saw a figure approaching, a girl in a red dress, with dark skin and no shoes on her feet. She walked slowly, step by step.\nHe slammed to his feet—nothing. The camp was empty.\nHis back was soaked with sweat.\n________________________________________\n18:46\nHe lay in bed, unable to sleep. Fingers grasp the fabric little by little on the side of the pillow.\nThere was a knock on the door. He got up and opened it, and there was no one outside the door.\nHe turned around, and there was a child sitting on the bed. Black hair, big eyes, gray all over, holding a broken ball in his hand.\nHe glared at the child. The kid stared at him too.\nTime stood still for a full twenty seconds.\nHe slammed the light on.\nNothing.\nNothing.\n________________________________________\n21:10\nHe wrote his last words in his diary:\n"We thought we were dropping bombs, but in fact we were bones."\nHe put down his pen and looked out the window at the starry sky.\nA meteor streaked by.\nHe instinctively prayed, "If there are gods, let me never see them again in my dreams." ”\nBut he knew that the god might have died in that village.\nOr maybe just lie on the edge of the blown up well, with your eyes still open, looking at him..."
 SWRW_AFG.7.a: "… Always look at him. "


 SWRW_AFG.1.t: "Please don't tell the truth"
 SWRW_AFG.1.desc: "Group 3 of the Russian Advisory Group in Afghanistan, Badakhshan, 25 December 1976\n"We're not here to win, we're just here to keep it burning."\n________________________________________\n6:12 a.m\nHe woke up in the camp room where the electric fan was buzzing, the dust on the floor, and the intermittent coughing sound coming from next door. He forgot who he was a\ncolonel and what class of outstanding graduates he was. All he remembered was dreaming last night that his wife was feeding soup to his son, who was five years old, but he\nhad never seen a real person.\nToday's mission is to assess the local Allied camp in the D-7 area, a semi-militia organization whose loyalty exists only until the check arrives. The order given to him\nby the headquarters was: "Encourage it to confront the German-backed Hazra faction, while ensuring that the threshold of intensification in the theater is not triggered." ”\nHe got into the jeep, the tires creaking on the gravel like bones running over the sand.\n________________________________________\n10:44 a.m\nThe mission arrived at the camp. The "commander" of the camp was a small Afghan leader in his twenties, wearing a Russian-made beret and his clothes were stained with oil.\nThe translator handed over a letter of funding from headquarters, and his eyes immediately lit up.\nThe colonel knew that the money was not enough to repair the old Soviet mortars, but he still encouraged the other party with a smirk: "We believe in your struggle. ”\nThe translator flipped through the pages. He didn't pull out the phrase "this is a meat grinder", nor did he pull out the fact that the colonel didn't say "you can live\nfor three months at most".\n________________________________________\n2:35 p.m\nThe advisory group inspected the barracks, ammunition depots and a small hospital. The taste inside made him gag: there was no anesthetic, only fire and wine and\nscreaming; There was no gauze, only shredded old newspapers. He saw a fourteen-year-old boy lying on a hospital bed, his belly wrapped in a strip of cloth held in place\nwith a rope, and the corners of his mouth foamed at the mouth.\nThe boy tried to raise his head and whispered something. The colonel looked down and listened, and the translator hesitated: "He said, you are from that ...... A place in\nparadise? ”\nThe colonel did not answer. He just turned around and walked out of the tent and threw up outside the door.\n________________________________________\n6:00 p.m\nOn the way back, their convoy was overturned by an improvised bomb, and the young non-commissioned officer sitting in the passenger seat died on the spot, with half of his\nface cut off. The radio in the car was blown up, and after briefly contacting HQ, I only got one response:\n"Record the coordinates and send a helicopter tomorrow morning to recover the body. You continue to follow the route. ”\nThe colonel sat next to the corpse, speechless all the way. He opened the briefcase, which contained the "Loyalty Assessment Report of Local Forces in Afghanistan" written\nby the Ministry of Foreign Affairs, with a five-level score, complete charts, and bright and eye-catching red and blue colors. He closed the papers, his face smiling for\nthe first time in more than a dozen days.\nIt was a world-weary sneer.\n________________________________________\n10:58 p.m\nThe advisory group returned to base. Dinner was cold canned and boiled carrots. The colonel washed his face and lay down. Wind and sand blew in through the broken window,\nand he didn't have the strength to close it.\nBefore the lights went out, he flipped out his communication log and recorded an audio report:\n"Group 3 has completed its mission. Camp D-7 is in a manageable state and is expected to maintain combat effectiveness for more than three months without significant\nexternal intervention. No anomalies. ”\nHe hesitated for a moment, and finally added:\n"Everything works."\nEnd of recording. He closed his eyes and dreamed that his son asked him, "Dad, who did you protect today?" ”"
 SWRW_AFG.1.a: "He woke up in his own silent breath, covered in mud and sand with answers."

 SWRW_AFG.2.t: "How long are we going to stay?"
 SWRW_AFG.2.desc: "Armed Forces of the Republic of Russia, 11th Infantry Brigade, 2nd Company, Paktia Front, Afghanistan, May 8, 1977\n________________________________________\n4:12 a.m\nThey woke up with a cough. The cold wind crept through the gaps in the sandbags, and the roof of the tent dripped with ice water that had melted last night. Private Andrei\nSherepin curled up in a blanket, staring at the rusty iron beams overhead. He doesn't remember how many days he's been in the sand, only that the last time HQ sent a\ncondolence package was last autumn — the cans inside were swollen.\n"How long are we going to stay?"\nHe whispered to his partner Nemtsov. The other party didn't answer, just wiped the frozen blood on the loader with a broken towel.\nHQ did not tell them whether they were still "on the front line" - because there was no rear here anymore.\n________________________________________\n10:20 a.m\nToday we will patrol in shifts to the southern section of Highway 7, a "death zone" that even the guerrillas do not want to approach. One team went missing there, and a\nweek later, their uniforms were nailed to the burned-out school bus.\nThe commander handed over a map with blurred ink circles on three possible IED burial areas in red pen, and then threw down the following sentence:\n"Be careful, or your mother won't even be able to receive the ashes."\nAndrei put on his helmet, grabbed his rifle, and followed the group in silence.\n________________________________________\n1:03 p.m\nThey found a landslide in the second area. Something was buried in the dirt, revealing a black sole. André approached cautiously and lifted the sand, revealing a shattered\ncorpse. It's not the Russian army, it's the remnants of some local armed soldier with an American first-aid kit on him.\n"Hell knows which side he is."\nNemtsov spat and moved on.\nAndrei stood for a moment, silently placing an empty kettle on the corpse's chest. He didn't know why he did it. Maybe it's just to let the people "over there" know that\nthere are still people alive here and what else can be done.\n________________________________________\n6:41 p.m\nOn their return to the camp, they were briefly ambushed - three of their companions were shot, one of whom was a new recruit who had just been transferred from Siberia for\nthree months. When Andrei knelt on the ground to bandage him, the boy kept staring at him, and the blood on his face made him tremble when he spoke:\n"Brother...... Does HQ know we're here? ”\nAndrei did not answer. He held down the artery, watched the blood come out of his fingers, and the words echoed in his heart over and over again: How long are we going to\nstay?\n________________________________________\n11:08 a.m\nThe camp was as quiet as a grave. The radio began to broadcast the dead propaganda tape again: "Every inch of Afghanistan is the front line of our defense of civilization\n" ”\nAndre was lying on the bed, but his mother's voice sounded in his head: "Remember to go home." ”\nHe took out the letter from under his pillow, which he could no longer read, read it again, and then lit it with a broken match.\nAs the ashes floated, he looked out at the rolling sand dunes in the distance. That's not the front line, it's not the mission location, it's not the honor front. "
 SWRW_AFG.2.a: "That's where the living bury themselves."

 SWRW_AFG.3.t: "We never promise tomorrow"
 SWRW_AFG.3.desc: "CIA Afghanistan Task Force, suburb of Herat, July 4, 1978\n________________________________________\n06:03 - Daily launch of the codename "Katrina".\nThe pump is broken. He washed his face with sand water again, and the dust on his face became thicker and thicker. The CIA's "Observation Outpost" is disguised as an aid\nmedical facility, with a façade painted in light blue of OFN-OAS, and two Pashto-speaking "doctors" standing at the door, both with M1911 hidden behind them.\nHe used a fake passport, a fake name, and a fake life. What his last name is, no one cares anymore. His mission designation is K-3/208/A, or "Katrina" for short, which is\nmore important than his name.\n________________________________________\n08:45 - meeting the "freedom fighters"\nWhat I want to meet today is the "asset" raised by the CIA itself - "Mohammad Lakim", the small leader of a local anti-Russian armed force. HQ demanded a new batch of\nammunition and communications equipment, as well as an exchange of "topographical information on the activities of Russian advisers."\nLakim was an hour late. He brought with him an icy plastic box containing the heads of two captured Russian soldiers. He also joked, "If you give me more ammo, I'll be\nable to save your whole face next time." ”\nHe smiled. K-3 did not.\nHe just nodded and said, "We'll think about it." ”\nHQ wants them to "keep the relationship" and not "scare away friends".\n________________________________________\n13:22 - Communication break logs 47th\nAt one point, HQ's encrypted radio station went missing for 42 minutes. He sat alone on the rooftop smoking a cigarette, looked over the sand net on the roof, and saw\nchildren playing with empty shells as building blocks in the distance.\nThey laughed as loudly as they did on the streets of California. But he knew that the fathers of these children were either rotting in the sand or were trained to die by\nthe kind of "Lakim".\nInstinctively, he held up his binoculars to see better, but when he saw one of the children wearing an old T-shirt with the "Pepsi-Cola" motif, he suddenly felt a wave of\nnausea.\n________________________________________\n17:10 - Operation "Wrap Up" fails\nHe was tasked with confirming the successful disposition of a "target" - a local liaison suspected of leaking secrets to the Russians. Local militants said they had "been\ndisposed of," but photos from the scene showed that the bodies did not match.\nHe tried to call the contact point in Kabul and was told: "HQ doesn't care about that line anymore and resources are tilting towards Kandahar." ”\nThis means that the person may still be alive, and he ...... will never know.\n________________________________________\n22:39 - log update and burndown\nHe turned on the small tape recorder he had brought with him. Press the record button. The voice is low and slow:\n"Mission No. K-3/208/A, day ninety-six. Failed to identify the target killed. Maintain cooperation with local armed forces, and there are no hostile incidents. It is\nproposed to postpone the distribution of the third batch of supplies, and Lakim's intentions are unknown. …… Task Execution Status: Normal. ”\nHe turned off the recording. He then pulled out several slips of paper from the file bag, containing identity information, intelligence sources, and financial movements.\nHe lit them with a lighter, threw them one by one into the old iron bucket, and watched the flames lick his life on the papers.\nHis life was like these documents – living in one-off messages, burned and no longer existing.\n________________________________________\n01:18 - monologue\nHe stared at the ceiling, unable to sleep. There will always be a classic sentence in the ears of HQ training:\n"We never promise tomorrow, we only honor today's order." "
 SWRW_AFG.3.a: "But now, he began to wonder if today was "order"? "




 SWRW_AFG.4.t: "From Tokyo to Herat"
 SWRW_AFG.4.desc: "Japanese Near East Dispatch Force, Herat, September 18, 1979\n________________________________________\nAt dawn, the blood-colored dawn\nFujita stood at the edge of the camp, staring at the dusky desert in the distance. The morning air was still heavy, with a strong smell of sand and dust, and he habitually\nraised his hand to cover the sun in front of him. The sky of Herat is vast, but the vast desert is always suffocating. He put down the telescope in his hand, and the\ncorners of his mouth curled slightly: "Maybe, this is my fate." ”\nSince the order was issued by Tokyo, Japan's Near East Dispatch Army has appeared like a ghost in this "imperial graveyard". Fujita does not deny that he did not come here\nfor the sake of "freedom" or "justice" – he was here to defend the interests of the empire, to hold the boundaries of power that had been eroded by Japan on a global\nscale. War, for Fujita, has long ceased to be a pan-Asianist romance, but a mechanized chess game.\n________________________________________\nAt 9:30 a.m., the tide of battle remained unshaken\n"Your task is to provide them with assistance and support their combat effectiveness." Fujita did not have a trace of expression on his face when he conveyed the\ninstructions of his superiors to his subordinates. The Japanese military's position is clear – to support pro-Japanese forces in Afghanistan and to ensure that the\nsituation here is not biased in favor of Russia or Western countries. However, the reality is more complex than any strategy.\nEvery time he interacts with the Afghan armed forces, Fujita feels an inexplicable sense of oppression. The eyes of the soldiers armed in these places were full of\nconfusion and anger. The land of Afghanistan will not easily accept foreign invaders, regardless of their appearance. In his interactions with these locals, Fujita sensed\ntheir fears and their dislike for Japan's history, the empire that invaded China and Southeast Asia.\nStill, he firmly believes, "This place has to be controlled by us." It was for the sake of the "greater future", for the sake of the Japanese Empire to which he was loyal.\n________________________________________\nAt 2:00 p.m., the atmosphere was heavy\nSoon after, Fujita received orders to lead his troops to a village south of Herat to provide support. Through intelligence, they learned that pro-Soviet forces in the\nregion were active and that tough measures had to be taken. However, this is not a simple battle.\nThere was a suffocating atmosphere in the village. Fujita and his men made their way through the crowd and into a humble dwelling. Inside, several ragged villagers bowed\ntheir heads and remained silent, their eyes uneasy. Fujita couldn't help but realize that the eyes of these villagers were full of fear of war, but more often than not, a\ndeep rejection of outside forces.\n"Our mission is not for the people here." Fujita whispered to the lieutenant accompanying him, "This is just so that Japan's influence will not be weakened." ”\nWhat he didn't say was: "After all, we are just pawns of the empire." ”\n________________________________________\n6:15 p.m., silence in the cold wind\nBack at camp, Fujita stood outside the tent and felt the cold wind from Herat blowing in the desert. This is a picture that has been repeated every day since he arrived in\nAfghanistan. Anxiety and tension during the day are accompanied by deep loneliness at night. Despite the hundreds of troops and colleagues around him, Fujita knew that\nthey all had the same sense of depression in their hearts - this was a war with no winners, and they were nothing more than a group of unchosen warriors trapped in this\ndesert.\nHe recalls his time in Tokyo, the glory and dreams of the past, the high spirits of the former Japanese Empire, and everything seems so hopeful. But now, he faces a land\nof death and despair, and every inch of Afghanistan is making him lose himself.\nFujita stood for a moment, then jerked around and walked into the depths of the camp.\nHe clearly knew that he, like all the soldiers on this battlefield, had long since left the so-called "glory" and entered a reality full of mud and blood. And all this,\nperhaps, can never be clearly explained, and it is impossible to really stop.\n________________________________________\n12:00 p.m., the struggle in my heart\nAs the night wore on, the lights in the camp were gradually extinguished. Fujita lay on a simple bed, his eyes fixed on the roof of the tent. Through the faint light, he\ncould see the crooked shadows—he knew there was no way back. It was not just for the sake of winning or losing the war, but also for the future of the Japanese Empire, or,\nfor the fate that he now had to face.\n"What is the point of my coming here?" Fujita asked silently in his heart.\nNo one answered him, and his heart slowly grew cold. Perhaps, this is the truth of war-"\nSWRW_AFG.4.a: "You never know what you're doing, but you can never stop."
 SWRW_AFG.5.t: "Like a ghost"
 SWRW_AFG.5.desc: "Co-Prosperity Sphere Observer Group in Afghanistan, Secret Service Unofficial Contact, Herat, 8 May 1980\n________________________________________\n8:10 a.m\nHe walked through the dust and sand of the streets and the orange morning light, not fast or slow. Beneath you is the scene of an explosion that was dealt with just\nyesterday. The secret service left no traces, only the conclusion: "Non-Chinese assets accidentally touched the misleading materials laid by the United States." ”\nHe wore a round hat and gray civilian clothes, and hid among merchants, clergy, and advisors. No one knows his name, only one code name: Hiyama No. 2. This is the name of\nTokyo, not Herat.\nHe walked into a teahouse. The landlord had already left a letter under the counter, the letter was written in Turkish, but the paper was the "silkworm white type"\ncharacteristic of East Asian paper mills. He didn't open the letter, just ordered a cup of black tea, drank it, and left.\n________________________________________\n11:47 a.m\nHe met with the nephew of a local pro-Japanese warlord at an abandoned French-style church on the outskirts of Herat.\n"We need your people to control that drain." Hiyama whispered, "It's not for irrigation, it's for the three villages on the map." ”\n"The Germans are also bidding." The nephew reminded him.\n"They're giving money." Hiyama smiled, "What we give is the future. The future of Greater East Asia. ”\nThe other party was silent for a moment, then nodded. The pledge he signed was sealed in a silver cigarette case and will be sent to Kabul tomorrow morning in a truck,\nwhere it will be returned to Tokyo in a diplomatic package.\nEverything was silent, but it was horribly clean.\n________________________________________\n3:20 p.m\nHiyama walks into the information room behind the Japanese "Cultural Support Center". It was dimly lit and filled with listening tapes and photographs. A young man brought\na new volume of recordings — a phone call between a U.S. military adviser and a Tajik commander in Mazar-i-Sharif, intermittent, but sufficient.\n"It is confirmed, the US side is ready to withdraw from the 6th contact point." The young man whispered.\nHiyama didn't answer. He stared at a line on the cassette case: "Sound doesn't necessarily say everything, silence is the dictionary of emotions." ”\nHe took out his pen and wrote on the intelligence receipt: Point B detection complete. Prepare to carry out local public opinion infiltration.\nHe added in his heart a sentence that no one heard: war does not need explosions, war is emotion.\n________________________________________\n6:05 p.m\nIt was getting dark, and the sunset light in the yellow sand was burning over Herat. He walked back to his lodgings, a small room that had been secretly converted behind\nan abandoned warehouse. A local kid squatted at the door and handed him a small folded note.\n"Who gave it to you?" He asked.\nThe child shakes his head.\nThe note had five letters written on it: "IZNNO". It is the code name for the "involuntary defector" in the old intelligence system of the Tokyo headquarters. Someone is\nselling out information - but their own people.\nHe sat down, didn't turn on the light, just stared at the note until it was dark.\n________________________________________\n11:11 p.m\nHe recorded a tape of the debriefing, and his voice was as calm as water:\n"The Herat Observation continues to advance. Abwehr tried to circumvent the joint agreement's intelligence-sharing mechanism for the third time this week, and U.S.\nadvisers had unclear intentions to retreat. The J-3 team may have leaked the secrets and is investigating. The psychological state remains stable. ”\nHe paused, looking at the old saber on the table.\nIt was left by my father - a relic of the old empire.\nHe whispered something that wasn't recorded on tape:\n"We're not ghosts anymore, but we haven't learned to be human yet."\n________________________________________\nHe closed the tape recorder, put his hat back on, and walked into the night. "
 SWRW_AFG.5.a: "The war continues, and he must continue to disguise."

 SWRW_AFG.6.t: "Thirteenth signature"
 SWRW_AFG.6.desc: "Advisory Mission of the Russian Federation in Afghanistan, Diary of Operations R-7 in the Theater of Operations, April 1, 1981\nLocation: Nangarhar Province, on the periphery of the buffer zone in southern Ghazni\n________________________________________\n2:06 a.m\nWhen he opened his eyes, he was still sitting at the aluminium war table, mud on his boots, dirt on his trouser legs, and his fingers still clutching the bitten pen.\nThe folder was spread out, and the red cover was printed with nine black letters: "Letter of Authorization for Chemical Cleanup Operations".\nHe had already signed a similar order twelve times.\nToday is the thirteenth time.\nBut he didn't put pen to paper for a long time.\nThe radio in the corner of the table was also broadcasting a headquarters briefing: "We must quickly weaken the armed will of the south and cut off its logistical contacts\nwith the German side." The tone was as smooth as the weather forecast.\nHe closed his eyes and saw only the video sent yesterday - the crowd at the entrance of the village, the guerrillas mixed with the refugees, the children lining up with\nempty pots to get water, and a woman holding the child screaming at the camera.\nShe speaks Pashto. But he understood.\nShe was scolding them, "Where is your God? ”\n________________________________________\n9:40 a.m\nThe airdrop is complete. The flight unit, codenamed "Igor", dropped four tanks of improved CL-34 gas. According to intelligence, more than 60 unarmed civilians were in the\ntargeted area with suspected guerrillas.\n"It's not very likely." The deputy consultant wrote in the report.\n"A necessary price." The chief of staff said from the side.\nHe stood in front of the remote monitoring platform, staring at the white mist wafting out, his palm pressed against the cold glass surface. The drone's picture begins to\nblur, with noise, flickering, and finally black and white.\nHe knew that there was no longer a sound of breathing.\n________________________________________\n1:22 p.m\nLunch was canned, dry cakes, and sugar water.\nHe didn't move.\n"Do you know what the U.S. military did in Kandahar?" One young consultant said, "We don't even do a hundredth of what they do." ”\nHe did not respond. Just put his hand in the pocket of his military coat and pinched the carbon paper—it had his signature on it, thirteenth.\nThe handwriting is more stable than the previous twelve.\nThat's what makes him sick the most.\n________________________________________\n6:04 p.m\nHQ issued a commendation: "The R-7 acted quickly and decisively, effectively deterring the local armed activity. It is recommended that the authority for asymmetric\noperations be continuously expanded. ”\nHe sat on the slope at the back of the camp, looking out at the valley in the distance, which had been labeled "neutral" by military intelligence. The wind blew from the\nmountain pass, with a faint sour smell. He didn't know if it was a real gas residue or a hallucination in his own nasal cavity.\n"You didn't do anything wrong." The adjutant said, "It was HQ who asked us to do this." ”\nHe suddenly asked, "Who is HQ?" ”\nThe adjutant was stunned.\n"Have you ever seen HQ's face? Do you know if HQ has a wife? Do they also dream of those charred bodies in the middle of the night? ”\nHe paused, and his voice was extremely soft:\n"I don't want to dream of that well anymore."\n________________________________________\n11:59 a.m\nHe finally returned to the tent and took out the carbon paper one by one, a copy of each order. Twelve are complete, and the thirteenth still bears fingerprints.\nHe began to burn them one by one.\nThe light of the fire reflected the tent like a tomb. He knelt on the sand, the last one unburned—"...... Authorized to immediately carry out the clean-up ......" The line\nstruggled in the fire, as if begging for mercy.\nHe finally cried.\nNot because of remorse.\nBecause he knew he would sign the fourteenth. "
 SWRW_AFG.6.a: "This is not the end. Just a record of the day. "

