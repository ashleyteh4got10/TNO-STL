 SWRW_GC_AFG_WAR: "Afghan War"
 AFG_WAR_war_desc_tt: "§WAfghanistan§F took advantage of the chaos following the §RWest Russian War§F in the late 1950s, when the former Soviet regions fell into complete turmoil, to seize parts of our republic §eTajikistan§F. The Tajik people and government have never ceased their calls for war against Afghanistan, especially after §m[RUS.GetName]§F unified the Russian region. These demands have grown increasingly insistent and impossible to ignore.\n[RUS.GetName] managed to delay this issue until after the war, but now the Tajik war against §WAfghanistan§F can no longer be postponed.\nEven though war is inevitable, [RUS.GetName] clearly cannot directly intervene in §WAfghanistan§F. Therefore, [RUS.GetName] is supporting the Tajik government against Afghanistan.\nTo minimize losses and maintain [RUS.GetName]'s national image, we must seize our opportunities. After demonstrating our strength to §WAfghanistan§F in the war, we can engage in §Mpeace negotiations§F to swiftly conclude the conflict.\nHowever, if [RUS.GetName] gains a significant advantage, we may present some §Vadditional demands§F....\n\n§VBut this may not necessarily be beneficial. Afghanistan is indeed a crucial step in our Central Asian strategy, and we hope to bring it into our sphere of influence. Yet directly annexing Afghanistan could lead to §qunforeseen§V consequences.§F"
 AFG_WAR_war_desc_afg_tt: "§WAfghanistan§F took advantage of the chaos following the §RWest Russian War§F in the late 1950s, when the former Soviet regions fell into complete turmoil, to seize parts of our republic §eTajikistan§F. The Tajik people and government have never ceased their calls for war against Afghanistan, especially after §m[RUS.GetName]§F unified the Russian region. These demands have grown increasingly insistent and impossible to ignore.\n[RUS.GetName] managed to delay this issue until after the war, but now the Tajik war against §WAfghanistan§F can no longer be postponed.\nEven though war is inevitable, [RUS.GetName] clearly cannot directly intervene in §WAfghanistan§F. Therefore, [RUS.GetName] is supporting the Tajik government against Afghanistan.\nIf [RUS.GetName] gains a significant advantage, we may present some §Vadditional demands§F....\n\n§VBut this may not necessarily be detrimental. Afghanistan is a key part of Russia's Central Asian strategy. While they also hope to bring Afghanistan into their sphere of influence, directly annexing it could lead to §qunforeseen§V consequences.§F"
