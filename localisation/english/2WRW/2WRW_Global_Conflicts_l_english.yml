SWRW_RUS.1.t:0 "Opening the Door of Opportunity"
SWRW_RUS.1.desc:0 "So many Russians have struggled in poverty their entire lives, yearning to improve their circumstances but lacking the resources to do so—there are far too many such people. To help them escape poverty, we must cultivate their specialized skills so they can find paid employment; otherwise, they will never afford training costs.\n\nThe solution is the Employment Corps—a new program operated by the Development and Reform Commission to provide free vocational training to young low-income individuals. By equipping them with skills to improve their socioeconomic status, we will enhance their quality of life.\n\nWith the establishment of the Employment Corps, we will show millions of Russia's poor a path out of the darkness of poverty. For those willing to walk it, a bright future awaits."
SWRW_RUS.1.a:0 "Dawn Breaks."

SWRW_RUS.2.t:0 "A Day in the Life of the Economic Minister"
SWRW_RUS.2.desc:0 "The Economic Minister of [RUS.GetName] is reviewing documents in his office as usual. A mountain of papers is being distributed as administrative orders. Soon, the final task of the morning arrives—a document personally drafted by the General Secretary, reflecting his deep commitment to Russia's economic policy: *Our Overall Economic Strategy*.\n\nHe squints, scrutinizing the text. His furrowed brow gradually relaxes, and he signs his name before [RUS.GetLeader]'s at the document's conclusion. With a long exhale, he savors his rare moment of leisure.\n\n...\n\nIn the cafeteria, the minister cheerfully produces a large bottle of cola. As the relaxing fizz of carbonation fills the air, he announces to his colleagues: 'Comrades, I declare our work has achieved a phased victory! And... we can resume normal vacations!' Cheers erupt immediately, even drawing a knowing smile from the usually stern old Artyom.\n\nAfter lunch, the Economic Minister strolls through the streets, observing the reconstructed commercial district where dilapidated buildings were demolished under urban planning. Half a month ago, this was flat vacant land—now, the framework of new buildings rises skyward. Their emerging nation, like this street, is still recovering from ruins but brimming with vitality. He thinks: 'Trucks deliver steel and concrete to construction sites, transforming into the city's bones and flesh. And those who labor tirelessly for this city...'"
SWRW_RUS.2.a:0 "'...are its very soul.'"

SWRW_RUS.3.t:0 "Preemptive Assessment"
SWRW_RUS.3.desc:0 "We have succeeded.\n\nSince the Russian heartland fell under Nazi occupation, its territory fragmented and its children turned against one another. Many believed Russia could never reunify. Yet now, we have unified most of Russia, reclaiming vast fragments of the Union. Everything seems to trend upward.\n\n'Frankly, while our current strength rivals most nations,' the Foreign Minister carefully weighs each word, trying to soften the gravity of his next statement, 'restoring the Soviet Union... given our present capabilities... poses significant difficulties.'\n\n[RUS.GetLeader] frowns: 'Explain.'\n\n'While we liberated Russian soil and purged traitors and Nazis, the world beyond has transformed. Our old adversary, Nazi Germany, survived the oil crisis. Though crippled, their military power grew substantially during our reunification. Their collaborators now infest every corner of Eurasia. Our enemy remains a transcontinental force of suffocating strength.'\n\n'Additionally, Japan to the east cannot be underestimated,' the Intelligence Minister adds. 'After our reunification, they increased troop deployments in the east, threatening our Far Eastern territories and launching new suppression campaigns against our compatriots there. Our current national strength cannot sustain a two-front war.'\n\n'Moreover, many neighboring nations and former republics view our reunification with hostility. They fear our return will strip their independence. Some regions are already under Nazi control, endangering our security.'\n\nAs [RUS.GetLeader] listens, his thoughts drift to domestic affairs. Though unified, Russia's governance challenges abound. Regional warlords established diverse regimes during fragmentation. While the Union crushed them, eradicating their remnants at every grassroots level remains arduous. Newly liberated lands lie in ruins, citizens endure hunger and cold, and national productivity lags behind pre-war levels. Though the leadership prepared for the worst in reunification, reality now outpaces plans.\n\n'Listen, comrades,' [RUS.GetLeader] addresses the assembled ministers. 'Our agenda must adapt. Retaking Moscow and other occupied zones will be postponed. We need time to recover, develop, and rebuild.' He turns to the Foreign Minister. 'Meanwhile, we must reconcile with America, garner global support, and expand our influence.'\n\n'Regardless, we have united the nation under one banner. If we act wisely, within years we will march on Moscow and make the Nazis pay in blood!'"
SWRW_RUS.3.a:0 "'The Red Banner will fly over Moscow again—someday.'"

SWRW_RUS.4.t:0 "Iron and Sweat"
SWRW_RUS.4.desc:0 "The train pulls into Kuybyshev. Through the window stretch ruins and shattered bridges. [ROOT.GetLeader] stands on the platform, surveying workers clearing debris and displaced masses. He murmurs:\n\n'This is not the city we want. We won’t mend the past—we’ll build a new future.'\n\nThus emerges the *Soviet Urban Development Plan*.\n\n'We won’t rebuild old districts—we’ll demolish them.' At Likachev’s urban planning meeting, red pens strike through pre-war blueprints. Cultural palaces and communal apartments replace them. The General Secretary points to the map’s center: 'Here will rise Western Russia’s largest Workers’ Square.'\n\n'A new city will rise from ruins.'\n\nThe Gorky Workers’ Housing Pilot launches. Central heating, public baths, free nurseries, cafeterias—working families gain true homes for the first time.\n\n'Is... this really for us?' Vasily stands frozen at his new apartment door.\n\nThe housing officer claps his shoulder: 'Of course. This is your home.'\n\n'The city finally belongs to us.'\n\nIrkutsk’s factory district opens, its metro linking directly to workshops—workers commute in twenty minutes. Kazan’s industrial park includes not just factories but clinics, cinemas, and sports fields. Workers are no longer machine appendages but masters of their lives.\n\n'A factory isn’t just a workplace—it’s a worker’s fortress and home.'\n\nYet construction faces hurdles.\n\n'We lack cement, steel, electricity.' The report’s scribbled text triggers a nationwide labor mobilization. Millions—workers, farmers, demobilized soldiers—flood construction sites, laboring day and night.\n\nIn Sverdlovsk, young engineers design heating systems through sleepless nights. Along the Volga, workers brave icy winds to erect bridges. All know they shape tomorrow.\n\nNew cities rise. At dawn, workers walk from apartments to factories. Mothers push strollers down tree-lined avenues to free nurseries. Radios broadcast victory songs; streets display success bulletins.\n\nOver Likachev Central Square, a red banner flutters:\n\n'Workers built this city—this city belongs to workers!'\n\n[ROOT.GetLeader] sits at his desk, gazing at this first city of the new world, eyes blazing."
SWRW_RUS.4.a:0 "'Even the longest journey...'"

SWRW_RUS.5.t:0 "Sowing Seeds of Knowledge"
SWRW_RUS.5.desc:0 "Morning light spills into a rural school near Likachev. The chalkboard reads: 'Soviet Victory and the People’s Future.' Elderly teacher Grigori Ivanovich taps the board, surveying his students—young faces brimming with hunger for knowledge. He clears his throat:\n\n'Children, you are New Russia’s future. You’ll no longer endure war or hunger. We pave your path to brightness.'\n\nHis voice echoes as workers and Red Army soldiers rebuild the war-torn land outside. Revolutionary flames once swept the earth, purging old rot—but building anew proves harder than burning.\n\nThe Central Education Committee recently enacted the *All-Russian Compulsory Education Reform Act*. Its core principle: Every child, whether of workers, peasants, or former bourgeoisie, deserves full education."
SWRW_RUS.5.a:0 "'Knowledge is a companion on every path.'"

SWRW_RUS.6.t:0 "New Social Security Act"
SWRW_RUS.6.desc:0 "The night remains cold, but lights burn ceaselessly in the Supreme Soviet. A marathon session drags on—air thick with cigarette ash and rustling papers. Exhausted members debate an issue determining millions of Russian lives: the All-Russian Social Security Program.\n\n'We won the war,' a gray-uniformed commissar rasps, rubbing bloodshot eyes, 'but what of our people? They have nothing left.'\n\nRevolutionary victory didn’t end suffering. Mother Russia groans; her children still struggle. Factories, fields, and rails lie destroyed. Millions of orphans wander streets. Wounded Red Army men starve in ruins. Aged mothers weep over children’s bones. The revolution promised a brighter future—now it must deliver.\n\nThis new social security program will be the Soviet state’s cornerstone.\n\nImplementation carries costs.\n\n'These programs require funds beyond our capacity!' The Finance Minister slams ledger pages, voice trembling with rage. 'The revolution just ended! Our treasury is empty! More burdens will collapse our economy!'\n\n[ROOT.GetLeader] listens silently, then places a factory production report on the table: 'We have resilient workers and brave soldiers—they can rebuild, but only if they survive.'\n\nThe program passes. To fund it, nationwide labor mobilization begins. Factories operate overtime; kulak properties are seized; wartime economic policies persist. Yet new homes, factories, and schools rise across the land.\n\nWhen the first workers, mothers, veterans, and orphans receive their benefits, they know this isn’t bourgeois charity—it’s their victory.\n\nKremlin lights finally dim. On the streets, workers gather before a freshly posted notice titled: *All-Russian Social Security Program*."
SWRW_RUS.6.a:0 "'For the People—Not Just the Revolution.'"

SWRW_RUS.7.t:0 "Military Expansion"
SWRW_RUS.7.desc:0 "A Day in the Barracks\nKuybyshev, Company Garrison.\nNew recruits answer the Union’s call.\n\n'I AM CAPTAIN VASILY! HERE TO TRAIN YOU! WE WESTERN WAR VETERANS ARE YOUR BEST BIG BROTHERS! ASK US ANYTHING—WE’LL ANSWER KINDLY! NOW—INTRODUCE YOURSELVES! STATE YOUR HOMETOWN AND NAME! STARTING WITH YOU!'\n\n'Sir! Likachev, Georgiy Mikha—'\n\n'TOO QUIET TO KILL NAZI SCUM! AGAIN!'\n\n'SIR! LIKACHEV CITY! GEORGIY MIKHAILOV!'\n\n'GOOD! NEXT!'\n\n'Gorky City! Moisey Petrov!'\n\n'GOOD! SPIRITED! NEXT!'\n\n'Vologda, Nikolai Ivanovich.'\n\n'CAN’T HEAR YOU! INVISIBLE! NO SOLDIER’S BEARING! AGAIN!'\n\n'Eyes front! No glancing around! IS THAT HOW YOU STAND AT ATTENTION?!'\n\n'IN THE ARMY, IF THE COMMANDER SAYS HE CAN’T HEAR—HE CAN’T HEAR! AGAIN!'"
SWRW_RUS.7.a:0 "'SIR! VOLOGDA! NIKOLAI! IVANOVICH!'"


