 SUR_add_uncategorised_law_tt: "§F[GetAssortedLawsSUR] will be added to our assorted laws.§!"
 SUR_remove_uncategorised_law_tt: "§F[GetAssortedLawsSUR] will be removed from our assorted laws.§!"
 
 SUR_get_law_tooltip: "[GetAssortedLawsDescSUR]"
 
 SUR_de_taalwet_law: "£GFX_SUR_de_taalwet_texticon  §uDe Taalwet§!"
 SUR_de_taalwet_law_desc: "§F£GFX_SUR_de_taalwet_texticon  §uDe Taalwet§! is a series of laws that aim to save the £GFX_SUR_netherlands_texticon  §ODutch§! language and culture from extinction. The government has renamed towns, rivers, and regions of §lSuriname§! and the §&Antillean§! islands to resemble patriotic £GFX_SUR_netherlands_texticon  §ODutch§! names, listed accepted names for newly born children, and standardized the language in spoken and written forms.\nOnly £GFX_SUR_belgium_luxemburg_texticon  §UBelgium-Luxemburg§! is exempt from these laws, being allowed to legislate freely and express linguistic autonomy.\n\nThe most controversial portion of the £GFX_SUR_de_taalwet_texticon  §uDe Taalwet§! is the £GFX_SUR_inlander_texticon  §ZInlander Code§!, which posits that anyone who doesn't meet cultural criteria becomes a de-facto second-rate citizen. Implemented by the Furstner government, the code was never abolished, despite vocal opposition, coming to encompass not just those already in §lSuriname§! before the establishment of the new regime but also any migrants moving to the country, making its continued existence more challenging to maintain by the day.§!"
 SUR_1947_constitutional_revision_law: "£GFX_SUR_1947_constitution_texticon  §P1947 Constitutional Revision§!"
 SUR_1947_constitutional_revision_law_desc: "§FWhen the exiled government of £GFX_SUR_netherlands_texticon  §OKingdoms of the Netherlands§! arrived in §lSuriname§!, it found that it was impossible to achieve stability in their new lands, resulting in the Rode Dinsdag. As a result, in 1947, £GFX_SUR_wilhelmina_texticon  §JWilhelmina§! stepped in and forced the implementation of new Constitutional Reforms that would bring back the institutions of the Kingdom that had been left behind in the §sOld World§! to make the £GFX_SUR_netherlands_texticon  §ONetherlands§! a nation for all its inhabitants, at least in theory.\n\nDrawing new electoral districts throughout §lSuriname§! whilst returning elections, the £GFX_SUR_1947_constitution_texticon  §P1947 Constitutional Revision§! would, on the surface, simply bring back the democracy that the £GFX_SUR_netherlands_texticon  §ODutch§! were already accustomed to while expanding it to all.\n\nHowever, as the years have gone by this revision has done very little of what it promised. £GFX_SUR_inlander_texticon  §ZInlander Code§! makes it impossible for many to participate in Democracy; alongside this, the rise of the £GFX_SUR_nvb_texticon  §gNVB§! as a dominating party has eroded institutions and the people's trust in the government, leaving many in the opposition to demand yet another Constitutional Revision.§!"
 SUR_princedom_of_belgium_luxemburg_law: "£GFX_SUR_belgium_luxemburg_texticon  §UAutonomous Kingdom of Belgium-Luxemburg§!"
 SUR_princedom_of_belgium_luxemburg_law_desc: "§FHaving lost all vestiges of their territory to the §oGermans§!, the £GFX_SUR_netherlands_texticon  §OKingdom of the Netherlands§! decided to negotiate with the remaining exiled governments of £GFX_SUR_belgium_texticon  §YBelgium§! and £GFX_SUR_luxemburg_texticon  §*Luxemburg§! to give them land to govern as a gesture of goodwill to their brethren.\n\nSigned into existence in 1949, the £GFX_SUR_belgium_luxemburg_texticon  §UAutonomous Kingdom of Belgium-Luxemburg§! was established in the land west of the Kopernaam river, renamed Westpolder.\n\nHaving experienced an economic miracle on their right, £GFX_SUR_belgium_luxemburg_texticon  §UBelgium-Luxemburg§! has become more than just a sidekick, proving to be an essential part of this new form of the £GFX_SUR_netherlands_texticon  §OKingdoms of the Netherlands§!.§!"
 SUR_dutch_social_corporatism_law: "§ODutch§! £GFX_SUR_factory_texticon  §XSocial Corporatism§!"
 SUR_dutch_social_corporatism_law_desc: "§FRebuilding its economy from scratch, the\n£GFX_SUR_netherlands_texticon  §ONetherlands§! embraced £GFX_SUR_corporatism_texticon  §.Corporatism§!, walking hand in hand with £GFX_SUR_unions_texticon  §VUnions§! and §gCompanies§ towards their shared goal of economic stability and sustained prosperity.\n\nHowever, not everyone agreed to the implementation of this £GFX_SUR_corporatism_texticon  §.Corporatism§!, with some preferring a §BTechnocratic§! or even §mLiberal§! approach to reclaiming the economic miracle of the 50s.\n\nThankfully for those who supported the current system, the nation would adopt neither. Instead, the country took on a much more £GFX_SUR_factory_texticon  §XSocialist§! direction, thanks to Vos and Hofstra's careful hand guiding hands, a system was created where the economy works for the people and not the other way round.§!"
 SUR_dutch_brazilian_friendship_treaty_law: "£GFX_SUR_netherlands_texticon  §ODutch§! §g-§! £GFX_SUR_brazil_texticon  §KBrazilian§! §EFriendship Treaty§!"
 SUR_dutch_brazilian_friendship_treaty_law_desc: "§FSigned in 1954 between then £GFX_SUR_netherlands_texticon  §ODutch§! Prime Minister Dirk Stikker and the £GFX_SUR_brazil_texticon  §KBrazilian§! President Eduardo Gomes, the §EGuyanas Cooperation and Development Treaty§! is the bedrock for modern relations between the two nations.\n\nWhile cooperation between the two began mainly around £GFX_SUR_netherlands_texticon  §ODutch§! investment in the £GFX_SUR_cayenne_texticon  §QCayenne Administration§!, as £GFX_SUR_brazil_texticon  §KBrazilian§! migration to the\n£GFX_SUR_netherlands_texticon  §ONetherlands§! grew, so did the closeness between the two countries, with military cooperation and joint development ventures becoming the new norm.§!"
 SUR_supremacy_of_the_navy_law: "§DStatus of the Armed Forces:§!\n£GFX_SUR_navy_texticon  §sNavy Supremacy§!"
 SUR_supremacy_of_the_navy_law_desc: "§FAfter being relegated to the §&Caribbean§!, the §bKoninklijke Landmacht§! was relegated to a rump force. And, with the formation of the §AOrganization of Free Nations§!, the force's pathetic corpse had its remaining economic hopes stamped out. As the §bKoninklijke Landmacht§! faced continuous neglect through the following years, its sibling, the\n£GFX_SUR_navy_texticon  §sKoninklijke Marine§!, prospered.\n\nWith the mighty £GFX_SUR_netherlands_texticon  §ODutch§! fleet being the largest in the §&Caribbean§!, the §gKorps Mariniers§! has become our nation's fighting force, ready to break the oceans to strike against any that threaten our country again while expanding the reach of our influence through more "hard" means.§!"