 SWRW_RUS_unification.1.t: "Mobilization"
 SWRW_RUS_unification.1.desc: " “...... The nascent central power will no longer be weak. We will destroy the Nazis in Germany, we will liberate all of Eastern Europe and restore the Motherland. "In the center of Samara, the commissar stands on a makeshift platform and speaks to the people on orders from his superiors. In addition to Russians, there are also refugees from Ukraine, Poland, and the Baltics, as well as Tatars, Kazakhs and other Central Asian nomads. The commissar could clearly feel the confusion and uneasiness of the audience, and everyone was eagerly waiting for his next sentence. n"First, we will return to Central Asia and restore order in the steppes, and then ......"n"The hegemony of ethnic Russians has long since ended, do you still want to turn Kazakhstan into a Russian colony, as Peter the Great did? A Kazakh man in the front row was agitated and scolded. The commissar was just smiling, but in fact the purpose of his trip was to unite the various ethnic groups that existed in the land of Samara against the Nazis. He turned to the makeshift map hanging on the wall behind him and calmly analyzed: "'The current Kazakhstan seems to be unified and stable, but in the south, the Turkic army supported by the German fascists is rising. The collapse of the former Soviet Union created a political vacuum in Central Asia, and the Nazis wanted to extend their claws further afield, and they have long coveted the regimes of Central Asian countries. Do you want your homeland to become a Nazi governor's palace like Poland? nThe whispers in the audience have weakened. "We will then negotiate with Japan to take back our legitimate rights and interests in Vladivostok. Our Kamchatka fleet dominates the waves, our guerrillas in Manchuria have begun to move, and Japan, which has just experienced an oil crisis, is too weak to refuse our offer. "It's all about our ultimate goal: westward expansion. The commissar pointed to the black area on the map, "Our relatives, our hometown, our comrades, who are still living under the iron heel of the Nazis." The rampant madness of German fascism today is nothing more than a foundation on our suffering, but it is a pity that the losers of the past have returned and returned with a military strength that is not what it used to be! The crowd applauded, no matter men, women and children, no matter what nationality they came from, no one was not boiling. So, a seed was planted in people's hearts:"
 SWRW_RUS_unification.1.a: "The motherland will be liberated."

