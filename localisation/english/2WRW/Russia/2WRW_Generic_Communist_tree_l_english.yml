 rus_democratic_soviet_land_forces_desc: "The [RUS.GetName] army could not go on in such a muddle. Our chain of command was bloated, and a dozen generals didn't even know the number of the troops under their command. It is necessary for us to carry out a radical reform of the Ministry of Defense, while at the same time leading our opponents in army equipment. \n\nOtherwise, we'll be beaten again."
