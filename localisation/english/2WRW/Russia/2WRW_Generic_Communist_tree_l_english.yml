 RUS_shukshin_invest_in_feniks:0 "Feed the Beast"
 RUS_shukshin_invest_in_feniks_desc:0 "After the outbreak of the war, the government and business agreed to put aside their political differences in order to consolidate the vast resources and economic wealth of the Commonwealth against the Great Germanic State. However, the war with the Germans was pushing our main producers of military products to the limit. The high demand for materials from the war has forced many factories to exceed capacity, leading them to formally request financial assistance from the government to expand existing factories to meet their needs. While many within the government are concerned about the potential consequences of such an action, it is clear that the government must currently support the military-industrial complex in order to unite against the interests of the empire."
