 rus_democratic_build_our_party: "Rebuild our party..."
 rus_democratic_build_our_party_desc: "After a great deal of debate and planning between the members of the §B Party§! and the president himself, there was a lot of debate and planning about how to achieve the \"§m pragmatic democracy\" they were pursuing. goals, the president and high-ranking officials of the party presented a concept to the State Duma aimed at answering how they can achieve these ambitious goals. nn§Y Federal Parliament§!nnThis is an ancient concept formulated in the early days of the Central Siberian Republic, which was reintroduced into the government, improved to better suit the needs of [RUS.GetName] and the goals of democratization of the country."
 rus_auth_build_our_party_desc: "After a great deal of debate and planning between the members of the §B Party§! and the president himself, there was a lot of debate and planning about how to achieve the \"§m pragmatic democracy\" they were pursuing. goals, the president and high-ranking officials of the party presented a concept to the State Duma aimed at answering how they can achieve these ambitious goals. nn§Y Federal Parliament§!nnThis is an ancient concept formulated in the early days of the Central Siberian Republic, which was reintroduced into the government, improved to better suit the needs of [RUS.GetName] and the goals of democratization of the country.\n\nHowever, we will not really put the people in power, and the new government will be elected by the 'National Assembly of the Unified Juche', and all of them will be ours."
