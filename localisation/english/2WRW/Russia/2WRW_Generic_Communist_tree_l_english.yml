 RUS_building_up_socialism: "building up Socialism"
 RUS_advance_plan_year_tt: "§YThe Ninth Five Year Plan§! Get the success. We will enter the next stage of historical development, According to §YThe Tenth Five Year Plan's §!Need to adjust the job"
 RUS_amur_highway_finished: "Has finished the §YAmur Highway§!."
