 rus_democratic_transport_modernization: "Modern transport network"
 rus_democratic_transport_modernization_desc: "As the saying goes: to get rich, build roads first. This statement is not without reason, and if we want to make our country rich, it is imperative to build a modern transportation network. We already have a ready-made Trans-Siberian Railway, but it is too old to take on the heavy responsibility. We need to build, develop, renovate on the basis of the original pitiful road and rail lines, we need to modernize!"
 rus_auth_transport_modernization_desc: "As the saying goes: to get rich, build roads first. This statement is not without reason, and if we want to make our country rich, it is imperative to build a modern transportation network. We already have a ready-made Trans-Siberian Railway, but it is too old to take on the heavy responsibility. We need to build, develop, renovate on the basis of the original pitiful road and rail lines, we need to modernize!"
