 rus_democratic_we_have_to_look_yourself: "...We have to united and ready."
 rus_democratic_we_have_to_look_yourself_desc: "Economic, political, diplomatic, military. These four were the central factors in our victory in the Second Western Russian War. In the next two years, we will expand our armaments and war, realize economic modernization, social normalization, military advancement, and diplomatic friendship. \n\nNext, it's time to get to work, comrades."
 rus_auth_we_have_to_look_yourself_desc: "Economic, political, diplomatic, military. These four were the central factors in our victory in the Second Western Russian War. In the next two years, we will expand our armaments and war, realize economic modernization, social normalization, military advancement, and diplomatic friendship. \nAnd those who oppose us will be severely punished by us. \n\nNext, it's time to get to work, comrades."
 rus_democratic_forward: "Towards Moscow!"
 rus_democratic_the_KGB: "Build the FGB"
 rus_democratic_the_KGB_desc: "The 'Cheka' of the Soviet period fully demonstrated the necessity of intelligence warfare. At the suggestion of Comrade Andropov, we will set up the Federal Security Service of Russia as our internal affairs agency, which will oversee all covert internal and external operations. And Andropov assured us that the KGB was absolutely loyal to the party and the state, and would become, like the Cheka, a sword for the defense of the country."
 rus_auth_the_KGB_desc: "The 'Cheka' of the Soviet period fully demonstrated the necessity of intelligence warfare. At the suggestion of Comrade Andropov, we will set up the Federal Security Service of Russia as our internal affairs agency, which will oversee all covert internal and external operations. And Andropov assured us that the KGB was absolutely loyal to the party and the state, and would become, like the Cheka, a sword for the defense of the country.\n\nAt least that's what he said......"
 rus_democratic_protect_the_nation: "Protect the nation"
 rus_democratic_protect_the_nation_desc: "$RUS_commie_protect_the_nation_desc$"
 rus_auth_protect_the_nation_desc: "Mobilize our people, inspire their patriotism, make them realize that they have to defend their homeland, make them realize that if we lose, everything will be irretrievable. Only when the whole of society is twisted into a rope, and only when the masses of the people spontaneously rise up in support of our great war, will it be possible for us to defeat Germany and we will be able to defend our alliance.\nWe will declare a national emergency. If they don't realize where they are, we're going to have to use guns.\n\nIf there is an opposition, then it proves that this group of people is not even afraid of our gendarmes, this is no longer ordinary citizens, I think they are all thugs!"
