 Espionage_NOV_Tech_0_Desc: "Aerial reconnaissance is expensive, prone to interception and requires hundreds of man-hours in planning. In contrast, pigeons come in flocks, blend with any environment and easily follow a trained handler's orders. A miniature camera with a timed delay, strapped onto a carrier pigeon with a flight path, will deliver overhead photographs of higher fidelity than any U2's - and at a fraction of its cost, to boot."
 Espionage_NOV_Tech_1_Desc: "A "belly buster" is an informal term for the Company's standard issue hand-powered drill. As the name suggests, the drill is operated by turning its crank while its bit is pressed firmly against a surface by the user's stomach. An experienced operator can bore holes onto wood and masonry by their lonesome, preparing the unsuspecting adjacent room for a listening device's rapt attention."
 Espionage_NOV_Tech_2_Desc: "Progress may introduce new methods and equipment to the age-old art of espionage, but equally old 'tricks of the light' still find use within a Company operative's repertoire. Taking the expression more literally are specially designed mirrors which unveil text and imagery when viewed at a certain angle. Such devices allow agents to access information stored without drawing eyes; the fair lady may just be inspecting her makeup, or the vain man his insufferable mug."
 Espionage_NOV_Tech_3_Desc: "There are more cigarettes sold each year than there have been humans alive. Excepting uncivilized backwaters, war-torn hellholes and no-smoking zones, any man would be forgiven for carrying a pack of Lucky Strikes on his pockets. Our agents exploit the benefit of the doubt by fitting a miniature camera into the pack. The cancer sticks themselves are put to better use as either barter good or bribe."
 Espionage_NOV_Tech_4_Desc: "A map, a compass and the Mk.1 Eyeball are all an agent needs to travel far, both literally and figuratively. But space is a luxury behind enemy lines; there a compass's metal bulk may mean the difference between relative health and malarial sickness. Small enough to fit a buttonhole, miniature compasses solve this dilemma handily."
 Espionage_NOV_Tech_5_Desc: "Operatives disguised as gentlemen of high breeding often encounter difficulties receiving instructions in social gatherings, where listeners are plentiful and suspicions easily raised. They shall look no further for remedies than radios specially designed to resemble a pipe cigar's narrow stem. These ingenious devices deliver sound vibrations from the mandible to the ear canal - hardly an act worth scrutinizing amidst the haze of song and dance."
 Espionage_NOV_Tech_6_Desc: "One man leaves behind his rubbish, and another comes to pick it up: this is the operating principle behind the dead man's drop, among the oldest techniques known to tradecraft. With the prevalence of film as a storage medium, modern spies now insert camera rolls into small, innocuous, waterproof spikes for their contacts to retrieve at an agreed-upon date and location."
 Espionage_NOV_Tech_7_Desc: "As the decades have proved, gentlemen do, in fact, read each other's mail. More than a few take the extra step and read each other's lips. The Company deflects nosy busybodies with suspiciously ample free time on their hands with ultrasonic motion sensors; should their invisible pulse catch intruders unaware, gentlemen will know to swap sensitive conversations with the most idling chatter."
 Espionage_NOV_Tech_8_Desc: "The CIA owes its extensive global reach in large part to native groups resisting Germany and Japan's pernicious grip. Such cooperation, however, entails frequent communication with contacts barely capable of speaking or writing English. To assist them in identifying enemy assets, our technicians have devised a contraption depicting vehicles' silhouettes adjacent to knob-adjustable numbers. Operators on the ground or on plane would then receive these counters' output as bursts of radio signal."
 Espionage_NOV_Tech_9_Desc: "For anyone else, it is a 1921 silver dollar, with Lady Liberty's smiling bust plastered on sheen 90% pure and an inch and half wide.\n\nFor the Company, it is a state secret bought a dollar per. Inflation, am I right?"

