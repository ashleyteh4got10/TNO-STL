 RUS_democratic_global_development_project: "全球发展计划"
 RUS_democratic_global_development_project_desc: "哪怕我们的国内市场再大，终有一天也会饱和。我们在之前的一系列举措已经让我国的工业在世界上占了一席之地，是时候放眼国外，让国内的工业潜能完全释放了。\n而目前最好的选择就是我们的势力圈内。中亚五国，西北，蒙古的工业几乎是一片空白，恰巧这里又没有什么人开发，现在是时候让我们释放他们的工业潜能了。"
 RUS_democratic_establishment_employment_working_group: "[ROOT.GetNameDef]就业计划"
 RUS_democratic_establishment_employment_working_group_desc: "有一个由来已久的悖论：找工作需要经验，而积累经验需要工作。年轻人最了解这种纠结，他们常常被迫从事没有自我提升空间的无意义工作。我们将组建一个机构，它将会向全国青年提供培训与工作经验。这不仅仅有助于青年劳动力未来的就业，也将为市场提供大量新的技术工人，从而有力促进地方经济增长。"
 RUS_democratic_integrate_industrial: "垂直整合工业体系"
 RUS_democratic_integrate_industrial_desc: "在前十年，俄罗斯大地上群雄逐鹿，每个国家都建立了一套自己的工业体系。在那时这种做法无疑是有效的，因为这让我们有了基本的工业能力。然而现在俄罗斯已经统一了，以前杂乱无章的工业就显得有些不好了。\n因此，我们将会拨一笔钱给发改委，让他们整合现有的工业体系，让工业系统充分运转。"
 RUS_democratic_invite_foreign_company: "邀请外资投资"
 RUS_democratic_invite_foreign_company_desc: "我们的市场在国外已经打响了名声。许多外资正等待着进入我们的市场，其中不乏一些像波音，IBM一类的行业巨头。我们应该邀请这些外国企业进驻我国，用他们的钱和技术扩充我国的工业实力。"
 RUS_democratic_what_do_you_do: "你对国家有什么贡献？"
 RUS_democratic_what_do_you_do_desc: "现在的祖国缺乏人力，而闲人最多的地方......就是监狱。犯人们不能再指望我们给他们提供生存保障了，他们要进行足额的劳动来换取保障。"
 RUS_democratic_give_money_to_servicer: "参军补贴"
 RUS_democratic_give_money_to_servicer_desc: "你想要养老金？养老金说到就到！你丢了工作？但你不会把房子也丢掉！你来开价，我们买单！把你的穷困、疲惫交给我，只要你来军队服役，我们会让它们消失不见！\n\n我们将会为参军的人员提供令人难以置信的慷慨福利，这一定会让我们的参军志愿大幅增加的。"
 RUS_democratic_expend_immigration: "扩大移民"
 RUS_democratic_expend_immigration_desc: "对比另外三个超级大国，俄罗斯的人和土地比起来实在是太少了。战争失败后，很多俄罗斯人移民到了国外，我们有理由相信他们仍然热爱着他们的祖国。\n\n我们将会为移民到俄罗斯来的人提供福利政策，希望这能让俄罗斯的土地得到开发吧。"
 RUS_democratic_women_in_army: "女性参军"
 RUS_democratic_women_in_army_desc: "我们面对的敌人拥有着大半个欧洲大陆。一旦战争爆发，他们的人力无穷无尽，新生的俄罗斯在人力上有着巨大劣势。然而，国内的女性却因为歧视而不能上阵。\n女性也应有参军的权利；雄兔脚扑朔，雌兔脚迷离。双兔傍地走，安能辨我是雄雌？"
 RUS_democratic_expend_supervision: "扩大监督"
 RUS_democratic_expend_supervision_desc: "我们在即将到来的战争中是打不到德国的本土的，这是无可置疑的。我们至多能拿下德国的所有东欧领地，而这些领地本就是我们的领土。当地居民正殷切的等待着我们解放他们，若是放任军队对平民施以暴行，那我们与德国人有什么区别？\n我们必须要扩大军队内的监督系统，让士兵们被称作'正义之师'，而非'俄罗斯的土匪'。"
 RUS_democratic_draft_it: "幸运之子"
 RUS_democratic_draft_it_desc: "纵使我们的战争急需人力，可让学生和人才上战场是不明智的。对于他们来说，在后方建设远远比在前方杀敌更能为国家贡献。我们应该扩大兵役豁免的范围，纵使军队不会满意。"
 RUS_democratic_invest_and_invest: "投资，投资，投资！"
 RUS_democratic_invest_and_invest_desc: "在税务改革暂时完成之后，我们发现拿到的钱远远比预想的要多得多。这些钱大部分都是从上层人群手中收的，这些钱如果放着不用，那就太可惜了，因此.....\n\n§G让我们向全国的各行各业投资，直到他们满意为止！"
 RUS_democratic_change_tax_law: "立法降低税率"
 RUS_democratic_change_tax_law_desc: "我们的税务改革进入到了最后一步。是时候改变我们的法律，让税收主要由富人承担了。收穷人的税只会让国家越来越穷，而收富人的税却能让资源合理的再分配。"
 RUS_democratic_looks_how_many_money_there_is: "看我找到了这么多闲钱"
 RUS_democratic_looks_how_many_money_there_is_desc: "我们外科手术式地专注于税务改革的一个好处是，大量预算实现了合理化——也许这不能让人们欢呼雀跃，但它足以影响我们的财政指标。毕竟，有钱永远不是坏事。"
 RUS_democratic_cut_tax_for_poors: "穷人的税应当减少"
 RUS_democratic_cut_tax_for_poors_desc: "穷人本来就没有钱，如果我们还想让他们交税，那他们只会变得更穷，从而更交不起税。因此，我们不仅不能对穷人加税，还要对穷人减税，从而让穷人变得富有，促进我国的经济发展。"
 RUS_democratic_get_tax_for_rich: "富人的税理应增加"
 RUS_democratic_get_tax_for_rich_desc: "自十七世纪以来，有钱的人总是在变得更有钱。他们试图用很多理由搪塞我们，但现在他们做不到了。我们将扩大对富人的征税，让政府拿到更多的钱，从而让这些钱更有效率的被利用。"
 RUS_democratic_tax_control: "税收困境"
 RUS_democratic_tax_control_desc: "我们现在的税收可以说非常奇怪。我们的税收让我们有钱，因为我们正无差别的征税。可这样的征税导致了我们的经济畸形。是时候对其做出大刀阔斧的改革，革除弊病了。"

