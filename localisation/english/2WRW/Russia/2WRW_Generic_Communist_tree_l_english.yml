RUS_democratic_global_development_project: "Global Development Plan"
RUS_democratic_global_development_project_desc: "Even our vast domestic market will eventually saturate. Our previous initiatives have already secured Russia's industrial foothold globally. Now we must look outward to fully unleash our industrial potential.\nThe optimal targets lie within our sphere: the Central Asian Five, Northwestern regions, and Mongolia—areas with untapped industrial potential awaiting development."
RUS_democratic_establishment_employment_working_group: "[ROOT.GetNameDef] Employment Initiative"
RUS_democratic_establishment_employment_working_group_desc: "A persistent paradox exists: jobs require experience, yet experience requires jobs. Youth understand this dilemma best, often trapped in dead-end positions. We'll establish an agency providing nationwide training and work experience. This will enhance youth employability while supplying skilled labor to boost local economies."
RUS_democratic_integrate_industrial: "Vertical Industrial Integration"
RUS_democratic_integrate_industrial_desc: "During Russia's fragmented past, each warlord-state built separate industrial systems. While effective then, this patchwork approach now hinders unified Russia. We'll allocate funds to the Development and Reform Commission to integrate these systems into a cohesive industrial machine."
RUS_democratic_invite_foreign_company: "Attract Foreign Investment"
RUS_democratic_invite_foreign_company_desc: "Our market's reputation now draws foreign capital. Giants like Boeing and IBM await entry. Inviting these firms will leverage their capital and technology to strengthen our industrial base."
RUS_democratic_what_do_you_do: "What Have You Contributed to the Nation?"
RUS_democratic_what_do_you_do_desc: "Our nation faces labor shortages while prisons overflow with idleness. Prisoners must earn their keep through productive labor rather than relying on state support."
RUS_democratic_give_money_to_servicer: "Military Service Benefits"
RUS_democratic_give_money_to_servicer_desc: "Want pensions? Immediate! Lost your job? Keep your home! Name your price—we'll pay! Surrender your poverty and weariness to us. Enlist, and watch them vanish!\n\nUnprecedented benefits will dramatically boost enlistment rates."
RUS_democratic_expend_immigration: "Expand Immigration"
RUS_democratic_expend_immigration_desc: "Compared to other superpowers, Russia's population density remains sparse. Post-war emigration drained our talent, but we believe patriotic Russians yearn to return. Welfare policies for immigrants will help develop Russia's vast lands."
RUS_democratic_women_in_army: "Women in Military Service"
RUS_democratic_women_in_army_desc: "Our enemies command continental Europe's manpower. Should war erupt, their endless reserves will overwhelm us. Yet domestic prejudice bars half our population from service.\nWomen deserve enlistment rights. 'The male rabbit kicks, the female blinks—but when both run together, who can tell their gender?'"
RUS_democratic_expend_supervision: "Expand Military Oversight"
RUS_democratic_expend_supervision_desc: "We cannot reach German soil in coming wars—at best liberating Eastern Europe. These lands await liberation. If our troops commit atrocities like the Germans, how are we different?\nEnhanced military supervision will ensure our soldiers remain the 'Army of Justice,' not 'Russian bandits.'"
RUS_democratic_draft_it: "Children of Fortune"
RUS_democratic_draft_it_desc: "Though desperate for manpower, sending students and intellectuals to battlefields is unwise. Their contributions through reconstruction outweigh frontline combat. We'll expand draft exemptions despite military dissatisfaction."
RUS_democratic_invest_and_invest: "Invest, Invest, Invest!"
RUS_democratic_invest_and_invest_desc: "Post-tax reforms revealed unexpected surpluses—mostly from the wealthy. Letting these funds idle would be criminal.\n\n§GLet's invest across all sectors until satisfaction is achieved!"
RUS_democratic_change_tax_law: "Legislate Tax Cuts"
RUS_democratic_change_tax_law_desc: "The final phase of tax reform demands legal restructuring. Wealth must bear the tax burden. Taxing the poor impoverishes nations—taxing the rich enables rational redistribution."
RUS_democratic_looks_how_many_money_there_is: "Look at All This Spare Cash"
RUS_democratic_looks_how_many_money_there_is_desc: "Surgical focus on tax reform revealed budget rationalizations. While not crowd-pleasing, these adjustments significantly impact fiscal metrics. After all, wealth is never unwelcome."
RUS_democratic_cut_tax_for_poors: "Reduce Taxes for the Poor"
RUS_democratic_cut_tax_for_poors_desc: "The poor lack means to pay taxes. Burdening them worsens poverty cycles. We must not only avoid taxing them but implement cuts to elevate their status and stimulate economic growth."
RUS_democratic_get_tax_for_rich: "Increase Taxes for the Wealthy"
RUS_democratic_get_tax_for_rich_desc: "Since the 17th century, the rich grow richer. Their excuses no longer suffice. Expanding wealth taxes will fund government priorities and efficient resource allocation."
RUS_democratic_tax_control: "Taxation Dilemma"
RUS_democratic_tax_control_desc: "Our current tax system is bizarre. While generating revenue through indiscriminate taxation, it distorts our economy. Drastic reforms must eliminate these malignancies."

