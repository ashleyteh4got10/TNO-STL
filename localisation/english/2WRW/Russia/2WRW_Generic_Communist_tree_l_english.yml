 rus_democratic_localized_accessories: "Localized foreign accessories"
 rus_democratic_localized_accessories_desc: "$RUS_commie_localized_accessories_desc$"
 rus_auth_localized_accessories_desc: "$RUS_commie_localized_accessories_desc$\n\n不过我们大可以直接买下工厂，毕竟没人想'离奇失踪'。"
 rus_democratic_industrial_centric_development: "Heavy Industry Development Plan"
 rus_democratic_industrial_centric_development_desc: "Heavy industry, among many complex industrial sectors, is notoriously high investment, long cycle and low return, and the huge cost is prohibitive for countless people who try to set foot in this field – not to mention that not many countries have the financial resources and capabilities to do so in the first place. \nBut we must develop heavy industry, without which there can be no industrial development in the country. A country without heavy industry can almost be said to have no war capability. \nHowever, we don't have to let the central government pay the sky-high costs (in fact, we don't have the ability to do so), and the local government can have some autonomy in the construction of heavy industry."
 rus_auth_industrial_centric_development_desc: "Heavy industry, among many complex industrial sectors, is notoriously high investment, long cycle and low return, and the huge cost is prohibitive for countless people who try to set foot in this field – not to mention that not many countries have the financial resources and capabilities to do so in the first place. \nBut we must develop heavy industry, without which there can be no industrial development in the country. A country without heavy industry can almost be said to have no war capability. \nBut we don't have to make the central government pay the sky-high costs (in fact, we don't have the ability to do so), we have guns in our hands, and if some people don't understand our good intentions, then we use guns to help them understand.\n\n§SMy power as president is unlimited!"
 rus_democratic_import_industrial_machinery: "Introduce exotic technologies"
 rus_democratic_import_industrial_machinery_desc: "$RUS_commie_import_industrial_machinery_desc$"
 rus_auth_import_industrial_machinery_desc: "'Can those stupid capitalists shut up the fuck? We've been patient for a long time, we've given them money, we've given them policies, we've given them resources, and now they want us to spend money on technology?' \n\n'But the president, they said that as long as this is done, they will take the initiative to give us profits! '\n\n'Oh, do it, fuck me down!' '"
 rus_democratic_the_problem_is_economy: "Our economy is in trouble"
 rus_democratic_the_problem_is_economy_desc: "$RUS_commie_the_problem_is_economy_desc$"
 rus_auth_the_problem_is_economy_desc: "$RUS_commie_the_problem_is_economy_desc$"
 rus_democratic_we_have_to_look_yourself_tt: "§WA series of national focuses will be unlocked to strengthen our nation!"
 rus_democratic_the_problem_is_economy_tt: "§WOur economic policies may have worked for us before, but now we have to be formal.\n§SThe Five-Year Plan Resolution Group will be unlocked!§!"
 rus_democratic_transport_modernization_tt: "We will modernize the Trans-Siberian Railway, and the GDP of the regions along the railway will increase significantly!"
 rus_democratic_the_final_attack_to_einheitspakt: "Forty years of fascist tyranny are finally over today"
 rus_democratic_the_final_attack_to_einheitspakt_desc: "Dear capital, \n\ngreat and strong, you are brave and invincible! \n\nDear capital, \n\nbeautiful and majestic, \n\nlet us sing for you!"
 rus_auth_the_final_attack_to_einheitspakt_desc: "$rus_democratic_the_final_attack_to_einheitspakt_desc$"
 RUS_the_final_attack_to_einheitspakt_desc: "$rus_democratic_the_final_attack_to_einheitspakt_desc$"
 RUS_forward_tt: "§VTowards§z Moscow!§F"
 RUS_our_situation_in_world: "Our situation on the world"
 RUS_our_situation_in_world_desc: "If we are to accomplish our final revenge, if we are to regain our dear homeland, if we want to reign again in the ancient city of Moscow in our lifetime, we must realize that it is impossible to defeat the mighty war machine of Germany alone. For the sake of the honor of our country, for the sake of dreams, for the happiness and well-being of the people of the world, we must use everything that can help us to weaken the power of the Germans. \n\n§V Take advantage of every opportunity available."
 RUS_international_trade: "International trade"
 RUS_international_trade_desc: "Nearly 10 years of horrific German bombardment after the West Russian War had turned almost all of Western Russia and Western Siberia into a wasteland – and the Far East and Central Siberia had been a desolate land since ancient times, and although Bukharin's Siberian plan had somewhat improved the situation, it was still inadequate. \nAlthough the warlords are not fools and have done their best to dig Russia into the ground to feed factories and machine tools, and although our wise leaders have developed scientific and effective industrial plans, our factories, our workshops, our assembly lines, our skilled workers, and our level of social development are still far from enough. Russia could not win the war against Germany with its pitiful resources, so foreign trade, strengthening itself, waiting for warplanes was the way to go. Without foreign aid, Russia's recovery and development will be far away. \nAt the same time, we believe that both the Americans, the Japanese, and even all those who have been devastated under their boots for forty years, will support our great war, and with these forces, Russia, with all its might, will become an indestructible, invincible, bridgehead against the Nazis!"
 RUS_africa_diplo: "Connecting the free nations of Africa"
 RUS_africa_diplo_desc: "Although Africa has been a land of poverty and chaos since the Age of Discovery, it is still necessary for us to do our best to win over our possible allies, and to use all possible favourable factors to achieve victory, and we know this very well. The free nations of Africa are our natural allies, although they are not many in number......"
 RUS_america_diplo: "Contact the United States"
 RUS_america_diplo_desc: "While the United States and ours may not share our ideologies, and many of us may not like the country, it is undeniable that the United States is one of the few shining lights in this dark world: it has one of the few navies in the world and an incomparably powerful industrial capacity. Of course, most importantly, it has always maintained an incomparable hatred for the Nazis. The elimination of the Nazi mongrels in Germany is one of our ultimate goals, and at the same time their long-cherished wish – more than enough to overshadow any contradictions that may exist between us and the United States.\nIf we want to win the war, we can't avoid reaching out to the United States and gaining their favor and support. The United States is hungry for revenge, Russia is hungry for revenge, and the peoples of the world are waiting for a general reckoning with the Nazis and fascists.\nAs long as we are united, that scene will never happen again, as long as we are united, nn§rNazi Germany§V will be swept into the dustbin of history!"
 RUS_OFN_training: "Establishment of the OFN-CSTO Liaison Office"
 RUS_OFN_training_desc: "We will carry out comprehensive cooperation with the OFN in the political, economic, military and other fields, which requires us to establish a strong and efficient full-time agency. It will take on the functions of linkage, planning, co-ordination, deployment, and so on. We will deepen trade with OFN, strengthen economic cooperation, and we will procure OFN's advanced technology, hire their military advisers, and learn their modern tactics and military technology. However, we have every reason to believe that OFN will also take the initiative to help us."
 RUS_connection_with_OFN: "Get in touch with the comrades of OFN"
 RUS_connection_with_OFN_desc: "We will carry out comprehensive cooperation with the OFN in terms of political and economic aspects, which requires us to establish a strong and efficient full-time agency. It will take on the functions of linkage, planning, co-ordination, deployment, and so on. We will procure the advanced technology of the OFN, hire their military advisers, learn their modern tactics and military technology. However, there is reason to believe that OFN will also actively assist us"
 RUS_OFN_supports: "OFN military assistance"
 RUS_OFN_supports_desc: "Huge boxes of equipment are being unloaded from planes and ships and into our weapons stockpiles, and the amount of OFN's assistance is staggering - you know, it's only a one-off time. It seems that the Americans have decided to support us in their entirety, and we naturally cannot disappoint them, and with these forces, we will have a solid foundation in future wars."
 RUS_europe_diplo: "'The New Order'"
 RUS_europe_diplo_desc: "Much of Europa has been poisoned by the Nazis for two generations, and the black, twisted toxin goes deep into the bone marrow. However, even the Einheitspakt was not monolithic, let alone Italy and Spain, which had always been at odds with Germany, and even the fascists could not tolerate the brutality of the Germans. Spain was merely passive resistance, and Italy even dared to openly confront German authority – fascism seemed to have become less hateful at this time in order to rid the Nazi poison that had entrenched itself in the West. Europe's independent nations probably dreamed that one day the boots would disappear, one day the nazi flag would burn into black smoke, and one day Europa's long-dead body would be brought back to life. \n\nWe have the same purpose as them: since the enemy of our enemies is our friends, we might as well sit down with them at the negotiating table and conspire with them."
 RUS_russia_vs_germany: "Our ways for NAZI"
 RUS_russia_vs_germany_desc: "At present, we are not able to take military action against the Nazis for the time being. But we can condemn them diplomatically and embargo them – even though they have embargoed us. \n\nAfter all, condemning the tyranny of the Einheitspakt is part of the lives of all countries in the world, and it will make our people more eager to look forward to war."
 RUS_asia_diplo: "Asia diplo"
 RUS_asia_diplo_desc: "We have unquestionable sovereignty over our Asian territory, but the Japanese took advantage of the collapse of the Soviet Union to steal Vladivostok, the Oriental pearl of our homeland, and the heavy cost of the Western Russian War made us completely lose control of Central Asia...... The body of the motherland is devastated, but history is still advancing, and we have every need and reason to take back our homeland. \nMore importantly, even the Japanese would love to see our war against Germany......"
 RUS_far_eastern_accords: "TO TOKYO"
 RUS_far_eastern_accords_desc: "At this stage, a direct conflict with Japan is absolutely undesirable, but Japan will also consider: Can it continue the Cold War with the United States while withstanding the wrath of a reborn Russia? Anyone with a discerning eye will give the answer: no way. Since conflict is an impossible option for us or Japan, the only option is to make some compromises to Japan and promise some benefits in exchange for Trans-Amur territory. If we can get back Transamur, our people will be greatly encouraged and the legitimacy of the government will be raised to a new level."
 RUS_the_western_war: "Conflict in the Northwest"
 RUS_the_western_war_desc: "The golden opportunity came - the remnants of the Kuomintang in northwestern China came into direct conflict with the Northwest Military Government established by the Japanese. If done properly, we can use this opportunity to deal a great blow to the Japanese in the northwest, further shake the foundation of the Co-Prosperity Sphere, and even use it as a springboard to support forces close to us...... However, we need such a code of conduct: hide yourself and do a good job of attacking, after all, Transamur is still in the hands of Japan"
 RUS_the_mongolia_war: "Comrades in Mongolia"
 RUS_the_mongolia_war_desc: "The so-called \"Mongolian and Xinjiang United Autonomous Government\", that is, the Mongolian puppet regime established by Japan, was the second springboard for Japan's aggression against China, and it was also the tool of this damned scum to force the old Soviet Union to allocate its few resources to the long frontier of the Far East, and it was one of the reasons why it lost the Great Patriotic War, and we can say that we hate it to the core. Now, we finally have the opportunity to remove this nail in the south of the motherland - the Mongolian Popular Front, composed of the remnants of the former Mongolian Communist Party, the Chinese Kuomintang, the democrats, and a small number of remnants of the Communist Party of the Soviet Union, is planning an uprising, and we will use this opportunity to overturn the reign of terror of the German king and restore justice to this plateau."
 RUS_south_america_diplo: "Diplomatic invitations to South America"
 RUS_south_america_diplo_desc: "The Second World War reshaped the whole world, and Germany, Japan and Italy pinched out the new order they wanted with their bloody dirty hands. However, South America seems to have been forgotten, and it has never been the scene of large-scale conflict in this era!\nAlthough compared to other turbulent parts of the world, South America is like a peaceful place of peace. But we must not forget that ideology is never isolated. The prevalence of fascism and Nazis in Europe and Asia has also affected South America...\nIt is necessary to keep abreast of the situation in South America, but we do not need to worry too much, after all, this is the backyard of the Americans, and the Americans will not tolerate another Nazi regime on their doorstep"
 RUS_the_final_attack_to_einheitspakt: "$rus_democratic_the_final_attack_to_einheitspakt$"
 RUS_pol_army: "Politicized army"
 RUS_pro_army: "Specialized army"
 RUS_OFN_TRAINING_IDEA: "§MThe OFN§WAi§Lds"
 RUS_our_situation_in_world_tt: "§e[RUS.GetName]§!§g is the hope of the people of the world§!§G's liberation§!§g. \n§gAfter dealing with the warlords in the country, we were finally able to engage in §m diplomacy as the only orthodox state in the land of §e Russia§g."
 RUS_international_trade_tt: "§Y Trade§g is the first step in bringing the nascent motherland into global convergence. \nThrough §m opening §g our trade policy, our overall strength has been somewhat enhanced."
 RUS_africa_diplo_tt: "The embers of §Q Einheitspakt §g still ravage the people in §Y Africa§g, and we need to help them and bring them into the global front of §a anti-fascist §g – even if it's just a flag-waving cry. \nOur relations with §Y Africa§g countries will be greatly improved§G!"
 RUS_america_diplo_tt: "§gIn that all-destroying §r war§g, the Lady of Liberty was unfortunately expelled from the Old World, however, now §M Lady Liberty §g is united and ready to launch a final general assault on §r fascist §g, so we need to establish close ties with §M and §g§g to build a global front against §a anti-fascist §g. \nOur relations with §Y North America§g countries will be greatly improved!"
 RUS_OFN_training_tt: "§g In more than forty years of resistance, §M comrades of the Free Nations Organization §g have grown up in the fight and have a unique experience. And §e we §g, as the main front line of §a anti-fascist §g front, need assistance from §MOFN §g."
 RUS_europe_diplo_tt: "§gThe Year is[GetYear],On Europa, the iron boot of §Q Einheitspakt §g is no longer heavy, and we must unite all the forces that can be united on Europa to destroy the Nazi stronghold.\nOur relations with §Y Europe §g independent countries will be greatly improved §G!"
 RUS_russia_vs_germany_tt: "§rGermany§RThe remnants of the sin must be destroyed!"
 RUS_asia_diplo_tt: "§V[JAP.GetFlag]Under the rising sun, the people of Asia are rising up, and we may not be able to help them for the time being, but one day they will succeed.\nOur relations with §m Asia §g countries will improve dramatically!"
 RUS_far_eastern_accords_tt: "§gVladivostok – one of the territories stolen by §V Japanese Army §G in 1953. Now that we§e have been united, it's time to make a diplomatic claim to §V Japan §g to retake our territory."
 RUS_south_america_diplo_tt: "§gSouth America – During the two world wars, it was almost unaffected. And most of them were members of the §a anti-fascist §g front. Improving relations with them is definitely not a bad choice.\nOur relations with §Y South America§g's independent countries will be greatly improved§G!"
 RUS_connection_with_OFN_tt: "The friends of §MOFN§g have been through many wars in the world. In the war, they proved that §M Lady Liberty §g has not stopped resisting. Contact with §MOFN§g will benefit our §G economy§g and the coming §r war§g."
 RUS_OFN_supports_tt: "Military aid from §MOFN§g arrived in waves. As it turned out, §M Lady Liberty §g was eagerly awaiting our final attack on the Germans."

 IRK_KGB_coup_in_west_china: "A coup d'état in the northwest China"
 IRK_KGB_coup_in_mongolia: "A coup d'état in Mongolia"
 KGB_coup_in_west_china_tt: "After the end of the Northwest War, Ma Jiajun actually announced an anti-communist policy, and we wanted to launch a coup d'état and bring our people to power."
 KGB_coup_in_mongolia_tt: "After the end of the Mongolia Wars,[MON.GetLeader]actually announced an anti-communist policy, we are going to stage a coup d'état and bring our people to power."
 IRK_KGB_GER_SGR_buff_regime_leaning_late: "Interference with German administration"
 IRK_KGB_GER_SGR_boost_reformers_late: "Aid to the German Resistance"
 IRK_KGB_GER_SGR_weaken_reactionaries_late: "Let the reactionaries bear the blame for Germany's economic woes"
 IRK_KGB_analyze_intelligence: "Intelligence analysis"
 IRK_KGB_fuck_opposition_party: "Hunt down the reactionaries"
 IRK_KGB_stable_it: "Defend the revolution"
 IRK_KGB_kill_the_corruption: "Strengthen the efficiency of government administration"


 rus_democratic_One_Once_More_new: "Russia Reborn!"
 rus_democratic_One_Once_More_new_desc: "$RUS_Freedom_desc$"
 RUS_our_real_situation: "$rus_democratic_our_real_situation$"
 RUS_our_real_situation_desc: "History reveals to us its essence: that humanity is destined to face a never-ending struggle. From the Atlantic to the Pacific, billions of people are still struggling to survive under unimaginable tyranny, and their situation is even a thousand times more miserable than that of the poorest Russians. Day after day, we earn a living under the clouds of destruction; Day after day, we can only hope that cool heads will take over the high ground, even in the most fanatical countries. At times like these, no matter how much effort we try, it seems insignificant. On the president's desk, [RUS.GetLeader] is contemplating the nature of this world, wondering if our efforts can light up the light in the infinite darkness, even if it is just a faint candle."
 RUS_build_our_party: "$rus_democratic_build_our_party$"
 RUS_build_our_party_desc: "The All-Union Communist Party (Bolsheviks), abbreviated as the Communist Party of the Soviet Union, was the advanced organized force of the Soviet proletariat and the highest form of its class organization. Lenin forged it in the flames of the revolution, and the conflict between Lyutin and Stalin split it again, and the Communist Party of the United States (CPR) was torn apart. Now that the Union has completed its reunification, it is time for the United Communist Party (CPB) to usher in real reunification! We have decided to rebuild the Party organizations in various localities, to write a new Party program, and to regenerate our proletarian vanguard! nnThe Party leads the proletariat, the working peasants and the entire working masses in the struggle for the consolidation of the dictatorship of the proletariat and the victory of socialism. The Party leads all the organs of the dictatorship of the proletariat and guarantees the smooth building of a socialist society. The Party is a unified fighting organization that combines proletarian, conscious, and iron discipline. The Party requires its members to work actively and selflessly for the realization of the Party programme and the Constitution, the implementation of the decisions of the Party and the Party organs, the guarantee of the unity of the Party ranks, and the consolidation of fraternal internationalist relations among the working people of the various nationalities of the Soviet Union and with the proletarians of the whole world."
 RUS_looking_the_moscow: "$rus_democratic_looking_the_moscow$"
 RUS_looking_the_moscow_desc: "Moscow - the capital of our Motherland. The city was destroyed at the hands of the Germans, burned, alienated. But we won't rest on our laurels. One day, we will retake Moscow and regain our homeland once again from the shame of the Second World War and the First Western Russian War."
 RUS_our_country_runs_well: "$rus_democratic_our_country_runs_well$"
 RUS_our_country_runs_well_desc: "The darkness never ends, but the light also endures. [RUS.GetName], the land of the free, the home of the warriors, a fertile land of endless opportunities. In this fertile land, everyone is free to pursue beauty in the name of the Russian dream. As long as our values are preserved, the light of freedom will always shine and the hope of freedom and justice will never be extinguished! We forge ahead to make the world a better place, even in the face of the darkest and most terrifying threat in history, and the conscience of humanity shines because of our struggle! [RUS.GetLeader] consoles ourselves that we can always hope that the Russian spirit will lead humanity to a better future."
 RUS_build_our_faction: "$rus_democratic_build_our_faction$"
 RUS_build_our_faction_desc: "As a new power, we are likely to emerge on the global stage in the future as another international power of the Cold War. Without further ado, we should create the CSTO and form our own sphere of influence.\n\n§xSome things should be done sooner rather than later.§!"
 RUS_prepare_our_army: "$rus_democratic_prepare_our_army$"
 RUS_prepare_our_army_desc: "Soldiers, listen up! Over the next two years, you will receive the most rigorous training, and we will provide you with the best equipment and the best logistics! And what you have to do is simple: train hard until our army moves west! Remember our slogan: 'For the sake of the Motherland, forward!' '"
 RUS_but_before_that: "$rus_democratic_but_before_that$"
 RUS_but_before_that_desc: "What else do we have?\n\nWe only have a ruined industry and agriculture, a dilapidated society, dilapidated military equipment, worrisome personnel quality, and a diplomatic environment surrounded by tigers and wolves. If we were to wage war against the damned Nazis in such a state, we would have no chance of winning.\n\nTherefore, we must improve the economic, political, diplomatic, and military conditions to lay the foundation for victory in future wars."
 RUS_commie_we_have_to_look_yourself: "$rus_democratic_we_have_to_look_yourself$"
 RUS_commie_we_have_to_look_yourself_desc: "Economic, political, diplomatic, military. These four were the central factors in our victory in the Second Western Russian War. In the next two years, we will expand our armaments and war, realize economic modernization, social normalization, military advancement, and diplomatic friendship.\n\nNext, it's time to get to work, comrades."
 RUS_forward: "$rus_democratic_forward$"
 RUS_forward_desc: "§MThe dawn of dawn shines everywhere,\n\nShine on the walls of the Kremlin\n\nThe boundless Soviet land\n\nWake up with the sun\n\nThe morning breeze was blowing, how cool\n\nThe streets and alleys are noisy\n\nGood morning, lovely city\n\nGood morning, heart of the Motherland!"
 RUS_the_KGB: "Build the KGB"
 RUS_the_KGB_desc: "The 'Cheka' of the Soviet period fully demonstrated the necessity of intelligence warfare. At the suggestion of Comrade Andropov, we will set up the KGB as our internal affairs agency to oversee all covert internal and external operations. And Andropov assured us that the KGB was absolutely loyal to the party and the state, and would become, like the Cheka, a sword for the defense of the country."
 RUS_commie_protect_the_nation: "Defend the Revolution!"
 RUS_commie_protect_the_nation_desc: "Mobilize our people, inspire their patriotism, make them realize that they have to defend their homeland, make them realize that if we lose, everything will be irretrievable. Only when the whole of society is twisted into a rope, and only when the masses of the people spontaneously rise up in support of our great war, will it be possible for us to defeat Germany and we will be able to defend our alliance.\nIt is important to note that the issue of women's rights in our country has been making slow progress, and now we will vigorously promote equal rights, which is also conducive to stimulating the patriotic enthusiasm of the majority of female compatriots."
 RUS_commie_patriotism_and_nationalism: "Soviet patriotism and nationalism"
 RUS_commie_patriotism_and_nationalism_desc: "It is indisputable that nationalism is the basis of the cohesion of the modern state. We will encourage patriotism, Great Russianism and nationalism, thus consolidating our rule and ensuring that future wars do not split into countless warlords like the last one."
 RUS_commie_extend_the_government: "$rus_democratic_extend_the_government$"
 RUS_commie_extend_the_government_desc: "After the reunification of Russia, the new social situation put new demands on us, the original executive branch was far from sufficient, and the multiplicity of official duties made our government personnel miserable - it was time to expand our government.\nHowever, we must not forget the experience of the past when we were a small warlord, when we first unified our region, when we won the war, when we received a territory almost the size of our own, and when we created a large number of redundant and unnecessary administrative structures that not only burdened the people, but also slowed down our efficiency and jeopardized our country, and we will not repeat the mistakes of the past."
 RUS_finish_social_reform: "$rus_democratic_finish_social_reform$"
 RUS_finish_social_reform_desc: "Our society has never been better! In [RUS.GetLeader], for the first time, our people had hope and experienced a real welfare system for the first time. In the school, the students are diligently studying knowledge, and the phased work of educational modernization has come to a perfect end.\nSocially, workers finally don't have to worry about their livelihoods, because our social security system allows workers to pay enough minimum wages to support a family of three. In hospitals, countless people receive government health insurance cards and enjoy medical security services similar to those in the United States.\n[RUS.GetName]'s society is thriving!"
 RUS_commie_we_dont_change: "$rus_democratic_we_dont_change$"
 RUS_commie_we_dont_change_desc: "Although our economic system cannot be perfect, and we may need to change at any time depending on the changing conditions of society, it is definitely not now. You must know that the economic system has always been a matter of affecting the whole body, and the turbulence of reform will inevitably affect our normal production for a period of time, and if society cannot adapt quickly, we will not be able to stabilize in the course of the confrontation with Germany, and the country cannot afford such consequences."
 RUS_commie_the_yagoda_economic: "$rus_democratic_the_yagoda_economic$"
 RUS_commie_the_yagoda_economic_desc: "Our [RUS.GetLeader] Comrade suddenly came up with a brilliant idea! We can take the socialist state's macroeconomic regulation and control as the basic economic plan, combine it with the market economy, let the market become the decisive factor in determining prices, and implement an economic system that combines the market economy with the planned economy! \nBy this way, we has the ability to specify macroeconomic policies and unite the whole country, and at the same time avoid the problem of the lag of the planned economy!"
 RUS_commie_the_socialized_economic: "Socialist socialized economy⋯⋯"
 RUS_commie_the_socialized_economic_desc: "Germany's Ludwig Erhard had a good idea, really,\nHis theory of the 'social market' reconciles class contradictions, protects free competition, limits monopolies, reduces excessively unfair distribution, and maximizes growth while ensuring that the country does not suffer from major chaos. We need to learn from the art of mastery in order to control the razor, and implement a similar economic system."
 RUS_commie_the_economic: "Union's Economic Policy"
 RUS_commie_the_economic_desc: "After partially solving some of the problems in our society, a stark question is before us: what should our economic system really be? Three factions have been formed within the NDRC on this issue.\nThe first is to maintain the stability of our policies. After all, we have only decided on the economic system a few years ago, and it may not be beneficial to change it hastily now.\nThe second is to combine socialist theory with the market economy and implement the 'New New Economic Policy', which advocates reform and opening up, the introduction of foreign capital, and the introduction of a system that combines marketization and planned economy to us.\nThe third is to study the German theory of the 'social market', learn from the mastery of the art to control the country, advocate a more radical liberalization policy, and eventually lead our economic system to corporatism.\n\nIn any case, it's up to you, [RUS.GetLeader]."
 RUS_commie_compulsory_education_program: "$rus_democratic_compulsory_education_program$"
 RUS_commie_compulsory_education_program_desc: "Education is the foundation of national rejuvenation and national prosperity. Even if the education situation of our generation is difficult to improve, we must lay the groundwork for future generations. Nowadays, the illiteracy rate in our country has always been high, which has directly led to the fact that the reform of our social, economic, and military systems has been resisted and not implemented. Workers don't know how to operate their machines, peasants don't know how to use tractors because they can't read instructions, and servicemen don't know how to service their guns because they're illiterate...... We need to implement compulsory education and literacy policies, both for ourselves and for our future generations."
 RUS_commie_the_sad_state_of_agriculture_in_our_country: "$rus_democratic_the_sad_state_of_agriculture_in_our_country$"
 RUS_commie_the_sad_state_of_agriculture_in_our_country_desc: "Our territory is vast, and agricultural production should have a unique advantage for us. However, since the beginning of the 20th century, a series of policies of Tsarist Russia and the Soviet Union, including the German invasion and the First West Russian War and years of warlord warfare, have made no progress in our agricultural production for 70 years. While there have been some improvements in the previous decade, there are still no major changes.\nIn order to win the hearts and minds of the people, but also to strengthen agriculture, we must increase the value of agricultural output in a short period of time, and this will cost us a lot of money...... But there will always be a way for the financial department."
 RUS_commie_social_security_policy: "New social security policy"
 RUS_commie_social_security_policy_desc: "It is useless to shout only patriotic slogans - the people will not approve of us because of empty words, if you want to really gain their support, the country must give them vital benefits. Social security is a powerful tool for us to win the support of the people, and we should make good use of this opportunity to enhance our legitimacy and truly bring the whole society together and fight for the country!"
 RUS_commie_the_social_need_help: "$rus_democratic_the_social_need_help$"
 RUS_commie_the_social_need_help_desc: "The land of Russia is ravaged, the people are displaced, the country is in turmoil, even if the motherland is reunited and there is a peaceful environment, we cannot immediately heal this great wound, we must take firm measures to help our people to renew themselves, first of all, starting with the social welfare system, we must make our people feel that the country is theirs and that the state will provide them with the best of what it can."
 RUS_commie_finish_army_modernization: "$rus_democratic_finish_army_modernization$"
 RUS_commie_finish_army_modernization_desc: "Since the crushing defeat in the war in West Russia, we have died down and prepared for future counteroffensives. In the first decade, we grew from a small warlord to Russian orthodoxy, during which time our army grew in battle and accumulated countless experiences. Now that all the free Russian regions are in our hands, the military reform we carried out a year ago has been completed: the Army has been refreshed, the Navy has not been left behind, the Air Force has been reborn, and it is time to look westward......"
 RUS_commie_naval_force_equipment_modernization: " Navy Modernization"
 RUS_commie_naval_force_equipment_modernization_desc: "The Navy is essential to protect our maritime interests. We have a long coastline, and the development of resources in the Arctic Ocean and control of strategic passages are of great importance for the future development of Russia. The presence of our Navy in the region ensures our effective control over territorial waters and the country's geopolitical interests. As an emerging force in the global navy, the modern Russian Navy is taking shape, and the strong pulse of innovation and development of the equipment system is not stopping, and it is surging towards the sea chart."
 RUS_commie_soviet_naval_forces: "Soviet Red Navy"
 RUS_commie_soviet_naval_forces_desc: "Once upon a time, the Soviet Red Navy was once a formidable presence in the world, and even the U.S. Navy, a sea power, had to give up three points, and all this came to naught with the disintegration of the Soviet Union in Bukharin. Now, with naval dockyards in Magadan, Kamchatka and Arkhangelsk at full capacity, with new ships launched almost every month, the new Russian Navy will be another maritime hegemon in the world."
 RUS_commie_air_force_equipment_modernization: "New Soviet Air Force"
 RUS_commie_air_force_equipment_modernization_desc: "Marshal Zhukov of the Revolutionary Front of Western Russia, summing up the experience gained during the Great Patriotic War, emphasized: "If a country is unable to counter the enemy's air strikes, then disaster will befall the country. "In the latter part of the Second World War, we were greatly shocked by the successful strategic bombing of the Soviet Union by German bomber groups. The good news is that our new air force has been built, and the German flies can no longer be in the Russian air."
 RUS_commie_soviet_air_forces: "Reorganization of the Soviet Air Force"
 RUS_commie_soviet_air_forces_desc: "Since the disastrous defeat in the West Russian War, the skies of Russia have been reduced to the playground of the Luftwaffe. Every day before the German Civil War, countless warplanes with swastika emblazoned on them took off from the Commissioner's precinct and turned into locusts, wantonly plundering the lives of the Russian people, leaving a wasteland in their wake. Today, we have risen from the ashes. We will rebuild the coalition air force and retake the skies of Mother Russia."
 RUS_commie_army_equipment_modernization: "The new army of the Union"
 RUS_commie_army_equipment_modernization_desc: "In the forties, fascist Germany tore up the Soviet-German Non-Aggression Pact and launched a surprise attack on the Soviet Union. Due to the fact that the Soviet Union underestimated the crisis of the war before the war, did not fully prepare for the battle, misestimated the balance of forces between the two sides, and failed in strategic guidance, the battle line collapsed for thousands of miles. Today, we have millions of soldiers on the border, and countless well-organized and well-equipped soldiers are at their posts, waiting for the final battle to come."
 RUS_commie_soviet_land_forces: "Soviet Armed Forces"
 RUS_commie_soviet_land_forces_desc: "Unlike the various armed forces that appeared in history, the Soviet armed forces were the people's armed forces, the guards of socialist communism. In 1917, the mentor Lenin led the workers' soviets to overthrow the Tsar, overthrow the bourgeois Provisional Government, and played a key role in the ensuing civil war in Soviet Russia. \nMore than 50 years later, with the help of the Soviet armed forces, the Union once again united Russia, demonstrating the incomparable superiority of the Soviet armed forces. Today, the militia and workers' pickets have been mobilized to defend the nascent Soviets."
 RUS_commie_advanced_training_project: "$rus_democratic_advanced_training_project$"
 RUS_commie_advanced_training_project_desc: "After the reunification of the new alliance, the people's enthusiasm for joining the army was high, and a large number of people with lofty ideals who longed for the reunification of the motherland and fought hard against the fascist bandits poured into the armed forces of the alliance. The old army training methods have exposed many problems, and they cannot be tolerated as a stumbling block to the liberation of our motherland. In the new period, there are new methods, and the reformers of the Quartermaster Department have formed a whole new set of training plans. After experimentation, the new program showed strong vitality.\nThe advanced training program can make up for all kinds of defects that have arisen in the past conscription and training, and is undoubtedly conducive to building an advanced, professional, and professional army."
 RUS_commie_specialized_army: "$rus_democratic_specialized_army$"
 RUS_commie_specialized_army_desc: "Russia's warlord melee is over, and the greatest enemy we face today is the pole of the world, the great Germanic states that dominate the continent. We now urgently need a professional army, and if we continue to fight on the disunited and unconcentrated armies of the past, as we did in the past, then the war in West Russia will inevitably be repeated.\nThe General Secretary has decreed that the new Red Army must be a highly specialized professional army. Experienced generals and soldiers with patriotic fervor have now been mobilized, and new operational requirements have been issued one after another. It is foreseeable that in the near future, the Red Army will become one of the most advanced military forces in the world, and this will undoubtedly guarantee the victory of the war for the liberation of our motherland."
 RUS_commie_extra_the_military: "$rus_democratic_extra_the_military$"
 RUS_commie_extra_the_military_desc: "The Motherland has a vast territory and abundant human resources, which has become more and more evident especially after the reunification of Russia. Increasingly, our armed forces believe that enriching our new coalition Red Army with the full use of all-Russian human resources will bring about a leap forward in our armed forces. After several meetings of the Central Military Commission, the resolution on expanding the armed forces has been put on the agenda.\nThe citizens of our Motherland, loyal and patriotic, have a deep and strong hatred for the enemy, mobilize them, let them enter the army, let the Nazis see the greatness of the Russian people."
 RUS_commie_the_professional_army: "$rus_democratic_the_professional_army$"
 RUS_commie_the_professional_army_desc: "The army needs to become an independent institution. It turns out that a politicized army is often weak in combat. Instead of further binding the army to the party, we should make the army independent, give them all kinds of guarantees, strengthen their discipline, let them know why they are fighting and how to fight, and not become a tool of politics."
 RUS_commie_the_politicized_army: "$rus_democratic_the_politicized_army$"
 RUS_commie_the_politicized_army_desc: "In any case, the independence of the army is very dangerous. After the disintegration of the Motherland, the armies loyal to the various ministries killed each other, so that [RUS.GetName] was met with obstacles.\nIn the past, although we also chose to make the military loyal to a certain person out of necessity, now we must make sure that this person is our party, or our country. And in doing so, we can also make our military organization more efficient.\n\nAfter all, although the former Soviet Union lost the Great Patriotic War, their commissars performed very well during the war."
 RUS_commie_the_army_need_better: "$rus_democratic_the_army_need_better$"
 RUS_commie_the_army_need_better_desc: "In that devastating war, the proud tank troops, artillery clusters, and air power of the former Soviet Union were reduced to scrap metal on the A-A line because of Yegorov's vanity. The ensuing battles with the reactionaries further weakened their armies until we united Russia and took over the ragged banner of the Red Army.\n\nSince then, [RUS.GetName] has undoubtedly reclaimed much of its former glory. [RUS.GetName] has regained its former position on the world stage, and we have more options in how to restore the Red Army's invincible majesty. We can't afford to be careless about this, the army of the Einheitspakt will not give us a respite, let alone show mercy to our men."
 RUS_commie_finish_the_economy: "$rus_democratic_finish_the_economy$"
 RUS_commie_finish_the_economy_desc: "The economic potential of our country has now been fully liberated! The establishment of the Unified Construction Consortium, the implementation of the Five-Year Plan and the modernization of the regulatory system have led to unprecedented growth in our GDP. Bukharin's Siberian plan has now been used to the maximum extent by my Government.\nIn the factories, the workers are working the assembly line, and on the farms, the farmers are working hard to lay the foundation for the victory of the liberation of the motherland. A new era for Russia has arrived!"
 RUS_workers_gowork: "$rus_democratic_workers_gowork$"
 RUS_workers_gowork_desc: "The embarrassing truth is that our workers are simply too inefficient. At present, the machines in many places are not even fully in production, and there is no tension among the workers. This state of affairs cannot be sustained any longer. We must learn from the 'war communism' system of the former Soviet Union, suffer the people first, and let our industrial potential be released to the maximum!\n\nBut after the war is over, should we restore the current welfare system?"
 RUS_commie_manning_the_factories: "$rus_democratic_manning_the_factories$"
 RUS_commie_manning_the_factories_desc: "Our factories are pitifully small compared to the Germans, so we must do our best not to miss every screw and steel bar on the production line, and we must keep our factories running at full speed, so that the guns and steel made in our country will continue to flow into the stock for need. Even if it comes at a cost......"
 RUS_commie_military_construction: "$rus_democratic_military_construction$"
 RUS_commie_military_construction_desc: "There is a sword and a shield first, and then there is a home and a country, this is an eternal truth. Not to mention the moment when war is imminent. Not only for the sake of recovering the homeland, but also for the sake of the Russian state, we must develop military-industrial capabilities. In the face of a strong enemy, a strong military industry is the foundation of our survival and victory."
 RUS_commie_the_resources_is_lot: "$rus_democratic_the_resources_is_lot$"
 RUS_commie_the_resources_is_lot_desc: "Even if we lose the vast Eastern European Plain, we still retain the land of Siberia. And in this vast land, countless resources are waiting for us to develop. For example, the vast oil and gas resources of the Tyumen region, once we get some news, it will not worry about buyers in the world. Fortunately, Siberia now has a large population, which is just enough to support our resource industry, after all, now, we have to extract the value of every bit of resources, not to mention that these resources actually have a great possibility of becoming the future industrial pillar of our country."
 RUS_commie_transport_modernization: "$rus_democratic_transport_modernization$"
 RUS_commie_transport_modernization_desc: "As the saying goes: to get rich, build roads first. This statement is not without reason, and if we want to make our country rich, it is imperative to build a modern transportation network. We already have a ready-made Trans-Siberian Railway, but it is too old to take on the heavy responsibility. We need to build, develop, renovate on the basis of the original pitiful road and rail lines, we need to modernize!"
 RUS_commie_urban_development_initiatives: "USSR Urban development initiatives"
 RUS_commie_urban_development_initiatives_desc: "After we unified Russia, local councils and individual city scholars came up with similar plans to develop and build other cities in Russia. While most of their proposals were rejected by the government due to the current state of the alliance, the authorities carefully adopted the core of their ideas.\n\nThese plans are mainly related to the development of infrastructure, and we want to make the transportation system within and between cities more convenient. Other projects adopted by the Consortium relate to the education system, and these programs aim to improve educational facilities and lay the foundation for the Alliance's future scientific careers."
 RUS_commie_localized_accessories: "$rus_democratic_localized_accessories$"
 RUS_commie_localized_accessories_desc: "Even if our allies can provide us with considerable support, it is better to have important technologies and core technologies in our own hands. In addition, it would save us money and allow us to use more resources and forces against Germany.\nOn the other hand, the Germans have already occupied Novaya Zemlya, and in the event of a war, the Arctic Ocean shipping lanes will most likely be completely blocked, and it is too inefficient to transport equipment from the Far East to the Russian front line by land, which also requires us to localize!"
 RUS_commie_industrial_centric_development: "$rus_democratic_industrial_centric_development$"
 RUS_commie_industrial_centric_development_desc: "Heavy industry, among many complex industrial sectors, is notoriously high investment, long cycle and low return, and the huge cost is prohibitive for countless people who try to set foot in this field – not to mention that not many countries have the financial resources and capabilities to do so in the first place. But we must develop heavy industry, without which there can be no industrial development in the country. A country without heavy industry can almost be said to have no war capability.\nHowever, we don't have to make the central government bear the sky-high costs (in fact, we don't have the ability to do so), and the local government can have a certain degree of autonomy in the construction of heavy industry."
 RUS_commie_import_industrial_machinery: "$rus_democratic_import_industrial_machinery$"
 RUS_commie_import_industrial_machinery_desc: "There is no good result in working behind closed doors, the new Russia does not have the ability to develop all the technologies it needs, and the introduction of advanced technologies from the OFN and the Co-Prosperity Sphere will do no harm, as long as it can help us fight the Nazis, we will take it all!"
 RUS_commie_the_problem_is_economy: "$rus_democratic_the_problem_is_economy$"
 RUS_commie_the_problem_is_economy_desc: "Years of conquest have dealt a devastating blow to Russia's economy, and in order for our economy to be strong enough to sustain our future wars, we must uproot the intertwined problems that hinder economic development. The root cause of the economic problems is that the people do not trust our nascent regime: weak industrial capacity, insufficient credibility of the currency, ineffective banks, etc., and we must address these problems."
 RUS_commie_we_have_to_look_yourself_tt: "$rus_democratic_we_have_to_look_yourself_tt$"
 RUS_commie_the_problem_is_economy_tt: "$rus_democratic_the_problem_is_economy_tt$"
 RUS_commie_transport_modernization_tt: "$rus_democratic_transport_modernization_tt$"


 RUS_five_year_plans: "§mThe [RUSGetPlanNumber] Five Year Plans"
 RUS_five_year_plans_desc: "\n\n\n\n\n\nBy §eour great party§! and [RUS.GetName]'s people, we rebuilt the [RUS.GetName],And §B the nation's foreign trade was liberated. Vladivostok will once again become a window of communication between [RUS.GetName] and the outside world, and will also be an important step in our liberation of the land occupied by §I revisionists. \n\nGuiding our new economic goals is the §VNDRC§!, which is made up of some of our best economists.However, there is a debate within the NDRC about the future economic model, with members close to Chairman [RUS.GetName] arguing that the future economic model of the alliance should establish a dualistic birdcage economic model while maintaining the institution, while supporters of the §C party faction under the leadership of §C opposition prefer a more orthodox economic model. Whichever model we choose, we need to restore socio-economic order while maintaining institutions. "
 RUS_plan_number_eight: "Eighth"
 RUS_plan_number_nine: "Ninth"
 RUS_plan_number_ten: "Tenth"

