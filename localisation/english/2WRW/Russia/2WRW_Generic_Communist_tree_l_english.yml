 Espionage_KGB: "KGB"
 Espionage_KGB_Desc: "The KGB was the newest intelligence unit of the Soviet Union, designed to safeguard the international interests of the Soviet Union in the Atlantic and Pacific Oceans."
 Espionage_KGB_Caps: "The 1st Main Directorate of KGB"
 Espionage_KGB_Short: "The 1st Main Directorate of KGB"
 Espionage_KGB_Fancy: "£GFX_counter_intelligence_IRK §MKGB§!"

 Espionage_Map_NA_Desc_SAM: "§M North America is the homeland of §m America and its neighbors, and is a veritable center of the free world."
 Espionage_Map_CA_Desc_SAM: "According to the purposes of §D the Monroe Doctrine, §m United States has the duty to protect §Y Central America from foreign aggression. But this argument is not convincing to the other countries in the shadow of §m USA§!, who are increasingly turning to the support of §gGermany§! or §e Japan§!. If §m America§! wants to maintain its supremacy in the New World, she must exert greater influence over it."
 Espionage_Map_SA_Desc_SAM: "§R South America is a melting pot of nations, so the interests of these countries do not always coincide with those of §m USA§!. In order to ensure the absolute influence of §m US in the region, all foreign powers must be brought to justice. If §gGermany§! or §e Japan§! intervene in §R South America§!, §m America§!, the thousand-mile embankment of the New World may be destroyed in the anthill."
 Espionage_Map_EU_Desc_SAM: "Europe is divided between §g Great Germania and its §g solidarity pact§!'s vassals, §G Italy§! and its former allies of §O Triumvirate§!, §R British Isles§!, and §M Scandinavian States§!. Europe was bleak under §g Germany§!, but the influence of §m We§! might overthrow the dictatorship of the Old World."
 Espionage_Map_RU_Desc_SAM: "The warlords of the former §G Russia have been united. We rise from the ashes and move towards a better future."
 Espionage_Map_AF_Desc_SAM: "§O Africa has been a colony for centuries, although that has changed. §gGermany§!, §GItaly§!, §Q, France§!, and §YSpain§!'s crumbling rule gave §m America§! an opportunity to influence the African continent."
 Espionage_Map_ME_Desc_SAM: "The Middle East is a melting pot of international politics, ranging from oil fields controlled by §G Italy to the superpowers' commercial interests in Saudi Arabia and Iran. Expanding the influence of §m USA§! in this world economic anchorage is crucial."
 Espionage_Map_EA_Desc_SAM: "The core territory of §e Japan§! is the brain of §e Empire of the Rising Sun§!, wielding outwardly the expanding synapses of §R Co-Prosperity Sphere§!, forming the nerve center of §m America§!'s greatest enemy of the Cold War. Regardless of whether the political bloc in §m America seeks confrontation or reconciliation with §G East Asia§! giants in the future, it is imperative to build a vast intelligence network in §e Japan and §B Republic of China§! in order to make better decisions."

