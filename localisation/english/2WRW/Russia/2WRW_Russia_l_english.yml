 SWRW_RUS.1.t:0 "Open the door to opportunity"
 SWRW_RUS.1.desc:0 "There are so many Russians who have struggled in poverty all their lives, eager to improve their situation, but lack the resources to make it happen – there are too many. If we are to help them out of poverty, we need to develop their skills so that they can find gainful employment, otherwise they will never be able to afford the cost of training.\n\nThe solution is: the Employment Task Force, a new program run by the National Development and Reform Commission (NDRC) that aims to provide free vocational training to young low-income people to improve their quality of life by equipping them with the skills they need to improve their socioeconomic status.\n\nWith the advent of the Employment Task Force, we will be able to show millions of poor people in Russia a path out of the darkness of poverty, and if they are willing to move forward, they can meet a bright future ahead."
 SWRW_RUS.1.a:0 "The light dawns."

 SWRW_RUS.2.t:0 "A day in the life of the Minister of Economy"
 SWRW_RUS.2.desc:0 "[RUS.GetName] Minister of Economy was in his office as usual to revise the papers, and as a mountain of papers was handed out as executive orders, the last work of the morning was quickly presented - this was drafted by the General Secretary himself, representing the great importance he attaches to Russia's economic policy: "Our General Principles of the Economy" He narrowed his eyes and carefully studied his frowning brow gradually unfolded, and then at the end of the document [RUS.GetLeader] signed his name in front of him, and he breathed a sigh of relief and enjoyed his rare leisure time.\n……\nIn the cafeteria, the minister took out a large bottle of Coke with a smile on his face, and with the relaxing sound of carbonated bubbles, he said to his colleagues: "Comrades, I announce to you that our work has been successfully completed in stages, and ...... We can go back to our normal vacation!" Suddenly, cheers abounded, and even the most serious old Artyom's face showed a knowing smile.\nAfter the meal, the Minister of Economy strolled through the streets and looked at the commercial street ahead that was being rebuilt after the demolition of dilapidated buildings in accordance with the city plan. Half a month ago, it was just a flat vacant lot, but now the frame of the building has risen from the ground. Their emerging country, like this street, is thriving, albeit in ruins. He thought: "Truckloads of reinforced concrete are sent to the construction site, turning into the bones and flesh of the city, and those who work hard for the city..."
 SWRW_RUS.2.a:0 "They are the soul of the city. ”"

 SWRW_RUS.3.t:0 "Pre-assessment"
 SWRW_RUS.3.desc:0 "We did it.\nSince the fall of the Russian land under the iron heel of the Nazis, the fragmentation of her land, and the fratricidal killing of her children, many people have come to believe that there is no possibility of reunification in Russia. Now, however, we have unified most of Russia, and most of the fragments of the alliance have been recovered by us, and everything seems to be moving in a good direction.\n"To be honest, although our strength is now comparable to the vast majority of countries in the world." The foreign minister scrutinized each sentence as much as he could, trying to make the rest of the sentence seem less heavy. "But as far as the restoration of the Soviet Union is concerned... With our current strength....it is indeed very difficult. ”\n[RUS.GetLeader] frowned:“Such of?”\n"By the time we were recovering Russia and purging the traitors and Nazis, the outside world had changed dramatically. Our old adversary, Nazi Germany, had survived the oil crisis, and although they were hit hard in this crisis, their military strength had also increased dramatically during the period of our unification of Russia, and their collaborators were all over Eurasia, so to speak, our enemies were still a suffocating force across continents. ”\n"In addition, our Japan in the East should not be underestimated." After the Minister of Foreign Affairs had finished speaking, the Minister of Intelligence continued. "After the unification of Russia, they have increased their presence in the East, which has created a new round of threats to our Far Eastern territories. And a new round of encirclement and suppression has been carried out against our compatriots in the Far East, and with our current national strength, we cannot withstand a two-front battle. ”\n"Moreover, many of our neighbours, as well as many of our former republics, have not welcomed our reunification, fearing that our return will result in the loss of their independence, and that some areas have even been taken over by the Nazis. threatens our security. ”\n[RUS.GetLeader] listened to these returns, and his thoughts drifted back home. Although Russia is unified, there are many domestic governance affairs. Although the coalition destroyed the different forms of political power established during the period of secession, it was not so easy to eliminate the remnants of these forces from all sides at the grassroots level. The newly liberated land was full of ruins, the people were hungry and cold, and the country's production capacity could not even catch up with that before the Soviet-German war. Although the entire leadership had prepared for the worst for the liberation of the country, when it came time to actually assess it, the plan was far from catching up with the changes.\n"Listen, guys." [RUS.GetLeader] looked at each of the ministers in attendance. "Our work plan will be changed, the recovery of occupied areas such as Moscow will no longer be carried out immediately, we will need some time to recover and develop, to rebuild our country." He turned to the Minister of Foreign Affairs. "In the meantime, we also need to reconcile with the United States, enlist the support of more powers in the world, and expand our influence"\n"In any case, we have united the whole country under one banner, and as long as we do it well, then I believe that in less than a few years, we will be able to fight back to Moscow and make the Nazis pay for it with blood!""
 SWRW_RUS.3.a:0 "One day, the red flag will come to Moscow again."

 SWRW_RUS.4.t:0 "Iron and sweat"
 SWRW_RUS.4.desc:0 "The train pulls into Kuibyshev, and the window is full of ruins and broken bridges. [ROOT.GetLeader] Standing on the platform, swept his gaze over the workers and displaced people cleaning up the rubble, and whispered: n"This is not the city we want. We will not mend the past, we will build a new future. ”\n- The "Urban Development Plan of the USSR" came into being.\n"We're not going to rebuild the old towns, we're going to demolish them." At Rykov's city planning conference, the old buildings were crossed out of the blueprints with a red pen and replaced by cultural palaces and collective apartments. The general secretary pointed to the center of the map: "Here, the largest workers' square in Western Russia will be built." ”  \n"We're not going to rebuild the old towns, we're going to demolish them." At Rykov's city planning conference, the old buildings were crossed out of the blueprints with a red pen and replaced by cultural palaces and collective apartments. The general secretary pointed to the center of the map: "Here, the largest workers' square in Western Russia will be built." "A new city will rise from the ruins."\nA pilot project in a workers' residential complex in the city of Gorky was launched. Central heating, public bathhouse, free nursery, canteen\nFor the first time, a working family has a home of their own.\n"Is this really for us to live in?" Standing in front of the door of the new apartment, Vasily asked, stunned for a while.\nThe distribution officer smiled and patted him on the shoulder: "Of course, this is your home. ”  \n"This is the first time the city has truly belonged to us."\nThe factory area in Irkutsk was launched, with direct access to the workshop by subway, and workers could reach their jobs in 20 minutes on foot.\nThe industrial park in Kazan has not only production workshops, but also canteens, clinics, cinemas, sports grounds, where workers are no longer vassals of machines, but masters of life.\n"A factory is not just a place for production, it is a fortress and home for workers."\nBut the road to construction was not smooth.\n"We lack cement, steel, electricity." The handwriting of the report is messy. The government immediately issued an "All-Russian Labor Mobilization Order", and millions of workers, peasants, and demobilized soldiers flocked to the construction site, working day and night.\nIn Sverdlov, young engineers worked all night designing heating systems; On the banks of the Volga, workers braved the cold wind to build bridges. Everyone knows that they are part of a project that will shape the future.\nThe first new cities sprung up.\nEarly in the morning, the workers walked out of their apartments and walked to the factory; The mother pushes the stroller and crosses the boulevard towards the free nursery. Songs of victory were broadcast on the radio, and reports of success were posted on the streets.\nOn Rykov's Central Square, a red banner was unfurled in the wind:  \n"The workers created the city, and the city will belong to the workers!"\n[ROOT.GetLeader] sat at his desk and looked at the first city of the new world, his eyes like a torch."
 SWRW_RUS.4.a:0 "Even if it's a long road."


 SWRW_RUS.5.t:0 "Sow the seeds of knowledge"
 SWRW_RUS.5.desc:0 "As the morning sun fell on an elementary school on the outskirts of Rykov, the blackboard was written in chalk with the theme of today's lesson: "The Victory of the Soviets and the Future of the People." Grigory Ivanovich, an elderly teacher, stood on the podium, tapped lightly on the blackboard, and looked into the immature but eager eyes of the classroom. He cleared his throat and said slowly: "Children, you are the future of the new Russia, you no longer have to endure war and hunger, we will pave a bright path for you." ”\nHis voice echoed through the classroom, while outside the window, hordes of workers and the Red Army were rebuilding the devastated land. The flames of revolution once swept across the land, and the decay of the old world was completely swept away, but the construction of the new world was far more difficult than the destruction.\nThe Central People's Commissariat of Education recently promulgated a far-reaching bill - the All-Russian Law on the Reform of Compulsory Education. At the heart of the bill is the idea that every child, whether they are workers, peasants, or former bourgeoisie, should have access to a complete education."
 SWRW_RUS.5.a:0 "Knowledge is a traveling companion on any path."

 SWRW_RUS.6.t:0 "New Social Security Law"
 SWRW_RUS.6.desc:0 "The night was still cold, but the lights of the Supreme Soviet remained unextinguished throughout the night. The hours-long meeting was still going on, and the smell of burnt cigarettes and the rustle of paper were in the air. Members of the Supreme Soviet sat around the conference table, wearily flipping through the documents before them, discussing an issue that would concern the lives and deaths of millions of Russians — the All-Russian Social Security Programme.\n"We won the war." A commissioner in a gray military uniform said tiredly, rubbing his bloodshot eyes, "But what about our people? They have nothing left. ”\nThe victory of the revolution does not mean the end of suffering. Mother Russia is moaning, and the Russian people are still struggling to survive. The war had destroyed factories, fields and railways, millions of orphans had lost loved ones roaming the streets, the disabled Red Army had endured hunger and cold in dilapidated houses, and elderly mothers wept over the bones of their children. The revolution promised a better future, and now, the future must deliver on its promises.\nThis newly adopted social security programme will be the first cornerstone of the new Soviet state.\n\nThe implementation of the new programme has not been without cost.\n"These projects require more money than we can afford!" The Minister of Finance spread out the ledger at the meeting, his voice trembling with anger, "We have just finished the revolution and the treasury is empty!" If we increase the financial burden, our economy will collapse."\nAfter listening in silence,[RUS.GetLeader] reached out and picked up a report on the factory's increase in production capacity, and gently placed it on the table: "We have the toughest workers, we have the bravest Red Army, and they can rebuild the country – but only if they survive." ”\nEventually, the plan was adopted. In order to prop up the social security system, the government announced nationwide labor mobilization, factories worked overtime, kulak property was expropriated, and the wartime emergency economic system was maintained. But at the same time, new housing, new factories, and new schools are springing up all over the country.\nWhen the first workers, mothers, veterans, and orphans received their own allowances, they knew that this was not a bourgeois handout, but a victory for themselves.\nAt night, the Kremlin lights finally went out, and in the streets, workers gathered in front of a new bulletin that had just been posted, silently reading its headline:\nNew All-Russian Social Security Programme\n"
 SWRW_RUS.6.a:0 "- For the people, not just for the revolution."

 SWRW_RUS.7.t:0 "Expand the army"
 SWRW_RUS.7.desc:0 "Barracks for a day,\nKuibyshev, where a certain company was stationed.\nA new batch of young men answered the call of the alliance to join the army.\n"I am! Captain Vasily! I'm here to train you! We, veterans of the Western Russian War, are the best of you! Big brother! If you have anything you don't understand, you can ask us, and we will tell you kindly! Now, please introduce yourself! Each person brings their own name and introduction! Start with you! ”\n"Yes! Rykov, George M.I..."\n"I want to the Nazi scum so quietly! Do it all over again! ”\n"Yes! Rykov City! Georgy Mikhailov! ”\n"Good! Next"\n"Gorky! Moisei Petrov! ”\n"Good! Very energetic! Next! ”\n"Vologda, Nikolai Ivanovich."\n"I can't hear clearly! Can't hear at all! It's too quiet! There is no Union military look! Do it all over again! ”\n"What?! Didn't you hear?! ”\n"Don't look away! Don't look around! Are you in an upright position?! ”\n"In the barracks, the company command said that it could not be heard, that is, it could not be heard! Do it all over again! ”"
 SWRW_RUS.7.a:0 ""Vologda! Nikolai! Ivanovic! ”"