l_english:
 ### POST UNIFICATION TREE ###
 OMS_the_black_league_victorious:0 "The Black League, Victorious"
 OMS_the_black_league_victorious_desc:0 "Since the days of Comrade Karbyshev, the £GFX_OMS_black_league_texticon §sBlack League§! has had but one purpose: the salvation of Russia through enduring the £GFX_OMS_great_trial_texticon §xGreat Trial§!. But this could never be accomplished while the Russian people live in squalor as a fractured nation, lost to the whims of petty bandits and warlords. Today, the first step to mending decades of destruction and violence wrought by the £GFX_OMS_teutons_texticon §qGerman Reich§! has been taken; Russia is united as one once more.\n\n£GFX_OMS_dmitry_yazov_texticon §YGlavkoverkh Yazov§! will waste no time in shaping the very soul of Russia into a force for righteous retribution against the £GFX_OMS_teutons_texticon §qGermanic Hordes§!. The people must be taught to honor the Three Theses and hate the £GFX_OMS_teutons_texticon §qHun§! that has stolen their Motherland. They must be devoted to the £GFX_OMS_great_trial_texticon §xGreat Trial§! in body, mind, and soul. Our vengeance is in sight. Now is only the final days of preparation."
 
 OMS_black_boots_march_over_the_east:0 "Black Boots March Over the East"
 OMS_black_boots_march_over_the_east_desc:0 "When we returned to Siberia, we were under no false pretenses of expecting a warm welcome.  We fought from house to house and from field to field for the future of our nation, toppling the Eastern regime. But our triumph over the Siberian government has proven to be merely half the battle. Small insurgencies have already declared their defiance to the £GFX_OMS_black_league_texticon §sReclamation Government§!, becoming pawns in the £GFX_OMS_teutons_texticon §qGerman§!'s game by fracturing our people. They must be taught the error of their ways, by force if necessary.\n\nCommissars will pour throughout the countryside, into the East. They will cleanse the tundra of the rot and disease that has festered for decades until there is no remnant of the past or its failures within the vastness of Siberia."
 
 OMS_teach_the_people_hate:0 "Teach the People Hate"
 OMS_teach_the_people_hate_desc:0 "The common Russian has been lost, adrift in a sea of loss and torment for untold years. Some have known nothing but this life, many are resigned to their fate as part of a forever broken nation that can never reclaim its past glory. They have no sense of how much has been stolen from them by the Hun. If the £GFX_OMS_black_league_texticon §sBlack League§! is to be victorious in the £GFX_OMS_great_trial_texticon §xGreat Trial§!, we must change the consciousness of the whole of Russia away from such fatalism.\n\nThe people must know the true breadth of the pain they endure. They must learn how the £GFX_OMS_teutons_texticon §qGerman§! has stolen their lives, their future, and their history. They must anguish over their Motherland's suffering, and emerge from their despair with a hardened heart and iron will to enact vengeance. The people will know their enemy, and hate him with the fury of hell."
 
 OMS_give_them_the_tools_they_need:0 "Give Them the Tools They Need"
 OMS_give_them_the_tools_they_need_desc:0 "The Motherland and its people have no shortage of willpower. As a nation, every man, woman, and child has faced countless atrocities and injustices. Russia is prepared to fight tooth and nail against the £GFX_OMS_teutons_texticon §qHun§!, though our valiant nation lacks one thing: material.\n\nWe will provide the people with opportunities, in labor, in arms, and in production, to contribute to the war effort before it's even begun. We will begin massive infrastructure projects and construct factories across our land, we will give purpose to all from the youth to the veteran soldier, and we will prepare Russia for the £GFX_OMS_great_trial_texticon §xGreat Trial§! with enough industry and equipment to shatter the Reichsadler hundreds of times over."
 
 OMS_everything_against_the_germans:0 "Everything Against the Germans"
 OMS_everything_against_the_germans_desc:0 "The £GFX_OMS_great_trial_texticon §xGreat Trial§! will no doubt be a costly endeavor. The wars to reunify the Motherland took enough of a toll to begin with, even when opposed by cowardly traitors and treacherous revolutionary scum. Now, we face a greater evil than any other that has ever soiled the earth's surface– one equipped with the means to wipe Russia's people from the face of the earth, and possessing intent to do so accordingly.\n\nThe fight will be strenuous and brutal, so we must utilize all of our Motherland in the war effort. Every chunk of ore, every piece of timber, every drop of petroleum must be sacrificed in the name of victory. We must use everything in Russia's arsenal for our righteous war against the £GFX_OMS_teutons_texticon §qReich§!. From the Urals to the Pacific we must exhaust every deposit, bullet and soul in our crusade against the £GFX_OMS_teutons_texticon §qNational Socialist Menace§!."
 
 OMS_controlling_the_masses:0 "Controlling the Masses"
 OMS_controlling_the_masses_desc:0 "One of the key contributing factors to the defeat of the Bukharinist Union was its inability to exercise total control of information over its citizens. Foreign propaganda materials and other agents of degeneration sneaked through our sacred borders despite repeated attempts to end the black market.\n\n£GFX_OMS_dmitry_yazov_texticon §YMarshal Yazov§! and his loyal followers will make sure this mistake is not repeated. Every border pass and checkpoint shall disregard 'privacy', and all but official radios and television channels will be brought down. Such things cannot be afforded until Russia is safe from monstrous £GFX_OMS_teutons_texticon §qTeutons§!!"
 
 OMS_enhanced_interrogation_techniques:0 "Enhanced Interrogation Techniques"
 OMS_enhanced_interrogation_techniques_desc:0 "Though we are no Bolsheviks, Trotsky once made an excellent point;\n\n"If the end is just, so too are the means."\n\nThe £GFX_OMS_teutons_texticon §qGermans§!, inhuman scum, must be seen for what they are- a source of little more than hatred and information. There collaborators and assistants should be treated no differently.\n\nThe floors of our interrogation rooms will be littered with blood, teeth, toenails, and inhuman and human colors the eyes should not know. We will write volumes from the information we secret from the broken souls left behind from our £GFX_OMS_great_trial_texticon §xRighteous crusade§!, and know the location of every building in the £GFX_OMS_teutons_texticon §qReich§!, as with their technology. Nothing will be safe from our eyes, and no man will be safe from our just wrath. Let our opponents cower."
 
 OMS_bolster_the_secret_police:0 "Bolster the Internal Security Directorate"
 OMS_bolster_the_secret_police_desc:0 "When £GFX_OMS_black_league_texticon §sOmsk§! was a mere statelet in the backwaters of Western Siberia, the use of secret police to maintain our rule was necessary to ensure our goals were met with minimal resistance. As the shadow of the £GFX_OMS_black_league_texticon §sBlack League§! has grown to engulf all of Russia, this has remained a fact.\n\nHowever, as the new wardens of Russia, we can no longer act as if we are still a singular city and the surrounding tundra. The secret police will be doubled in size, as to properly oversee our newly-reclaimed territories. Our security apparatus must be next to none, for the enemies of the £GFX_OMS_great_trial_texticon §xGreat Trial§! are many and we are few."
 
 OMS_a_loyal_populace:0 "A Loyal Populace"
 OMS_a_loyal_populace_desc:0 "Oh, woe be the lot of those poor Russians who were divided for so long. Kept under the thumb of weak, foolish men, our countrymen may find themselves confused by their new governments. Many have lodged complaints or queries, asking what the £GFX_OMS_great_trial_texticon §xGreat Trial§! is and why our new Russian society is so geared towards £GFX_OMS_teutons_texticon §qTeutonic§! reprisal.\n\nFortunately, we are here to illuminate them. Our new citizens will be given free re-education, as to integrate them with the rest of the populace. Soon, every true Russian will realise that their heart too burns with the desire for revenge. And those who don't? Well, then they were never true Russians in the first place..."
 
 OMS_Together:0 "Together"
 OMS_Together_desc:0 "A Russian family should be modelled after the £GFX_OMS_black_league_texticon §sNational Reclamation Government§!. The loving, strong father defends the family with his impeccable instincts and marksmanship; The caring, compassionate mother shelters her children from danger and teaches them skills necessary to survive; The children, candidates for £GFX_OMS_black_league_texticon §sLeague§! membership, shall understand the responsibility they will bear as a Russian in defeating the £GFX_OMS_black_league_texticon §qNazi scum§!. Militarisation shall enter the household of every citizen!"
 
 OMS_Reworking_The_Economic_Sector:0 "Reworking the Economic Sector"
 OMS_Reworking_The_Economic_Sector_desc:0 "As much as £GFX_OMS_dmitry_yazov_texticon §YMarshal Yazov§! wish to bring utter destruction to the £GFX_OMS_teutons_texticon §qNazi hegemon§!, he knows the costs of the £GFX_OMS_great_trial_texticon §xGreat Trial§!. We cannot blindly smash ourselves against the £GFX_OMS_teutons_texticon §qGermans§! till we are ready for it. A series of policies designed for rapid industrialisation will be carried out. In addition, we will also examine our budget and cut anything that is not strictly necessary. Every last penny ought to be struck into bullets if it can be spared!"
 
 OMS_a_generation_of_rage:0 "A Generation of §RRage§!"
 OMS_a_generation_of_rage_desc:0 "In preparation for the £GFX_OMS_great_trial_texticon §xGreat Trial§!, we cannot forget the importance and duties of our Motherland's youth. They cannot be neglected, lest they fail to realize the importance of our cause or dare gain sympathies with the £GFX_OMS_teutons_texticon §qReich§!. Children are easily swayed and their minds can easily be infested with £GFX_OMS_teutons_texticon §qTeutonic§! propaganda. Russia's future cannot be allowed to be corrupted.\n\nChildren will be taught of the crimes and history of the £GFX_OMS_teutons_texticon §qHuns§!, of their legacy as warmongers and savages that have done nothing for the world and are a cancer upon this Earth. They must know their enemy and the cause of Russia's woes. Let every child in Russia know that our enemy is the £GFX_OMS_teutons_texticon §qGermans§! and only the £GFX_OMS_teutons_texticon §qGermans§! and that their crimes have but one punishment: §eannihilation.§!"
 
 OMS_spread_our_truth:0 "Spread Our Truth"
 OMS_spread_our_truth_desc:0 "Russians of Occupied Territories! Too long have you been oppressed by the Germania regime without a semblance of dignity. Too long have they stained our holy motherland, on which they have left many a scar. Too long have you stayed silent, kept shut by Nazi rifles and tanks. However, all hopes are not yet lost for our nation and our people. Under the command of the glorious £GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§!, Free Russia is finally whole, but the national liberation of Russia has only just started!\n\n§RAny valiant citizen of Occupied Russia not willing to let the Nazis ride on his neck any longer, Arise§!!"
 
 OMS_the_black_league_listens:0 "The League Hears All"
 OMS_the_black_league_listens_desc:0 "Even in this hour, elements of dissent still linger in Russia. Many of the intelligentsia class have been known to oppose the £GFX_OMS_black_league_texticon §sBlack League§!'s efforts to unify Russia into a singular war machine against the Teutonic horde in favour of personalistic, materialistic and selfish ideas like 'freedom of association' or 'right to appeal'. These are nothing but counterproductive to the £GFX_OMS_great_trial_texticon §xGreat Trial§!, and as such will be eliminated from our society. Let those crypto-Teutonics tremble, for every word that escapes their lips will be held accountable against them any time any where!"
 
 OMS_the_tvs_will_run_black:0 "The TVs Will Run Black"
 OMS_the_tvs_will_run_black_desc:0 "The Television is one of mankind's greatest creations, with abilities to propagate and spread information at a rate previously unheard of. The £GFX_OMS_black_league_texticon §sBlack League§! of course must seize complete control over mass media whenever a new form arises to ensure our nation and our people are not tainted by the profane and infectious propaganda of our eternal enemy. Of course, entertainment will not be completely off the screens to appease the population, but we must ensure every single pixel is purely Russian!"
 
 OMS_the_factories_will_be_without_dissent:0 "The Factories Will\nRun Red"
 OMS_the_factories_will_be_without_dissent_desc:0 "The machines of Mother Russia might be less capable than what the West can produce, but all equipment is run by hard-working men, and no other nation on earth houses workers as dedicated as ours. However, spoiled by other warlord regimes, many manufactories in Russia are not standardised in terms of working hours and quotas. Even worse, cases of fraternisation amongst the management and workers contributed to our state-mandated guidelines not being followed. This of course must change.\n\nIf they do not comply, what they produce will send them six feet under."
 
 OMS_true_league_comrades:0 "A United Conscience"
 OMS_true_league_comrades_desc:0 "The Russian Man is a man of great will, strength and wisdom. He knows that £GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§! means no harm to any Russian, nor the Motherland that He defends every day and night for the sake of hundreds of millions. He knows the National Reclamation Government requires sacrifice not because it wants to inflict injury, but to rescue those yet under the Teutonic shadow. He knows the Army is harsh and unforgiving such that every soldier of the Motherland is as mighty as the mightiest of the Nazi scum. He knows the Secret Police patrols the street only to cleanse the spies and un-Russian elements of the society, such that §Rone day, the Russian man may be able to exact revenge of terrible scale upon his most hated enemy§!."
 
 OMS_Expand_the_national_redoubt:0 "Expand the National Redoubt"
 OMS_Expand_the_national_redoubt_desc:0 "Although the £GFX_OMS_black_league_texticon §sBlack League§! is quite familiar with the concept of fortification, we are not nearly doing enough. In case of £GFX_OMS_final_war_texticon §ea nuclear war, which is likely to occur§! as our £GFX_OMS_teutons_texticon §qTeutonic enemies§! are ready to bring down the world with them, Russian people will be in a sorry state. Casualties will not be toleratable, and whether our race can exist after the £GFX_OMS_final_war_texticon §enuclear holocaust§! will be questionable.\n\nThe Ural Mountains, which have proved valuable during our wars of unification, shall be £GFX_OMS_national_redoubt_texticon §gthoroughly fortified§! as the Swiss did with the Alpes. Although we would not necessarily have used them for defensive purposes, sheltering a significant percentage of our nation will be invaluable if the war goes ill."
 
 OMS_A_True_War_Economy:0 "A True War Economy"
 OMS_A_True_War_Economy_desc:0 "In the West, Military-Industrial complexes are sometimes known to play a major factor in the economy, especially for superpowers like Germany and the United States. However, in these nations, their degeneration has resulted in these systems falling apart. The £GFX_OMS_black_league_texticon §sBlack League§! will not and cannot tolerate these mistakes.\n\nOur militarised economy must be completely dominated by state-owned corporations by buying out every last privately owned factory in West Russia. Only then, are we able to clearly count, distribute, and swiftly liquidate any that dare to compromise our efficiency."
 
 OMS_Remove_The_Excess:0 "Remove the Excess"
 OMS_Remove_The_Excess_desc:0 "Much of Russia's economy is oriented towards various types of consumer goods. Although some are absolutely critical for our society to function normally, some are more of a luxury than what is strictly necessary. So long as any such instances of luxurious goods remain, we will remain disadvantaged against our enemy. £GFX_OMS_dmitry_yazov_texticon §YMarshal Yazov§! will see to the elimination of this wasteful consumption in Mother Russia."
 
 OMS_Produce_Only_What_You_Need:0 "Produce Only What You Need"
 OMS_Produce_Only_What_You_Need_desc:0 "A significant chunk of Russia's economy is still driven by agriculture, and both our regime and that of Siberia relied on exports of excess grain in foreign currencies. This practice however is now obsolete.\n\nThe £GFX_OMS_black_league_texticon §sLeague§! will systematically survey our agricultural production capabilities, and adjust them to a more fitting level. More farmers will pick up machine tools and produce £GFX_OMS_teutons_texticon §qTeuton§!-killing grenades and rifle rounds rather than black rye. We will lose many to the war, and therefore Russia would have less and less need for food anyhow."
 
 OMS_Separate_The_Wheat_From_The_Chaff:0 "Separate the Wheat From the Chaff"
 OMS_Separate_The_Wheat_From_The_Chaff_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! demands nothing but the strongest faith and will from all it leads. Russia must be powerful, loyal and above all ready to serve the League at any moment's notice. We cannot accept weakness or take pity on the lesser of spirit. To beat back the £GFX_OMS_teutons_texticon §qHuns§!, the frail and feeble cannot be allowed to hold us behind.\n\nWe will conduct a series of programs and evaluations set out for our citizens. They must be tested rigorously to ensure their loyalty and strength. We shall accept no inferiors into the battle against the £GFX_OMS_teutons_texticon §qGerman§! without exception. Those who fail these examinations will be put to more... appropriate use. We will raise a legion of officers without flaw or infirmity, committed to destroying £GFX_OMS_teutons_texticon §qTeutonic§! decadence and evil."
 
 OMS_Boys_In_The_Factories:0 "Boys in the Factories..."
 OMS_Boys_In_The_Factories_desc:0 "Our motherland is wide, and with it millions of people inhabit it. Many of these people cannot fight to defend it, but there is a willing group that, whilst not being able to fight on the frontlines, may be of use to us producing the weaponry for use in our £GFX_OMS_final_war_texticon §efinal conflict§!. Children are on average more patriotic and more loyal to our cause than adults, if they are put to work in factories we may gain an upper hand against the menace to our west."
 
 OMS_Men_In_The_Service:0 "...Men in the Service"
 OMS_Men_In_The_Service_desc:0 "The soldiers of the £GFX_OMS_black_league_texticon §sBlack League§! defeated our degenerate enemies to the East relatively easily, but the Army should realise £GFX_OMS_teutons_texticon §qour next competitor§! will be a lot more difficult to defend against much less defeat them. £GFX_OMS_teutons_texticon §qNazis§! will likely have total air superiority, heavier tanks and numerous weaponry at their disposal. However, their pride in quality shall be the final nail of their coffin.\n\nThe £GFX_OMS_black_league_texticon §sLeague§! can and will field an army large enough to counter the £GFX_OMS_teutons_texticon §qGermanic horde§!. In addition, civilians shall be put into militia regiments for the purpose of observation and early warning across cities in West Russia. Only by completely covering the entire front and our cities with reservists may the terrible wrath of war remain on the borders."
 
 OMS_The_Fertile_At_Home:0 "The Fertile at Home..."
 OMS_The_Fertile_At_Home_desc:0 "The continuation of Russians as a sizable ethnic group is as important as eliminating the £GFX_OMS_teutons_texticon §qTeutonic barbarians§!. If we are to lose all our men for the £GFX_OMS_final_war_texticon §eproject§!, then in fifty years our nation will be reduced to a state of widows and crones. We must genetically select naturally fertile women, who will play a crucial role in repopulation should it become necessary. In addition, the £GFX_OMS_black_league_texticon §sLeague§! will focus propaganda efforts and award productive mothers with honours, additional rations and publicity to increase our subpar birth rate."
 
 OMS_The_Rest_In_The_Army:0 "...The Rest in the Army"
 OMS_The_Rest_In_The_Army_desc:0 "Some female members of our society are looked down upon by traditionalists for carrying 'masculine' features and are inherently less suitable for roles like housewives. This discrimination against useful members of the Russian nation must come to a full halt. We will assist these abled women to a more fitting career, one that will bring as much if not more honour to their family than any other males. Let the £GFX_OMS_teutons_texticon §qTeutons§! tremble before the battle cries of the brave daughters of Mother Russia!"
 
 OMS_Technological_Advancement:0 "Advance KAMERA Research"
 OMS_Technological_Advancement_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! of course will not be mindlessly sending our youth to pave the way to Germania with their own corpse. We will utilise what resources we have with maximum efficiency. When science is freed of its manmade shackles like 'morality' or 'consciousness', the power it can unleash will shock £GFX_OMS_teutons_texticon §qour hated enemies§! to their very core.\n\nThe £GFX_OMS_black_league_texticon §sBlack League§! will also work on improving its weaponry by recruiting disgruntled foreign scientists rejected from achieving their dreams by concepts like 'ethics'. Let the raw power of the finest of the world befall upon the £GFX_OMS_teutons_texticon §qTeutons§!!"
 
 OMS_The_Men_In_The_Factories:0 "The Men in the Factories"
 OMS_The_Men_In_The_Factories_desc:0 "The practice of penal labour has existed since time immemorial, and in Mother Russia, it is almost expected for those charged with serious crimes. However, for the most part, prisoners committing more petty crimes do not face this gruesome fate.\n\nThis mistake will now be changed effectively. Though not back-breaking, all convicts will be put onto the assembly lines. Only through continuous work may these undesirable parts of our society redeem themselves, bread for bullets."
 
 OMS_The_Men_On_The_Front:0 "The Soldiers on the Front"
 OMS_The_Men_On_The_Front_desc:0 "War is coming. This is but a fact since our conquest of Siberia. As £GFX_OMS_teutons_texticon §qNazi Germany§! may launch a pre-emptive strike at any moment, it is imperative for the £GFX_OMS_black_league_texticon §sLeague§! to remain vigilant against potential invasions from the West. And if we begin to mobilise then, it would be all but too late.\n\nHarsher conscription must begin effectively immediately across the country. Only then will we have the time to train and harden Russian men and women into effective and blood-lusting machines of war."
 
 OMS_Expand_The_Bunkers_West:0 "Encroach Farther"
 OMS_Expand_The_Bunkers_West_desc:0 "While £GFX_OMS_national_redoubt_texticon §gfortifications§! in the Urals and Western Siberia are underway, we must not forget the actual frontline against the so-called Reichskommissariat Moskowien. From the White Sea to the Caspian, the borders shall be militarised to the uttermost. Every river crossing, every mountain pass, and every forest shall be defended by well-stocked comrades of the £GFX_OMS_black_league_texticon §sBlack League§!, and the £GFX_OMS_teutons_texticon §qTeutons§! will learn to respect Mother Russia and her furious sons and daughters."
 
 OMS_lock_down_the_west:0 "Lock Down the West"
 OMS_lock_down_the_west_desc:0 "A key aspect of our victory over the Nazi empire is that we must have tight control over the movement of people across the country. It is imperative that we should meet with regional governors and ask them to keep the citizens where they should be at any given time. This way, we will be able to single out subversive elements and spies of the enemy, who will be swiftly dealt with.\n\nTo achieve this, curfews should be imbued into the routine of every Russian, and all unnecessary movements of people must halt at once. If any person can travel to a neighbouring town without official documents permitting so, then we will risk hostile infiltration!"
 
 OMS_fortify_the_vastness:0 "Fortify the Vastness"
 OMS_fortify_the_vastness_desc:0 "Our border with the illegal, disdainful German occupied territory of Moscowien is one of the longest continuous political divides in the world. Some would say that to attempt to garrison a stretch of Earth so far reaching in its entirety would be a fool's errand. Those who would claim such have never seen what the resolve of Russia can accomplish.\n\nExtensive and vast lines of trenches and other defensive fortifications will be built along the length of the border. We will create our own Hadrian's Wall to defend our land from the scum that lay across the boundaries of our state. Not an inch will be left unprotected. By the will of the £GFX_OMS_black_league_texticon §sBlack League§!."
 
 OMS_depopulate_the_villages:0 "Depopulate the Villages"
 OMS_depopulate_the_villages_desc:0 "In order to truly prepare for the £GFX_OMS_great_trial_texticon §xGreat Trial§!, and inevitably annihilation of the Teuton, we must first prepare against the Moscow border. The villages along the border will be flushed out and replaced with soldiers. Now without the issue of civilians, we can prepare our defenses and effortlessly house our men in their cabins.\n\nWhen the Teuton stumbles upon the frontier of our border, they will be met with nothing but iron and blood. Their beloved Panzer corp will be met with emplacements deep into the countryside, and rattle with the sound of our artillery."
 
 OMS_dig_the_trenches:0 "Dig the Trenches"
 OMS_dig_the_trenches_desc:0 "Wartime mobilisation is not something alien to average Russians. Since the 1940s, the civilian population has been through trials of fire and blood, and so did the League. Though Soviet-era city designers placed settlements with national defence in mind, the war showed that simply placing down towns and expecting enemies not to reduce them to rubbles is childish.\n\nModern, total war demands greater sacrifice still, and we cannot repeat the mistake Bukharinists made that cost us our sacred motherland. Before the war starts, our soldiers will only march to victory if they have extensive trench and fortification networks to work with."
 
 OMS_a_safe_frontline:0 "A Safe Frontline"
 OMS_a_safe_frontline_desc:0 "From the city of Michael Taxiarch to the shores of the Caspian Sea, the National Reclamation Government is finally ready for a potential clash with the Greater Germanic Reich. A curtain of steel, of concrete, of human flesh and will, hardened by decades of war and fueled by primordial hate has encased the dangerous borders between two nations destined to annihilate each other. Two nations with nothing but hate towards the other. Two nations, of which only one may stand victorious. It is either the total destruction of Barbarian Germany or us. There can be no mercy or hesitation. All is ready, and the loyal soldiers of the £GFX_OMS_black_league_texticon §sBlack League§! await the orders of £GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§! for what has been promised.\n\n§RRevenge§!."
 
 OMS_To_Beat_The_Germans:0 "To Beat the Germans..."
 OMS_To_Beat_The_Germans_desc:0 "£GFX_OMS_black_league_texticon §sOur nation§! has made many sacrifices first to unify our country and now to beat the £GFX_OMS_teutons_texticon §qTeuton menace§!. We will neither bow nor bend not even break to the £GFX_OMS_teutons_texticon §qNazi scum§! but if we have to make the £GFX_OMS_final_war_texticon §eultimate sacrifice§! to save our culture, and our race from the threat we will. We will £GFX_OMS_final_war_texticon §escorch the earth until it becomes a desert and destroy their cities§! so their civilization will have felt the modicum of pain that they had inflicted on us all those years ago. We will win at any cost."
 
 OMS_We_Must_Use_Every_Advantage:0 "...We Must Use Every Advantage"
 OMS_We_Must_Use_Every_Advantage_desc:0 "The coming conflict will require immense willpower in every single Russian for us to claim the £GFX_OMS_final_war_texticon §efinal victory§!. Though our enemies are hardened by sadism and brute force, great still shall be our hate. Our spirit shall drive us, but the enemy will not be beaten off with simple courage. Instead, our army needs to learn to adapt to the environment they are fighting in, and our society will need to adapt to protracted warfare. Every citizen will know how to act when their food is appropriated for the front, and every soldier will know how to survive even in the most dangerous hours.\n\nAs for our government, we also need to press every advantage we can think of. Courting with the United States and false information will be necessary. After all, they did abandon us to the £GFX_OMS_teutons_texticon §qNazi§! onslaught.\n\n§RIt is what they owed us§!."
 
 ## Forpol Section ##
 OMS_All_Shall_Bear_The_Weight_Of_The_World:0 "A Culture of Strength"
 OMS_All_Shall_Bear_The_Weight_Of_The_World_desc:0 "Our culture has seen much suffering and decay since the First Trial. It has been belittled and scarred by the barbaric £GFX_OMS_teutons_texticon §qTeutons§! in the West, infantile Kazaks in Central Asia, and the conniving Japanese in the Far East. In spite of all the chaos, a new, stronger Russia has arisen which shall see the culture of Russia reach heights that have never been seen before.\n\nThe evolution of Russian culture into a strong, dedicated force of vengeance and vengeance alone has begun to take root and is spreading far and wide. We must sustain this process, whipping and pushing and leading the Russian people into a cold, merciless that shall be the Teuton's undoing. The Russian bear grew dormant and almost perish, but now its roar will be for §Rall on Earth to hear§ and to instill nothing less then pure fear of our power! Russia marches onward, first to the South, and will then turn West to complete its one and only purpose.."
 
 OMS_the_infantile_kazakhs:0 "The Infantile Kazakhs"
 OMS_the_infantile_kazakhs_desc:0 "The Kazakh & Turkmen nations of Central Asia, in their independence, have declined in their faithfulness. They have become uncivilized brutes, a nation of savages - those who desire nothing but money, who still remain faithful to the rotting, vile faith of Bukharin's system, and even those who emulate the Teutonic Menace. They no longer have any sense of personship, and they have abandoned in everything that is right, and true, in their world.\n\nThis must be changed. We will destroy these foolish, falsified emulations of 'nations', ending their corrupted system of raids and conquests - no longer allowing what is little more than tribes to try and raid the lands within our south. However, there is also an ulterior motive - the steppes near the German Border may prove to our advantage..."
 
 OMS_quell_central_asian_nationalism:0 "Quell Central Asian Nationalism"
 OMS_quell_central_asian_nationalism_desc:0 "While some may fully believe in our ideas and rabid nationalism, a majority of those within the Kazakh Steppes will refuse our absolute truth. This is no matter. We will send the expansive units of spies and militarized police to destroy any dissent against £GFX_OMS_dmitry_yazov_texticon §YYazov's§! will, preparing against any potential insubordination to our south.\n\nIn turn, with our domination over the Kazakhs, we will have a southern frontier free for Russian population, be it through forced migration or ethnic landscaping. With the expansion of the Russian peoples, there shall be a second homeland, the second great Russian land, never to fall to the savages again."
 
 OMS_silence_the_steppes:0 "An Act of Violence..."
 OMS_silence_the_steppes_desc:0 "Historically, members of the Kazakh nation have been largely supportive of Russia. They have fought in many wars since the establishment of Russian Turkestan, and few have been Russophobic. The nation is still not beyond salvaging. Like us in Russia, what has been stopping Kazakhs from embarking on the same destiny is a subversive, rebellious minority of the Kazakh society. The only thing we need to do to correct the mistake is to obliterate our enemies and help our true friends."
 
 OMS_overhaul_intelligence_operations:0 "Overhaul Intelligence Operations"
 OMS_overhaul_intelligence_operations_desc:0 "The Teutonic horde possesses a great intelligence apparatus, one that must not be ignored should we want to advance the £GFX_OMS_great_trial_texticon §xGreat Trial§!. It is imperative that we must ensure that we have the upper hand on the unseen battlefield. As we advance through the so-called Moskowien regime, we anticipate hostile sabotage efforts in their helpless attempt to stop the fury of Mother Russia.\n\nThrough a combination of domestic techniques developed since the late 1950s and foreign concepts, no Teutonic scum will escape the sight of £GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§!!"

 OMS_more_ears_on_the_border:0 "More Ears on the Border"
 OMS_more_ears_on_the_border_desc:0 "As the £GFX_OMS_great_trial_texticon §xGreat Trial§! comes ever closer, there could never be too much preparation and information. Our sleeper cells, deployed into West Russia and Ukraine since we first reached the borders with Germany shall be put into action. No movement of German military personnel and materiel shall be made unknown from the hidden eyes and ears of the £GFX_OMS_black_league_texticon §sBlack League§!. Only then may our holy war be a feasible military operation."
 
 OMS_found_the_sbo:0 "Found the Statistics Bureau of Observation"
 OMS_found_the_sbo_desc:0 "\n\n\n\n\n\n\n\n£OMS_sekretno"
 
 OMS_blacking_out_the_rising_sun:0 "Lock Down the East"
 OMS_blacking_out_the_rising_sun_desc:0 "We have played nice with the Japanese for too long. They took part in the faillure of the First Trial, and have taken righteous Russian lands and added them to the pathetic basket case of instability that is called Manchuria. While plans have been drawn up for an operation to retake our lands and the port of Vladivostok by force, we can not afford to get trapped into a wider conflict with the Japanese Empire, for it would only ever distract from the affairs in the West which take far greater prescedence.\n\nBut we can not leave this flank exposed, should the Japanese get any ideas. Our East shall be locked down, fortified, and well defended to dissuade the Japanese from undertaking anything while the §xGreat Trial§! is ongoing. Dependance upon and trade with the entire Co-Prosperity Sphere shall be ended, and from now on the Black League will stand guard in the East...while moving everything else towards the West."
 
 OMS_far_eastern_black_navy:0 "Far Eastern Black Navy"
 OMS_far_eastern_black_navy_desc:0 "The Japanese have a formidable navy. Whilst we have likely inherited a small fleet from whatever statelet existed in the East, the Japanese fleet will massively overpower it. A programme of research and development into naval capabilities is therefore required to even ward off the possibility of a Japanese naval assault."
 
 OMS_siberian_redoubts:0 "Far Eastern Redoubts"
 OMS_siberian_redoubts_desc:0 "Should the Japanese strike, they will almost certainly do an invasion using their Chinese lapdogs, as well as naval landings in the Far East. We shall cake the earth in their blood, should they try."
 
 OMS_expand_arsenal_of_vengeance:0 "Expand Our Arsenal of Vengeance"
 OMS_expand_arsenal_of_vengeance_desc:0 "Our nation was badly scarred in our battles with the Teutonic beast and his cowardly underlings. Rich off of our resources that they stole and built by the hands of those they enslaved, the undeniable reality is that they eclipse our capabilities. This means that we have a lot of catching up to do if the §RGreat Trial§! is going to be successful.\n\nNow that the riches of Siberia have been reclaimed and with this urgent need in mind, we'll spare no expenses to designate and develop several cities for the express purpose of becoming the most advanced chain of research, development and production of NBC weaponry that mankind has and the means to deliver them on land, air and sea. §RWhen the time comes to march on Germania, we'll do so with an arsenal of weapons greater than anything the brutish westerner's feeble mind could even imagine.§!"

 OMS_field_experiments:0 "Field Experiments"
 OMS_field_experiments_desc:0 "Large-scale experimentation and development of chemical weapons have been dormant for several decades and it's only recently that we've been able to resume large-scale R&D of these weapons that will send our message of hate to our enemies. Thankfully, our inhuman foes have rested on their laurels while we made strides in the field.\n\nIn future wars, our comrade soldiers will march into battle without having to rely on regimental support artillery to receive support from our arsenals of vengeance. We'll make these instruments of our national anger portable by the common infantryman, giving entire legions of patriots the means to corrode the bodies of our enemies just like they tried to corrode our glorious motherland."

 OMS_rehabilitations:0 "Rehabilitations"
 OMS_rehabilitations_desc:0 "Among those who fought in the reunification wars, there are many great heroes of the Soviet Union who proved themselves against the Teutonic hordes both in the Great Patriotic War. Some had their careers shattered in the Smuta, some even live out their days in our dungeons for standing against us in our struggle to reclaim all of Russia for the Black League.\n\nBecause of their abilities and the fact that they have - for now - killed more Germans than most in our own ranks, We're prepared to re-evaluate the records of some of these faded heroes of our Soviet past. They will be given a simple choice: pledge their loyalty to the sacred Russian homeland and its heroic Marshal ahead of the Great Trial, or rot in a jail for insubordination. We expect them all to make the right choice."
 
 OMS_delivering_our_message:0 "Delivering Our Message" 
 OMS_delivering_our_message_desc:0 "Our beloved nation has been badly scarred in its battles with the Teutonic beast in the west and its cowardly underlings. With decades gone to waste, we have a significant amount of catching up to do in several key military fields. This would’ve been difficult in the past, but with the reclamation of Siberia’s riches, this is about to change.\n\nUnder our watch, we’ll spare no expenses to make sure that Russia’s waters will once again be protected by a mighty fleet. Our newly formed strategic rocket forces will allow us to rain death upon our hated enemy, their strikes made all the more potent thanks to our strides to modernize our NBC arsenal. Once the §RGreat Trial§! starts, we’ll have all the tools we need to utterly vanquish the German people and §Rturn Germania itself into a smoldering crater.§!"

 OMS_the_great_equalizer:0 "The Great Equalizer"
 OMS_the_great_equalizer_desc:0 "Rushed through development, Object 416 is finally ready for testing in the recently liberated deserts of Central Asia. Bearing the name of the Black League's founder, this weapon will be what allows us to erase Germania itself from history. A weapon so powerful that a single bomb eclipses that of the entire Teutonic arsenal, the mere mention of its name will strike fear into the hearts of the enemies of Russia.\n\nIf successful, we will finally have a weapon that can not only equalize the bomb and missile gap between us and our enemies, but will be enough to outright destroy the heart of the Teutonic empire with one fell swoop. Nothing less is enough to express our full hatred for the German."

 OMS_thousand_lakes_run_red:0 "Let The Thousand Lakes Run Red"
 OMS_thousand_lakes_run_red_desc:0 "Among the ranks of Russia's enemies, the perfidious Finns are often overshadowed by the greater evils that reside in Germania though their crimes against our people have endured for centuries. Always the eager servant of the Swedes, these barbarians were always the first line of defense against Russia's efforts to civilize the Nordic region. The current permutation of Finland is perhaps the most vile to date: a sanctimonious underlings of one of Germany's servants that committed ethnic cleansings of Russians in Karelia while pretending they were any better than the Germans.\n\nThe Finnish mockery of the Russian nation ends now. In what might become a dress rehearsal for the §RGreat Trial§!, Black Hand operatives will enter the Land of a Thousand Lakes and turn them red with the blood of those that thought they could harm our people and go unpunished."

 OMS_operation_apraksin:0 "Operation Abraksin"
 OMS_operation_apraksin_desc:0 "It is high time that we started to rectify the historical injustice that is Finnish independence by force, bringing a final hammer blow to this cowardly lackey of the Teuton. Where the Union fell short in 1939, we will succeed today by unleashing a steel tide upon them from which they'll never recover. Once we do, the Teuton and any Scandinavian vassal at his disposal will surely rush to the aid of the illegitimate collaborator regime in Helsinki. Let them come - we'll simply destroy them and make the process of liberating Moscow simpler.\n\nThe inevitable military conquest of Finland is only the first step, however. Once their armies are crushed, we will crush the will of their people. What a hundred of years of Tsarist benevolence couldn't do, we will achieve within a single year. Once we're done, their will to resist won't just be broken - the entire concept of anything Finnish will be as well."

 OMS_in_bobrikov_footsteps:0 "In Bobrikov's Footsteps"
 OMS_in_bobrikov_footsteps_desc:0 "With the Finnish army and their Swedish handlers thoroughly routed, the time has come to solve the Finnish problem once and for all. The First World War interrupted and delayed more than half a century's worth of civilizing this wild wasteland that once was part of the Tsardom. The benign efforts of our ancestors were predictably met with violence, the only language that the Nordic peoples understand besides duplicity. The Grand Duchy has too kind to the Teuton's beasts of burden, a mistake that the Black League won't repeat.\n\nIf the liberation of Finland was a dress rehearsal for the §RGreat Trial§, the pacification of the country will be a prelude for how we'll reintegrate the Kommissariats into Russia. We will station a full reserve army in Finland and stomp on the collective neck of Russia's enemies to the point where they will never be able to rise up again as a people."
 
 OMS_sharpen_our_swords:0 "Sharpen Our Swords"
 OMS_sharpen_our_swords_desc:0 "With the immediate tasks of rectifying most of our losses in the Great Patriotic War It's finally time to begin our final preparations for the §RGreat Trial§!. The weapons of our vengeance will be the swift sword of retribution with which we'll cut off the head of the Teuton. Not only are we catching up with the Germanic beast in terms of firepower but technologically as well.\n\nWhile we still lack a safe and effective method of deploying Object 416, thanks to our ongoing liberation of Russian lands we're now able to test missiles that give us the ability to strike within Germany territories on day one of our §RGreat Trial§!. Once successful, these weapons of national vengeance can enter mass production and deliver convetional, chemical and biological payloads on their cursed soil.""

 OMS_a_war_to_end_the_germanic_menace:0 "A War to End the Germanic Menace"
 OMS_a_war_to_end_the_germanic_menace_desc:0 "The Third Reich and its Nazi pigs have had one, and only one, enemy that has ever truly stood against them: the mighty people of Russia. It is our motherland that bled dry by tens of millions fighting against the Teutonic jackboot, it is our motherland that was enslaved and whipped, and it is our motherland that will beat them back and claim victory.\n\nFor all their posturing, the pitiful Organization of Free Nations and their pathetic ideals of democracy have never meaningfully aided in the sacred war against the Reich. Their peoples have not suffered for victory. They cannot know our struggle and our pain. We do not need them or their weakness. If we are to stamp out the Reich, it must be done ourselves."
 
 OMS_brutalisation_of_russia:0 "The Brutalisation\nof Russia"
 OMS_brutalisation_of_russia_desc:0 "Even today, our nation bleeds because of past disasters. So long as Russian lives are maltreated in any form, the £GFX_OMS_black_league_texticon §sBlack League§! cannot call itself a defender of our country and people. Elsewhere in Asia, Slavic populations still face great prejudice from Central Asians and the Japanese. Ever have they worked to de-russify occupied Russian territories, and ever the brave partisans stood fast. Compared to the Germans, these are relatively less menacing threats that we can deal with to boast our strength and teach these traitor nations a lesson."

 OMS_we_are_ready:0 "We Are Ready" 
 OMS_we_are_ready_desc:0 "How much has our nation lost awaiting this moment? How many days, months, years have our people counted while the jackboot was pressed against their throats? How many tens of millions of lives were shattered? We have awaited this moment through suffering and endless time, and now it has arrived.\n\nEverything has come to this. Every bomb and bullet which decided the fate of Russia led us here. For the first time since Voroshilov let it slip through his fingers, Moscow is once again in reach of its rightful countrymen. The city of lights calls out to us in this hour of reclamation. We must answer its cries."
 
 ## War prep tree section
 OMS_at_the_precipice:0 "Minutes to Midnight" 
 OMS_at_the_precipice_desc:0 "The £GFX_OMS_black_league_texticon §sentire nation§! and everyone in it, no matter who or where they are all share the exact same feelings. Anticipation, determination, perhaps nervousness. But all are united in their determination to see the £GFX_OMS_teutons_texticon §qwretched Reich§! cast down, and the £GFX_OMS_teutons_texticon §qGerman menace§! which it serves £GFX_OMS_final_war_texticon §eextirpated§! like so much rotten cancer. Every weapon is loaded and primed, every soldier at his post, and every plan signed off and prepared to fastidious detail. All that remains is the last handful of technical and logistical tasks to ensure every last piece is exactly where it needs to be.\n\nThe £GFX_OMS_great_trial_texticon §xGreat Trial§! is nearly at hand, for all the world to bear witness to.But it cannot be carried out until every last offensive plan is ready to be carried out at maximum efficiency, for maximum effect. We will ensure the opening stages of the war are as £GFX_OMS_final_war_texticon §edevastating as possible§! to the £GFX_OMS_teutons_texticon §qenemy§."
 
 OMS_fill_the_peoples_fervor:0 "Activate the Sleepers" 
 OMS_fill_the_peoples_fervor_desc:0 "How disconcerting would it be if the people you knew and were familiar with, your co-workers, neighbors, perhaps even your friends suddenly started raising a fresh hell? That is exactly our aim. We have slowly but thoroughly filtering agents into the RKs, and allowing them to settle into civil society there. Letting them appear as quiet, law abiding citizens beneath anyone’s notice. like buried explosive traps waiting for the detonation signal. Now the time has come to send that signal.\n\nSeemingly out of nowhere, factories will be sabotaged, garrisons and police ambushed, and bands of partisans ready to conduct protracted guerilla warfare from the forests and hills. For the £GFX_OMS_teutons_texticon §qGermans§!, this ordeal will be akin to being flung into a pool of freezing cold water. Distressing, disorienting and agonizingly painful."
 
 OMS_march_towards_midnight:0 "March Towards Midnight" 
 OMS_march_towards_midnight_desc:0 "As the final preparations for the £GFX_OMS_great_trial_texticon §xTrial§! begin to see their end, the £GFX_OMS_final_war_texticon §efinal march§! towards the end of the £GFX_OMS_teutons_texticon §qGerman race§! and their occupation of our sacred motherland begins. What remains of the £GFX_OMS_black_league_texticon §sRussian National§! Army beyond the Urals, protecting the frontier of the £GFX_OMS_black_league_texticon §sBlack League§!'s domain, are to be immediately called from their posts towards the border of the vile architects of our Motherland's misery.\n\nThe £GFX_OMS_black_league_texticon §sReclamation Government§! and its people stand at the precipice of fulfilling their destiny. The last hours of peace for the £GFX_OMS_teutons_texticon §qTeutons§! and their vermin race fast approach. The honor and duty of our motherland's brave defenders will bring about a new age, and the destruction of the Reich."
 
 OMS_arm_the_soldiers_of_the_reclamation:0 "Arm the Soldiers of the Reclamation" 
 OMS_arm_the_soldiers_of_the_reclamation_desc:0 "All the industrial effort into preparing for The £GFX_OMS_great_trial_texticon §xGreat Trial§! has borne considerable fruit, with large caches of weapons, munitions and other war materials made ready for the oncoming war. But as there is no such thing as enough when dealing with such a well entrenched foe as the £GFX_OMS_teutons_texticon §qReich§! and their collaborator lapdogs. As such, one final great push of building up weapons for the war has been ordered. Factories will work on extended hours, every mine, every workshop that can be made to churn out tanks, trucks, guns and ammunition will be made to do so, and every able pair of hands will be made to work.\n\nEven those who cannot stand at a furnace or lathe can be made useful in administrative tasks, as the large sums of material will need to be kept track of and sent to the right warehouses and supply centers. There will not be a single person who isn’t hard at work ensuring victory. Not one."
 
 OMS_doctrine_of_shadow_and_steel:0 "Doctrine of Shadow and Steel" 
 OMS_doctrine_of_shadow_and_steel_desc:0 "As the £GFX_OMS_great_trial_texticon §xGreat Trial§! will soon begin, we must make sure that every man knows his duty. We seek to not just defeat the £GFX_OMS_teutons_texticon §qTeuton§!, but to utterly and totally crush him. To do this we must use every method we have at our disposal. We will do to the £GFX_OMS_teutons_texticon §qTeutons§! what they once did to us. We will wage total war upon our enemy. Our officers must be willing to completely disregard the life of the £GFX_OMS_teutons_texticon §qTeuton§! without hesitation, be they military or civilian. They must think of the £GFX_OMS_teutons_texticon §qenemy§! as animals and treat them as such. Those who cannot do this will be sidelined. They are inefficient and useless to the architect of the £GFX_OMS_great_trial_texticon §xGreat Trial§!. We cannot afford to have cowards in our nation’s most vital hour."
 
 OMS_final_offers:0 "Final Offers" 
 OMS_final_offers_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! has prepared for this moment decades over. Our Glavkoverkh has dreamt of the glory that will come from this day. Every act and shred of will in all of our great motherland has pushed it towards its destiny. The time has finally come for the £GFX_OMS_final_war_texticon §elast act of retribution§! against the £GFX_OMS_teutons_texticon §qThird Reich§!.\n\nOur vengeance shall be swift. Our hatred and noble wrath shall boil over like a wave upon the enemies of Russia. The £GFX_OMS_national_redoubt_texticon §gNational Redoubt§! facilities stand operational under the mountains, providing our people safety from the calamity that our sacred war will reap. The £GFX_OMS_teutons_texticon §qReich§! shall be £GFX_OMS_final_war_texticon §eburnt to ash§!.\n\n§RLet vengeance be done, though the heavens fall.§R"

 ## Cut and unused
 OMS_thus_struck_the_minute_hand:0 "Let the Heavens Fall" 
 OMS_thus_struck_the_minute_hand_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! has prepared for this moment decades over. Our Glavkoverkh has dreamt of the glory that will come from this day. Every act and shred of will in all of our great motherland has pushed it towards its destiny. The time has finally come for the £GFX_OMS_final_war_texticon §elast act of retribution§! against the £GFX_OMS_teutons_texticon §qThird Reich§!.\n\nOur vengeance shall be swift. Our hatred and noble wrath shall boil over like a wave upon the enemies of Russia. The £GFX_OMS_national_redoubt_texticon §gNational Redoubt§! facilities stand operational under the mountains, providing our people safety from the calamity that our sacred war will reap. The £GFX_OMS_teutons_texticon §qReich§! shall be £GFX_OMS_final_war_texticon §eburnt to ash§!.\n\n§RLet vengeance be done, though the heavens fall.§R"

 OMS_More_For_The_Soldiers:0 "More for the Soldiers"
 OMS_More_For_The_Soldiers_desc:0 "Naturally, humans choose the profession with the highest earnings, and this will be exploited to assist in our conscription program. The army will be prioritised on every possible type of goods and provided with commodities that are otherwise hardly available to the general public. In addition, we will also provide similar benefits to the family of our soldiery. With their family in safe hands, more Russians will flock to the £GFX_OMS_black_league_texticon §sBlack League§!."
 OMS_Dig_Deeper:0 "Dig Deeper"
 OMS_Dig_Deeper_desc:0 "Russia is abundant with a myriad of natural resources, many of which are integral to a nation's ability to wage total war across the Eurasian continent. With our recent conquest of Siberia, additional strategic reserves are now available for exploitation. The defeat of our foe in the civil war proved their inability to completely master the art of harvesting ores, rubber, precious metals and wood for the war effort.\n\nThe £GFX_OMS_black_league_texticon §sLeague§! will export its efficient model to everywhere it may reach."
 OMS_and_the_league_knows_all:0 "And the League\nKnows All"
 OMS_and_the_league_knows_all_desc:0 "The League has cameras, microphones and informants all across Russia. The amount of information that we collect and process is beyond comprehension. All this is done to safeguard our Motherland, of course, by rooting out Teutonic sympathisers and other undesirable scum that plague our great nation. None shall stand in the way of our great Glakoverkh.\n\nAfter all, one should not fear the All-Knowing Eyes and Ears of the £GFX_OMS_black_league_texticon §sBlack League§! if one does not have anything to hide..."
 OMS_and_the_league_is_secure:0 "Secure the State"
 OMS_and_the_league_is_secure_desc:0 "£GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§! watches over Russia's labours for her £GFX_OMS_final_war_texticon §eone last historical mission§!. All across the nation lives have never been more secure from the Teutonic menace that has ruthlessly cut down our people. No longer will a Germanic spy find any information, for our lips are shut and sharp are our eyes. No Nazi brute will penetrate through our defences, for our countless guns and earthworks shall bury him six feet under. No more will the unity of our nation and our people be challenged, for £GFX_OMS_dmitry_yazov_texticon §YComrade Marshal Yazov§!, a loving father of ours guides Russia only towards victory. No more will the £GFX_OMS_black_league_texticon §sBlack League§! fear subversive sabotage, for the League is now with Mother Russia, §Rwhether or not she wants to§!."
 OMS_stronghand_the_americans:0 "Stronghand the Americans"
 OMS_stronghand_the_americans_desc:0 "Whilst we see very differently from the §MAmericans§!, we ultimately have common enemies of §qGermany§! and §VJapan§!. §VJapan§! stabbed us in the back in the 1940s, and whilst they aren't our main threat, they are historic allies with §qGermany§!. §VJapan§! has a surprising amount of influence inside the far-east, most likely due to the traitors in Magadan and Amur getting in bed with them, and as such the chances of them attempting to pull us into their §Vsphere§! is only increasing, so allying with the §MAmericans§! is the natural counter.\n\nUltimately, the §MAmericans§! are pretty willing to support us due to themselves hating the §qGermans§!, but they haven't committed to destroying them like we have. We have learned from history, you cannot condemn someone out of a window. "
 OMS_production_for_promises:0 "Production For Promises"
 OMS_production_for_promises_desc:0 "The vastness of American wealth and what it could provide the League is almost immeasurable, yet it can be felt across the world. Stretching out from the economic core of the Americas, their capital swells the foreign market throughout the globe, of course excluding countries unaligned to American interests, naturally including our domain for many decades.\n\nToday, however, we share vested interest in the return of our rightful Eastern land from Japan and the destruction of our western enemy in the Fascist Reich. Regardless of what changes to our relationship the Trial may bring, for now we stand aligned, and our benefit is theirs. Investment from the clueless Americans will nicely oil the machinery of our state and provide the capital to bring the Trial to fruition."
 OMS_show_the_world_japans_crimes:0 "Show the World Japan's Crimes"
 OMS_show_the_world_japans_crimes_desc:0 "The atrocities committed by the Japanese since they crawled from their home islands are uncountable. Their barbaric hordes have facilitated disgusting denials of humanity across Asia, second only to the Reich. Nanjing, in Iwo Jima, in Sichuan, and most recently in Vladivostok; the Japanese vermin have shown their true colors of fruitless violence.\n\nOur talented propagandists have an abundance of horror and destruction which can be used to our advantage and shown to the world. Soon, everyone shall come to hate the Japanese people as much as Russia has, and surely then they will not deny us the reclamation of our rightful land from the villains of the Rising Sun..."
 OMS_pro_russian_propaganda:0 "Pro-Russian Propaganda"
 OMS_pro_russian_propaganda_desc:0 "With the conquest of Kazakhstan being inevitable, we will show them the betterment of the average civilian's life under us. As long as they remain faithful to the league, a people of strength and devotion to our cause, integrating within the £GFX_OMS_black_league_texticon §sBlack League§!, they will gain greatness - they will gain money - and most importantly, they will §Rfinally destroy what has destroyed them§!.\n\nAfter our propaganda is flown all throughout the Kazakh 'nations' - no longer will they remain loyal to the petty fiefdoms within Central Asia, no, they will defect to our banners en masse, whether it will truly help them, or not."
 OMS_a_flurry_of_armour:0 "A Flurry of Armour"
 OMS_a_flurry_of_armour_desc:0 "Even in this hour, some in former Russian Turkestan still oppose our rule. Thinking they can outrun us, many bands of mounted bandits roam the vast steppes of Kazakhstan. How childish. These strategies are only effective against backwater militaries, and Motherland Russia, now reinvigorated by her most loyal and beloved son - All-Russian £GFX_OMS_black_league_texticon §sBlack League§!, is no such enemy.\n\nEvery inch of Kazakhstan shall be free of dissenting rebels. We will give our armoured formation opportunities for training that they can utilise against the Germans on the vast steppe.\n\nLive munitions included."
 OMS_brought_by_noncompliance:0 "...Brought By Noncompliance"
 OMS_brought_by_noncompliance_desc:0 "However, this is not to say Kazakhstan is free of any guilt. Since the collapse of Soviet Russia, Kazakhstan, along with other Central Asian republics, passed a series of anti-Russian legislatures aimed at reducing the influence we Russians hold in Central Asia, something that our forefathers centuries ago have toiled for. These people have clearly forgotten who uplifted them from poverty into organised cities, who taught them how to read and who brought the guns that they are using, at this very moment, to massacre our compatriots. This kind of behaviour must be corrected at once!"
 OMS_a_war_for_national_reclamation:0 "A War of Salvation"
 OMS_a_war_for_national_reclamation_desc:0 "Through our collective efforts, the ruination of our beloved Motherland at the hands of the Teutonic invaders shall be avenged with ferocity and thoroughness the likes of which has never been seen before. When the §RGreat Trial§! achieves its inevitable and final victory over Russia's foes, no one will even dare to utter the names of our fallen foes, let alone adhere to the wicked ideology that led them to their inevitable demise.\n\nThe war that lies ahead will be hard-fought, and in order to assure our success the Black League must make the utmost use of whatever allies that have earned the privilege of being redeemed alongside us.\n\nAll must come together to extinguish the flame of National Socialism once and for all, for those who do not heed the  call to fight are little better than those who collaborated with the enemy."
 OMS_cull_the_officer_corp:0 "Cull the Officer Corps" 
 OMS_cull_the_officer_corp_desc:0 "For all our efforts to remove the doubting and potentially dangerous and put the loyal and faithful in their place, there remains a stubborn, disparate few who have eluded us and yet continue to (even if unwittingly) spread seeds of doubt among the soldiers and officers. The old adage of a chain is only as strong as its weakest link holds true, and we must find these weak links, and replace them with stronger ones. It would not do to have weak hearts spreading doubt, which would be a lead weight on morale and organization.\n\nFinding them is a matter of listening for these whispers of fear and uncertainty, identifying a suitable replacement and then shuffling them where they can do no harm. Be it as a pencil pusher, or out of the job entirely. Such backroom backstabbing is a dirty business, but necessary to build the strongest war machine man can organize."
 OMS_give_preference_to_the_faithful:0 "Elevate the Faithful" 
 OMS_give_preference_to_the_faithful_desc:0 "While ideally our top officers would share our moral convictions, this is not the case. Some foolishly hold ideals of democracy or freedom. While some of these officers may be skilled, they cannot be trusted with the fate of Russia. Only officers who are blindingly loyal to £GFX_OMS_dmitry_yazov_texticon §YYazov§! and the ideals of the £GFX_OMS_black_league_texticon §sBlack League§! are fit to carry out this holy mission. These loyal men will receive promotions over those who don’t share our values. Some will say this will lead to a stagnation in the officer corps. Yet, it would be even more dangerous to let some pompous bleeding heart liberal hold the fate of Russia. No matter the cost, the ideological integrity of our officers must be upheld."
 OMS_with_the_torchs_blaze:0 "With the Torch's Blaze" 
 OMS_with_the_torchs_blaze_desc:0 "Since we made the world aware of the £GFX_OMS_great_trial_texticon §xGreat Trial§!, §MOFN§! affiliated agents have made furtive contact with us, offering covert channels for arms, munitions, intelligence and monetary support.. Most of these have proven to be very enticing indeed, and we have maintained contact with these assets. Now, it is time to cash in our chips. We will begin to requisition whatever weapons, funds and information can be made available to us, to ensure that the £GFX_OMS_great_trial_texticon §xGreat Trial§! is carried out without a hitch. Not everyone in the league is in favor of this idea, but to ensure our ultimate victory, we must swallow a little pride.\n\nThe §MOFN§! is known to have high standards for equipment of all types, and if §MAmerican§! guns and dollars are what help carry us to victory, then so be it. Not a single one of our soldiers will go unarmed, not a single factory unfunded, and not a single battle planned without high quality intelligence."
 OMS_ready_the_silos_unseal_the_canisters:0 "Ready the Silos, Unseal the Canisters" 
 OMS_ready_the_silos_unseal_the_canisters_desc:0 "Of the many projects undertaken in preparation for the The £GFX_OMS_great_trial_texticon §xGreat Trial§!, some argue that the arsenal of vengeance is one of our more important. It will no doubt give us an invaluable strategic and tactical edge against the armies of the £GFX_OMS_teutons_texticon §qReich§!, and their collaborator lapdogs. To that end, we must move these weapons to forward positions. £GFX_OMS_chemical_weapons_texticon §KChemical munitions§! will begin to be distributed to artillery battalions and mortar teams, and nuclear warheads will be loaded into their silos, and a suitable target planned. Their cities will vanish beneath a poisonous cloud, and that will only be the start.\n\nGas grenades and incendiaries can be assigned to infantry units, though some additional training and guidance will be necessary for the responsible usage of these weapons. The last thing we need is gas blowing back in our faces, and fires spreading out of control."
 OMS_posture_our_might:0 "Posture Our Might" 
 OMS_posture_our_might_desc:0 "The £GFX_OMS_international_image_texticon §iworld at large§! and indeed the £GFX_OMS_teutons_texticon §qTeuton menace§! believe we are little more than a jumped up warlord state, who are merely playing at being a serious presence on the world stage, and indeed a credible threat to the ever noisome §qGermans§!. Before The £GFX_OMS_great_trial_texticon §xGreat Trial§! begins in earnest, we will martial every last serviceman in great parades and military exercises to demonstrate not only our numbers, but our ability to coordinate and equip such a large force all at once.\n\nOur soldiers, our generals, our equipment. Our planes, ships, tanks and all our vengeance weapons will be put on full display for the world to curate. We will make it abundantly clear our intentions, and our ability to follow through. The £GFX_OMS_teutons_texticon §qGermans§! and the £GFX_OMS_international_image_texticon §irest of the world§! will be made to respect, if not fear us. Whether they like it or not."
 OMS_dump_the_rot:0 "Final Offers" 
 OMS_dump_the_rot_desc:0 "Our last attempts at negotiation with the £GFX_OMS_teutons_texticon §qTeutonic Menace§! will be blunt and coarse. We will demand the complete and total liberation of all lands rightfully belonging to the Motherland, immediate deportation of all Germans residing in the freed territories, demilitarization and the permission of subsequent "retribution protocols" in the Prussian lands, dismantlement of the Germanic Fleet, and many such more necessary measures to be submitted and inked in our name. These demands, although obviously symbolic in nature, shall be sent for the £GFX_OMS_teutons_texticon §qdecrepit, degenerated husks§! in the "Volkshalle" to flatly rebuff.\n\nHowever, in the otherworldly event that the £GFX_OMS_teutons_texticon §qVultures§! do accept our ungodly measures, we will spare no enemy of the Motherland. Any German delegation that crosses our sacred soil shall step not one foot without the cold, piercing glare of our bayonets to greet them. If they cannot accept this reality, then we must make them ourselves."
 OMS_with_every_waking_moment:0 "With Every Waking Moment "
 OMS_with_every_waking_moment_desc:0 "If The £GFX_OMS_great_trial_texticon §xGreat Trial§! and all the struggle that it entails is to succeed, then the bodies and minds of the £GFX_OMS_black_league_texticon §sentire nation§!, top to bottom must be focused on preparing both materially and theoretically. The farmer will grow good groups to mill into rations, the miner will extract ore to be made into weapons and munitions, and the generals and command staff will spend every waking moment meticulously planning every last step of the offensive, and all reasonable permutations. If you can work, if you can plan, you will be part of the trial. This will be everyone’s fight, and everyone’s victory.\n\nThe £GFX_OMS_teutons_texticon §qGermans§! and their puppets have fallen into complacency, and when the £GFX_OMS_great_trial_texticon §xTrial§! begins in earnest, they will be completely flat footed in the face of our advanced preparedness. Whether advancing unfailingly or presenting a stout defense, we will have plans on top of plans for every outcome, and the stockpiles to see them through."
 OMS_operation_alekseyev:0 "Operation Alekseyev"
 OMS_operation_alekseyev_desc:0 "The Japanese have hidden behind their walls of Bureaucracy and piles of plundered wealth long enough. The time has come for their tanks, their soldiers, their will, and their honor to be shattered. We will pierce their weak defenses, overwhelm each and every sentry, and reach our rightful Vladivostok before they can muster any puny defenses.\n\nThere will be no quarter for enemies to our great and sacred Russia. There will be no remorse, no resistance to our benevolent rule, no dissent within our ranks, and most of all nothing to deny us the organic borders of the Russian motherland. All in our way will perish, and in their wake a new Russia, strong and unbroken, will arise."
 OMS_deport_the_collaborators:0 "Deport the Collaborators"
 OMS_deport_the_collaborators_desc:0 "For the forty arduous years of Japanese occupation of Russian lands, there lived a network of collaborationist traitors, seeping into society like rot, who sold out the interests of their people for personal greed or delusional hopes of preventing further retribution by their occupiers.\n\nAs the fist of the £GFX_OMS_black_league_texticon §sBlack League§! comes to grip Outer Manchuria once more, we are in a position to rectify these evils. If these traitors to the motherland so desperately wish to live under the Japanese boot; we will happily oblige. Local garrisons are to be dispatched to the homes and families of known collaborators, to offer 'transport services' to the Japanese border. They have betrayed their homeland, and now the only place for them is with their barbaric masters."
 
### GREAT TRIAL TREE ###
 OMS_The_Great_Trial:0 "The Great Trial"
 OMS_The_Great_Trial_desc:0 "Thirty years ago, the heart and soul of our nation was burned to the ground by the Teutonic hordes. The failures of the First Trial nearly wiped the Russian people off the face of the earth, as the Aryan fought a war against not just our nation, but our culture and people. They sought to “cleanse” the earth of our brothers and sisters, and tore down everything we cherished in life.\n\nThe Aryan believed they had achieved permanent victory.\n\nHow foolish they were.\n\nThe white-hot embers of rage and sorrow forged a new Russia. One that would achieve total vengeance, no matter the cost. Every single man, woman, and child who was relegated to the cold embrace of a ditch, will have their blood-debt paid three times over. Our £GFX_OMS_final_war_texticon §efinal victory§! over the scourge of Europe is at hand, as tens of millions righteously toil in factories, or march into our former homeland with one goal: The complete destruction of Germany by any means necessary.\n\nWe have waited many years for this moment, and now the hour is at hand where we may finally avenge the injustices of the past.\n\n§RThe £GFX_OMS_great_trial_texticon §xGreat Trial§! has begun.§!"
 
 OMS_The_Road_To_Moscow:0 "The Road To Moscow..."
 OMS_The_Road_To_Moscow_desc:0 "Once, the city of Moscow served as the beating heart of the Russian nation. A beautiful city of lights and dreams we once proudly called our capital. In another world, it may have become one of the greatest examples of human achievement and progress in the world. But that did not happen, as the £GFX_OMS_teutons_texticon §qTeutons§! brutally ripped our sacred city away from her people, burning away all that was sacred, and placing its rightful inhabitants in chains.\n\nNow, we stand at the gates of our once beloved city, ready to forevermore bring it into the fold of her people. And when we hoist our sacred flag over the spires of the Kremlin, we shall promise the world this:\n\n§RNever again§!"

 OMS_Will_Be_Paved_With_Blood:0 "Will Be Paved With §RBlood§!"
 OMS_Will_Be_Paved_With_Blood_desc:0 "If one were to think about the consequences of our failure during the First Trial, the first thing that comes into the mind of the average Russian would be the countless faces of siblings, parents, and neighbors, each of them having been mercilessly slaughtered by the endless cruelty of the Teuton.\n\nNow, we finally have the opportunity to §Rreturn the favor§!.\n\nEvery settler and soldier will be met with the same fate as those who they once murdered en masse. At long last, total retribution and justice will finally be delivered to the so-called “Ubermensch”, and the sacrifices of our long dead comrades will no longer be in vain."

 OMS_Everything_We_Can_Use:0 "Everything We Can Use"
 OMS_Everything_We_Can_Use_desc:0 "It's only right that the wealth of the Teuton and those that willingly served under his yoke have what was theirs taken from them.\n\nIn order to maintain our offensive we must increase our efforts and get more supplies to the frontlines. Whatever we come across as we march into the Reich will be repurposed to further our military needs. Food, materials, vehicles - everything that isn't bolted or welded down will be used to further our march towards Germania. Specialist logistics units will also be set up to make sure that as much of these materials as possible get efficiently converted to easily be used by our forces. Additionally, penal units will be allowed to plunder the bodies of the dead to reduce the strain on our logistics system. Fortunately for them, §Rthere is no such thing as a civilian in this war.§!"
 
 OMS_With_The_Leagues_Might:0 "With the League's Might"
 OMS_With_The_Leagues_Might_desc:0 "The Black League has made its mark on this world. We used to be seen as little more than a petty warlord in Siberia but have grown to prove ourselves to be the mightiest force of retributory vengeance that the world has ever witnessed. Our tanks have laid have smashed the Wehrmacht, our planes have flattened the Hun's cities and our men have trampled on the corpses of our fallen foes.\n\nWe must make sure that news of our rampage of vengeance across the European landmass reaches the eyes and ears of every Russian to bolster their resolve to redouble their efforts at home and fight with increased ferocity throughout our nation. And of course, as the sight of the devastation we've wrought breaches the censorship regimes of our foes, they will tremble in fear before us."
 
 OMS_With_The_Motherlands_Blood:0 "With the Motherland's Blood" 
 OMS_With_The_Motherlands_Blood_desc:0 "Industry is essential in war, nobody can reasonably disagree with this. If you can outproduce your enemy then it doesn’t matter how fanatical and devoted he is. You can’t expect to win if your men aren’t properly equipped. To that end, the league has made the decision to drastically ramp up production. Implementing shift rotations such that factories and workshops can remain open and operating at all hours, as well as loosening some regulations to help the production lines run faster.\n\nIt will no doubt cause a great toll on not only the people who have to work in those factories, but the tools as well. No man or machine is unbreakable, but we will make sure their sacrifice in blood, toil, sweat and tears is worthwhile. We will take their tireless labor and make The £GFX_OMS_great_trial_texticon §xGreat Trial§! a glorious victory for all to share in."
 
 OMS_Burning_Through_Supplies:0 "Burning Through Supplies" 
 OMS_Burning_Through_Supplies_desc:0 "To obliterate the greatest enemy Russia has ever faced, the Black League finds itself using the largest army that the Motherland has ever fielded. Doing so is putting an immense strain on our logistics grid, however, and if steps aren't taken it may not be long before our stockpiles start to run dry.\n\nTo prolong our army's sustainability in the field we're going to earmark a portion of our industry to fully convert to helping the supply chain with vehicles, supply shipments, food, uniforms and more. If a surplus is achieved once more, all of that will go towards our supply stockpiles in our subterranean living quarters throughout Siberia."

 OMS_Their_Fatherlands_Wealth:0 "With Their Fatherland's Wealth"
 OMS_Their_Fatherlands_Wealth_desc:0 "While we have managed to lay waste to a large amount of our repugnant foe's cities and forces, we have yet to establish an organized department for repurposing the ill-gotten wealth of the Teuton. By more properly organizing a state body to administer the reclaimed wealth that the German people have stolen from the world we can use it to supplement our supply chain as well as bolster our home front situation."

 OMS_Who_Hasnt_Served:0 "Who Hasn't Served?"
 OMS_Who_Hasnt_Served_desc:0 "With our grand crusade against the fascist cancer in full swing, we expect our manpower reserves to deplete rapidly in the coming months. To assuage any future complications, we will scour all our lands and pluck every abled body man from every town and hamlet. From tenements in the city to cabins in the woods, we will ensure all of Russia’s men will shed every last drop of blood in Russia’s reclamation.\n\nNo matter the age, if you can hold a gun or move artillery shells, then it is an obligation to serve Russia until you're dead or dying. The £GFX_OMS_teutons_texticon §qTeutons§! and their ghoulish collaborators will throw all they have at our frontlines, millions will perish from their machinations. We know the sacrifices that are to come, and we will be ready to replace every dead soldier with two more. All shall serve their great Motherland in her finest hour. "
 
 OMS_What_To_Do_With_The_Settlers:0 "What To Do With The Settlers?"
 OMS_What_To_Do_With_The_Settlers_desc:0 "The greatest crime committed by the Reich was the so called “General Plan Ost”,an absolutely horrid plan with the goal of reducing our slavic brethren to nothing more than slaves, as the vial Aryan reaped the fruits and eventually fully replaced them. Now, these so-called “settlers” beg and plead at our feet for mercy.\n\nWe will only offer them §Rsuffering§!.\n\nThese criminals, who slaughtered untold millions for their sacred Lebensraum, will be given nothing but anguish. They shall soon feel the sting of the whip, the weight of chains, and much more.\n\nHowever, £GFX_OMS_dmitry_yazov_texticon §YComrade Yazov§! has engineered his own additional method of justice. Every single Ost-Deutch within our hold will undergo a program of sterilization, forever eliminating the future of the Teuton while also keeping them alive as nothing more than fodder for our war machine."

 OMS_Accept_Nothing:0 "Accept Nothing"
 OMS_Accept_Nothing_desc:0 "It is inevitable that some Teuton "settlers" will have refused to leave their stolen homes and farmsteads. Perhaps some of them believe they can resist us. Perhaps some continue to hold onto the feeble hope that if they beg for mercy from the £GFX_OMS_black_league_texticon §sBlack League§!, they will be spared.\n\nThey are sorely mistaken.\n\nThere will be no mercy for the settlers. Not a single German will be spared. Any mewling attempts to appeal to a "better nature" will be met with the barrel of a gun. The stolen lands will be engulfed with gunfire, and silence shall only fall when the last of the National Socialist scourge has been removed from blessed Russia."
 
 OMS_They_Know_Their_Fate:0 "They Know Their Fate"
 OMS_They_Know_Their_Fate_desc:0 "They know our stance on their blood. Their barbaric culture and ideals. If they haven't left our homeland by now, they will feel the consequences. After all, they dare remain in our rightful homeland, even after everything they have done?\n\nThe Germanics shall run from the Eagle, or they will be eaten. Man, woman, or child, it does not matter, they will feel the hammer of righteous fury."
 
 OMS_No_More_Scum:0 "No More Scum"
 OMS_No_More_Scum_desc:0 "Currently there are very few settlers left in our domain. Thankfully many were caught and prosecuted in whatever execution deemed right. But sadly we have run out of places to cleanse.\n\nNow, we must reinvigorate the hunt of the Teuton in our land. Whether they have even one drop of Germanic blood they must be dealt with. The same stands with this Germanic “culture”. We will extinguish the light from every pair of Tectonic eyes on our soil, and bring ourselves ever closer to fully repaying our blood debt."
 
 OMS_Show_Them_Our_Hate:0 "Show Them Our Hate"
 OMS_Show_Them_Our_Hate_desc:0 "If the Teuton is to fully understand the fate that awaits them, we must instill the same degree of fear and terror that they once brought to our land. And we will show it all for the whole world to see. Executions, ruthless beatings, and lashings will be broadcast to the homefront, so that all may gaze upon the fulfillment of true justice.\n\nOur divine justice and triumph of our national peoples over the lowly Germanics shall be put on full display. We shall show their men die, their women suffer, and their children starve.\n\nAnd nothing but thunderous applause will reign out."

 OMS_Anger_Is_A_Strong_Tool:0 "Anger Is A Strong Tool"
 OMS_Anger_Is_A_Strong_Tool_desc:0 "Hatred is a beautiful emotion. No other invokes such strong, visceral reactions within humanity. It is pure - and the purest form of hatred in the world is that which we hold towards Germany. The age-old bitterness of the oppressed finally getting the chance to lash out and wreak vengeance on their oppressors is one that we will harvest and fashion into a weapon.\n\nHatred makes men hit harder, run faster, fight harder. It is good, and we will use it against the Teuton and his allies. Our primal rage will see Germania reduced to a blasted heath, its people scrambling away in fear for dear life in the exact way our people have for decades. They will know suffering as we have known it - for our hatred is far greater than theirs."
 
 OMS_Fear_Beats_Willpower:0 "Fear Beats Willpower"
 OMS_Fear_Beats_Willpower_desc:0 "They will see exactly what we have in store for them. Our land was assailed and beaten by the Germans. Every damn square meter has been defaced by the Teutonic menace. Families were upturned, cities sacked, and futures burnt down. Now it is our time to scare them.\n\nWe shall mirror what they have done to us onto them. They will see their families upturned, their monuments defaced, and their cities sacked. These truths will be mass-produced and broadcast to the world. Soon the world shall carry our fury."

 OMS_Expand_The_Target_List:0 "Expand The Target List" 
 OMS_Expand_The_Target_List_desc:0 "The common soldiery of the Teuton expects our wrath, therefore they do not fear it - at least, as much as they should. The Fuhrer knows that one day he will nought but ash in the wake of our crusade. He fears us, but less than he should. This is not enough. The German people do not fully grasp what is upon them. Therefore, it is our job to remind them.\n\nThe list of military targets our soldiers are to capture and kill on sight shall be expanded to include greater non-combatant populations. Regardless of gender, age, or social strata, each and every German has benefitted from the suffering of the Russian people, growing fat off of our pain like some great collective tick. No more. They will, for the first time in their lives, know true fear."

 OMS_Hanging_Judge:0 "Hanging Judge"
 OMS_Hanging_Judge_desc:0  "In this §RGreat Trial§! comrade Glakoverkh Yazov is the highest authority of justice. It's he who presides over the great halls of justice that is the endless Eurasian battlespace and it's he who will dispense justice upon the enemies of Russia and it is the Black Hand that will deliver the swift sword of our retributory justice to the hearts of the enemy societies.\n\nFound collectively guilty, our operatives will begin to assassinate leaders of their societies. From managers to mayors to marshals, we'll spread terror throughout their societies and cripple their ability to function as a cohesive national body for as long as we fight them. They're all guilty and the sentence is §Rdeath§!."
 
 OMS_No_More_Strings:0 "No More Strings"
 OMS_No_More_Strings_desc:0 "The contacts in the Reichstag and beyond have grown middling and have given unneeded results. We have asked enough of these valiant people and their sacrifices were not in vain, we will make sure of it. They will be remembered as one of the many hammers that broke down the licentious German Eagle.\n\nBesides we do not need to seek more knowledge of the enemy. For we already know what they are, the filth that needs to be cleaned off the surface of the planet."
 
 OMS_No_Matter_How_Long_It_Takes:0 "No Matter How Long It Takes..."
 OMS_No_Matter_How_Long_It_Takes_desc:0 "The £GFX_OMS_great_trial_texticon §xGreat Trial§! drags onward, as the successful conclusion we'd been hoping for continues to elude us. The “Aryan” Menace has clung as hard as they possibly could. But that is to be expected with cornered rats, for they bite and snarl because they know we are their superior, and that they will be permanently extinguished.\n\n§REvery. Last. One Of Them.§!\n\nThe Russian Eagle is finished toying with its prey, and now we shall finish it off."
 
 OMS_We_Will_Win:0 "Let the Heavens Fall"
 OMS_We_Will_Win_desc:0 "needs new loc - Blooboory \n\nWe have to win this war. For the sake of those who laid down their lives, and for the complete realization of the motherland's destiny, every Russian knows it.The corrupt showa bureaucracy in their pagoda knows it. The Americans know it, crammed in their office buildings and homes. The damned “Aryan” menace, the pest we shall kill, knows it. Then why would they be running? Why would they hide behind nuclear payloads and diplomacy? If this war must go on for thousands of years then let it! If the last humans on Earth are a German and a Russian, the Russians will always win! The vile and futile German will always lose.\n\nWe are better than they will ever be.\n\nThe £GFX_OMS_great_trial_texticon §xGreat Trial§! will be fulfilled, no matter the cost."
 
 ### Great Stall Tree ###
 OMS_hung_jury:0 "Hung Jury"
 OMS_hung_jury_desc:0 "The Great Trial has reached an impasse. Despite our best efforts and our intense preparations we now find ourselves in a state where our forces can only advance with the most extreme difficulty imaginable as the bulk of the army has run out of steam after months of relentlessly advancing with more intensity than any fighting force ever has in history.\n\nIf the §RGreat Trial§ is to resume and be successful, we must take urgent measures - lest all our efforts will be for nothing more than a botched §Rmistrial§."
 
 OMS_yazovs_grace:0 "Glakoverkh's Grace"
 OMS_yazovs_grace_desc:0 "Marshal Yazov will not respond to the crisis like a barbaric Teuton, but with the calm and grace that Russia deserves to see from its leader at this moment. They will see him not as a tyrant demanding the impossible, but as one that is leading by an example worth striving for. The airwaves in the trenches on the front and shelters at home will see him taking the situation with a robust steadiness that makes him the living embodiment of Russia's collective stoicism./n/nWhatever may happen behind the scenes, our propaganda will make sure that this is what all Russians both at and behind the frontlines will see and believe."
 
 OMS_yazovs_fury:0 "Glakoverkh's Fury"
 OMS_yazovs_fury_desc:0 "The situation is inexcusable. For the so-called soldiers of the League to stumble just as we're so close to finishing our task of national annihilation against the Germans is a crime in and of itself. We will make sure that the message will go out loud and clear to all of Russia that their marshal demands that they fight with redoubled vigor. The rage we all feel over the attacks on Russia will be channeled through Yazov, the living embodiment of Mother Russia's rage at those that slayed her sons and daughters.\n\nAnyone that doesn't give it their all in this time of crisis, whether it's at home or directly at the front, will be dealt with harshly by the Black Hand, the instrument of comrade Yazov's justice."
 
 OMS_throw_them_a_bone:0 "Throw Them a Bone"
 OMS_throw_them_a_bone_desc:0 "Our officer corps quite justifiably expect heads to roll over the fact that they've nearly caused the §RGreat Trial§ to end up like the First West Russian War. We should use this to our advantage./n/nThey will expect the worst, and we will make the believe that the worst is neat only to mercifully be saved from the abyss by their benevolent marshal whose kindness and understanding is the only reason that they can live on to fight another day. At the end of the day, everyone in the officer corps whose nerves have been wavering as of late will be made to make commitments to Yazov himself and redouble their efforts in the war."
 
 OMS_make_an_example:0 "Make an Example"
 OMS_make_an_example_desc:0 "Those who betrayed Russia and the soldiers under their leadership rightfully fear what is in store for them. We will make examples of them and show these inept fools that they are not above punishment. Anyone that isn't indispensable attached to units that have underperformed will immedeately be put under investigation./n/nThe Black Hand will investigate the officers in short order and anyone found guilty of criminal neglect in the line of duty will be sentenced for treason. In recognition of their service, we will give them two options: they can be put in front of a firing squad, or spend the rest of the war shoulder to shoulder with German POWs captured by their more successful peers."
 
 OMS_fresh_blood:0 "Fresh Blood"
 OMS_fresh_blood_desc:0 "Within the lower ranks of our officer corps are many former Red Army officers that used to serve their Motherland with dignity and were allowed to re-enlist in our army as we swept through Siberia and liberated Russia from those who failed the Motherland. Given the failures of our own generals, the time has come to re-evaluate these officers and give them a chance at redemption.\n\nMore importantly than the skills they bring in, these officers are being given a second lease on life and they know it. They will be thankful to the Glavkoverkh and ensure that more ferocity is brought to the table within our officer corps. Because if they don't, they know that they may very well be back at square one again - or worse."
 
 OMS_with_renewed_vengeance:0 "With Renewed Vengeance"
 OMS_with_renewed_vengeance_desc:0 "It wasn't just the soldiers that failed to reduce Germany to ashes, but the so-called leaders who were supposed to lead them to victory. They had grown soft and complacent following the reunification wars and now their men are paying the price, as is the rest of our sacred Motherland. We cannot let this injustice stand.\n\nUnder the potential penalty of torture for any failure, we are to make sure that each and every officer that wishes to serve comrade Glavkoverkh Yazov is reminded of their duty and the costs of not succeeding. Brutality may be the only language Germans understand, and we'll make sure that our officer corps will become more than fluent in this kind of expression - or else."
 
 OMS_pierce_the_veil:0 "§RPierce the Veil§!"
 OMS_pierce_the_veil_desc:0 "The much-touted Great Stall as the foreign press has dubbed it has turned out to merely be a Great Regrouping of our forces, one that has allowed us to become even stronger than we were before. The moment of imperfection is over and now we stand ready to unleash a more perfect form of vengeance against the Germans./n/nNow the time has come to unleash our perfect hatred upon the Germans. Across the European battlespace millions of courageous Russians stand ready to once again advance with renewed vigor towards our foe and deliver a new, complete cleansing of their barbaric homeland. It's time for us to kill, and it's time for the Germans to die./n/n§ROur Great Trial begins anew.§"

 ### Unorganised bullshit below. ###
 OMS_Black_League_Childrens_Authority:0 "Black League Childrens Authority"
 OMS_Black_League_Childrens_Authority_desc:0 "The next generation of Russians have been educated as to the evil of the Teuton - we have seen to that. So by that logic, now that the £GFX_OMS_great_trial_texticon §xGreat Trial§! is finally upon us, how could we in good consciousness deny them the right to partake in it? It is their birthright, in their very blood. The children WILL serve their motherland.\n\nIn what way this happens will depend on a case-to-case basis. Some will help by serving in the factories, making bombs and bullets. Some will be sent to the front-lines as an auxiliary force, manning machine guns and carrying equipment. Regardless, our children will make us and our ancestors proud - just as we are."
 OMS_The_Bottom_Of_The_Barrel:0 "The Bottom Of The Barrel"
 OMS_The_Bottom_Of_The_Barrel_desc:0 "Disaster! Our evaluation of the stockpiles has shown that they are almost entirely worthless! Most of the weapons no longer function, if they ever had, and the rest malfunction in ways that would only endanger us. Heads will roll for this incompetence on display, but before, we must remedy this or else all of our work to find victory in the £GFX_OMS_great_trial_texticon §xGreat Trial§! will have been wasted.\n\nTo get our men resupplied, we must turn to what little equipment is left from the Great Patriotic War. No matter how ancient the gun, if it shoots, a soldier will wield it. We have no choice if we wish to salvage our logistics. The will of our men will have to be enough to overcome these shortcomings."
 OMS_Improvised_Tanks:0 "Tap the Stockpiles"
 OMS_Improvised_Tanks_desc:0 "It is a meticulous process to make a tank. Numerous parts and components are needed to assemble such machines of war. But in such dire times like this, we need no such “armor” or “alloy” for a tank to be sufficient.\n\nWe shall do fine with strapping our emplacements on top of cars and making vehicles just as effective as their armored counterparts. The Germans may think this gives them an advantage, but they do not understand that all we need to achieve victory is discipline and bravery. In the end, we will ensure quantity while leaving the quality aspect to the crews."
 OMS_Partisans_Arise:0 "Partisans, Arise!"
 OMS_Partisans_Arise_desc:0 "From the hills of Brest to the shores of Samara, they have trained for one sole thing. They have fought and died for the death of the Teutonic overlords, those who have shackled their fellow countrymen.\n\nArise ye humble Partisan! Arise to shake this very theater and open holes in the Germanic lines. Soldier or Partisan, the Teuton will learn to fear a follower of the League."
 OMS_No_More_Equipment:0 "No More Equipment"
 OMS_No_More_Equipment_desc:0 "The stream of equipment has gone dry. Our bountiful harvest of weapons and equipment for the soldiers has stopped abruptly. When we started this war our coffers were full and ready to help dispatch the £GFX_OMS_teutons_texticon §qTeutons§!, but now it lay destitute, with no possibility of full replenishment.\n\nWe now have a new task ahead of us, to preserve the weapons that we hold and use them to the utmost effectiveness. With what we have left, we must conquer."
 OMS_an_unmeasurable_anger:0 "An Unmeasurable Anger"
 OMS_an_unmeasurable_anger_desc:0 "What the fuck is going on with our army? We have trained for years to tackle the Nazi beast. Our men were supposed to liberate Moscow!? We sit on our laurels already won, our sons and daughters under the Nazi jackboot are crying out for oppression. Our army is a fucking joke. Cowardice and treachery runs through the veins in our army. Cowardice is a stain that dirties our reputation and it must be cleansed if Russia is to be saved."
 OMS_call_for_immediate_reformation:0 "Call for §RImmediate Reformation§!"
 OMS_call_for_immediate_reformation_desc:0 "The impossible has become possible.\n\nThe Gears of War have stopped, with the rot and filth of bureaucratic inadequacy. As our men freeze in the holes they dug outside of Moscow, the public grows antsy at our continual progression of the £GFX_OMS_great_trial_texticon §xGreat Trial§!.\n\n£GFX_OMS_dmitry_yazov_texticon §YComrade Yazov§! has called for the nation to hold steady as we prepare for a long winter, many things will change in our stead. Many facets of our society will be upturned and changed for the better. These are changes we should have made long ago.\n\n§RTen years of progress will be made in Ten Weeks§!."
 OMS_replacement:0 "Replacement..."
 OMS_replacement_desc:0 "The Teutonic scourge has downtrodden our high command and military apparatus to the point of ineptitude, but degeneracy does not solely affect the internal workings of the state. It branches out, hoping to destroy traditions we have held precious to us for hundreds of years, to render society into decadence.\n\nIf we do not hope to see ourselves fall like the empires of old, then we shouldn't implement myopic solutions. A replacement must ensue, getting rid of incompetency in our ranks and ripping out the tendrils of Teutonic degeneracy from society. A message must be driven into the minds of every citizen, one of courage and ability."
 OMS_in_the_people:0 "...in the People"
 OMS_in_the_people_desc:0 "With a population as widespread and numerous as ours, it can be difficult to gauge the common mood, which can vary widely from city to city, village to village. But, we must make a concerted effort to ensure that every single man, woman and child of all ages, everywhere and all at once has their full dedication to Yazov, the league and The £GFX_OMS_great_trial_texticon §xGreat Trial§!.\n\nThis will consist of an all out propaganda effort, with nonstop radio broadcasts extolling the virtues of Comrade Yazov and the glorious £GFX_OMS_black_league_texticon §sBlack League§!. Pamphlets stuffed into everyone’s hand, newspapers with headlines shouting to all who’ll read them about the evils of the Teuton, and how Yazov and the league are our only way to defeat them once and for all. Not a single soul, from the streets of Omsk, to the wastes of Omolon will fail to support us wholeheartedly."
 OMS_increased_security:0 "Increased Security"
 OMS_increased_security_desc:0 "The £GFX_OMS_great_trial_texticon §xGreat Trial§! takes precedence over everything else, and as such, it is only natural for the Russian people to give their all to see it to its conclusion. Men and women will serve - day and night - in our many factories to fulfill the many needs of the £GFX_OMS_black_league_texticon §sBlack League§!.\n\nBut some short-sighted and naive fools have begun protesting our heavy-handed requisition of material and institution of long work-hours. This has caused a wave of dissent to disturb the solidarity of our nation and our Great Cause, it must not be allowed to continue.\n\nAlready we have received reports of riots at key infrastructure which has disrupted our war effort to a substantial degree. In order to curtail this threat, we will have to send out the most loyal men in our army to secure vital military and industrial complexes and give them orders to arrest and gas protestors and should a full-scale riot break out… they know what to do."
 OMS_trust_no_one:0 "Only One Enemy, Only One Goal"
 OMS_trust_no_one_desc:0 "The people are the sheep and the £GFX_OMS_black_league_texticon §sBlack League§! is their shepherd. They are unable to see the bigger picture and are too short-sighted to make good decisions for themselves. The people are foolish and think that their actions will do them good when it will only bring our nation to ruin. But no matter, the £GFX_OMS_black_league_texticon §sBlack League§! exists to guide the misguided.\n\nThe £GFX_OMS_black_league_texticon §sBlack League§! is the only entity worthy of trust in Russia, more so than neighbours, friends, even family. And as such, they should not trust the words of those that surround them, for how can sheep tell lie from truth? Only the League is wise enough to know the truth, to know what is good for Russia, only the League can bring salvation to us all."
 OMS_smoke_out_the_rats:0 "Smoke Out the Rats"
 OMS_smoke_out_the_rats_desc:0 "The conundrum of internal security can only be addressed by knowing those who seek to undermine and overthrow the League. The panopticon of the £GFX_OMS_black_league_texticon §sBlack League§! shall catalog every dissenter and back-stabber who leaves their footprints in the sand, as we hope to secure the homeland situation in order to focus our efforts on the armed struggle against the Teutonic marauders. We already have an extensive list, it matters not a few thousand more traitors are found and dealt with."
 OMS_in_the_army:0 "...in the Army"
 OMS_in_the_army_desc:0 "We have done much to ensure material and practical preparations for The £GFX_OMS_great_trial_texticon §xGreat Trial§!, but much still remains to be done. Specifically, we must ensure the utmost and unwavering loyalty of the soldiers and staff. From the field marshal down to the private, we will instill the brand of fanaticism needed to drive the noisome German all the way back to his lair. This will consist of several components, the first being designing a training regime for both privates and officers commissioned and non, that saturates them in propaganda, taught by existing hardliners.\n\nThis can be mixed in with drill and assault practice, and even lighter elements like having shooting and bayonet targets be in the shape of German soldiers. Finally, and to ensure that this conditioning sticks in the hearts and minds of the men, is to encourage them to echo these sentiments amongst each other. The hatred of the enemy will resonate through every squad, every regiment, and every division."
 OMS_only_the_loyal:0 "Only the Loyal..."
 OMS_only_the_loyal_desc:0 "Our officer corps quite justifiably expect heads to roll over the fact that they've nearly caused the §RGreat Trial§ to end up like the First West Russian War. We should use this to our advantage.\n\nThey will expect the worst, and we will make the believe that the worst is neat only to mercifully be saved from the abyss by their benevolent marshal whose kindness and understanding is the only reason that they can live on to fight another day. At the end of the day, everyone in the officer corps whose nerves have been wavering as of late will be made to make commitments to Yazov himself and redouble their efforts in the war."
 OMS_may_eat_from_my_hand:0 "...May Eat From My Hand"
 OMS_may_eat_from_my_hand_desc:0 "Those who betrayed Russia and the soldiers under their leadership rightfully fear what is in store for them. We will make examples of them and show these inept fools that they are not above punishment. Anyone that isn't indispensable attached to units that have underperformed will immedeately be put under investigation.\n\nThe Black Hand will investigate the officers in short order and anyone found guilty of criminal neglect in the line of duty will be sentenced for treason. In recognition of their service, we will give them two options: they can be put in front of a firing squad, or spend the rest of the war shoulder to shoulder with German POWs captured by their more successful peers."
 OMS_of_bullets_and_teeth:0 "Bullets and Teeth"
 OMS_of_bullets_and_teeth_desc:0 "An inept and clumsy army will only ensure that our efforts against the Reich will fail. Incompetence will be dealt with by correcting those men whose only contribution to the struggle is to worsen the state of the military, whether that means re-education, transfer, or in the case of desertion, death. The army will be forced to answer only to the League, and any dissent or mutiny will be dealt with accordingly. Soon our armed forces will know not to bite the hand that feeds them, for we’ll reciprocate even harder."
 OMS_in_the_generals:0 "...in the Generals"
 OMS_in_the_generals_desc:0 "Within the lower ranks of our officer corps are many former Red Army officers that used to serve their Motherland with dignity and were allowed to re-enlist in our army as we swept through Siberia and liberated Russia from those who failed the Motherland. Given the failures of our own generals, the time has come to re-evaluate these officers and give them a chance at redemption.\n\nMore importantly than the skills they bring in, these officers are being given a second lease on life and they know it. They will be thankful to the Glavkoverkh and ensure that more ferocity is brought to the table within our officer corps. Because if they don't, they know that they may very well be back at square one again - or worse."
 OMS_to_be_feared:0 "To Be Feared"
 OMS_to_be_feared_desc:0 "We have long left the days when we were but a small rump state in Omsk behind, but it appears that we have not left behind the corruption and nepotism that our high command once had, before we purged it from our nation with blood and steel.\n\nOur security officers have notified us of instances where high-ranking officers and officials have utilised their influence and power to syphon off resources meant for the war effort and for the construction of infrastructure to enrich themselves.\n\nThe Glakoverkh is unsurprisingly - furious, and has given orders to arrest these decadent bastards and trial and execute them for treason. We are close to our goal, none will stand in the way of the £GFX_OMS_great_trial_texticon §xGreat Trial§!'s success. If we have to put a bullet in between the eyes of every single corrupt official and officer to instil a fear of disobedience into those that might be tempted to reach for things they should not touch."
 OMS_and_loved:0 "And to Be Loved"
 OMS_and_loved_desc:0 "Marshal Yazov will not respond to the crisis like a barbaric Teuton, but with the calm and grace that Russia deserves to see from its leader at this moment. They will see him not as a tyrant demanding the impossible, but as one that is leading by an example worth striving for. The airwaves in the trenches on the front and shelters at home will see him taking the situation with a robust steadiness that makes him the living embodiment of Russia's collective stoicism.\n\nWhatever may happen behind the scenes, our propaganda will make sure that this is what all Russians both at and behind the frontlines will see and believe."
 OMS_all_feelings_no_words:0 "All Feelings, No Words"
 OMS_all_feelings_no_words_desc:0 "It wasn't just the soldiers that failed to reduce Germany to ashes, but the so-called leaders who were supposed to lead them to victory. They had grown soft and complacent following the reunification wars and now their men are paying the price, as is the rest of our sacred Motherland. We cannot let this injustice stand.\n\nUnder the potential penalty of torture for any failure, we are to make sure that each and every officer that wishes to serve comrade Glavkoverkh Yazov is reminded of their duty and the costs of not succeeding. Brutality may be the only language Germans understand, and we'll make sure that our officer corps will become more than fluent in this kind of expression - or else."
 OMS_a_trust_in_the_process:0 "A Trust in the Process"
 OMS_a_trust_in_the_process_desc:0 "Our Glavkoverkh, £GFX_OMS_dmitry_yazov_texticon §YDmitry Yazov§!, is the one man in Russia who can claim to truly be directly responsible for the triumphs of the £GFX_OMS_black_league_texticon §sBlack League§!. Who was it that ended the factionalist, greedy reign of the old guard? Who was it that brought the League to rule indisputably over the vast lands it administers? Yazov, and Yazov alone.\n\nJust as it would be foolish and arrogant to deny the Glavkoverkh recognition of his successes, we can not turn our backs on his judgment. Unwavering faith in his methods and theories will bring the Black and League and Russia its salvation. Any other means or leadership would be entirely futile."
 OMS_random_acts_of_patriotism:0 "Random Acts of Patriotism"
 OMS_random_acts_of_patriotism_desc:0 "The greatest weapon of the £GFX_OMS_black_league_texticon §sBlack League§! on the homefront of Russia remains its loyal citizenry. Regardless of those that seek misplaced harm to the cause of the Trial, a strong support base of the everyday people of Russia remains ever present throughout the nation, a fact we can exploit against these misguided dissenters.\n\nRewards to those that take a personal hand in exposing the rats within Russia will be distributed across the nation. Any information that results in the capture of Anti-£GFX_OMS_black_league_texticon §sBlack League§! agitators will be given significant rewards, including increased rations for up to a month. All we'll have to do to watch the opposition crumble is sit back and watch."
 OMS_see_my_beauty:0 "See My Beauty"
 OMS_see_my_beauty_desc:0 "Russia is a sweeping land. Taigas, mountains, cities, spanning from Siberia to the West. And throughout all these lands, there are no men greater than Russia's very saviour - £GFX_OMS_dmitry_yazov_texticon §YDmitry Yazov§!. He took the reigns of the £GFX_OMS_black_league_texticon §sBlack League§! from Karbyshev and made haste in finishing the work that his predecessor had neglected, once again uniting Great Russia under one banner.\n\nAnd now, there is no one who can challenge him anywhere in the world. From Washington to Germania, these men are nought but ants in comparison to the titan that is £GFX_OMS_dmitry_yazov_texticon §YYazov§!. And soon, all of them shall know. We stand on the precipice of finally fulfilling The £GFX_OMS_great_trial_texticon §xGreat Trial§!, and it shall only be through the work of the Supreme Marshall!"
 
 OMS_decades_of_stagnation:0 "Decades Of Stagnation"
 OMS_decades_of_stagnation_desc:0 "The £GFX_OMS_great_trial_texticon §xGreat Trial§! has thrusted the world into an unprecedented nuclear holocaust– as Glavkoverkh Yazov and the All-Russian Black remain silently under the shadow of the Ural Mountains, they wait out the pervasive atmospheric firestorms, ionizing radiation and harsh nuclear winter that envelops much of the world.\n\nHe and the £GFX_OMS_black_league_texticon §sBlack League§! are determined to resurface, to unite all of Russia under a singular banner once again and bring vengeance to the pervasive, scheming £GFX_OMS_teutons_texticon §qTeutons§! that managed to escape the grasp of the Trial. It is a necessity to Yazov that the shortcomings of the Trial be redeemed, and that what remains of the Nazi government and party chancellory be entirely eradicated, by any means necessary. Yazov looks west, determined– hoping to embark on an expedition throughout what remains of Eastern Europe, in order to end the Teutonic blight once and for all.\n\nBut, despite his determination and the League's willingness to proceed, a myriad of issues stand in his way. Among the high saturation of ionizing radiation and environmental phenomenon on the surface, a substantial amount of the £GFX_OMS_black_league_texticon §sBlack League§! high command is dispersed across numerous nuclear shelters situated in major cities and other strategic regions. The Glavkoverkh finds himself without the vital resources and manpower required for crossing into central Europe, compounded by the scarcity of supplies and unrest within Yazov's territory. The future of the League looms in a dismal cloud of uncertainty, and only time will tell if it's able to continue its legacy."
 OMS_the_dead_lay_above:0 "The Dead Lay Above Our Feet"
 OMS_the_dead_lay_above_desc:0 "The cowardly £GFX_OMS_teutons_texticon §qTeutons§! have dealt a crippling blow not just to the £GFX_OMS_black_league_texticon §sBlack League§!, but all of human civilization. While our society lives on beneath the Earth, the world we know above has been eviscerated in the fires of war.\n\nHundreds of millions lay dead at the hands of Germany. The citizens of Russia we so-fervently sought to liberate are but ashes across the irradiated soil they lay upon. The world's countless cultures and histories are but a fading memory within the anarchy that has consumed them. A millennia of civilization, gone in a flash.\n\nThe £GFX_OMS_teutons_texticon §qTeutons§! shall pay for their crimes. That, our Glavkoverkh will make sure of."
 OMS_trapped_in_an_infernal_game:0 "Trapped In An Infernal Waiting Game"
 OMS_trapped_in_an_infernal_game_desc:0 "It is abundantly clear that our bravest and most ingenious tacticians are starting to break under the strain of bunker life. Whilst this is a great and noble trial in and of itself, we must find a way to keep them preoccupied to ensure that they are ready to do whatever is necessary when the £GFX_OMS_black_league_texticon §sBlack League§! finally rises like a Phoenix from the ashes. Some activities and solutions proposed in breaking up the monotony include sending scout teams to investigate the outside, surprise drills to keep the generals' minds sharp as well as increasing the amount of rations they could get each month. We shall run through each of these solutions as we wait for the radiation levels to decrease, maybe even doing all of them at once given the luxury of time"
 OMS_thoughts_of_the_past:0 "Thoughts Of The Past"
 OMS_thoughts_of_the_past_desc:0 "The people yearn for the bygone days of the Soviet Union. Back when the peoples of Europe and Asia were united as one. We shall use this nostalgia to our advantage by creating films regarding the heroes of the West Russian War and the hardships endured by the average Soviet citizen under Bukharin's rule. This will show them that the former Soviet Union was weak and that the bygone days would have been exactly as they remembered it had the old union's leadership been stronger. These films shall pave the way for our citizens to be more open to enduring the hardships of our £GFX_OMS_great_trial_texticon §xGreat Trial§! and prepare them for the challenges ahead. With all the time we have to wait out the radiation, we have enough time to ensure these films send our message clearly."
 OMS_when_the_kitchens_were_full:0 "...When The Kitchens Were Full"
 OMS_when_the_kitchens_were_full_desc:0 "To think that so many things we took for granted before this £GFX_OMS_great_trial_texticon §xGreat Trial§! are a luxury now. The fresh air, the clean water, the morning sun and most of all, the ripe harvest and livestock that fed our people. Those days seem so far away now, the memory of a bright summer day now being a distant memory to our loyal citizens.\n\nPerhaps it would be good to lift up the people's spirits by making creative use of our rations. We shall conduct a survey to look for culinary experts in these bunkers and have them make recipes out of the rations. These recipes shall evoke the memory of the pre-war days. It should help break up the monotony and ensure that our population remains healthy and happy. Whilst this is not enough to keep our people motivated, it should serve as the backbone to our strategy of surviving the £GFX_OMS_great_trial_texticon §xGreat Trial§!."
 OMS_when_the_army_was_decadent:0 "...When The Army Was Decadent"
 OMS_when_the_army_was_decadent_desc:0 "There once was a time when the £GFX_OMS_black_league_texticon §sBlack League§! was an unstoppable force. Our great nation stood amongst giants and could easily crush any that would oppose it. Our logistics and firepower were near second to none and we were able to stomp out the Teuton menace for good. Nowadays it is a shadow of its former self, left rot while we wait for our return to the surface.\n\nWe must ensure our army is ready to fight at any cost. Surprise drills and inspections should keep our soldiers on their toes as well as keep our general's minds active. We shall do our best to simulate the conditions that our men might face on the surface once we emerge, despite the limited space within our bunkers."
 OMS_when_the_people_had_purpose:0 "...When The People Had Purpose"
 OMS_when_the_people_had_purpose_desc:0 "The purpose of every £GFX_OMS_black_league_texticon §sBlack League§! citizen is to work towards the destruction of the £GFX_OMS_teutons_texticon §qTeutons§!. But ever since the supposed end of the £GFX_OMS_teutons_texticon §qTeutons§!, the £GFX_OMS_great_trial_texticon §xGreat Trial§! has been reduced to a mere waiting game with much time and little to do. The resolve of our citizens is waning and they are beginning to question their purpose for living in the first place.\n\nWe must help them endure this £GFX_OMS_great_trial_texticon §xGreat Trial§! by reminding them that there is much work to be done to reclaim the motherland and that they must prepare intensely. We shall run educational films that shall instruct our citizens of the industries and infrastructure that must be rebuilt once we emerge from the surface. Every citizen shall be trained rigorously in construction, agriculture and radiation cleanup so that the reclamation of the surface will be smooth and easy. Our £GFX_OMS_great_trial_texticon §xGreat Trial§! isn't over and the £GFX_OMS_black_league_texticon §sBlack League§! must be ready for whatever comes next."
 OMS_new_league_in_new_age:0 "New League, In A New Age"
 OMS_new_league_in_new_age_desc:0 "To all, it is clear that the reclamation will require great change within the society of the £GFX_OMS_black_league_texticon §sBlack League§!. If we are to maintain our current state, we would simply become yet another decentralized warlord, a nation of sedentary peoples, no longer a great Russian nation, but a nation of cowards, and liars.\n\nWith this, we prepare for yet another great change within the society - from men and women living their sedentary lives within the various bunkers, to once more a culture of war, a people dedicated to our true goal once more, no longer necessitating the League abandon what it was meant to do, once again becoming a Spartan Machine, all united in the goal of the End of the £GFX_OMS_teutons_texticon §qTeutons§!."
 OMS_changes_needed:0 "Changes Needed"
 OMS_changes_needed_desc:0 "It has become apparent that our first reforms have succeeded, yet, there is a need for more. Yazov is still not pleased with the affairs - many of his own men are still slacking, and lazy. There is still rot to be purged from the ranks of the £GFX_OMS_black_league_texticon §sBlack League§!, before even another thought of destroying the savages within the SS is given. Not until every man serves - every man is faithful - and every man truly believes in our cause, can we rise across the entirety of Eurasia once more.\n\nA fundamental shift in our new society must be made. We have lived too lavishly without the threat of the teutonic beasts on our back, we have spent years sloughing within the bunkers, losing our devotion to the cause. We were foolish. The old order, and the new, cannot be allowed to continue, lest Omsk fall to the demonic creatures which we had once wiped away."
 OMS_sacrifices_made:0 "Sacrifices Made"
 OMS_sacrifices_made_desc:0 "Throughout our lands, inside our bunkers, a rot seeps into every crack in its walls. We took every precaution to cleanse our tools of national salvation of the filth that permeated throughout our nation, but these traitors and degenerates are like cockroaches. They have survived the bombs but they will not survive us.\n\nCleansing our bunkers of these rats is to become the first priority of the £GFX_OMS_black_league_texticon §sBlack League§!. Every crevice and nook must be inspected. The enemy cannot be allowed to persist a second longer. The rot will be cleansed. The League will endure. The traitors will be dealt with by any means necessary for the survival of our Motherland."
 OMS_stunning_silance:0 "Stunning Silence Under The Surface"
 OMS_stunning_silance_desc:0 "Initial reports from our forward scouts have revealed a gradual dissipation in radiation levels, finally permitting our League access to the surface again. It is time for our citizens to finally put into practice their reclamation training, slowly taming the desolate wasteland we once called our home. These measures will include the construction of localized checkpoints outside of Omsk itself, rebuilding armament workshops, and forming a civilian sector so that we may create a functioning economy once more.\n\nIn time, our Motherland shall stand as a beacon of justice and civilization amongst the ruins of the old world—a land of strength, industry, and martial peoples."
 OMS_matter_of_clarity:0 "A Matter Of Clarity"
 OMS_matter_of_clarity_desc:0 "All the dominoes have fallen. Every single event that was meticulously crafted day and night by the Glavkoverkh has successfully gone all to plan one way or another, the £GFX_OMS_great_trial_texticon §xGreat Trial§! has brought itself to its inevitable conclusion. All the fighting and bloodshed could end, all the hatred towards the Germans; it was all over, and Yazov couldn't feel any emptier.\n\nWith who we thought were the last remnants of the £GFX_OMS_teutons_texticon §qTeutons§! now dead in the snow, Yazov has prepared to leave the bunkers himself to face the hellish reality he himself has brought upon not just the citizens of Germany, but the whole world itself."
 
 OMS_once_more_into_the_breach:0 "Once More Into The Breach"
 OMS_once_more_into_the_breach_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! stands at the precipice of reclaiming the motherland and destroying the Teuton menace that lies beyond. It is, therefore, necessary to create new staging points by modifying our existing bunkers into strongpoints, allowing us to wreak havoc on our enemies without worry of reprisal attacks.\n\nBy repurposing old redoubts into supply hubs and checkpoints, our engineers and logistics officers shall become the bedrock of our next generation of soldiers. These new warriors, hardened by the harsh, unforgiving wastes we call Russia, will surpass even the Spetsgruppa in determination, with our strongpoints following them every step in the way."
 OMS_form_new_regiments:0 "Form New Regiments"
 OMS_form_new_regiments_desc:0 "It is a tragic reality that many of our brave comrades were eviscerated in the climax of the £GFX_OMS_great_trial_texticon §xGreat Trial§!. However, that shall not stop the £GFX_OMS_black_league_texticon §sBlack League§! in continuing the fight. From the men we saved to the next generation, we shall bring forth new divisions that will revive our strength—perhaps forging an army even stronger than before.\n\nThis new force of the League will be more than capable of bringing the wastes to heel. Our loyal men shall know no fear as they march and redeem our fallen warriors for the good of our Glavkoverkh."
 OMS_break_open_the_caches:0 "Break Open The Caches"
 OMS_break_open_the_caches_desc:0 "Our beloved and treasured motherland lies under a coat of nuclear ash, with her industries either obliterated into dust or picked apart by scavengers. With our Glavkoverkhs' preparations to reclaim our country now underway, we must tap into our vast underground arsenals to prepare for the oncoming national struggle.\n\nIn preparation for our great advance into the unknown, the League has managed to stockpile a grand array of equipment acquired during our conquests, ranging from antiquated rifles to howitzers and armor. While these expansive stores cannot be expected to last forever, we can only pray that what, who, or what we find,does not exhaust our depots before the national vengeance can begin anew."
 OMS_salvaged_tanks:0 "Salvaged Tanks"
 OMS_salvaged_tanks_desc:0 "Reports from our advanced groups of scouts have brought astonishing news from the surface; collections of pre-war armored vehicles have been found intact within the vicinity of the Omsk Bunker, and are in good enough condition to be salvaged and eventually returned to service.\n\nThe tanks vary greatly in make and origin, with some bearing the mark of the Teutonic hordes, while others remain as shells of our fallen comrades, still lingering around our capital in a stasis-like trance. While the rehabilitation process will take some time, the prospect of fielding armor on the battlefield once more greatly entices our new breed of warriors."
 OMS_our_chemical_arsenal:0 "Echos Of Our Vengeance"
 OMS_our_chemical_arsenal_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! shall retrace the steps of its fallen comrades and march once more into Western Russia, cleansing the land of chaos and anarchy just as they helped to cleanse the motherland of Germanic tyranny. We must rearm and support our soldiers as they prepare to cross into the unknown to achieve this. The next step in finally destroying the Teutonic beast necessitates the reconstruction of old railroads, depots, workshops, and the trains needed to transport our soldiers into the Wasteland for us to begin the great reclamation.\n\nOnce our army's necessary infrastructure is complete, we shall drill our next generation of men into the patriotic warriors of old. Nothing shall be left to chance. Russia will be saved, lest the Teuton tendrils return like a blight upon our Motherland."
 OMS_underground_workshops:0 "From The Earth, We Fight"
 OMS_underground_workshops_desc:0 "The Germans, in one final attempt to preserve their decrepit Reich from our touch, wrought the fires of the atom upon the lands of Russia. They believed in our destruction. They were wrong. Under the unbreakable will of our Iron Marshal, the £GFX_OMS_black_league_texticon §sBlack League§! fights on from the depths of the earth, waiting for the chance to once again unleash our wrath against all who oppose us. In due hours, our armies will bring swift justice to the surviving roaches who still infest our homeland. bringing vengeance to those who doomed our Russia to a decade of anarchy.\n\nIn the meantime, however, all is not well underneath the desolate surface. Food has begun to run scarce within the cold, isolating walls of the Omsk Complex, and disloyalty has once again begun to creep back into our ranks. We must address these pressing issues eventually, but for now, our League survives. Its steel heart is still beating strong in the face of the apocalypse."
 OMS_control_the_heavens:0 "Control The Heavens"
 OMS_control_the_heavens_desc:0 "Our army grows stronger day after day, but they are nothing but walking bodies and scrap metal if our mortal enemies retain mastery over our skies. It is thus pertinent that the £GFX_OMS_black_league_texticon §sBlack League§! must scavenge as many planes from the wasteland as we can. Be it the simple biplanes of the bygone Free Aviators or the jets of our fallen comrades, we shall recover them and reclaim the skies just as we reclaimed Russia on our path to glory.\n\nWith our planes dominating the skies once more, we shall ensure the destruction of our enemies and bring unbridled fear wherever they roam. For as long as our League hunts the clouds, the bandits and traitors who inhabit our lands shall fear the Sun like a divine blight."
 OMS_Leagues_Heart:0 "Heart Of The League"
 OMS_Leagues_Heart_desc:0 "The £GFX_OMS_black_league_texticon §sBlack League§! has forged a generation of steel through fire and blood, a manifestation of the League's unbreakable will in the face of hardship. Like a well-oiled machine, our soldiers must be prepared to crush anything that dares to oppose them in the radioactive vacuum outside our reach. While much of our army was scattered and destroyed during the climax of the £GFX_OMS_great_trial_texticon §xGreat Trial§!, a new wave of recruits have arisen to fulfill their martial duty.\n\nWhile some cadres of men may require more, 'patriotic instillment' than others, we shall forge the chaff into a core of iron. Hard times require strong men, and the next generation shall serve as the tip of our spear in the reclamation of Russia."
 OMS_remind_them_of_their_duty:0 "Remind Them Of Their Duty"
 OMS_remind_them_of_their_duty_desc:0 "Like the aging guns buried deep within our soil, the resolve of our citizens has slowly rusted away during our time beneath the surface. Some question our stringent food rationing and the necessity of our martial law, others dare to slander our Marshal and even the £GFX_OMS_great_trial_texticon §xGreat Trial§!'s purpose. They will be reminded of their place in our Bunker.\n\nWe shall summon a new wave of heroic propaganda aimed at all sects of our society. Whether it's the young or the old, all shall serve and fight to bring justice to the motherland and our fallen comrades. When Germany's stench is wiped from the earth, they will know true victory. Until then, we shall fight."
 OMS_the_eagle_will_fall:0 "The Eagle Will Fall..."
 OMS_the_eagle_will_fall_desc:0 "Neither death nor Hell can stop the £GFX_OMS_black_league_texticon §sBlack League§!'s righteous cause in securing redemption for our ancestors. For too long mortal weaknesses such as plague, hunger, and greed have chained us to our pain. Enough of this! Russia will never know peace for as long as the Teuton's memory endures. We survived the power struggles, we survived the Unification Wars, and we will survive the fires of Satan.\n\nNo longer shall our suffering blind us from our true purpose. Whether it takes years, decades, or centuries, we shall stand alongside our Glavkoverkh until our flag waves above Germania for good."
 OMS_no_matter_the_cost:0 "...No Matter the Cost"
 OMS_no_matter_the_cost_desc:0 "The day of prophecy has arrived! Our army stands ready, our citizens are motivated, and the Glavkoverkh holds firm. With the wastes desperately waiting for their liberation, we cannot afford to wait any longer.\n\nJust as our ancestors crossed the border into Moskowien so long ago, we will enter the underworld and complete our mission. Now, or never"

