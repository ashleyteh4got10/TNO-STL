 # Decisions
 
 OMS_2WRW_show_western_front_decisions:0 "Show Western Front Decisions"
 OMS_2WRW_hide_western_front_decisions:0 "Hide Western Front Decisions"
 OMS_2WRW_grand_offensive_stratagem_decision:0 "Grand Offensive Stratagem"
 OMS_2WRW_grand_offensive_stratagem_decision_desc:0 "We'll divert extra resources from our storages for a grand general offensive in the spirit of comrade Glavkoverkh Yazov himself."
 OMS_2WRW_ceaseless_assault_stratagem_decision:0 "Ceaseless Assault Stratagem"
 OMS_2WRW_ceaseless_assault_stratagem_decision_desc:0 "Our commissars will instill into our soldiers the patriotic fervor needed to charge relentlessly towards the enemy and never stop until all opposition has been obliterated."
 OMS_2WRW_chemical_saturation_stratagem_decision:0 "Chemical Saturation Stratagem"
 OMS_2WRW_chemical_saturation_stratagem_decision_desc:0 "Additional planes, artillery and rockets will be made to carry chemical payloads. A cloud of chemicals will sweep away the Germans as our men march behind it."
 OMS_2WRW_firestorm_assault_stratagem_decision:0 "Firestorm Assault Stratagem"
 OMS_2WRW_firestorm_assault_stratagem_decision_desc:0 "The Germanic disease will be eradicated by a storm of fire that will burn down his forts, his homes, his dreams. As scorched earth greeted the enemy when he marched into our Motherland, scorched earth will greet our men as they lay waste to the Teuton's nest."
 OMS_2WRW_strategic_repossession_theorem_decision:0 "Strategic Repossession Theorem"
 OMS_2WRW_strategic_repossession_theorem_decision_desc:0 "Rather than destroying all that lays before us, we'll temporarily slow down our offensive to requisition non-combatant assets within or zones of control. The ill-gotten riches of Germany will thus go straight to our war chests."
 OMS_2WRW_show_home_front_decisions:0 "Show Home Front Decisions"
 OMS_2WRW_hide_home_front_decisions:0 "Hide Home Front Decisions"
 OMS_2WRW_expropriate_assets_non_combatants_decision:0 "Expropriate Assets From Non-Combatants"
 OMS_2WRW_expropriate_assets_non_combatants_decision_desc:0 "The non-combatants will have to learn to live with less. Cars, fuel, food, metals and even the clothes they wear is better needed at the front lines. Our commissars will scour cities to make sure that our patriotic laborers contribute to the war effort."
 OMS_2WRW_expand_labor_force_decision:0 "Expand Labor Force"
 OMS_2WRW_expand_labor_force_decision_desc:0 "The non-combatant segment of the population knows that there is no such thing as too old, young or sick to work. They must all do their part for the war effort. If they will not face death on the frontlines, they will do so in the workshops if need be."
 OMS_2WRW_propaganda_saturation_decision:0 "Propaganda Saturation"
 OMS_2WRW_propaganda_saturation_decision_desc:0 "Our people will read about the triumphs of our army and see for themselves the annihilation our army is causing the enemy on their screens. Day and night, the music of victory will be their companion."
 OMS_2WRW_crush_defeatist_sentiments_decision:0 "Crush Defeatist Sentiments"
 OMS_2WRW_crush_defeatist_sentiments_decision_desc:0 "Even as victory is at hand there are still those who would prefer humiliation beneath the German jackboot over doing their part to achieve final victory. The Black Hand will bring them into line."
 OMS_2WRW_find_additional_volunteers_decision:0 "Find Additional Volunteers"
 OMS_2WRW_find_additional_volunteers_decision_desc:0 "There are many people across the nation who have not volunteered for military service yet, often laboring under the misconception that they're unfit to serve or can serve the Motherland better at home. Our security forces will scour the countryside and cities to find these men and help them volunteer."

 OMS_2WRW_readiness_construct_siberian_redoubts:0 "Construct Siberian Redoubts"
 OMS_2WRW_readiness_construct_siberian_redoubts_desc:0 "We will construct more networks of underground fortifications on top of the ones we already have in our Siberian strongholds, ensuring that more of our people survive the inevitable."
 
 OMS_2WRW_readiness_construct_finnish_logistics:0 "Construct Finnish logistics network"
 OMS_2WRW_readiness_construct_finnish_logistics_desc:0 "The reclamation of the old Imperial capital of Russia will be second in importance only to the recapturing of Moscow once we embark on our §RGreat Trial§ against the Germans. The barbardic Finns, however, built their Karelian logistics grid around the foolish idea of retaining their ill-gotten spoils of war. Let us instead repurpose it for the liberation of Russian lands."
 
 OMS_2WRW_readiness_construct_nikolaigrad_redoubts:0 "Construct Finnish Redoubts"
 OMS_2WRW_readiness_construct_nikolaigrad_redoubts_desc:0 "It isn't enough that we turned the den of vipers known as Helsinki into a Russian city. Our work isn't complete until we integrate it and other key cities into our national redoubt. It'll ensure that the new Russian citizenry will survive the aftermath of the §RGreat Trial§, as well as make any Teutonic attempt to strike back at us completely futile."
 
 OMS_2WRW_readiness_construct_establish_baltic_navy:0 "Establish a Baltic Naval Presence"
 OMS_2WRW_readiness_construct_establish_baltic_navy_desc:0 "We've been denied access to the Baltic Sea for three decades and it's about time that the Black Fleet made its presence felt here. By constructing new naval facilities here we'll be able to reclaim our naval legacy on this region. With it, we'll be in a position to strike directly at German cities in the north once the §RGreat Trial§! begins, shattering any illusions their so-called civilians may have that they'll be safe from our wrath."
 
 OMS_2WRW_readiness_construct_western_redoubts:0 "Construct Western Redoubts" 
 OMS_2WRW_readiness_construct_western_redoubts_desc:0 "A large portion of our population and industry currently reside in western Russia. Lacking strong natural defenses, it's imperative that we build fortifications to protect our factories and laborers from enemy strikes and, in the worst case scenario, serve as forward frontline bases if the enemy breaks through our lines."

 OMS_2WRW_readiness_construct_far_eastern_redoubts:0 "Construct Far-Eastern Redoubts"
 OMS_2WRW_readiness_construct_far_eastern_redoubts_desc:0 "Far beyond the reach of Germany's bombers, the Far East will be a major strongpoint for the rebuilding of our society after the Great Trial is complete. By creating additional underground redoubts in these areas, we'll ensure a future for our nation long after the bombs fall."
 
