 OMS_chemical_weapons_gui_info_tt:0 "We may be working on producing considerable stockpiles of WMD's, but our stockpiles of our other 'Weapons of National Vengeance' ready to be used at the warfront is a very different matter...\n\nDecisions on the top right tab of the GUI allow you to fill your stockpiles. The more weapons we have, the longer we will be able to utilise them on the frontlines. We can also initiate further stages, which upgrades our chemical and biological weapons at the cost of the weaponry's stability. If the weapons become too unstable, engaging them in war will result in us also being hit by the weapons. To stabilise the weaponry, you can utilise the bottom right tab of the GUI."


