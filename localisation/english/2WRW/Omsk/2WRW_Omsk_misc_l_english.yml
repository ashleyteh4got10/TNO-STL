 OMS_we_stand_at_the_precipice_of_our_final_war:0 "We stand at the precipice of £GFX_OMS_great_trial_texticon §xOur Final War§! against the £GFX_OMS_teutons_texticon §qReich§!, though some last preparations must be made…"

 OMS_rapidly_escalate_arsenal_of_vengeance:0 "We will begin to rapidly escalate our £GFX_OMS_chemical_weapons_texticon §Karsenal of vengeance§!...\nThe Chemical Weapons GUI will become inaccessible!"

 OMS_any_means_necessary:0 "The £GFX_OMS_black_league_texticon §sBlack League§! will use any means necessary against the £GFX_OMS_teutons_texticon §qmenace of the Huns§!, though some will not have the stomach..."
 
 OMS_posturing_might:0 "The £GFX_OMS_black_league_texticon §sRussian National§! Army will put on one final display of its might before the £GFX_OMS_great_trial_texticon §xTrial§!"
 
 OMS_our_agents:0 "Our agents in Moskowien will finally commence §ROperation Chernobog§!"

 OMS_chemical_weapons_gui_enabled_tooltip:0 "We will build an £GFX_OMS_nuclear arsenal capable of §Rburying the Teutonic threat forever§!..."

 OMS_the_time_is_now:0 "§RAt long last, the Reich shall be wiped from the earth as we begin the Great Trial!§!"

 OMS_sending_them_gifts:0 "§WWe shall send the§! §qTeutons§! §Wa§! §Rgift§!."
 
 OMS_activate_weapons:0 "§RBIOLOGICAL WEAPONS WILL BE UNLEASHED WITH THE FIRST SHOT OF THE WAR!\nCHEMICAL WEAPONS WILL BE UNLEASHED WITH THE FIRST SHOT OF THE WAR!§!"

 OMS_100_readiness_needed:0 "§Y100§! readiness."

 OMS_in_bobrikov_footsteps_tt:0 "We'll destroy the very concept of the Finnish in due time. Once the bulk of the work is done, Finland will once again become §RPart of the Russian core territory.§!\nIn the meantime, we can expect a notable strain on our infrastructure"

 # Dynamic Modifiers
 OMS_chemical_warfare_dynmod:0 "§RChemical Warfare§!"
 OMS_chemical_warfare_dynmod_desc:0 "The Great Trial has begun and the Black League has already made its opening move. In massive bombing campaigns, chemical weapons have been deployed in both our cities and on the frontline en masse. The effects are already taking a toll on our country and our ability to defend ourselves from their aggression.\n\nTheir weapons are indiscriminate. For every one of our soldiers that's killed, an equal number of civilian lives are taken. The Black League has set the scene for this war already:\n\n§RThis is a War of Annihilation.§!"
 OMS_biologic_warfare_dynmod:0 "§RBiological Warfare§!"
 OMS_biologic_warfare_dynmod_desc:0 "The Great Trial has begun and the Black League has already made its opening move. In massive bombing campaigns, biological weapons have been deployed in both our cities and on the frontline en masse. The effects are already taking a toll on our country and our ability to defend ourselves from their aggression.\n\nTheir weapons are indiscriminate. For every one of our soldiers that's killed, an equal number of civilian lives are taken. The Black League has set the scene for this war already:\n\n§RThis is a War of Annihilation.§!"
 GER_biologic_warfare_dynmod:0 "§RBiological Warfare§!"
 GER_biologic_warfare_dynmod_desc:0 "The Great Trial has begun and the Black League has already made its opening move. In massive bombing campaigns, biological weapons have been deployed in both our cities and on the frontline en masse. The effects are already taking a toll on our country and our ability to defend ourselves from their aggression.\n\nTheir weapons are indiscriminate. For every one of our soldiers that's killed, an equal number of civilian lives are taken. The Black League has set the scene for this war already:\n\n§RThis is a War of Annihilation.§!"
 2WRW_collateral_damage_dynmod:0 "§RCollateral Damage§!"
 2WRW_collateral_damage_dynmod_desc:0 "The Great Trial has begun, and the weapons we've deployed have already seen tremendous success in crippling the Teuton defense effort. Their supply lines are crippled, their cities are in chaos, and their frontlines are barely able to form a cohesive defense. Despite this, we've seen repercussions on our lands.\n\nWeapons that we've deployed are starting to harm our soldiers. They're more potent than we anticipated, and the arsenal seems to be more than what our current CBRN kits can handle. They've caused casualties amongst our frontline soldiers, and even illnesses in some frontline cities. But despite this...\n\n...§RNo cost is too much for the Great Trial.§!"

