 OMS_their_fatherlands_wealth:0 "Their Fatherland's Wealth"
 
 OMS_the_great_trial:0 "§RThe Great Trial§!"
 OMS_the_great_trial_desc:0 "The time is now. Our sole purpose, the defining moment in the history of Russia and her people, has arrived. We have prepared for many years, and hammered the heart and soul of our nation into a machine capable of finally bringing the end of the Teutonic horde. Millions toil in the iron arteries of industry as millions more march forward into our former heartlands to finally avenge the countless millions who were slaughtered.\n\n §RThe Great Trial, has begun.§!"

