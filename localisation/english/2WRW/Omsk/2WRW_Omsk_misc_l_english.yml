 # Chemical Weapons
 infantry_equipment_chemical:0 "CBRN Technology"
 infantry_equipment_chemical_0:0 "LPC-70"
 infantry_equipment_chemical_0_desc:0 "The Light Infantry Chemical Thrower is a weapon developed by the Black League's scientists to provide the infantry of the future reclamation wars with readily available access to the arsenal of vengeance for use against anyone who'd dare to stand against them. It fires a deadly chemical payload onto its targets that's strong enough to corrode most light cover soldiers may find in the field and leave behind clouds of toxins. The weapon requires heavy-duty protective gear to use, but is otherwise remarkably safe for the user thanks to its robust design. Black League squads designated as Chemical Vengeance Legionnaires usually operate with six chemical throwers, with the rest of the squad operating light machine guns to provide covering fire on the advance. The weapon is highly potent as a shock infantry weapon and being allowed to use it is seen as both a badge of honor for the courageous soldiers that are granted this weapon (and extensive protective gear), though its heavy and short-ranged nature makes it ill-suited for defense compared to more conventional infantry weapons. Whenever Chemical Vengeance units are deployed, field commanders of the Black League are required to make sure that all regular soldiers in the vicinity are given at least the most rudimentary protective suit in the field to avoid unnecessary injuries. Consequently, a Black Hand officer threatening soldiers with being designated as penal support infantry for the Chemical Vengeance Legionnaires is often enough to scare even the most unruly soldier into getting back in line."

 # Ideas 

 OMS_Separate_The_Wheat_From_The_Chaff_idea:0 "Seperate the Wheat From the Chaff"
 OMS_Separate_The_Wheat_From_The_Chaff_idea_desc:0 "The war against the Teutonic Menace demands the strongest, purest individuals within Russia to be of service to the Russian National Army.\n\nThe Army shall not dare be infested with any perfidy or ineptness that'll dismantle all adroitness present within the League. No excuses."
 
 OMS_the_men_in_the_factories_idea:0 "The Men in the Factories"
 OMS_the_men_in_the_factories_idea_desc:0 "All undersirables rotting within the cells have unpaid debts. They shall be repaid, rightfully so. Each and every one of them will be assigned to the factory lines. No exception can be made to a man of crime."
 
 OMS_the_men_in_the_front:0 "The Men in the Front"
 OMS_the_men_in_the_front_desc:0 "Harsher conscription methods must be utilised across Russia if we are to protect the Motherland from the Menace. It is a pure, warranted obligation to mobilise and train every man and woman for the War. Nothing more than an essential obligation."

