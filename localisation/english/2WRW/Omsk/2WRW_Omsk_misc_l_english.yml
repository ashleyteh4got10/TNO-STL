 ### Far East Decisions ###
 OMS_operation_alekseyev_category:0 "Operation Alekseyev"
 OMS_operation_alekseyev_category_desc:0 "Although a diversion from the §RGreat Trial§!, there are still Russians living under Japanese occupation in Manchuria. They must be brought back under rightful Russian control so that they can do their part in taking down the western beast. Everyone must do their part. Their ancestors dereliction of their duty to their nation is no excuse.\n\nThe operation is rather simple. We must take the designated area of land and hold it against the inevitable counterattack. We can spare one short-term allocation of additional supplies to bolster our efforts in the region, but no more. It was all go towards the §RGreat Trial§! itself."
 OMS_attack_manchuria:0 "Begin the Operation"
 OMS_attack_manchuria_desc:0 "§RThe terrain in the Far East is cold, and treacherous. The fight will not be easy. Be prepared.§!"
 OMS_skirmish_buff:0 "Reinforce Operations"
 OMS_skirmish_buff_desc:0 "More assets will be sent to reinforce Operation Alexseyev. §RWe cannot spare much more than this. Everything has to be dedicated for the Great Trial.§!"
 operation_alekseyev_cooldown:0 "§$OP ALEKSEYEV§!: MANCHURIAN REINF ENROUTE"
 operation_alekseyev_cooldown_desc:0 "\n§$OPERATION ALEKSEYEV§!: MANCHURIAN REINFORCEMENTS ENROUTE"
 OMS_manchuria_buff:0 "Reinforced Operations"
 OMS_manchuria_buff_desc:0 "The current border operations in the Far East have been reinforced."
 SWRW_OMS_the_eastern_redoubt_category:0 "The Great Eastern Redoubt"
 SWRW_OMS_the_eastern_redoubt_category_desc:0 "It should come as no surprise that much like in 1853, all enmity between our adversaries evaporate when the time comes for Russia to bring justice to the world. The moment our §RGreat Trial§  started to bring final retribution to the criminals in Germania and its collaborators, the rotten cretins in Washington and Tokyo sharpen their claws as they prepare to come to aid of the Nazi regime.\n\n Thanks to the efforts of the Black Hand however, we have been given ample time to prepare every Russian citizen to perform their duty against the looming threat. Defenses will be built, spies will be rooted out and fresh volunteers will be brought into service. Should our defenses in the east falter, we'll bring nuclear retribution to the homelands of those that try to impede the §RGreat Trial§.\n\n Let it be known that §eAnyone who stands against us will die just like the Teuton he protects.§"
 SWRW_OMS_declare_war_eastern_retribution:0 "Declare the War of Eastern Retribution"
 SWRW_OMS_declare_war_eastern_retribution_desc:0 "The Japanese and their vassals strike us because they think we're weak. A fatal mistake, and it will be their last. We'll destroy every last one of the invaders and finally bring about justice for their long history of egregious crimes against the Russian nation."
 SWRW_OMS_create_black_guard:0 "Create The Black Guard"
 SWRW_OMS_create_black_guard_desc:0 "With the looming threat of war in Siberia, we need to use the time we still have to raise additional forces in the far east. The Glavkoverkh has decided that the best way of doing so is to establish a new people's Opolcheniye that will proudly protect their Motherland against any enemy incursion."
 SWRW_OMS_create_black_guard2:0 "Emergency Black Guard Volunteer Drive"
 SWRW_OMS_create_black_guard2_desc:0 "With the enemeies of Russia mustering their strength, we need to expand the scope of our defensive armies in the east without threatening the progress of the §RGreat Trial§ against Germany. Though they will only receive the most basic training, they will proudly serve the Motherland and bravely support their more experienced comrade soldiers as they fend off the enemy."
 SWRW_OMS_create_black_guard3:0 "Final Black Guard Volunteer Drive"
 SWRW_OMS_create_black_guard3_desc:0 "We'll bring forth one last batch of hastily trained soldiers from Siberia to aid us in the final victory in our §RGreat Trial§. Their patriotic duty will be to hold the line against the invaders so that we can bring about our final retribution against the hated Teuton!"
 SWRW_OMS_create_black_planes:0 "Establish the Siberian Strategic Defense Grid"  #I accidentally swapped these two decisions' effects around. whoops.
 SWRW_OMS_create_black_planes_desc:0 "We are very likely to face significant challenges from both the IJAAS and USAF in case war breaks out in Siberia as well as many other sophisticated forces of our enemy. It's therefore vital that we deploy additional engineers to the east to build strategic defenses against any invading force."
 SWRW_OMS_eastern_radar:0 "Establish the Black Guard Aviation Corps "Establish the Black Guard Aviation Corps
 SWRW_OMS_eastern_radar_desc:0  "We have large stockpiles of planes from the years of the Smuta that are mothballed in our armories. With the looming Japanese aggression, it might be prudent to refurbish some of these and bring these planes back in a defensive capacity. While they cannot defeat the USAF and IJAAS, they can support our defensive operations in Siberia under the cover of friendly AA."

 ### Great Trial Category ###
 OMS_2WRW_great_trial_category:0 "The Great Trial"
 OMS_great_trial_desc:0 "The moment we've prepared for has finally come as we embark on our §xGREAT TRIAL§! to smite the Teutonic beast once and for all. Time is of the essence however, as a drawn out conflict will §xstrain our society§!. Should our people falter, we'll have to take §xextreme measures§! to ensure our final victory over the hated Goths."
 OMS_great_trial_offensive_momentum_desc:0 "With each strategic victory, the Black League grows stronger as it marches on §xGermania§! for our final victory. Should we be pushed back to the national redoubt, however, the consequences will be §xSEVERE§!."

