 OMS_apocalypse_proofing:0 "Apocalypse Proofing"
 OMS_apocalypse_proofing_desc:0 "We intend for this to be a war to their annihilation, not ours. All pieces of key infrastructure in Russia are to be built partly or fully underground, designed to function after the nuclear bombs fall. This will make construction costlier but will ensure that our people will survive the §RGreat Trial§! and inherit the earth once the job is done. In the event that an enemy should strike Mother Russia itself, our soldiers can make ample use of these shelters and tunnels for protection."

 OMS_vengeance_against_the_occupant_1:0 "Vengeance Against the Occupant"
 OMS_vengeance_against_the_occupant_1_desc:0 "The hatred for our enemy is a perfect hatred, one which no one can ever hope to resist. As we liberate more of our sacred homelands and eventually lay waste to our enemy's filthy hovels, anyone who tries to stop us qill §Rmeet a fate worse than death.§!"
