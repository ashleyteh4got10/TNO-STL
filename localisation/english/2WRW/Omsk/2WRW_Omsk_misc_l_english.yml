 OMS_cull_the_officer_corps:0 "Cull The Officer Corps"
 OMS_cull_the_officer_corps_desc:0 "As the final days before the Trial pass, they bring with them rigorous inspection of Russia's armed forces, and it's become clear that traitors and their petty "ethics" seep into every crack in the Motherland, sabotaging the Black League's war effort.\n\nThe rot which has infested the Russian National Army must not be allowed to persist. Any who are not willing to carry out their assignments to the fullest extent must, by any means necessary, §Rbe relieved of their duty.§R"

 OMS_cull_the_officer_corps_2:0 "Cull The Officer Corps"
 OMS_cull_the_officer_corps_2_desc:0 "As the final days before the Trial pass, they bring with them rigorous inspection of Russia's armed forces, and it's become clear that traitors and their petty "ethics" seep into every crack in the Motherland, sabotaging the Black League's war effort.\n\nThe rot which has infested the Russian National Army must not be allowed to persist. Any who are not willing to carry out their assignments to the fullest extent must, by any means necessary, §Rbe relieved of their duty.§R"

 OMS_every_waking_moment:0 "Every Waking Moment"
 OMS_every_waking_moment_desc:0 "The Great Trial demands nothing less than complete devotion to bring the vast might of Russia to bear against the Reich. Each cog in the machine of the Black League will turn the great conveyor of vengeance.\n\nThere can be no rest for Russia's citizenry, be it in the factories, the farms, or the fields of combat. For every man, woman, and child who dies in service of their Motherland, another five hundred must take their place. There is no cost too high for our retribution."

 OMS_march_to_midnight:0 "March To Midnight"
 OMS_march_to_midnight_desc:0 "The final moments of peace for the Germans and their vile race come ever nearer to an end. In accordance, the Russian National Army must be ready to march onwards at a moment's notice, unimpeded and in a single stroke, bringing hell to the Reich.\n\nPreparations for such a large coordinated assault cannot be made at the last moment. The soldiers of Russia must be recalled from the frontier of the League towards the calling of destiny and retribution against the Hun, ready to enact their vengeance."

 OMS_pure_black_doctrine:0 "A Pure, Black Doctrine"
 OMS_pure_black_doctrine_desc:0 "The Red Army had many shortcomings, lack of weaponry, poor command structure, outdated equipment. But none were as obvious as the poorly planned, poorly executed tactics being used. It was first put on full display in the war with Finland, losing hundreds of thousands of men for what was a tiny gain in land, ultimately. And in the war with Germany we lost even more, whilst losing half of our country… An absolute disgrace.\n\nNever again.\n\nThe Black League's top strategists have been at work making new strategies, new plans. Whilst taking the lessons of our wars of unification and the lessons of foreign conflicts, we have rebuilt our army from the ground up. The Russian National Army has become an iron fist ready to take on any challenges that threaten our motherland, including the trial ahead. It has the equipment, the will, and the manpower to finally destroy the teuton once and for all."
 
