  HANGINGJUDGE_Walther_Wenck: "Walther Wenck"  
  POLITICS_HANGINGJUDGE_Walther_Wenck_DESC: "Walther Wenck had always been a career military officer. Having proved himself as Chief of Staff with the 1st Panzer Army as well as leading several other armies in the east, he had achieved numerous victories against the Soviet Union and played a significant part in its demise. None of these experiences could prepare him for what a victory against this new Russia would entail, if one could even call it a victory.\n\nIn an ironic twist of fate, he now seems destined to spend the twilight days of his life and career watching over what remains of western russia, the caretaker of scorched plains and smouldering ruins. He was a decorated officer of the Reich, there was no task that was beyond him. Or so he thought.\n\nEvery day, the refugee lines only become longer and longer. The shelters that still function within these lands are filled to the brim with the patients suffering varying degrees of radiation poisoning, dehydration, burns or starvation. Compounding the horror is the combined terror of both the Black League remnants and SS that wage their war against each other beyond the Urals. In the face of this, his men find themselves acting less like occupiers and more like peacekeepers as they struggle around the clock to deal with what can easily be considered one of the largest humanitarian crises in history, one that only grows in severity by the day.\n\nWenck was not equipped to handle this. After all, what man could? Yet as he watches the radioactive dust settle and the smoke clear, he can only roll up his sleeves and get to work, trying to pick up the pieces in this regional apocalypse. Not out of devotion to the Reich or his duty to the uniform.\n\nBut out of pity for the people he once saw as bitter enemies."  

  HANGINGJUDGE_Alexander_Barkashov: "Alexander Barkashov"  
  POLITICS_HANGINGJUDGE_Alexander_Barkashov_DESC: "In the smoke-choked ruins of Moskowien, where the shadow of Germany still looms over the bones of a defeated Russia, Alexander Barkashov has risen, the result of Germany's most perverse experiment yet. He is the scion of an entire generation assimilated into the national socialist ideology. As a result, Barkashov is neither puppet nor rebel. Instead, he is a willing fanatic, a Frankenstein's masterpiece, a Russian Übermensch who will do anything to keep the Russian wastes in line.\nHis beliefs are the relic of Albert Speer's efforts to "reform" Moskowien. Children, en masse, were taken from their parents. Instead of books, they were handed Hitler Youth manuals, and schooled in the tenets of Nazism. Where older Russians clung to shattered memories of defiance, Barkashov’s generation learned to kneel—and later, to rationalize that kneeling into their own twisted ideals regarding race.\nTo the new generation of Russians, Barkashov is a messiah—a man who will advance the Russian race to join their Germanic brothers. To the older generations, he is nothing but a grotesque warlord. Some kneel, but most have simply resigned themselves to their new, native masters. To Barkashov, the math is simple. If Moskowien endures, Russia shall ascend to Germany's equal."  

  HANGINGJUDGE_Gustav_Wagner: "Gustav Wagner"  
  POLITICS_HANGINGJUDGE_Gustav_Wagner_DESC: "Alone. Gustav Wagner is alone. But still, he trudges forward, for it is all he knows how to do.\n\nBefore the land was set aflame and the heavens torn asunder, none would have guessed Wagner would lead anything beyond an irredeemable band of killers, and they would be proven right. Yet this band of killers has, through fate and fate alone, gained importance well beyond its worth, for it has been made to fight the last war it will ever know. Yet this war is unlike any before it. Every day, another man is lost. Every day, another bunker, tunnel, or city is discovered, forcing Pyrrhic trades upon Wagner's ever dwindling supply of men. Every day, they draw closer to their only peers left in this world, and that very world punishes them for it.\n\nWagner can see the writing on the wall; he can see the casualty reports, the diminishing food stores, the balding, dizzying, bleeding, invisible plague that stalks them all. He knows that they may very well fail, that they may die before they arrive, or that they may perish even after victory. He has spent years mulling over each and every one of these facts. But what he cannot see is stopping—not now, not ever. He is a blind man, and he walks forth only through closing all paths behind or beside him to ensure there remains but one course of action left.\n\nDo or die. The world cares not which one occurs."  

  HANGINGJUDGE_Gustav_Wagner_Victory: "Gustav Wagner"
  POLITICS_HANGINGJUDGE_Gustav_Wagner_Victory: "There are many titles Gustav Franz Wagner has ascribed to himself over the years—what else would befit this self-described hero of the fatherland, second only to the Führer himself? "What else?" he ponders—"What else?" he asks out loud. And unfortunately for him, the Russian wastes have seen fit to answer.\n\nFor the Beast, the Wolf, the simple-minded butcher incapable of anything above the basest of tasks, motivated only by the basest of feelings and contemplating only the basest of thoughts, has been made a prisoner of his own making. There is no triumph, no rapture with the defeat of the Black League, however complete and utter. No satisfaction is derived from the death of Russia, no matter how many times he repeats it—now to himself alone, manning the Uralwall in stalwart defense of all that is German—so say the ruins of Germania.\n\nBut Wagner above all else knows the truth behind this farce, that he is unwanted even by those he claims to have saved, that he has been banished, sent to fend off foes from east and west alike—hordes, he claims. But even that is far from true, for all that is left is the occasional bandit to execute, or perhaps a scavenger to rob. Where worlds once met, where Europe becomes Asia and vice versa, Wagner can do little more but snuff out the remaining embers of human life, ever far and few in between. That is all that he has left, and no lie from Germania, nor from himself, can dispel that mundanely terrible truth."

  HANGINGJUDGE_Alexander_Lazarenko: "Alexander Lazarenko"  
  POLITICS_HANGINGJUDGE_Alexander_Lazarenko: ""  

  HANGINGJUDGE_Heinz_Gunther_Guderian: "Heinz Günther Guderian"  
  POLITICS_HANGINGJUDGE_Heinz_Gunther_Guderian_DESC: "Son of legendary commander Heinz Guderian, Gunther currently finds himself in a position not too distant from that held by his father. About forty years ago, Gunther’s father spearheaded the thunderous blitz of Panzers through the Benelux and into France. Now his son follows in his footsteps, although in a much more dire position.\n\nThe position he holds doesn't just encourage brutality, it almost demands it. Despite this, he's a standout amongst his counterparts. Yes, resistance is still handled through swift retribution to those responsible and people adjacent. However, most resistance is scarce, and German oversight is measured. Coupled with a populace who almost welcomed the German takeover due to decades under the oversight of Yazov’s Black League and their draconian rule, Reichskommissariat Turkestan is surprisingly stable in comparison to other newly acquired German holdings.\n\nGunther cares very little about that, however. As long as the recourses flow and the panzers are in working order, he's content. And as long as he’s content, the Kazakhs will be spared from the horrors that are far more commonplace in occupied Siberia."  

