  HANGINGJUDGE_Igor_Rodionov: "Igor Rodionov"  
  POLITICS_HANGINGJUDGE_Igor_Rodionov: "Comrade veterans of the §RFirst Great Trial§!, this is your new commander speaking.\nGlavkoverkh Dimitry Yazov has failed us and failed Mother Russia, as have her sons who once again fought valiantly on the battlefield only to fall short in our nation's hour of need.\nYet, their selfless sacrifice for the Motherland was not in vain. The beast in the west has been mortally wounded thanks to our collective efforts. While it bleeds and atrophies, we'll restore our nation from the safety of our National Redoubt.\nNow is not the time to mourn, but to work hard and regain our strength. Where our brothers and sisters fell today, we shall triumph tomorrow.\n§RComrade veterans, the Second Great Trial approaches.§! Our cause is just. Victory will be ours. Good night."  

  HANGINGJUDGE_Dmitri_Dmitriyevich_Vasilyev: "Dmitri Dmitriyevich Vasilyev"  
  POLITICS_HANGINGJUDGE_Dmitri_Dmitriyevich_Vasilyev_DESC: ""  

  HANGINGJUDGE_Konstantin_Ageev: "Konstantin Ageev"  
  POLITICS_HANGINGJUDGE_Konstantin_Ageev_DESC: "Konstantin Ageev has had an unlikely political journey. It began in the Russian Civil War, which led to him joining the Asano Brigade upon arriving in Manchuria upon which after, like many other exiles, he ended up in Harbin. Despite his Tsarist sympathies, he served in Rodzaevsky's Army as an infantry officer during the Smuta but ultimately found himself in Manchuria. n\\n\nThings went dormant, but his connections to Japan’s allies opened new doors for him when Yazov united Russia and engaged in a military campaign against the Co-Prosperity Sphere’s backyard. He was made to pay attention to Russia, not least when the so-called §RGreat Trial§ threatened to ignite a war. That war was a disaster with the Germans pushing up to the Urals and Siberia descending into  anarchy following the collapse of the National Redoubt. Seeing the writing on the wall, Japan responded by setting up a force led by former exiles to march into southern Siberia.  n\\n\nHe'd been hesitant to return where it all started for him, but the chance to work with Japan to restore the Russian Empire was an offer he couldn't refuse. After so much hardship, this could be the last chance to see the throne return to Russia. Now he is once more fighting to restore the great Russian Empire. With the support of Japan, he will be able to realize the dream he’s had ever since the defeat of the Whites so long ago."  

  HANGINGJUDGE_Emil_Spiridonov_Epilogue: "Emil Spiridonov"  
  POLITICS_HANGINGJUDGE_Emil_Spiridonov_Epilogue_DESC: "In the aftermath of the Great Trial, everyone believed it was truly over. How many times could Russia be plunged into the depths of anarchy, rising up again and again, only to fall even further? When would the cycle end? Every foreign observer came to the same conclusion: it wouldn't.\n\nThey were wrong.\n\nEmil Nikolayevich Spiridonov, commander of the Pacific fleet, had succeeded in his westward march and unified the tattered remnants of Russia once more, carving out a new Russian state that stretched from the Uralmauer to the Pacific. Under his watchful gaze, he had brought the nation back from the brink, healing the wounds and scars of the League's madness.\n\nExploiting the natural wealth of Siberia and enjoying cordial relations with the Organization of Free Nations, Spiridonov readies himself for his third and final term as the constitutionally elected president of the Russian Republic, proving that the embers of liberty and freedom were merely dampened, not extinguished.\n\nThere was still much to be done. Much of Russia's sovereign land lay beyond the Uralmauer and it would be decades before it would truly be whole again. But for now, the Russian dream no longer lay dead, as under Spiridonov's watch, many Russians feel something they haven’t felt for a long time.\n\nHope."  

  HANGINGJUDGE_Nikita_Romanov: "Nikita Romanov"  
  POLITICS_HANGINGJUDGE_Nikita_Romanov_DESC: "For a century, the Russian Empire was met with nothing but humiliation. Lost to the revolution, the Russian anarchy had brought a glimmer of hope to the great restoration, yet with the rise of the Black League and his fathers removal, it was not meant to be.\n\nBut Nikita Nikitich Romanov was not his father. Backed by allies in Tokyo, no longer shall the Tsar bow to the whims of the White Army, nor fall to internal division and strife. Picking up the pieces of the Siberian Plan and rallying what few monarchists remained to join his cause, he succeeded in carving out his destiny within the Siberian Empire.\n\nAs the Tsar rebuilds his fiefdom and rallies the remnants of the Imperial Army, he knows that if he fails, he will have no successor, there will be no third chance. Under his banner, the Two-headed eagle will cry out victorious once more, or die in darkness with the final embers of monarchism extinguished forever.\n\nYet these circumstances only harden Nikita’s resolve. He will fight tooth and nail to ensure the Empire survives. He will fight to the bitter end to see Russia reunited once more under his reign. When the Imperial Army marches west toward the Ural Mauer, he will make one final declaration.\n\nNever again will the Empire suffer such a humiliation, for the Tsar of All Russias wills it."  

  HANGINGJUDGE_Emil_Spiridonov: "Emil Spiridonov"  
  POLITICS_HANGINGJUDGE_Emil_Spiridonov_DESC: "When the union fell and Russia was plunged into anarchy, many former soviet officers rallied under the teachings of Karbyshev and his Black League. One such naval officer was Emil Nikolayevich Spiridonov, a talented submarine captain whose skill and prowess led him to become commander of the Black League's Pacific fleet. Yet soon he started to become disillusioned by Yazov's militarism as he watched more and more atrocities being committed in the name of vengeance.\n\nSo when the inevitable order was given to fire the Pacific fleet's nuclear missiles, targeting the Co-Prosperity sphere, Spiridonov refused, mutinying against the League, in the process sparing millions of lives and countless millions more from the horrors of nuclear war.\n\nThus, when the sound of gunfire died down and the flags of the league were lowered, he found himself taking up the role of a peacekeeper maintaining stability in the far-east, a position he’d never have foreseen in his wildest dreams. As thousands look up to him for safety and guidance and with the Pacific fleet behind him, this once humble submariner gears up for one final struggle.\n\nTo free Russia from the grip of tyrants, whether they be from within or without."  

  HANGINGJUDGE_Erich_Topp: "Erich Topp"  
  POLITICS_HANGINGJUDGE_Erich_Topp_DESC: "Erich Topp is not a happy man.\n\nAn awardee of the Knight's Cross, Topp began his days in the navy in the early thirties, just as National Socialism was beginning to take its roots in the country. His commitment to the ideology matched his constant placing near the top of his class. The Second World War and later West Russian War saw a very successful U-Boat career, with Topp becoming an influential voice in the Kriegsmarines' development. After all, he hadn’t just broken the Allies in the Atlantic, but had skillfully bested the Front in the White Sea as well.\n\nBut as time went on, as Hitler's health worsened, and as the German Reich began to crumble, his faith in the ideology waned. He was content to reside himself to desk jobs and paperwork on an officer's salary for the past decades until his plans were ruined by the Black League. Called back to active service in the face of such an overwhelming threat, he's been left to handle the waning months of their naval war in the Arctic Sea.\n\nNow, he maintains a watchful gaze over one of Russia's only surviving ports and the ice drifts of the north. Patrolling and trying to keep supplies flowing through the northern sea routes; a position that few envy. For the people of Russia he's forced to contend with, service under him is one of the best fates they could ask for in comparison to his much more committed peers.\n\nBut for Topp, he just wants to go home, and to have nothing more to do with this."  

  HANGINGJUDGE_Georg_von_Boeselager: "Georg von Boeselager"  
  POLITICS_HANGINGJUDGE_Georg_von_Boeselage_DESC: "The halls of the Vorkuta Gulag have, for the past fifty years, been roamed by the spirits of untold hundreds of thousands who perished within its confines. Even as cold winds sweeping north across the icy plains bring radiation from the fall of the now obsolete Black League, it shall not know peace. A new scourge has taken hold of the site: Georg von Boeselager.\n\nBane of partisans all across Moskowien, von Boeselager was in command of many successful anti-bandit and counter-insurgency operations in the area since Barbarossa. Even as he grows older, his methods do not become less brutal. Mass deportations and summary executions were common methods for handling areas gripped by partisan activity. Even as he's evaded innumerable attempts on his life, his draconian methods remain.\n\nAnd now, his grip is held tight in the north within Festung Nenzen. The final stop on the trip of Black League soldiers and sympathizers before the grave. The scores of unnamed and forgotten dead who endlessly roam the Vorkuta Gulag will only continue to rise under his watch. In an ever escalating arms race of cruelty against the Russian people, he is determined to make sure that they blink first and submit to the Reich."  

  HANGINGJUDGE_Werner_Molders: "Werner Mölders"  
  POLITICS_HANGINGJUDGE_Werner_Molders_DESC: "Werner Mölders had been fighting Germany's wars for what might as well his entire life. He first flew in combat in Spain, fighting for the Condor Legion, then later in France, then on the Eastern Front. At this point, he has arguably spent more time in the sky than on the ground. Now as his career and life enters its twilight years, he takes on one more assignment, this time to make sure he never has to fight again.\n\nAs the head of Jagdverband Mölders, stationed in the vast hinterlands of Sakha, he and his pilots hunt the remnants of the Omsk Air Force, who constantly sally out of their endless underground bases and hidden airfields to harass German soldiers and air traffic moving through the Far East. It is a miserable assignment, hindered constantly by angry locals, a lack of supplies, and the hellishly cold weather. Battling the wind just as much as the Russians, Mölders still takes to the sky in these dangerous conditions, never content to sit back.\n\nHis mission will be an assignment he takes to the grave. However, if it ensures one less Russian fighter is left to harass the Final Victory, then so be it."  

  HANGINGJUDGE_Wilhelm_Monke: "Wilhelm Monke"  
  POLITICS_HANGINGJUDGE_Wilhelm_Monke_DESC: "Victory always comes at a cost, a saying that Germany knows all too well. Three victorious wars had failed to quell the rebellion in the lands of the Rus. From the East, a continuous spill of Asiatic hordes, the impure masses clawing at the gates of the Reich to try and pillage what was inside. This could never happen again.\n\nWilhelm Mohnke, one of the Reich's most loyal scions, has been tasked with ensuring this. In order to accomplish this mission, he has reverted to the most basic of solutions: a wall. The Ural Mountains, forming an already formidable natural barrier, would be reinforced under the newly established SS-Uralwall-Armeeoberkommando. Tens of thousands of engineers and conscripted locals will build bunkers, erect defensive installations, and plant mines throughout the Ural's peaks and passes.\n\nNo doubt the cost will be high and Mohnke knows he will not live to see the final touches. Afterall, besides just the wall, the SS has been given the lofty task of cleansing every native out from Germany's side of the wall. Although not as intense as past wars he has fought, the task has only just begun. Nevertheless, he moves forward, prepared to do anything for the Reich as he has done since 1933."  