 OMO_autonomy_1_desc_COM: "OMOLON\n\n[?global.date.GetDateStringNoHourLong]\n\nDear Comrade [564.owner.GetLeader],\n\nWe've been notified of your recent accomplishments of unifying the region, which we applaud as a significant step towards recovering order and stability across Russia. We're sending this letter as an appeal for peaceful unification, in peace and unity unified.\n\nWe ask of you dearly to honor the people of their region, ethnically majority and minority alike, and their wishes to practice religion and traditions. The people of Siberia wish for peaceful cooperation and contribution in hopes for a future unification of all Russians.\n\nWe wish and hope for the bestest possible cooperation, unity and peace.\n[OMO.GetLeader]"
