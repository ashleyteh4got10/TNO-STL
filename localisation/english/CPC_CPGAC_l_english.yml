 CPGAC_prop_increase_citizens_subsidy: "Expand urban household subsidies"
 CPGAC_prop_increase_citizens_subsidy_desc: "The Party's established policy prioritizes supporting urban industries, resulting in an expanding urban industrial workforce. To maintain stability in urban areas and encourage industrial workers to boost production, the central government has decided to expand urban household subsidies to meet the people's growing material needs.\n\nIn conclusion, the £CPGAC_texture_loc §GCPGAC§! voted to approve the £TER_texticon_liu §mproposal to expand urban household subsidies§!."
 CPGAC_prop_increase_citizens_subsidy_effect: "The approval of this issue is a prerequisite for the national focus on §YEducation Subsidies§! and §YSupervision of working hours standards§!."
 CPGAC_prop_increase_citizens_flag: "£CPGAC_texture_loc §GCPGAC§! voted to approve the §mMajor Issue§! to §YExpand urban household subsidies§!."
