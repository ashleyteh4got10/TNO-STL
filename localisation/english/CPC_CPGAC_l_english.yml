 CPGAC_portrait_hog_desc: "§Y[TER_CPGAC_name_hog]§!\n---------------------------\nPremier of the People's Government\n\nThe §YPremier§! is the head of the CPGAC and is responsible for overseeing government work.\n\nThe §YPremier§! has the authority to accelerate the completion of the §Ycurrent issue§!."
 CPGAC_portrait_sec_desc: "§YDeng Xiaoping§!\n---------------------------\nDirector of the CPGAC\n\nThe §YDirector§! holds a core position in the CPGAC, responsible for coordinating and unifying the opinions of various factions within the committee.\n\nThe §YDirector§! can communicate and coordinate with all parties to increase support for the §Ycurrent major issue§!."
 faction_CPC_btn_tt: "£CPC_texticon §xCommunist Party of China§!\n---------------------------\nAccording to the \"§mNational Defense§! §xFront Program§!,\" the opinion weight of the £CPC_texticon §xCommunist Party of China§! in the £CPGAC_texture_loc §GPeople's Government§! is §Y70%§!.\nThe current satisfaction level of the £CPC_texticon §xCommunist Party of China§! with the government is: [?CPC.CPGAC_satisfaction^1|1G%]\n---------------------------\nClick to enter the detailed interaction interface of the £CPC_texticon §xCommunist Party of China§!."
 faction_DEM_btn_tt: "§CDemocratic Parties§!\n---------------------------\nAccording to the \"§mNational Defense§! §xFront Program§!,\" the opinion weight of the §Cdemocratic parties§! in the £CPGAC_texture_loc §GPeople's Government§! is §Y20%§!.\nThe §Cdemocratic parties§! currently in the government are: §zChina Democratic§! §CRevolutionary Alliance§! and §sNew China Democratic Alliance§!.\nThe current satisfaction level of the §Cdemocratic parties§! with the government is: [?CPC.CPGAC_satisfaction^2|1G%]\n---------------------------\nClick to enter the detailed interaction interface of the §Cdemocratic parties§!."
 faction_LIB_btn_tt: "§mNon-Affiliates§!\n---------------------------\nAccording to the \"§mNational Defense§! §xFront Program§!,\" the opinion weight of the §mNon-Affiliates§! in the £CPGAC_texture_loc §GPeople's Government§! is §Y10%§!.\nThe main §mNon-Affiliates§! currently include: §xWorker Representatives§!, §RSoldier Representatives§!, §GFarmer Representatives§!, and §mProperty Owners' Representatives§!, among others.\nThe current satisfaction level of the §mNon-Affiliates§! with the government is: [?CPC.CPGAC_satisfaction^3|1G%]\n---------------------------\nClick to enter the detailed interaction interface of the §mNon-Affiliates§!."
