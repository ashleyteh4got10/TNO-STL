 CPC_CPGAC.0.t: "Prelude"
 CPC_CPGAC.0.d: "On January 1, 1962, a seemingly ordinary winter's day, fine drizzles mixed with snowflakes fell gently, vanishing almost before they touched the ground. The season was approaching its coldest point, but the harsh and lengthy winter of the Loess Plateau seemed to be drawing to a close, even though the truly warm and bright spring was still far off.\n\nIn 1947, after claiming tens of millions of lives, the Greater East Asia War ended with a Japanese victory. The rising sun ascended over the Western Pacific, its blood-red light burning away the white bones buried beneath the Empire's ambitions. Yet, on the vast and timeworn land of Northwest China, a red flag, symbolizing hope, stood steadfast against the western wind. It was on this last bastion of free soil that the National Defense Front, organized by the Communist Party of China, made its stand.\n\nTime passed like a fleeting horse, and a fractured China endured fourteen bitter winters in darkness. The long-prepared Qinghai warlord Ma Jiyuan, under the banner of the \"National Salvation Army,\" tore apart the united front agreement and launched a surprise attack on Lanzhou, igniting a civil war across the five provinces of Northwest China. On the Mongolian steppe, three rival regimes clung to their vision of the Eternal Blue Sky, battling for dominance. North and south of the Tianshan Mountains, colors changed rapidly. In the snowy Buddhist kingdom, hidden desires emerged. Meanwhile, under the shadow of Japanese bayonets, the president of the Republic of China proclaimed the nation's five modernization goals for the future. In Guangdong, merchants were enthusiastically pitching profit indices for the new year, while the Emperor of Manchukuo, in his New Year’s address, wished his cement-bunker-bound citizens a \"Happy New Year.\"\n\nHave the Chinese people lost their confidence?\n\nThere are still Chinese people who have not lost their confidence.\n\nThere will always be individuals, whether prominent or obscure, who, away from the noise and splendor, pursue dreams—noble or humble. In the shadows beyond the reach of the spotlight, they craft stories uniquely their own."
 CPC_CPGAC.0.o: "The world does not belong to the oppressors; it should belong to us."
 CPC_CPGAC.1.t: "The Beginning"
 CPC_CPGAC.1.d: "Northwest National Defence Front, China's last free land, the spiritual home of countless anti-Japanese aspirants, the thorn in the side of Gao Zongwu, the thorn in the side of the Japanese - is now facing a rebellion big enough to be buried in the Northwest.\n\nYan'an has started the emergency votes process of the CPGAC, at the moment the hall is crowded, right in front of the podium Mao Zedong, Liu Shaoqi, Zhou Enlai and other comrades of the Party Central Committee are stone-faced, exchanging words with each other to pass on what information.\n\nIn a moment, Liu Shaoqi stood up and cleared his throat, \"Comrades, friends, now begins the emergency meeting of the CPGAC on the Northwest National Defence Front on the disposal of the rebellion of the Ma Clique ......\""
 CPC_CPGAC.1.o: "Hopefully, we can hang on to the cliff."
 CPC_CPGAC.2.t: "The Premier is ill!"
 CPC_CPGAC.2.d: "The long and heavy workload in the CPGAC has apparently taken a serious toll on the Premier's health, and the Chairman Mao has approved a three-month sick leave of absence for the Premier, who will not be able to interfere with the affairs of the CPGAC for the next three months!"
 CPC_CPGAC.2.o: "Take care to rest."
 PM_health_0_punish: "The Premier is on sick leave."
 CS_patience_0_punish: "The Director is reflecting on the mistake."
 GAC_biggest_punish: "CPGAC has shut down."
 CPC_CPGAC.3.t: "The Director bribed the election!"
 CPC_CPGAC.3.d: "The frequent covert manipulation of votes in the CPGAC is undoubtedly out of order, and this matter has seriously angered Chairman Mao, who has decided to discipline the Director, who will not be allowed to interfere with the affairs of the CPGAC for the next three months!"
 CPC_CPGAC.3.o: "Beware of making mistakes."
 CPC_CPGAC.4.t: "CPGAC has shut down."
 CPC_CPGAC.4.d: "As both the Premier and the Director are currently unable to exercise their authority in the CPGAC, the CPGAC is no longer able to maintain its basic functions, and after a study by the Central Committee, it has been decided to suspend the activities of the CPGAC for a period of three months, effective immediately."
 CPC_CPGAC.4.o: "We are fucked."
 CPC_CPGAC.5.t: "CPGAC can back to work."
 CPC_CPGAC.5.d: "The Premier and Director are back to work, CPGAC is back to work as well."
 CPC_CPGAC.5.o: "Be careful next time."
 CPC_CPGAC.6.t: "Premier recovered"
 CPC_CPGAC.6.d: "Premier has backed to work, with immediate effect, the Premier can resume his role in the CPGAC."
 CPC_CPGAC.6.o: "Take care to rest."
 PM_Zhou_retire_flag: "Production Team Note: This event is a mechanic event that detects that §YPremier Zhou Enlai§! is still hospitalised in the §Ycurrent episode§!, and as such, £CPGAC_texture_loc the §GCentral People's Government Affairs Committee§!’s all §YPremier-related powers§! remain disabled."
 CPC_CPGAC.7.t: "Director back to work."
 CPC_CPGAC.7.d: "The Director has returned to work, the Secretary can resume his role in the CPGAC."
 CPC_CPGAC.7.o: "Beware of making mistakes."
 CPC_LB_GM.1.t: "Lin Biao WENT TO the mountains"
 CPC_LB_GM.1.d: "Amidst a round of applause, several members of the Central Standing Committee slowly entered the hall and slowly sat down according to their seating order. The vote on the motion has not yet officially started, after the completion of the welcome ceremony delegates joked and laughed with each other, sharing what they have seen and heard recently, very cordial. But the atmosphere on the podium is a bit strange.\n\nZhu De struggled to hold his crutches; twisting and turning to what should have been his seat, looking up and discovering he had walked past a seat - in the past he should sit next to Mao Zedong, but today there is no name tag. Bo Yibo saw the change in position but did not dare to move without permission, can only first assist Zhu De back to the new seat. Liu Shaoqi did not pay attention behind him, he sat as usual on the chair to scan his eyes, heart muttering: how to sit on the stage with so many representatives in uniform? To this he took a look at the podium left and right, more confused in his heart: Chairman Mao did not come up, how to empty two seats on the right?\n\nTime passed, and from the official start of the meeting has passed fifteen minutes, Chairman Mao still did not appear. Late always create a tense and uncomfortable atmosphere, and the field delegates quietly became whispering. Can not wait for Mao Zedong, Liu Shaoqi is not good to maintain order, on the seat motionless, by the overhead lights silently baked.\n\nSuddenly, the delegates hooted and hollered and all stood up, the warm applause once again, Chairman Mao came out! He smiled and waved with a not-so-steady pace, accepting the welcome of the crowd. He was followed by a straw-green uniform of a small man, two hands on his chest slightly applauding, his face seeming to smile or not, nodding to the delegates. When he nodded, the audience instantly broke out in eardrum-shattering slogans: \"Long live Chairman Mao!\" Lin Biao came on the stage, and what surprised Liu Shaoqi was that the uninvited guest Lin Biao rightfully sat next to Mao Zedong and became the third. But the group was too late to react, the podium Zhou Enlai announced that the motion vote officially began, and applause once again buried the belly full of suspicion."
 CPC_LB_GM.1.o: "The vote was passed!"
 CPC_LB_GM.2.t: "Lin Biao WENT TO the mountains again."
 CPC_LB_GM.2.d: "Lin Biao followed [CPC.GetLeader] to the voting site for the second time, everyone already knew what his arrival meant and dutifully stuffed the ballot box with yes votes. Except for [CPC.GetLeader] himself, the delegates' smiles were very stiff, the more they walked to the front of the stage the bigger their mouths got, but once they turned their heads, they withdrew. Zhou Enlai's unhappiness was written plainly on his face; whether stating his position or putting on an act, is there any principle to voting here?"
 CPC_LB_GM.2.o: "The vote was passed!"
 CPC_LB_GM.3.t: "Lin Biao didn't want to go to mountains."
 CPC_LB_GM.3.d: "\"Do you know how much risk I have taken for him? Now the party is talking about me, not only the party, the army, and all levels of local government which does not poke my backbone? Saying that I am a pussy fighting for power, bullying others.\"\n\n\"But Chairman Mao he also has a difficult ah, he asked you to go also burdened not.\"\n\n\"According to you, Chairman Mao is not very clear? Knowing that I was invited to vote is not good.\"\n\n\"That is for ......\"\n\n\"I will not go, go again I became the sinner of the whole party and army.\"\n\n\"......\"\n\n\"I also told you, in the future, there is such a thing, do not think of looking for me!\""
 CPC_LB_GM.3.o: "The vote was still passed."
