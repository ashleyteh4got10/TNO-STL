 CPGAC_prop_Mongolia_emergency_plan: "Mongolia Emergency Plan"
 CPGAC_prop_Mongolia_emergency_plan_desc: "The Baotou negotiations have §Rfailed§!, with Mongolia rejecting all our proposals for peaceful reunification and beginning to §Rexpel§! our stationed personnel in batches. They have even mobilized troops to the border, adopting a confrontational stance.\nWith §Gpeaceful reunification§! now hopeless, the £CPGAC_texture_loc §GCPGAC§! has unanimously agreed to assemble forces as quickly as possible to §xachieve reunification with Mongolia through military means§!."
 CPGAC_prop_Mongolia_emergency_plan_effect: "§YNorthwest National Defence Front§! Declared war to §YPeople's Republic of Mongolia§!"
 CPGAC_prop_Mongolia_emergency_plan_option_0: "Ensure the safety of personnel remaining in Mongolia"
 CPGAC_prop_Mongolia_emergency_plan_option_1: "Ensure border stability"
 CPGAC_prop_Mongolia_emergency_plan_option_2: "Ensure the well-being of the people"
 CPGAC_prop_Mongolia_emergency_plan_option_3: "Emphasize that Mongolia is an inherent part of our territory"
 CPGAC_prop_party_committee_appointment_reform: "Party Committee Appointment and Dismissal Reform"
 CPGAC_prop_party_committee_appointment_reform_desc: "\"In the past year, while our Party has accumulated valuable experience, the fundamental issue for our Party to continue maintaining correct and sound leadership in the future lies in our efforts to reduce errors in the ideological understanding of Party organizations and members.\nWhy did Hui Muslim communities collectively attack local governments? Why were our Party members rejected by farmers? In the end, it is our own leadership problem. If we do not humbly correct this, any explanation will be an excuse, and the masses will not be convinced.\nWe should understand the role of local Party committees. They are our most direct link to the people, and their influence on how our Party is discussed and evaluated by the masses is crucial. Therefore, we have been entrusted with the important task of carefully selecting the method for appointing and dismissing Party cadres.\"\n— §mLiu Shaoqi§!, speech at the £CPGAC_texture_loc §GCPGAC§! working conference"
 CPGAC_prop_party_committee_appointment_reform_effect: "It will determine the method for the future appointment and dismissal of §Ylocal Party committees§! and unlock the §Ycorresponding national focus§!."
 CPGAC_prop_PCAR_we_choose_Liu: "We have adopted the £TER_texticon_liu §mLiu Faction§! proposal in the §YParty Appointment and Dismissal Reform Proposal§!."
 CPGAC_prop_PCAR_we_choose_Mao: "We have adopted the£TER_texticon_mao  §GMao's Faction§! proposal in the §YParty Appointment and Dismissal Reform Proposal§!."
 CPGAC_prop_party_committee_appointment_reform_option_0: "Central government designated"
 CPGAC_prop_party_committee_appointment_reform_option_1: "Local recommendations"
 CPGAC_prop_liberate_Sichuan: "Defend §YXikang§!, liberate §YSichuan and Chongqing.§!"
 CPGAC_prop_liberate_Sichuan_desc: "Chairman Mao instructed: \"Revolution and revolutionary war are inevitable; without them, the leap in social development cannot be completed, and the reactionary ruling class cannot be overthrown.\" We cannot only focus on the liberated areas, but must observe both domestic and international situations. Based on changes in these situations, we must fully mobilize the people's §G revolutionary enthusiasm§! and proactively initiate §G revolutionary war§!.\n\nThrough strenuous and extraordinary efforts, the §G liberated areas§! have §G overcome difficulties§! and developed further. However, the §R white areas§! are deeply mired in §R economic crisis§!, and the people are suffering. This presents us with a rare opportunity that must not be wasted in the new wave of revolution. Therefore, the £CPGAC_texture_loc §G Government Committee§! has decided to advance toward the weakest areas of the counter-revolutionary forces to rescue Liu Wenhui, who is being besieged by reactionary forces."
 CPGAC_prop_liberate_Sichuan_effect: "When the §Rflames of war reignite§! in Sichuan, we can support our §Gallies§! according to the §Ypreviously decided plan§!."
 CPC_YEAH_WE_CHOOSE_TO_FUCK_SIC: "We will directly participate in the §Yliberation of Sichuan and Chongqing§! battle."
 CPGAC_prop_liberate_Sichuan_option_0: "We cannot allow the reactionaries to succeed."
 CPGAC_prop_liberate_Sichuan_option_1: "Go all the way when helping others, and see it through to the end"
 CPGAC_prop_liberate_Sichuan_option_2: "We have concerns about starting the war."
 CPGAC_prop_rural_commsearization: "Accelerating rural collectivization"
 CPGAC_prop_rural_commsearization_desc: "Before the Eighth National Congress, the scope of the §xLiberated Areas§! was not large, with regions such as §YXinjiang§!, §GInner Mongolia§!, and §fSichuan§! still unliberated. Our §Gagricultural work§! at the time was unsustainable in the §fbarren and dry Northwestern Plateau§!, and the §Rexcessively harsh collectivization§! further plunged agriculture in the Liberated Areas into its §Rlowest point§!.\n\nAs progress was made in base area work, the central leadership collectively believed that §Gaccelerating agricultural collectivization§! would become an important task during this period. Agricultural collectivization is the essential feature of §Ssocialist agriculture§!. The collectivization model of the £TER_texticon_mao §GPeople's Communes§! had no significant flaws. With the lessons learned from history, we now believe we have the experience and capability to implement collectivization reforms in a stable and effective manner. The £TER_texticon_mao §GPeople's Communes§! will play the huge role we envision."
 CPGAC_prop_rural_commsearization_effect: "We will accelerate the advancement of £TER_texticon_mao §Gagricultural collectivization§!."
 CPGAC_prop_rural_commsearization_option_0: "Accelerate the consolidation of large communes."
 CPGAC_prop_rural_commsearization_option_1: "Focus on consolidating lower-level communes."
 CPGAC_prop_rural_commsearization_option_2: "Increase the procurement price of grain."
 CPGAC_prop_rural_commsearization_option_3: "There are also merits in agricultural trade markets."
 CPGAC_prop_state_monopoly_of_purchasing_and_marketing: "Increase the grain procurement quotas."
 CPGAC_prop_state_monopoly_of_purchasing_and_marketing_desc: "By the mid-1960s, the general situation in the §xliberated areas§! was §Gfavorable with good weather§!, with crops §Ggrowing well§! and production increasing dramatically compared to the early 1960s. In many communes, grain production increased by §Gover 50%§!, with some communes even reaching §Gdouble or even several times§! their target production.\n\nDue to the large newly liberated §xareas§!, the £CPGAC_texture_loc §Ggovernment departments and functions§! were also expanding and deepening. After careful consideration, the £TER_texticon_mao §Gcentral party committee§! and £CPGAC_texture_loc §GState Council§! decided to §Yincrease§! the annual grain procurement quotas, under the condition that the production and daily life of the farmers in the liberated areas would not be disrupted, in order to meet the needs of the government work in the currently liberated areas covering nearly half of China."
 CPGAC_prop_state_monopoly_of_purchasing_and_marketing_effect: "Increasing the grain procurement quotas will put §Gagriculture§! under §Rsome pressure§!, but it will improve our §Gadministrative efficiency§!."
 CPGAC_prop_state_monopoly_of_purchasing_and_marketing_option_0: "Only increase the wheat procurement quota."
 CPGAC_prop_state_monopoly_of_purchasing_and_marketing_option_1: "Slightly increase the procurement quotas for all crops."
 CPGAC_prop_ban_individual_businesses: "Completely abolish individual businesses."
 CPGAC_prop_ban_individual_businesses_desc: "The §Gnationalization of key industries§! was originally one of the §Geconomic goals§! set by the Front in the 1950s, but had to be suspended due to the §esevere crisis and turmoil§! in the early 1960s. The Front then shifted to allowing and encouraging §Yprivate enterprises and ethnic capitalists§! to operate industries within the Front. Indeed, private industries played a crucial role in the recovery of the §GFront’s economy§! during this period. However, during the §Reconomic difficulties§! of the early 1960s, these §Yprivate industries§! also displayed a §R selfish and profit-driven nature and limitations §!, and we must reconsider the role of §Yprivate industries§! in the future §S socialist construction§! of the base. As £TER_texticon_mao  §GChairman Mao§!pointed out, the essence of a §Ssocialist economy§! is the §x public ownership§! of the means of production. As economic conditions have matured, we should now carry out a thorough §Gnationalization reform§! of private industries and §xabolish individual businesses§!."
 CPGAC_prop_ban_individual_businesses_effect: "In the liberated areas, we will encourage and compel §Ycapitalists§! to give up their company shares and proactively transfer the management rights of key industries to the §GParty and the people§!."
 CPGAC_prop_ban_individual_businesses_option_0: "Implement the transformation to public ownership."
 CPGAC_prop_ban_individual_businesses_option_1: "Provide protection to patriotic democrats."
 CPGAC_prop_ban_individual_businesses_option_2: "Encourage workers to spontaneously form mass organizations."
 CPGAC_prop_release_surplus_labor_to_rural_areas: "Release surplus labor to rural areas"
 CPGAC_prop_release_surplus_labor_to_rural_areas_desc: "As the §Ssocialist construction§! enters a new era, with major cities such as §YChongqing, Xi'an, and Chengdu§! being successively liberated, our §murban population and industrial level§! have experienced a §Gsignificant leap§!, and for the first time, the front has an adequate labor force. £TER_texticon_mao §GThe Central Committee and Chairman Mao§! have instructed that the front should maintain §Gurban-rural convergence§!, and surplus labor from towns should be sent to rural areas and remote regions to receive §xre-education from poor peasants§!.\n\nAfter undergoing training in local communes, this group of urban residents should grow into the §Gbackbone of our socialist construction§!, and at the same time, our local rural people's communes will make progress in economic work due to the influx of surplus labor, a win-win situation."
 CPGAC_prop_release_surplus_labor_to_rural_areas_effect: "We will strengthen the implementation of the policy of §Ycadre decentralization and youth sent to rural areas§! in the liberated areas."
 CPGAC_prop_release_surplus_labor_to_rural_areas_option_0: "We will focus on the decentralization of cadres and establish universities."
 CPGAC_prop_release_surplus_labor_to_rural_areas_option_1: "Establish a system of urban-rural counterpart support."
 CPGAC_prop_release_surplus_labor_to_rural_areas_option_2: "Provide certain privileges to intellectuals."
 CPGAC_prop_PLA_announcement: "Reform proposal for the §YPeople's Liberation Army§!."
 CPGAC_prop_PLA_announcement_desc: "Our army must have a full understanding and preparation for the complexity and variability of §mmodern warfare§!. Many officers and soldiers in the army believe that in modern warfare, the army that can defeat the enemy often possesses §Gprofessional personnel quality§! and §mmodern combat equipment§!. Our army has the §xglorious tradition of military building§! and the §Gadvanced thought of political army building§!, but there is an urgent need to update our combat thinking. We need a §Gmore professional and more advanced People's Liberation Army§! to face the inevitable §xliberation war§!.\n\nTo ensure the combat quality of the People's Liberation Army, the £CPGAC_texture_loc §GState Affairs Committee§! unanimously agreed to implement the £TER_texticon_PLA §YPLA reform§! proposal."
 CPGAC_prop_PLA_announcement_effect: "We will decide the £TER_texticon_PLA §RPeople's Liberation Army§!'s §Yreform direction§!."
 CPGAC_prop_CPC_PLA_reform_L: "We have adopted the §Gmission-based command reform§! plan in the £TER_texticon_PLA §YPeople's Liberation Army reform§!."
 CPGAC_prop_CPC_PLA_reform_R: "We have adopted the §mcentralized command reform§! plan in the £TER_texticon_PLA §YPeople's Liberation Army reform§!."
 CPGAC_prop_PLA_announcement_option_0: "Adopted the §Gmission-based command reform§!"
 CPGAC_prop_PLA_announcement_option_1: "Adopted the §mcentralized command reform§!"
 CPGAC_prop_no_ongoing_prop: ""
 CPGAC_prop_no_ongoing_prop_effect: "Currently, §Rthe session is adjourned§!."
 CPGAC_prop_foundation_of_NNPF: " §m\"Platform of the Chinese National§! §xDefence Front\"§!"
 CPGAC_prop_foundation_of_NNPF_desc: "In §Y1949§!, various patriotic anti-Japanese political parties in the West jointly signed the §mPlatform of the Chinese National§! §xDefence Frontin§! §YXi'an§!, declaring the formation of the §Runited Front§! to continue the great §xanti-Japanese cause§!."
 CPGAC_prop_foundation_of_NNPF_effect: "Establish the [CPC.GetFlag]§mRepublic of China§!§xNational Defense Front Northwest Central Government§!.\nStart the §GThird§ £GNG_chinese_nation_texticon §mNational§!£CPC_texticon  §xCommunist§! cooperation§!."
 CPGAC_prop_rural_land_reform: "Decisions on §GRural Land Reform§!."
 CPGAC_prop_rural_land_reform_desc: "The §mProgram§!§xOutline§! proposed that §Gall major base areas§! and §Cpatriotic anti-Japanese forces§! should complete §Rsocial transformation§! under the banner of the §CNew Democratic Revolution§!. The primary task is to §Ydestroy the feudal production relations in rural areas§! and establish a §xcollectivized economy§!. The £CPGAC_texture_loc §GCPGAC§! voted and passed a resolution to §Glaunch a land reform movement in rural areas§!."
 CPGAC_prop_rural_land_reform_effect: "$improve_agriculture_medium$add base Stability:§G+10.00%§!."
 CPGAC_prop_interim_capital_defense_plan: "Interim Capital §xNational Defense Plan§!."
 CPGAC_prop_interim_capital_defense_plan_desc: "At the inception of the §mNational Defense§!§x Front§!, §YXi'an§! was designated as the capital of the [CPC.GetFlag] §YNorthwest National Defense Front§! in the form of the §mProgram§! §xOutline§!. Due to §YXi'an§!'s direct exposure to the £GNG_japanese_frustration_texticon §jJapanese puppet forces§! and the §eimminent threat of invasion§!, it became imperative to transform the city into a §xfortress of war§!.To achieve this, the £CPGAC_texture_loc §GGovernment Committee§! unanimously agreed to concentrate manpower and resources on developing §YXi'an§! and to rapidly transform it into a §xfully armed fortress city§! as part of the long-term §xanti-Japanese struggle§!."
 CPGAC_prop_interim_capital_defense_plan_effect: "Begin the §YXi'an§! §xfortification§! construction process.\nAppoint §YZhang Zongxun§! to replace §YXi Zhongxun§! as the mayor of §YXi'an§!."
 CPGAC_prop_foundation_of_NADT: "Found the §mNorthwest Defence§! §xResearch Institute§!"
 CPGAC_prop_foundation_of_NADT_desc: "After the establishment of the £TER_texticon_NDF §RPeople's Liberation Army§!, to meet the needs of §mmodern warfare§! and explore the integration of §mnew forms of warfare§! with §SPeople's War§!, the central government considered creating a specialized §mNational Defense Technology Research Institute§! to focus on the development of §madvanced military technology§!.After listening to the opinions of various party representatives, the £CPGAC_texture_loc §GGovernment Committee§! voted to approve the establishment of the §mNational Defense§!§x Research Institute§! (NDRI)."
 CPGAC_prop_foundation_of_NADT_effect: "ntegrate the Front's §mscientific research capabilities§! to establish the §mNational Defense§!§x Research Institute§! (NDRI).\nAppoint the General Logistics Department Secretary §YHuang Kecheng§! as its Director."
 CPGAC_prop_5_years_plan: "§mNational Defense§! §xFront§! Five-Year Development Plan."
 CPGAC_prop_5_years_plan_desc: "The Northwest's industrial foundation is §Rweak§!, and the development of heavy industry is hindered by factors such as §Ylimited funding, insufficient power supply, inconvenient transportation, and a shortage of skilled personnel§!. These challenges make it difficult to see significant results in a short period, and capitalists are reluctant to risk investing in the region.\nTo build the §Yeconomic defense line§! of the base area, the central government dispatched £CPC_texticon §RParty and government units§! to various regions to lead economic development and formulated an §Yeconomic development plan with a five-year timeframe§!, striving for §Gbreakthrough achievements§! in both agriculture and industry to establish a §Gsolid foundation of productivity§! for the liberation cause of the Front.After unified discussion within the Party and consultation with various political parties, the £CPGAC_texture_loc §GGovernment Committee§! overwhelmingly approved the decision to implement the five-year economic development plan."
 CPGAC_prop_5_years_plan_effect: "Form the £CPC_texticon §RNorthwest Bureau§! to oversee the development of §YShaanxi-Gansu-Ningxia-Qinghai§! matters.\nRename §YXikang Province§! to [XIK.GetFlag] §YSouthwest Defense Front.§!\nDispatch £CPC_texticon §RSouthwest Bureau§! to guide [XIK.GetFlag] §YSouthwest Defense Front's§! administrative development."
 CPGAC_prop_NADT_10_years_plan: "§mNational Defense Research§! §xTen-Year Plan§!"
 CPGAC_prop_NADT_10_years_plan_desc: "The objective of the §mNational Defense Research§! §xTen-Year Plan§! is to systematically enhance §mdefense research and development investments and technological advancement§!, elevate the §Rmilitary technological capabilities§! of the Northwest Defense Front, and bring §Gcivilian technological levels§! onto a §mmodernized track§!. The primary goal is to ensure that our armed forces can initiate §xcomprehensive modern warfare§! within the next decade. This plan aims to drive independent innovation, close technological gaps, and gradually achieve §mdefense modernization§!, thereby strengthening the overall combat capabilities and strategic deterrence of the military.\nThe £CPGAC_texture_loc §GCPGAC§! voted to approve the decision on the §mNational Defense Research§! §xTen-Year Plan§!."
 CPGAC_prop_NADT_10_years_plan_effect: "Begin §mNational Defense Research§! §xTen-Year Plan§!"
 CPGAC_prop_great_leap_forward: "§GGreat Leap Forward§! Decisions"
 CPGAC_prop_great_leap_forward_desc: "In order to fundamentally change the §Rbackward conditions§! of the §GNorthwest Base Area§! and achieve §Gleapfrog development§!, the £CPC_texticon §RCentral Committee§! has decided to launch the §GGreat Leap Forward§! movement, focusing on §Gagriculture§!, §mindustry§!, and §Ygrassroots organizational development§!. This campaign calls for rapid implementation of §Gagricultural collectivization§! and §mstate-owned industrial and commercial transformation§!, adhering to the high standards of §G“more, faster, better, and more economical”§! to fully accelerate economic development and consolidate the §xsocialist system§!.\n\nParty organizations at all levels must strengthen ideological unity, firmly carry out central directives, and ensure goals are achieved on schedule. The entire Party, the entire military, and the broad masses of the people will work together, with the fearless §xrevolutionary spirit§!, to achieve the §xgreat victories§! of the new socialist era."
 CPGAC_prop_great_leap_forward_effect: "Launch the £TER_texticon_mao §GGreat Leap Forward Movement§!."
 CPGAC_prop_rightist_campaign: "§GAnti-Rightist Movement§! Decisions"
 CPGAC_prop_rightist_campaign_desc: "To reverse the §Rpassive political situation§! in Ningxia since liberation and establish the authority of the £CPC_texticon §xParty§!, we should decisively launch §xa swift and vigorous counteroffensive§! to eliminate all §ereactionary right-wing elements§! within the front. The movement targets §mbourgeois sympathizers§! within the Party, §eKuomintang reactionaries§!, §CDemocratic parties§!, and other §Yupper-class individuals in society§!, promptly exposing their §eanti-communist, anti-people, and anti-socialist§! intentions."
 CPGAC_prop_rightist_campaign_effect: "Declare the £GNG_chinese_nation_texticon §mKuomintang of China§! an §eillegal party§! and §eremove it§! from the §RUnited Front§!.\nForm the §zChinese Democratic§! §CRevolutionary Alliance§! and the §sNew China Democratic Alliance§!."
 CPGAC_prop_suppress_QIN_Ma_revolt: "Suppress the §mQinghai Ma Army§! rebellion"
 CPGAC_prop_suppress_QIN_Ma_revolt_desc: "The §ereactionary warlord§! §YMa Ji-yuan§!, formerly a regional military and political leader of the £GNG_chinese_nation_texticon §mKuomintang§! in the Northwest, has since the United Front’s inception refused to comply with the provisions of the §m“Program §VOutline”§!. Instead, he has §Rpaid lip service and actively obstructed§! revolutionary construction efforts at every turn. His boundless personal ambitions culminated in the late 1950s when he ordered his subordinates to secretly §xassassinate§! our £CPC_texticon §RParty comrade§! §GPeng Zhen§!, who had been sent to Qinghai to guide §Grevolutionary work§!. His crimes are too numerous to count.\n\n[QIN.GetFlag] §Y[QIN.GetName]§! was established by the§e reactionary warlord§! §YMa Ji-yuan§!, and is entirely a §ereactionary feudal separatist force§! that betrays the §RUnited Front§! and the £GNG_chinese_nation_texticon §mNationalist§!-£CPC_texticon §xCommunist§! cooperation§!. It must be §xcompletely eradicated and suppressed§!.\n\nThe £CPGAC_texture_loc §GCPGAC§! has unanimously agreed to assemble troops as swiftly as possible to suppress the §mQinghai Ma Army§! rebellion."
 CPGAC_prop_suppress_QIN_Ma_revolt_effect: "Due to the §ehostile actions§! of the §YPeople’s Salvation Army§!, it is hereby declared that the §YNorthwest Defense Front§! is now officially in a state of §Rwar§! with the §YPeople’s Salvation Army§!."
 CPGAC_intensify_policy_effect_tt: "§!Enhace§Y [CPGAC_ordinary_policy_tmp_name]§mdaily policies§! in £CPGAC_texture_loc §GCentral People's Government Affairs Committee§!"
 CPGAC_unlock_limited_policy_effect_tt: "The £CPGAC_texture_loc §GCPGAC§! will unlock the §Y[CPGAC_ordinary_policy_tmp_name]§! §mdaily policies§!, which can be implemented [?times_tmp|0Y] times."
