 CPGAC_prop_relaxation_of_self_individual_farmers: "Relax restrictions on rural individual businesses."
 CPGAC_prop_relaxation_of_self_individual_farmers_desc: "\nIn past surveys, the central government found that some cooperatives were §Runsustainable§!, with members §millegally dividing land for private cultivation§! to survive famine through this §Yhousehold responsibility system§!. After several years of small-scale implementation of this system, many farmers' lives have §Gimproved§!, effectively §Galleviating§! economic difficulties in these areas.\n\nComrade §mLiu Shaoqi§! pointed out that relaxing individual business operations could be §mlimitedly promoted§! across the entire base area, primarily to help farmers in more remote and impoverished regions meet their basic needs. Only by resolving the §Rsurvival crisis§! of the small peasant class can we proceed to the next phase of §Gcollectivization§! efforts.\n\nIn conclusion, the £CPGAC_texture_loc §GCPGAC§! voted to approve the £TER_texticon_liu §mproposal to relax rural individual business operations§!."
 CPGAC_prop_relaxation_of_self_individual_farmers_flag: "£CPGAC_texture_loc §GCPGAC§! voted to approve the §mMajor Issue§! to §Yrelax rural individual business operations§!."
 CPGAC_prop_relaxation_of_self_individual_farmers_effect: "The §mhousehold responsibility system§! agricultural measure will be promoted and implemented in the liberated areas."
 CPGAC_prop_relaxation_of_self_individual_farmers_option_0: "Promote the household responsibility system for production in advanced communes on a trial basis."
 CPGAC_prop_relaxation_of_self_individual_farmers_option_1: "No relaxation will be applied to advanced and large communes."
 CPGAC_prop_relaxation_of_self_individual_farmers_option_2: "Increase grassroots subsidies to alleviate poverty."
 CPGAC_prop_rebuild_ABC: "Rebuild Agricultural Bank of China"
 CPGAC_prop_rebuild_ABC_desc: "In the past, our approach to §Gthe socialist transformation of agriculture§! lacked clarity, often falling into the trap of §Rbeing overly hasty and heavy-handed§!, which disrupted the natural rhythms of agricultural production. As a result, farmers frequently faced grain shortages at home and lacked the savings needed to cope with potential natural disasters.\n\nTo address this situation, the central government has decided to reestablish the §mAgricultural Bank§!, dedicated to providing farmers with §Ysavings, loans, and financial assistance§! to help them overcome difficulties and achieve self-reliance.\n\nIn conclusion, the £CPGAC_texture_loc §GCPGAC§! voted to approve the £TER_texticon_liu §mproposal to reestablish the Agricultural Bank of China§!."
 CPGAC_prop_rebuild_ABC_effect: "The policy to §Yincrease agricultural and rural loans§! will be promoted in the liberated areas."
 CPGAC_prop_rebuild_ABC_flag: "£CPGAC_texture_loc §GCPGAC§! voted to approve the §mMajor Issue§! to §YRebuild Agricultural Bank§!."
 CPGAC_prop_rebuild_ABC_option_0: "Strengthen central regulation"
 CPGAC_prop_rebuild_ABC_option_1: "Strengthen oversight to eliminate exploitation"
 CPGAC_prop_rebuild_ABC_option_2: "Learn from modern financial practices"
 CPGAC_prop_lower_food_prices: "Reduce grain procurement prices"
 CPGAC_prop_lower_food_prices_desc: "The liberated areas are undergoing a new round of industrial expansion. Established industrial zones such as Sichuan-Kangding and Guanzhong require substantial capital injection during this period to drive development. However, the central financial system is currently nearing its limit. After comprehensive research and analysis, the central government has decided to reduce costs and increase efficiency by lowering the procurement prices of certain grains.\n\nIn conclusion, the £CPGAC_texture_loc §GGovernment Committee§! voted to approve the £TER_texticon_liu §mproposal to reduce grain procurement prices§!."
 CPGAC_prop_lower_food_prices_effect: "In the foreseeable future, §Ygrain will be procured at lower prices§!."
 CPGAC_prop_lower_food_prices_option_0: "Provide limited subsidies to farmers"
