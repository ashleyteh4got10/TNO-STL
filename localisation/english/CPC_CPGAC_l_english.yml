 CPGAC_u_field_investigation_movement: "Land Census"
 CPGAC_u_field_investigation_movement_desc: "The base area has just weathered its most perilous period, and we have regained control of millions of square kilometers in China’s vast western lands. However, arable land remains limited. Within the territories under the front’s actual control, only three main grain-producing regions—Hetao, Guanzhong, and Sichuan—are available. In normal years, we can barely sustain the grain burden, but in the event of a bad year, the consequences would be unimaginable.\nGiven the severity of the situation, the Central Committee has decided to immediately launch a land inspection campaign. This involves swiftly completing crucial tasks such as rooting out bandits in the countryside, verifying land ownership, and reconciling cooperative debts. If we fail to promptly inspect and clear the land, thereby delaying production, our agricultural foundation will face severe threats."
 CPGAC_u_the_four_clean_ups_movement: "The Four Cleanups"
 CPGAC_u_the_four_clean_ups_movement_desc: "Under the leadership of the Party Central Committee and Chairman Mao, significant progress has been made in agricultural work in the liberated areas. However, during the actual construction of various local communes, we have noticed that the lingering feudal elements—landlords, rich peasants, counterrevolutionaries, and bad elements—are unabashedly taking advantage of the socialist spring breeze to indulge in fantasies of “riding the favorable wind to ascend the heavens.”\n\nThe Party and the people will not allow these reactionary elements to steal the great achievements of socialist construction. Launching the rural “Four Cleanups” campaign is urgent and necessary. We must decisively and thoroughly eliminate the influence of these four types of elements at the local level, and protect and strengthen our grassroots organizations."
 CPGAC_u_Su_Fan_movement: "Sufan Movement"
 CPGAC_u_Su_Fan_movement_desc: "The urbanization efforts in the liberated areas have been highly successful, with a number of industrial towns established across the regions. Our urban population and workforce have steadily grown. However, recent construction efforts have prompted concerns from the public about the emergence of a group of idle and lazy troublemakers in the cities.\n\nThe Party and the people will not allow such reactionary elements to steal the great achievements of socialist construction. Launching an urban Sufan(anti-reactionary) campaign is both urgent and necessary. We must decisively and thoroughly eliminate the corrosive influence of these bad actors on our organizations, and protect and strengthen our city-level Party structures."
 CPGAC_u_recontact_NAJUA: "The Northeast Anti-Japanese United Army’s westward"
 CPGAC_u_recontact_NAJUA_desc: "After hearing the report from the comrades of the Northeast Anti-Japanese United Army (NAJUA), the Central Committee unanimously agreed that we must seize this rare opportunity to establish a working relationship with the NAJUA. Every effort must be made to ensure that the Northeast comrades have direct contact with our sphere of influence. Given the desolate conditions of the northeastern frontier, the base area cannot survive independently. The sole objective of subsequent assistance is to open the Mongolia-Northeast corridor, enabling the NAJUA to rely on support from our front and relocate to western Manchuria to establish a guerrilla base.\n\nThe final plan is as follows: the NAJUA will break through eastward from Manzhouli, while our forces advance eastward from cities like Choibalsan. Ultimately, the two forces will converge at the border. The NAJUA, with its rear secured by Mongolia and the front supported by our line, will establish a base in western Manchuria and initiate guerrilla operations."
 CPGAC_u_Force_to_go_through_the_Yellow_river: "Yellow River Ferry"
 CPGAC_u_Force_to_go_through_the_Yellow_river_desc: "According to the Central Military Commission’s operational plan, the forceful crossing of the Yellow River to liberate Shanxi is the first step in our journey to liberate the entire country. If we can swiftly and decisively destroy the puppet regime in Shanxi, we will gain access to Shanxi’s energy and military industries, providing a powerful material guarantee for the nationwide liberation effort. Furthermore, it will significantly boost the morale of our rear lines.\n\nChairman Mao instructed: “Preparations for crossing the Yellow River and liberating Shanxi should not be treated as preparations for a localized conflict, but rather as preparations for a comprehensive, sweeping, nationwide war.” This is an extremely accurate strategic judgment. Our battle is likely to set off a chain reaction, meaning we must mobilize the entire national defense front, and even the entire ANRL, from north to south, from east to west, to counter any full-scale counterattacks from the puppet Republic or even Japanese imperialism."
