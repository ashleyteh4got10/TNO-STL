 TER_main_issue_entry_category: "Party, Government, Military"
 TER_main_issue_entry_category_desc: "According to the §m\"Platform of the Chinese National§! §xDefence Front\"§! regulations, §Y[CPC.GetFlag][CPC.GetName]§! has a unique operational structure. Based on its organizational divisions, it can be separated into £CPC_texticon §RParty Organization§!, £CPGAC_texture_loc §GGovernment Organization§!, and £TER_texticon_PLA §YPeople’s Liberation Army Organization§!, forming the three major organizational systems of §RParty§! §GGovernment§! §YMilitary§!."
 CPC_dec_gui_entry_tt: "[CPC_dec_gui_entry_tt]"
 enter_CPGAC_main_gui_tt_generic: "[GetEnterGACtt]"
 enter_CPGAC_main_gui_tt: "Click to activate £CPGAC_texture_loc  §GCentral People's Government Affairs Committee§! GUI"
 enter_CPGAC_main_gui_CANNOT_tt: "From §RDay of Totally Shut Down§!, you can NOT do anything in £CPGAC_texture_loc  §GCentral People's Government Affairs Committee§! in §Y90 days§!."
 TER_CPGAC_tips: "£CPGAC_texture_loc §GCentral People's Government Affairs Committee§!\n----------------------------------\n§YLegislative Discussion§!\nAccording to the §mNational Defense Front§! §xPrinciple of China,§! £CPGAC_texture_loc §GCPGAC§! is the legislature of the §G[CPC.GetName]§! our party and §Ydemocratic figures outside the party§! will, through democratic consultation, pass and implement the government’s political resolutions.\n£CPGAC_texture_loc The §GCPGAC§! consists of three factions: §xthe Communist Party of China§!, §Cdemocratic parties§!, and §mNon-Affiliates§!. According to the §mThe§! §xProgram§. all Major Issues concerning the §xfuture and fate§! of the §mnational defense§! front are discussed and passed with a voting ratio of §Y7:2:1.§!\nAll §Ymajor issues§! are triggered by §Ynational focus, events§!, and the voting period is §Y60 days§!. Depending on the issue, §Ydifferent amendment§! proposals may be available for reference. At the beginning of each round of major issue voting discussions, one §Yamendment proposal§! will be selected by default, and it can be changed at most once. The §Ycurrent amendment proposal§! can also be changed with additional opportunities provided by the powers of the committee chairperson. Each change requires £pol_power §Y5§! political points.\n----------------------------------\n§YDaily Administration§!\nAccording to the §mNational Defense§! §xFront Program§!, the £CPGAC_texture_loc §GCPGAC§! is the administrative body of §G[CPC.GetName]§!. At different stages of development, different §Ydaily policies§! can be chosen for execution. All §Ydaily policies§! can select specific §Yfactions,§! and their effects will vary slightly, so please pay attention."
 TER_CPGAC_recessing: "In recess"
 TER_CPGAC_recessing_red: "§R$TER_CPGAC_recessing$§!"
 CPGAC_btn_hog_name: "Premier"
 CPGAC_add_to_PM_pressure: "Mental Stress of the §YPremier§! §Rincreased§! by §Y1§! point."
 CPGAC_skill_PM_desc: "Authority: End the vote\nThe §YPremier§! will directly accelerate the §Ycompletion§! of the current issue §Y(including daily policies)§!.\n\nIf §Ymajor issues§! and §Ydaily policies§! are being executed simultaneously, §Ymajor issues§! will be prioritized for acceleration.\n\n§RDeduct§! §Y1§! point of Health ."
 CPGAC_PM_gui_desc: "Enter §YPremier§! interaction interface / Return\n--------------------\nHere you can see the various indicators and powers of the §YPremier§!.\n\n§YHealth §! represents the current health status of the §YPremier§!. Excessive §YMental Stress §! or the use of §Ypowers§! will reduce the Health .\n\n§YMental Stress §! represents the current mental stress of the §YPremier§!. For every 3 points of §YMental Stress §!, §RHealth §! will be deducted.\n\nWhen the §Yhealth§! reaches §Rzero§!, the Premier will be granted a §Y90-day§! sick leave approved by Chairman Mao, during which the §RPremier will no longer participate in the work of the CPGAC.§!\n\nWhile the Premier is involved in daily affairs, Health  will recover §G1 point§! per month, and Mental Stress  will decrease by §G1 point§! per month.\n\n§RIf both the Premier and the Director are unable to participate in work simultaneously, the committee will enter a 90-day inactivity period, during which no actions can be taken. Please act cautiously!§!"
 CPGAC_add_to_CS_popularity: "Prestige of the §YDirector§! §Rincreased§! by §Y1§! point."
 CPGAC_skill_CS_desc: "Authority: Review\nThe §YDirector§! will review the §Ycurrent major issue§!, gaining §Yan additional opportunity§! to select an §Yamendment proposal§!.\n\n§RDeduct§! §Y1§! point of tolerance."
 CPGAC_CS_gui_desc: "Enter §YDirector§! interaction interface / Return\n--------------------\nHere you can see the various indicators and powers of the §YDirector§!.\n\n§YTolerance§! represents the current tolerance level of the Chairman towards the §YDirector§!. Excessive §Yreputation§! or the use of §Ypowers§! will reduce the tolerance.\n\n§YPrestige§! represents the current influence of the §YDirector§! among the representatives. For every 3 points of §Yreputation§!, §R1 point of tolerance§! will be deducted.\n\nWhen the §Ytolerance§! reaches §Rzero§!, the Director will be granted a §Y90-day§! penalty approved by the Chairman, §Rduring which the Director will no longer participate in the work of the CPGAC.§!\n\nWhile the Director is involved in daily affairs, tolerance will recover §G1 point§! per month, and Prestige  will decrease by §G1 point§! per month.\n\n§RIf both the Premier and the Director are unable to participate in work simultaneously, the committee will enter a 90-day inactivity period, during which no actions can be taken. Please act cautiously!§!"
