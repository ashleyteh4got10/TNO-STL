 TER_CPGAC_voting_rules: "The current voting §Gapproval rate§!/§Ropposition rate§! is: §G[?CPGAC_total_yes_attitude|3G]%§!/§R[?CPGAC_total_no_attitude|3R]%§!\nVoting rules:\nIf the §Gapproval rate§! exceeds half at the end of voting, it is considered §Gapproved§!.\nIf the §Gapproval rate§! is not over half but is greater than the §Ropposition rate§!, it is considered §Gapproved§!.\nIn case of a §Ytie§!, it is considered §Gapproved§!, and all factions' §Rapproval rating§! will decrease by §Y5%§!.\nIf none of the above conditions are met, military representatives will §Rforcefully approve§! the Proposal. The §xCPC§! will §Rlose§! §Y10%§! in satisfaction, and the §Yother factions§! will §Rlose§! §Y15%§! in satisfaction."
