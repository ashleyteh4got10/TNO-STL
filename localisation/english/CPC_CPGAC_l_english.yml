 CPGAC_begin_a_proposal_tips: "This will initiate the voting process for §Y[Get_CPGAC_ongoing_prop_title]§!, with the default selection being the §Yfirst priority amendment proposal§!.\nYou will gain §Y1§! opportunity to change the §Yamendment proposal§!, and §Y3§! opportunities to use the §Yfaction's special functions§!.\nThe §Ginitial approval rate§! for §Yall factions§! will be multiplied by their §Yapproval rating§! to obtain the §Gactual approval rate§!.\n---------------------------\n§GMao Faction§! initial attitude: [?CPGAC_Y_attitude_in_party_tmp^0|G1]% / [?CPGAC_N_attitude_in_party_tmp^0|R1]% \n§mLiu Faction§! initial attitude: [?CPGAC_Y_attitude_in_party_tmp^1|G1]% / [?CPGAC_N_attitude_in_party_tmp^1|R1]% \n§R[TER_CPGAC_faction_name_sov]§! initial attitude: [?CPGAC_Y_attitude_in_party_tmp^2|G1]% / [?CPGAC_N_attitude_in_party_tmp^2|R1]% \n§YSecretary Faction§! initial attitude: [?CPGAC_Y_attitude_in_party_tmp^3|G1]% / [?CPGAC_N_attitude_in_party_tmp^3|R1]% \n§CDemocratic Parties§! initial attitude: [?CPGAC_yes_attitude_tmp^0|G1]% / [?CPGAC_no_attitude_tmp^0|R1]% \n§mNon-Affiliates§! initial attitude: [?CPGAC_yes_attitude_tmp^1|G1]% / [?CPGAC_no_attitude_tmp^1|R1]%"
 faction_btn_sub_anti_desc: "[!faction_btn_sub_anti_click]"
 faction_btn_add_sup_desc: "[!faction_btn_add_sup_click]"
 CPGAC_prop_faction_button_click_desc: "The §Yfaction's special function§! will cause changes in the attitude of §Yeach faction.§! Currently, you can use this function [?CPGAC_btn_faction_skills_time|+=0] more time(s).\n---------------------------\nThe left side represents the change in the §Gapproval rate§!, and the right side represents the change in the §Ropposition rate§!:\n\n§GMao Faction§! attitude change: [?attitude_change_Y_in_party_tmp^0|+=1]% / [?attitude_change_N_in_party_tmp^0|-=1]% \n§mLiu Faction§! attitude change: [?attitude_change_Y_in_party_tmp^1|+=1]% / [?attitude_change_N_in_party_tmp^1|-=1]% \n§R[TER_CPGAC_faction_name_sov]§! attitude change: [?attitude_change_Y_in_party_tmp^2|+=1]% / [?attitude_change_N_in_party_tmp^2|-=1]% \n§YSecretary Faction§! attitude change: [?attitude_change_Y_in_party_tmp^3|+=1]% / [?attitude_change_N_in_party_tmp^3|-=1]% \n§CDemocratic Parties§! attitude change: [?attitude_change_Y_tmp^0|+=1]% / [?attitude_change_N_tmp^0|-=1]% §mNon-Affiliates§! attitude change: [?attitude_change_Y_tmp^1|+=1]% / [?attitude_change_N_tmp^1|-=1]%"
 CPGAC_ongoing_prop_option_desc: "[!CPGAC_ongoing_prop_option_click]"
 CPGAC_prop_option_generic_desc: "The amendment proposal was proposed by [CPGAC_prop_option_faction_big][CPGAC_prop_option_in_party]. Adopting this amendment proposal will cause changes in the opinions of various factions and cost £pol_power §Y5§! political points.\n\nThe left side represents the change in the §Gapproval rate§!, and the right side represents the change in the §Ropposition rate§!:\n\n§GMao Faction§! attitude change: [?attitude_change_Y_in_party_tmp^0|+=1]% / [?attitude_change_N_in_party_tmp^0|-=1]% \n§mLiu Faction§! attitude change: [?attitude_change_Y_in_party_tmp^1|+=1]% / [?attitude_change_N_in_party_tmp^1|-=1]% \n§R[TER_CPGAC_faction_name_sov]§! attitude change: [?attitude_change_Y_in_party_tmp^2|+=1]% / [?attitude_change_N_in_party_tmp^2|-=1]% \n§YSecretary Faction§! attitude change: [?attitude_change_Y_in_party_tmp^3|+=1]% / [?attitude_change_N_in_party_tmp^3|-=1]% \n§CDemocratic Parties§! attitude change: [?attitude_change_Y_tmp^0|+=1]% / [?attitude_change_N_tmp^0|-=1]% \n§mNon-Affiliates§! attitude change: [?attitude_change_Y_tmp^1|+=1]% / [?attitude_change_N_tmp^1|-=1]%\n---------------------------\nCurrently, you have [?CPGAC_ongoing_prop_option_click_times|0+=] remaining chances to change the §Ymodification suggestion§!.\n---------------------------\nOriginal effects: [CPGAC_ongoing_prop_effect]\n---------------------------\nAdditional effects of this amendment proposal"
 CPGAC_prop_option_generic_we_have_chosen_this: "This is the §Yamendment proposal§! we are currently adopting, proposed by [CPGAC_prop_option_faction_big][CPGAC_prop_option_in_party].\n---------------------------\nCurrent remaining [?CPGAC_ongoing_prop_option_click_times|0+=] opportunities to change the §Yamendment proposal.§!\n---------------------------\nOriginal effect:[CPGAC_ongoing_prop_effect]\n---------------------------\nAdditional effects of this proposal:"
 CPGAC_prop_option_faction_from_CPC: "§xWithin the CPC§!"
 CPGAC_prop_option_in_party_e: ""
 CPGAC_prop_option_in_party_0: "§GMao's Faction§!"
 CPGAC_faction_rep_Mao_p1: "Kang Sheng, Lin Biao"
 CPGAC_faction_rep_Mao_p2: "Liu Jianxun, Ji Dengkui"
 CPGAC_prop_option_in_party_0_desc: "§GMao's Faction§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §Y[CPGAC_faction_rep_Mao]§!\n---------------------------\nThe §GMao's Faction§! generally consists of party cadres who support Mao Zedong's policies or are trusted and heavily utilized by him. It is also one of the largest factions within the §xCPC§!, wielding significant influence among §Gmid- to high-ranking cadres from the Northwest§! and within the §RPLA§!. However, at present, the §GMao's Faction§! seems to lack a relatively cohesive organizational structure and often struggles to act in unison on political matters.\n\nThe §GMao's Faction§! policy agenda usually aligns with Mao Zedong's bold and sweeping approach, particularly during the §SSocialist Transformation Period§! with its radical policies. However, it is important to note that the §GMao's Faction§! does not entirely represent Mao Zedong's political will. In fact, the §GMao's Faction§! does not always exhibit the fearless and romantic image of idealistic revolutionaries. Within the vast §GNorthwest cadres§!, §Ga new generation§! is emerging under Mao Zedong's protection. These cadres are engaging in base area construction with a more mature political stance. Compared to the older generation, they tend to be more flexible and are well-regarded by grassroots cadres and the masses. Nonetheless, their goal remains resolute: to fulfill §GChairman Mao's§! directives and to push forward a §xsocialist upsurge§! throughout the base areas—or even across all of China."
 CPGAC_prop_option_in_party_1: "§mLiu's Faction§!"
 CPGAC_faction_rep_Liu_p1: "Bo Yibo, An Ziwen"
 CPGAC_faction_rep_Liu_p2: "Zhao Minxin, Lin Feng"
 CPGAC_prop_option_in_party_1_desc: "§mLiu's Faction§! Representative of the £CPGAC_texture_loc §GCPGAC§! : §Y[CPGAC_faction_rep_Liu]§!\n\nThe §mLiu's Faction§! generally refers to the group of Party cadres who support Liu Shaoqi’s ideas or are trusted and promoted by him. It is also one of the largest factions within the §xCommunist Party of China§!. Most of its members have direct or indirect ties to Liu Shaoqi during his time working in the §mwhite zone§! behind enemy lines. Many of the faction's mid-aged cadres have ascended to the §xParty’s Central Committee§!, and therefore, in some informal discussions, these individuals are also referred to as the §mwhite zone faction§! or the §mcentral faction§!.\n\nThe political agenda of the §mLiu's Faction§! aligns with Liu Shaoqi's relatively moderate political and economic views. It rose rapidly after the §GGreat Leap Forward§! due to the need for economic recovery and political stability.\n\nContrary to the §mLiu's Faction§!'s generally moderate political and economic stances, the administrative methods employed by the faction’s cadres to achieve their goals are often §Ytough§!. From the perspective of third parties, this administrative style has made the §mLiu's Faction§! gradually resemble the §GMao's faction§! from the past…"
 CPGAC_prop_option_in_party_2: "§R[TER_CPGAC_faction_name_sov]§!"
 CPGAC_prop_option_in_party_2_desc: "[CPGAC_prop_option_in_party_2_desc]"
 CPGAC_prop_option_in_party_2_desc_sov: "§RInternational Faction§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §YZhang Wentian§!\n---------------------------\nAs a faction that has nearly exited the stage of history, the §RInternational Faction§! once experienced a period of remarkable influence: figures loyal to the Comintern, such as Zhang Wentian, Wang Ming, and Bo Gu, briefly ascended to the highest power within the revolutionary ranks in various ways. However, their rigid adherence to doctrinal strategies became the Achilles' heel that led to the §RInternational Faction's§! decline when confronted by those more familiar with China's realities.\n\nToday, the §RInternational Faction§! can hardly be considered a legitimate faction. Instead, it resembles a \"target\" pre-set for criticism in successive internal political movements. Were it not for §mLiu Shaoqi's§! need to secure political allies by keeping §Rthem§! within his orbit, the term §RInternational Faction§! might have long since been relegated to the dusty archives.\n\nDespite their dissatisfaction with §mLiu's Faction§!'s \"revisionist policies,\" the §RInternational Faction§! is now powerless to rise and refute. All they can do is cast silent approval votes in policy decisions."
 CPGAC_prop_option_in_party_2_desc_pop: "§RMass Faction§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §YHu Jiwei§!\n---------------------------\nThis is an emerging faction, originating from the §Rfoundation of the literary front§! laid by Zhou Yang for the §xCPC§!. After the Ninth National Congress, as the older generation of revolutionaries within the Party gradually retired, the §RMass Faction§! began to gain visibility in higher circles.\n\nThe §RMass Faction§! is far from being a power-wielding group; its primary focus is almost entirely on cultural development, making it little more than an §Yadjunct§! to the current general line.\n\nDespite the name §R\"Mass Faction,\"§! it has always remained a small circle of party newspaper editors and intellectuals engaged in academic discussions. Nevertheless, §mLiu's Faction§! has shown a certain degree of interest in the §RMass Faction§!—perhaps it could serve as §man ally§! in the cultural propaganda arena…"
 CPGAC_prop_option_in_party_3: "§YSecretary faction§!"
 CPGAC_prop_option_in_party_3_desc: "§YSecretary Faction§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §YChen Yun§!\n---------------------------\nThe §YSecretary Faction§! is relatively small in size but holds significant power. Almost without exception, party cadres identified as part of the §YSecretary Faction§! are high-ranking central officials closely associated with §xGeneral Secretary of the CPC Secretariat§! Deng Xiaoping.\n\nDeng Xiaoping himself was selected by Mao Zedong as a key aide to mitigate the severe aftermath of the Great Leap Forward. Unlike the traditional Maoist cadres in the central government who emphasize §x“ideological direction”§!, Deng Xiaoping is indifferent to labels when it comes to his economic policies. In his own words: §Y\"It doesn't matter whether a cat is black or white, as long as it catches mice, it's a good cat.\"§!\n\nMany have criticized Deng Xiaoping's §xcommitment to party ideology§!, but Mao Zedong tacitly approved his remedial measures and entrusted him with the important roles of §GGeneral Secretary of the CPC Secretariat§! and §GDirector of the CPGAC§! to assist in managing daily party and governmental affairs.\n\nPerhaps, from the perspective of internal factional divisions, it would not be entirely inaccurate to regard the §YSecretary Faction§! as a heterodox branch of the §GMao's Faction§!."
 CPGAC_prop_option_faction_from_DEM: "§CDemocratic parties§!"
 CPGAC_prop_option_faction_from_DEM_desc: "§CDemocratic Parties§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §Y[CPGAC_faction_rep_dem]§!\n---------------------------\nThe §CDemocratic Parties§! are composed of non-Communist participating parties. Against the backdrop of the §Gthird £CPC_texticon CPC -£GNG_chinese_nation_texticon KMT cooperation§!, the £CPC_texticon §xCommunist Party of China§! and the £GNG_chinese_nation_texticon §mNorthwest Kuomintang§! signed the §mNational Defense Front Program§! together in Xi'an, forming an §mAnti-Japanese United Government§!. Under the principles of the §GNew Democratic Revolution§!, various parties actively participated in the work of the £CPGAC_texture_loc §GPeople's Government§!, playing a significant role in advancing the cause of anti-Japanese liberation and building base areas.\n\nDue to the §Gturmoil and division of the late 1950s to early 1960s§!, the £GNG_chinese_nation_texticon §mKuomintang§! effectively betrayed the §xChinese revolution§! and was dissolved by the §mFront§!. Former §mleft-wing members of the £GNG_chinese_nation_texticon Kuomintang§! led the formation of the new §zChina Democratic Revolutionary Alliance§!, which, together with the §sNew China Democratic Alliance§!, now represents the current democratic parties.\n\nIn terms of political ideology, the §CDemocratic Parties§! are not single-class parties but organizations with the nature of a §Cclass alliance§!, with political divisions into §Cleft§!, §Ycenter§!, and §sright§! tendencies. Their political stance is broadly consistent with the §GNew Democratic Revolution political program§! of the CPC."
 CPGAC_faction_rep_dem_p1: "Liang Shuming, Zhang Naiqi"
 CPGAC_faction_rep_dem_p2: "Zhang Naiqi, Xie Wanying"
 CPGAC_prop_option_faction_from_LIB: "§mNon-Affiliates§!"
 CPGAC_prop_option_faction_from_LIB_desc: "§mNon-Affiliates§! Representatives in the £CPGAC_texture_loc §GCPGAC§!: §Y[CPGAC_faction_rep_lib]§!\n---------------------------\n§mNon-Affiliates§! is a general term for well-known individuals who have not joined any party organization but have a history in the §mdemocratic movement§! and possess significant social influence. They primarily consist of §mintellectuals§! and §xa minority of worker and peasant representatives§!.\n\nThese individuals have considerable social appeal, are generally well-educated and highly capable, and contribute actively and uniquely to society. Their main role is to provide advice and suggestions for the policy-making of the £CPGAC_texture_loc §GPeople's Government§!, leveraging their extensive networks across various fields and industries.\n\nAfter Chongqing's surrender in 1947, the non-affiliated individuals who had remained in the rear areas were transferred to §YXi'an§! with the assistance of the §xParty organization§! and participated in the formation of the £CPGAC_texture_loc §GCPGAC§!, with §mprominent representatives§! among them taking part in government work."
 CPGAC_faction_rep_lib_p1: "Xu Jiegang, Xu Longguang(Francis L. K. Hsu)"
 CPGAC_faction_rep_lib_p2: "Xu Longguang(Francis L. K. Hsu), Wu Jingchao"
 CPGAC_op_execute_faction_NONE: "§YNo active policy being implemented§!"
 CPGAC_op_execute_faction_CPC: "§xCommunist Party of China§!"
