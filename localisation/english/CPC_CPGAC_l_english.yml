 CPGAC_prop_rural_democracy_desc: "Since the Eighth National Congress, the construction period has brought us tremendous achievements, with the economy of the base areas experiencing significant growth and recovery. However, some §Ycomrades§! within the Party have pointed out that in our §Grural grassroots§! and even §murban grassroots§!, excessive delegation of power to local cadres for production and construction has led to many §Rnegative issues§!. A considerable number of grassroots cadres have started exhibiting §Rabuse of power and authoritarian tendencies§!. As a result, some §Gyoung comrades§! have submitted proposals to the central government regarding §CGrassroots democratic reform§!"
 CPGAC_prop_rural_democracy_effect: "We will decide the §Yreform direction§! for §Cgrassroots§! §Sdemocracy§! reform."
