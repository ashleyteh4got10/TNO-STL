 TOT_comintern_icon_tt:0 "§Y共产国际大会§!\n\n共产国际大会是§R共产国际§!的核心机构，各国的共产党代表在此§Y提出§!议案并对其做出§Y表决§!。§R共产国际§!的所有重要决议都需通过共产国际大会的审议，各国共产党在其中享有相同的§G表决权§!——而主席国拥有额外的两票。\n\n共产国际大会中的不同决议有不同的表决通过要求，越重要的决议所需的§G支持§!票的§Y比例§!越高。每一次会议的§Y表决§!期为§G3周§!，在这之间可以任意修改自己的倾向。"

