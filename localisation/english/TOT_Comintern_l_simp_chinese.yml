 TOT_comintern_omc_department_1_tt:0 "§Y共产国际情报局§!\n\n共产国际情报局是直接隶属于共产国际国际联络部的情报组织，仅服从来自共产国际的指令。在平时，一般负责联络、援助各国地下党，收集情报等任务。\n\n当启用时，每个月，§Y[?global.TOT_comintern_omc_department_1_level]级§!的共产国际情报局将:\n特勤小组：§G+[?global.TOT_comintern_omc_department_1_level]0§!\n共产国际国际联络部经费开支：§R[?global.TOT_comintern_omc_department_1_level_cost]M§!"
 TOT_comintern_omc_department_2_tt:0 "§Y国际工人组织部§!\n\n国际工人组织部是共产国际接纳各国社会党联盟后的产物。作为资本主义工会的替代品，国际工人组织部负责在各国引导工人进行游行抗议和罢工运动。\n\n当启用时，每个月，§Y[?global.TOT_comintern_omc_department_2_level]级§!的国际工人组织部将:\n特勤小组：§G+[?global.TOT_comintern_omc_department_2_level]0§!\n共产国际政治力量开支：§R[?global.TOT_comintern_omc_department_2_level_cost]§!"
 TOT_comintern_omc_department_3_tt:0 "§Y联合军事委员会§!\n\n联合军事委员会是共产国际的军事合作机构。名义上，该机构直属于共产国际，拥有指挥和调动各个成员国军队的权力。\n\n当启用时，每个月，§Y[?global.TOT_comintern_omc_department_3_level]级§!的联合军事委员会将:\n特遣部队：§G+[?global.TOT_comintern_omc_department_3_level]0§!\n共产国际国际联络部经费开支：§R[?global.TOT_comintern_omc_department_3_level_cost]M§!"
 TOT_comintern_omc_department_4_tt:0 "§Y国际纵队§!\n\n国际纵队是共产国际的直接对外干涉力量，该机构由各成员国的志愿军队组成。其一般负责支援社会主义国家反对反动敌人的作战，不过在某些时候也作为一支秘密军队存在。\n\n当启用时，每个月，§Y[?global.TOT_comintern_omc_department_4_level]级§!的国际纵队将:\n特遣部队：§G+[?global.TOT_comintern_omc_department_4_level]0§!\n共产国际政治力量开支：§R[?global.TOT_comintern_omc_department_4_level_cost]§!"

