 TOT_comintern_news.1.t:0 "[Get_newspaper_header]共产国际成立"
 TOT_comintern_news.1.d:0 "有不少人还记得在[?global.TOT_comintern_founded_b]年前，在莫斯科召开的第三国际第一次代表大会宣布了共产国际的成立。尽管在随后的战争中这一组织被解散，并随着苏维埃联盟的覆灭而再无人问津，现在，这一落满了尘埃的概念却被再一次拾起。\n\n各国共产党已从世界各地出发赶往[TOT_comintern_leader_target.Capital.Getname]，参加新生的共产国际的第一次代表会议，除此之外，会议还邀请了各国的社会党和工人党作为观察员。大会上通过了《国际共产党联合宣言》作为共产国际的纲领。\n\n在华盛顿、在东京、在罗马······世界各国的观察家们对此态度不一，但所有人都承认这样一件事：冷战又迎来了新的棋手。"
 TOT_comintern_news.1.a:0 "全世界的无产者，联合起来！"
 TOT_comintern_news.1.b:0 "又一个挑战者"
 TOT_comintern_news.1.c:0 "盯紧这些赤匪"

 TOT_comintern_news.2.t:0 "[Get_newspaper_header]共产国际干涉[TOT_comintern_target_country_display.Getname]"
 TOT_comintern_news.2.d:0 "就在今天，共产国际通过了一项干涉[TOT_comintern_target_country_display.Getname]战争的决议，基于决议的内容，共产国际各成员国将派遣志愿军支援[TOT_comintern_target_country_display.GetAdjective]政府进行的一切作战。\n\n许多国家认为这是一种侵略的行径，这无疑会加剧全世界的紧张态势。除此之外，也有不少人认为这只不过是共产国际试图扩张其势力范围的尝试。无论如何，[TOT_comintern_target_country_display.Getname]的敌人都将面临巨大的挑战。"
 TOT_comintern_news.2.a:0 "国际纵队，前进！"
 TOT_comintern_news.2.b:0 "他们想要怎样？"

 TOT_comintern_news.3.t:0 "[Get_newspaper_header]共产国际对[TOT_comintern_target_country_display.Getname]宣战！"
 TOT_comintern_news.3.d:0 "惊人的消息：共产国际通过了对[TOT_comintern_target_country_display.Getname]开战的决议，这引起了大范围的震动，世界各国都在为这种行为感到不安。\n\n许多国际观察家宣称这“撕开了赤匪最后的伪装”，是“共产主义侵略世界的证明”，而也有不少人将其视作共产国际兑现其承诺——解放全世界无产阶级——的开始。\n\n不过，现存的超级力量也许不会允许这样的事情再度发生，未来何去何从，让我们拭目以待。"
 TOT_comintern_news.3.a:0 "目标是[TOT_comintern_target_country_display.Capital.Getname]！"
 TOT_comintern_news.3.b:0 "谁来阻止他们！"

 TOT_comintern_news.4.t:0 "[Get_newspaper_header]共产国际国际联络部成立"
 TOT_comintern_news.4.d:0 "在今天早晨，共产国际大会通过了关于成立共产国际国际联络部的决议，这个部门将致力于援助全世界共产党和其它左翼力量反对其现有政府的尝试。\n\n在[TOT_comintern_leader_target.Capital.Getname]，共产国际大会正忙碌于新成立的机构的建设，而在世界的其它地方，那些将社会主义视作敌人的政府加紧了其镇压工人运动的力量，其他的则开始寻找起新的出路。"
 TOT_comintern_news.4.a:0 "朋友们，我们来了！"
 TOT_comintern_news.4.b:0 "阴谋、暗害、社会主义！"

 TOT_comintern_news.5.t:0 "[Get_newspaper_header]国际科学院成立"
 TOT_comintern_news.5.d:0 "一个让全世界科学家都感到兴奋的消息传来：共产国际通过了成立国家科学院的决议，一个覆盖全共产国际的庞大科研组织正缓缓升起，在这里，来自共产国际各个成员国的科学家将分享他们的科研成果，并开展一系列共同的科研项目。\n\n许多人将它视作科学史上的一个重要的节点：科学第一次彻底打破了国界，伟大的思想将在每一个热爱它的人的脑海中流动。"
 TOT_comintern_news.5.a:0 "未来近在眼前"
 TOT_comintern_news.5.b:0 "我们也可以搞一个"

 TOT_comintern_news.6.t:0 "[Get_newspaper_header]共产国际宣布对[TOT_comintern_target_country_display.Getname]禁运"
 TOT_comintern_news.6.d:0 "由于近一段时间以来的各种冲突和混乱，共产国际最终宣布了对[TOT_comintern_target_country_display.Getname]的贸易禁运，这份禁运包括了近百个行业的数千项物品。而作为回应，[TOT_comintern_target_country_display.Getname]（及其势力范围）也宣布了类似的贸易禁运。\n\n禁运对双方的经济都造成了一定的影响，许多的生活物品开始出现稀缺，不少物资的价格显著增长，与此同时，全世界的紧张情况也进一步加剧，许多人开始担忧起自己的未来。"
 TOT_comintern_news.6.a:0 "嗯......"
 TOT_comintern_news.6.b:0 "这......"

 TOT_comintern_news.7.t:0 "[Get_newspaper_header]共产国际宣布解除对[TOT_comintern_target_country_display.Getname]禁运"
 TOT_comintern_news.7.d:0 "由于禁运而带来的经济问题迫使共产国际不得不解除他们对[TOT_comintern_target_country_display.Getname]的禁运，而[TOT_comintern_target_country_display.Getname]也“慷慨”地取消了一部分禁运的项目。\n\n考虑到禁运是由共产国际发起的，许多人认为这是共产国际影响力衰落的证明，这也在全世界范围内造成了不小的影响，一些人认为自己已经看见共产国际再度灭亡的那一天了。"
 TOT_comintern_news.7.a:0 "我们不会输"
 TOT_comintern_news.7.b:0 "好样的"

 TOT_comintern_news.8.t:0 "[Get_newspaper_header]共产国际解散[TOT_comintern_target_country_display.GetAdjective]共产党"
 TOT_comintern_news.8.d:0 "作为名义上的世界共产党，全世界各国的共产党被视作是共产国际的支部。因此，共产国际宣布解散[TOT_comintern_target_country_display.GetAdjective]共产党的消息也就不足为奇了。\n\n在决议通过后，[TOT_comintern_target_country_display.GetAdjective]共产党代表愤怒地离开了共产国际大会，并宣称该决议是“不公平的”。随后[TOT_comintern_target_country_display.GetAdjective]政府宣布退出共产国际，并解除一切与共产国际之间的联系。\n\n“尽管共产国际被削弱了，但是它却变得更加纯净”——共产国际的代表们这样说到，无论如何，[TOT_comintern_target_country_display.Getname]的未来都被彻底的改变了。"
 TOT_comintern_news.8.a:0 "对自我的清洗至关重要"
 TOT_comintern_news.8.b:0 "赤匪的内斗"

 TOT_comintern_news.9.t:0 "[Get_newspaper_header]《反共产国际协定》签署"
 TOT_comintern_news.9.d:0 "出于对共产国际侵略倾向的恐惧，在[FROM.Capital.Getname]，各个国家签署了所谓的《反共产国际协定》。这其中要求协定的每个签署国将在共产国际对其中任何一个签署国开战时加入对抗共产国际的战争。\n\n在世界的其它地方，未能或不愿加入《反共产国际协定》的各国也开始准备起自己的方案，无论如何，全世界对共产国际的敌意都在增加。"
 TOT_comintern_news.9.a:0 "反动派的垂死挣扎！"
 TOT_comintern_news.9.b:0 "和平、反共！"

