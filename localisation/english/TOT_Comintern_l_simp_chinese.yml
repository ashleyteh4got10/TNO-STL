 TOT_comintern_leader_desc:0 "在旧世界的废墟之上，崛起了无产阶级的坚实堡垒——“共产国际”。基于《共产国际宣言》的精神，在每3年一届的共产国际大会上，各成员国将投票推选出新一届的共产国际主席国，作为下一届大会的召开国以及共产国际主要事务的承办国。\n\n目前，共产国际的主席国职务落在[This.GetNameWithFlag]身上。\n\n作为全世界共产党和工人党的联盟，世界无产阶级的先锋队，共产国际承担着一个伟大而光荣的任务：实现全世界无产阶级的解放。为了实现这一目的而联合起来的劳动者们向全世界宣告着：\n\n§R全世界无产者，在反对帝国主义暴行、反对君主制、反对特权阶层、反对资产阶级国家和资产阶级所有制、反对形形色色的阶级压迫或民族压迫的斗争中，联合起来！\n\n全世界无产者，在工人苏维埃的旗帜下、在夺取政权和实行无产阶级专政的革命斗争的旗帜下、在第三国际的旗帜下，联合起来！§!"
 TOT_comintern_member_desc:0 "作为共产国际的重要组成部分，基于《共产国际宣言》的精神，共产国际的成员国享有在共产国际大会的投票权以及竞选和选举新一任主席国的权利。除此之外，成员国将基于各国经济情况承担共产国际的所有开支，并且在此之上达成各国之间的经济、政治、军事、文化、科研上的全面合作。"
 TOT_comintern_temp_gov_desc:0 "或者是由于该国的共产党组织受到毁灭性的打击，或者是由与该国混乱的政治局势，又或者是其他的什么原因，总之[This.GetNameWithFlag]无法组建起由该国共产党领导的独立政府。因此，基于《共产国际宣言》的精神，该国的政权将暂时由共产国际大会接管，直到该国共产党完成有效的重组为止。"
 TOT_comintern_observer_desc:0 "由于地缘问题或是内部政治问题，尽管[This.GetNameWithFlag]对共产国际表现出极大的兴趣，但是最终未能如愿加入共产国际。不过，他们的努力并非无用——共产国际同意了他们作为观察国而存在。假以时日，他们也许将同全世界无产阶级一道迎来自己的解放。"
 TOT_comintern_anti_desc:0 "出于对共产国际侵略倾向的恐惧，各个国家签署了所谓的§R《反共产国际协定》§!。这其中要求协定的每个签署国将在共产国际对其中任何一个签署国开战时加入对抗共产国际的战争。\n\n作为§R《反共产国际协定》§!的成员，该国的安全受到其它签署国的保障。"

