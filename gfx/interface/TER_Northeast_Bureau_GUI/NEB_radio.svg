<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">收音机</title>
  <desc id="dsc">TNO-STL 东北局 GUI 风格线稿：青色 #55C8C3 描边、红色 #DE2910 指示灯、透明背景。</desc>

  <style>
    /* —— 取自工作区 GUI：青色主描边、浅青细线、党徽红作点缀 —— */
    .cy3   { fill:none; stroke:#55C8C3; stroke-width:3;   stroke-linejoin:round; }
    .cy25  { fill:none; stroke:#55C8C3; stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
    .cy2   { fill:none; stroke:#55C8C3; stroke-width:2;   stroke-linejoin:round; }
    .hair  { fill:none; stroke:#75C6C2; stroke-width:1.3; opacity:0.85; }
    .grill { fill:none; stroke:#75C6C2; stroke-width:1.4; }
    .tick  { stroke:#75C6C2; stroke-width:1.6; stroke-linecap:round; }
    .tickM { stroke:#55C8C3; stroke-width:2.2; stroke-linecap:round; }
    .red   { fill:#DE2910; }
    .redln { fill:none; stroke:#DE2910; stroke-width:2.6; stroke-linecap:round; }
    .lbl   { font-family:Aldrich,'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;
             fill:#55C8C3; font-size:11.5px; font-weight:600; letter-spacing:1.8px; text-anchor:middle; }
    .num   { font-family:Aldrich,Arial,sans-serif; fill:#75C6C2; font-size:9px; text-anchor:middle; }
    .cap   { font-family:Aldrich,'Microsoft YaHei',sans-serif;
             fill:#75C6C2; font-size:8.5px; letter-spacing:1px; text-anchor:middle; }
  </style>

  <g id="radio">

    <!-- ── 提手 ────────────────────────────────────────────── -->
    <path class="cy25" stroke-width="3.4"
          d="M 200 112 V 92 Q 200 78 214 78 H 298 Q 312 78 312 92 V 112"/>

    <!-- ── 天线 ────────────────────────────────────────────── -->
    <g id="antenna">
      <line class="cy25" stroke-width="3.4" x1="438" y1="110" x2="456" y2="72"/>
      <circle cx="456" cy="72" r="3.2" fill="#55C8C3"/>
      <line class="cy2" x1="456" y1="72" x2="474" y2="36"/>
      <circle class="red" cx="477" cy="30" r="5"/>
    </g>

    <!-- ── 机身 ────────────────────────────────────────────── -->
    <rect class="cy3" x="56" y="112" width="400" height="288" rx="12"/>
    <rect class="hair" x="66" y="122" width="380" height="268" rx="8"/>

    <!-- ── 扬声器格栅 ──────────────────────────────────────── -->
    <g id="speaker">
      <rect class="cy2" x="76" y="148" width="184" height="212" rx="8"/>
      <rect class="grill" x="94"  y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="111.5" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="129" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="146.5" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="164" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="181.5" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="199" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="216.5" y="168" width="8" height="172" rx="4"/>
      <rect class="grill" x="234" y="168" width="8" height="172" rx="4"/>
    </g>

    <!-- ── 调谐表盘 ────────────────────────────────────────── -->
    <g id="dial">
      <rect class="cy2" x="276" y="140" width="160" height="124" rx="8"/>
      <text class="lbl" x="356" y="166">东北人民广播电台</text>
      <line class="hair" x1="290" y1="176" x2="422" y2="176"/>

      <!-- 刻度（短刻度 228→236，长刻度 222→236，基线 y=236） -->
      <line class="tick" x1="294"   y1="222" x2="294"   y2="236"/>
      <line class="tick" x1="306.8" y1="228" x2="306.8" y2="236"/>
      <line class="tick" x1="319.6" y1="222" x2="319.6" y2="236"/>
      <line class="tick" x1="332.4" y1="228" x2="332.4" y2="236"/>
      <line class="tick" x1="345.2" y1="222" x2="345.2" y2="236"/>
      <line class="tick" x1="358"   y1="228" x2="358"   y2="236"/>
      <line class="tick" x1="370.8" y1="222" x2="370.8" y2="236"/>
      <line class="tick" x1="383.6" y1="228" x2="383.6" y2="236"/>
      <line class="tick" x1="396.4" y1="222" x2="396.4" y2="236"/>
      <line class="tick" x1="409.2" y1="228" x2="409.2" y2="236"/>
      <line class="tick" x1="422"   y1="222" x2="422"   y2="236"/>
      <line class="hair" x1="294" y1="236" x2="422" y2="236"/>

      <text class="num" x="294"   y="252">55</text>
      <text class="num" x="319.6" y="252">60</text>
      <text class="num" x="345.2" y="252">65</text>
      <text class="num" x="370.8" y="252">70</text>
      <text class="num" x="396.4" y="252">75</text>
      <text class="num" x="422"   y="252">80</text>

      <!-- 红色指针 -->
      <line class="redln" x1="373" y1="206" x2="373" y2="240"/>
      <circle class="red" cx="373" cy="204" r="3.4"/>
    </g>

    <!-- ── 旋钮 ────────────────────────────────────────────── -->
    <g id="knobs">
      <!-- 音量（外圈刻度 12 格） -->
      <line class="tickM" x1="353"   y1="302"   x2="358"   y2="302"/>
      <line class="tickM" x1="348.9" y1="317.5" x2="353.2" y2="320"/>
      <line class="tickM" x1="337.5" y1="328.9" x2="340"   y2="333.2"/>
      <line class="tickM" x1="322"   y1="333"   x2="322"   y2="338"/>
      <line class="tickM" x1="306.5" y1="328.9" x2="304"   y2="333.2"/>
      <line class="tickM" x1="295.2" y1="317.5" x2="290.8" y2="320"/>
      <line class="tickM" x1="291"   y1="302"   x2="286"   y2="302"/>
      <line class="tickM" x1="295.2" y1="286.5" x2="290.8" y2="284"/>
      <line class="tickM" x1="306.5" y1="275.1" x2="304"   y2="270.8"/>
      <line class="tickM" x1="322"   y1="271"   x2="322"   y2="266"/>
      <line class="tickM" x1="337.5" y1="275.1" x2="340"   y2="270.8"/>
      <line class="tickM" x1="348.9" y1="286.5" x2="353.2" y2="284"/>

      <circle class="cy25" cx="322" cy="302" r="26"/>
      <circle class="hair" cx="322" cy="302" r="19"/>
      <line class="cy25" stroke-width="3.4" x1="322" y1="302" x2="329" y2="290"/>

      <!-- 调谐（外圈刻度 8 格） -->
      <line class="tickM" x1="423"   y1="302"   x2="427"   y2="302"/>
      <line class="tickM" x1="415.7" y1="319.7" x2="418.5" y2="322.5"/>
      <line class="tickM" x1="398"   y1="327"   x2="398"   y2="331"/>
      <line class="tickM" x1="380.3" y1="319.7" x2="377.5" y2="322.5"/>
      <line class="tickM" x1="373"   y1="302"   x2="369"   y2="302"/>
      <line class="tickM" x1="380.3" y1="284.3" x2="377.5" y2="281.5"/>
      <line class="tickM" x1="398"   y1="277"   x2="398"   y2="273"/>
      <line class="tickM" x1="415.7" y1="284.3" x2="418.5" y2="281.5"/>

      <circle class="cy25" cx="398" cy="302" r="20"/>
      <circle class="hair" cx="398" cy="302" r="14"/>
      <line class="cy25" stroke-width="3" x1="398" y1="302" x2="409" y2="311"/>

      <text class="cap" x="322" y="348">音量</text>
      <text class="cap" x="398" y="348">调谐</text>
    </g>

    <!-- ── 电源指示灯 ──────────────────────────────────────── -->
    <g id="power">
      <line class="hair" x1="288" y1="372" x2="338" y2="372"/>
      <circle class="red" cx="356" cy="372" r="4.5"/>
      <line class="hair" x1="374" y1="372" x2="424" y2="372"/>
    </g>

    <!-- ── 脚座 ────────────────────────────────────────────── -->
    <rect class="cy2" x="146" y="400" width="44" height="14" rx="3"/>
    <rect class="cy2" x="334" y="400" width="44" height="14" rx="3"/>

  </g>
</svg>
